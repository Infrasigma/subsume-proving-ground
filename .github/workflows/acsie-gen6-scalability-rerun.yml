name: ACSIE Gen6 scalability diagnostic rerun

on:
  push:
    branches:
      - research/acsie-h7-r3-exact-source-20261011
    paths:
      - ".github/workflows/acsie-gen6-scalability-rerun.yml"

permissions:
  contents: read

jobs:
  gen6-recursive-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact proving-ground harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare evidence and compile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/gen6
          {
            echo "EXECUTOR_REPOSITORY=Infrasigma/subsume-proving-ground"
            echo "EXECUTOR_BRANCH=${GITHUB_REF_NAME}"
            echo "EXECUTOR_COMMIT=${GITHUB_SHA}"
            echo "WORKFLOW_RUN_ID=${GITHUB_RUN_ID}"
            echo "HARNESS_SHA256=$(sha256sum lab/acsie_gen6_gen3_scalability.py | awk '{print $1}')"
            echo "GROWTH_LAB_SHA256=$(sha256sum lab/acsie_open_ended_growth_proving.py | awk '{print $1}')"
            echo "GEN6_CHECKPOINT_INDEX=6"
            echo "MEASURED_GENERATION_INDICES=0,1,2,3,4,5,6"
            echo "SEEDS=2026100301,2026100302,2026100303,2026100304,2026100305"
          } | tee evidence/gen6/provenance.txt
          python -m py_compile lab/acsie_gen6_gen3_scalability.py lab/acsie_open_ended_growth_proving.py

      - name: Checkout exact ACSIE research source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and test identities
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git -C acsie rev-parse HEAD)"
          actual_tree="$(git -C acsie rev-parse 'HEAD^{tree}')"
          behavioral_sha="$(sha256sum acsie/cognitive_core/behavioral_search.py | awk '{print $1}')"
          compiler_sha="$(sha256sum acsie/cognitive_core/recursive_cognitive_compiler.py | awk '{print $1}')"
          growth_test_sha="$(sha256sum acsie/tests/test_open_ended_growth.py | awk '{print $1}')"
          test "$actual_commit" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$actual_tree" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          test "$behavioral_sha" = "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          test "$growth_test_sha" = "685c92ee3a825013323ea92d40a45e8e684a0867f7e72cd1317f5db72e9ced53"
          {
            echo "ACSIE_COMMIT=$actual_commit"
            echo "ACSIE_TREE=$actual_tree"
            echo "BEHAVIORAL_SEARCH_SHA256=$behavioral_sha"
            echo "RECURSIVE_COGNITIVE_COMPILER_SHA256=$compiler_sha"
            echo "TEST_OPEN_ENDED_GROWTH_SHA256=$growth_test_sha"
            echo "SOURCE_IDENTITY=PASS"
          } | tee evidence/gen6/acsie-source-identity.txt

      - name: Setup Python and pytest
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run exact open-ended-growth tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 \
            python -m pytest -q acsie/tests/test_open_ended_growth.py \
            2>&1 | tee evidence/gen6/open-ended-growth-tests.txt

      - name: Measure seven generation indices per frozen seed
        timeout-minutes: 30
        shell: bash
        run: |
          set -uo pipefail
          root="$GITHUB_WORKSPACE/evidence/gen6"
          for seed in 2026100301 2026100302 2026100303 2026100304 2026100305; do
            stem="gen6-seed-$seed"
            echo "GEN6_SCALE seed=$seed checkpoint_index=6 generations=7"
            set +e
            PYTHONHASHSEED=0 PYTHONPATH="$GITHUB_WORKSPACE/acsie" \
              timeout 240s python "$GITHUB_WORKSPACE/lab/acsie_gen6_gen3_scalability.py" \
                --mode gen6 --seed "$seed" --generations 7 \
                > "$root/$stem.json" 2> "$root/$stem.stderr"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then status="CHILD_EXIT_0"; \
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then status="CHILD_WALL_TIMEOUT"; \
            else status="CHILD_EXIT_${rc}"; fi
            printf '{"seed":%s,"child_returncode":%s,"wrapper_status":"%s"}\n' \
              "$seed" "$rc" "$status" > "$root/$stem.status.json"
            echo "RESULT seed=$seed rc=$rc wrapper_status=$status"
          done
          python - "$root" <<'PY'
          import json
          import pathlib
          import statistics
          import sys

          root = pathlib.Path(sys.argv[1])
          seeds = (2026100301, 2026100302, 2026100303, 2026100304, 2026100305)
          rows = []
          for seed in seeds:
              stem = f"gen6-seed-{seed}"
              wrapper = json.loads((root / f"{stem}.status.json").read_text())
              row = {"seed": seed, **wrapper}
              path = root / f"{stem}.json"
              if wrapper["child_returncode"] == 0 and path.exists() and path.stat().st_size:
                  try:
                      result = json.loads(path.read_text())
                      row["record"] = result
                      row["output_schema"] = result.get("schema")
                      row["generation_6_reached"] = result.get("generation_6_reached") is True
                      raw = result.get("original_growth_lab_result", {})
                      records = result.get("per_generation_telemetry", [])
                      row["source_finite_growth_gate"] = raw.get("finite_open_ended_growth_gate")
                      row["gen6_accepted"] = records[6].get("accepted") if len(records) >= 7 else None
                      row["gen6_parent_used"] = records[6].get("parent_used") if len(records) >= 7 else None
                      row["gen6_multi_parent_used"] = records[6].get("multi_parent_used") if len(records) >= 7 else None
                      row["child_error"] = result.get("error")
                      row["record_status"] = (
                          "PASS" if result.get("schema") == "ACSIE.gen6_scalability_diagnostic.v2"
                          else "CHILD_EXCEPTION_OR_INVALID_SCHEMA"
                      )
                  except Exception as exc:
                      row["record_status"] = f"INVALID_JSON:{type(exc).__name__}:{exc}"
              else:
                  row["record_status"] = "NO_COMPLETE_CHILD_RECORD"
              rows.append(row)

          complete = [
              r for r in rows
              if r.get("record_status") == "PASS" and r.get("generation_6_reached") is True
          ]
          matrix_complete = len(complete) == len(seeds)
          source_gate_all = matrix_complete and all(
              r.get("source_finite_growth_gate") is True for r in complete
          )
          g6_accept_reuse_all = matrix_complete and all(
              r.get("gen6_accepted") is True and r.get("gen6_parent_used") is True
              for r in complete
          )
          g6_multi_parent_all = matrix_complete and all(
              r.get("gen6_accepted") is True and r.get("gen6_multi_parent_used") is True
              for r in complete
          )

          generation_summary = []
          for gen in range(7):
              g_rows = [
                  r["record"]["per_generation_telemetry"][gen]
                  for r in complete
                  if len(r["record"].get("per_generation_telemetry", [])) > gen
              ]
              learner = [g.get("metrics", {}).get("learner", {}) for g in g_rows]
              def med(values):
                  return round(statistics.median(values), 3) if values else None
              def med_field(field):
                  values = [m[field] for m in learner if isinstance(m.get(field), (int, float))]
                  return med(values)
              process_elapsed = [
                  m.get("method_elapsed_ms", {}).get("synthesize_process_frontier", 0.0)
                  for m in learner
              ]
              process_candidate_counts = []
              for m in learner:
                  calls = m.get("process_frontier_calls", [])
                  process_candidate_counts.append(
                      statistics.fmean([
                          c["returned_candidate_count"] for c in calls
                          if isinstance(c.get("returned_candidate_count"), (int, float))
                      ]) if any(isinstance(c.get("returned_candidate_count"), (int, float)) for c in calls) else None
                  )
              process_candidate_counts = [x for x in process_candidate_counts if x is not None]
              generation_summary.append({
                  "generation_index": gen,
                  "completed_seed_count": len(g_rows),
                  "accepted_count": sum(bool(g.get("accepted")) for g in g_rows),
                  "parent_reuse_count": sum(bool(g.get("parent_used")) for g in g_rows),
                  "multi_parent_accept_count": sum(
                      bool(g.get("accepted")) and bool(g.get("multi_parent_used")) for g in g_rows
                  ),
                  "median_target_depth": med([g["target_depth"] for g in g_rows if isinstance(g.get("target_depth"), (int, float))]),
                  "median_retained_count": med([g["retained_count"] for g in g_rows if isinstance(g.get("retained_count"), (int, float))]),
                  "median_exact_search_calls": med_field("exact_search_calls"),
                  "median_exact_search_elapsed_ms": med_field("exact_search_elapsed_ms_total"),
                  "median_exact_search_generated_expressions": med_field("exact_search_generated_expressions_total"),
                  "median_exact_search_unique_states": med_field("exact_search_unique_states_total"),
                  "median_exact_search_max_dominance_frontier": med_field("exact_search_max_dominance_frontier"),
                  "median_process_frontier_elapsed_ms_total": med(process_elapsed),
                  "median_process_frontier_candidates_per_call": med(process_candidate_counts),
                  "median_expression_enum_elapsed_ms_total": med_field("expression_enum_elapsed_ms_total"),
                  "median_expression_enum_candidate_total": med_field("expression_enum_candidate_total"),
              })

          if not matrix_complete:
              classification = "INCONCLUSIVE_INCOMPLETE_SEED_MATRIX_OR_CHILD_EXCEPTION"
          elif source_gate_all and g6_accept_reuse_all and g6_multi_parent_all:
              classification = "GEN6_SELF_EXTENDING_DIAGNOSTIC_PASS_ALL_FIVE_SEEDS"
          else:
              classification = "GEN6_SCIENTIFIC_GATE_FAILURE_REPORTED"

          summary = {
              "schema": "ACSIE.gen6_scalability_summary.v2",
              "acsie_source_commit": "d83cb60286f195eec02b4d7aa45a60539316d115",
              "experiment": "acsie_open_ended_self_extending_proving.py:run_seed",
              "generations": list(range(7)),
              "gen6_checkpoint_index": 6,
              "seeds": list(seeds),
              "completed_seed_count": len(complete),
              "classification": classification,
              "scientific_gates": {
                  "source_finite_open_ended_growth_gate_all_seeds": source_gate_all,
                  "gen6_accepted_and_used_parent_all_seeds": g6_accept_reuse_all,
                  "gen6_accepted_and_used_multiple_parents_all_seeds": g6_multi_parent_all,
              },
              "per_generation_scalability": generation_summary,
              "seed_records": [
                  {k: v for k, v in row.items() if k != "record"}
                  | ({
                      "source_finite_growth_gate": row.get("source_finite_growth_gate"),
                      "gen6_accepted": row.get("gen6_accepted"),
                      "gen6_parent_used": row.get("gen6_parent_used"),
                      "gen6_multi_parent_used": row.get("gen6_multi_parent_used"),
                      "run_elapsed_ms": row["record"].get("run_elapsed_ms_including_lightweight_telemetry"),
                      "process_peak_rss_mb": row["record"].get("process_peak_rss_mb"),
                      "raw_result_sha256": row["record"].get("raw_result_sha256"),
                      "final_closure_gain": row["record"].get("original_growth_lab_result", {}).get("final_closure_gain"),
                      "final_probe_success_rate": row["record"].get("original_growth_lab_result", {}).get("final_probe_success_rate"),
                      "final_baseline_probe_success_rate": row["record"].get("original_growth_lab_result", {}).get("final_baseline_probe_success_rate"),
                  } if "record" in row else {})
                  for row in rows
              ],
              "interpretation_guard": (
                  "Actual OpenEndedRecursiveCognitiveCompiler self-extending workload through generation index 6. "
                  "This is a bounded diagnostic, not the frozen 5x12 qualification or an AGI/ASI claim."
              ),
          }
          (root / "summary.json").write_text(json.dumps(summary, sort_keys=True, indent=2) + "\n")
          print(json.dumps(summary, sort_keys=True, indent=2))
          PY

      - name: Upload Gen6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen6-scalability-rerun-${{ github.run_id }}
          path: evidence/gen6/
          if-no-files-found: error
