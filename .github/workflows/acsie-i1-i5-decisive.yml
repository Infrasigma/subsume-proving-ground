name: ACSIE I1-I5 decisive recursive test

on:
  pull_request:
    branches: [main]

jobs:
  decisive:
    strategy:
      fail-fast: false
      matrix:
        seed: [2026100201,2026100202,2026100203,2026100204,2026100205,2026100206,2026100207,2026100208,2026100209,2026100210]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact proving-ground test
        uses: actions/checkout@v4

      - name: Checkout exact ACSIE candidate
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "5129d648e75743a111513af7279cbfedcbce791a"
        run: |
          set -euo pipefail
          ASKPASS="$RUNNER_TEMP/askpass.sh"
          cat >"$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          test -n "$ACSIE_READ_TOKEN"
          rm -rf "$RUNNER_TEMP/acsie"
          git clone -q --no-checkout https://github.com/Infrasigma/ACSIE.git "$RUNNER_TEMP/acsie"
          git -C "$RUNNER_TEMP/acsie" checkout --detach --force "$ACSIE_REF"
          test "$(git -C "$RUNNER_TEMP/acsie" rev-parse HEAD)" = "$ACSIE_REF" || {
            echo "candidate ref did not resolve to expected branch head" >&2
            exit 128
          }
          echo "ACSIE_COMMIT=$(git -C "$RUNNER_TEMP/acsie" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ACSIE_TREE=$(git -C "$RUNNER_TEMP/acsie" rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Syntax and native-core integrity
        run: |
          set -euo pipefail
          python3 -m py_compile "$RUNNER_TEMP/acsie/cognitive_core/recursive_research.py"
          test -f "$RUNNER_TEMP/acsie/cognitive_core/native_independent_core.py"
          export PYTHONPATH="$RUNNER_TEMP/acsie"
          python3 - <<'PY'
          from cognitive_core.recursive_research import MechanismConfig, CapabilityDemandModel, HypothesisEngine
          c = MechanismConfig()
          assert "unknown" in CapabilityDemandModel.HYPOTHESES
          assert HypothesisEngine().generate(c, rows=(), width=2)
          print("I1-I3 import/generation smoke: PASS")
          PY

      - name: Run one decisive seed
        env:
          PYTHONPATH: "${{ runner.temp }}/acsie"
          SEED: "${{ matrix.seed }}"
        run: |
          set +e
          python3 research/acsie_i1_i5_decisive_test.py --seed "$SEED" --out "evidence/i1-i5/$SEED" | tee "evidence/i1-i5/$SEED/stdout.json"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "evidence/i1-i5/$SEED/exit_code"
          exit 0

      - name: Upload scientific artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-i1-i5-${{ matrix.seed }}
          path: evidence/i1-i5/${{ matrix.seed }}/**
          if-no-files-found: warn
