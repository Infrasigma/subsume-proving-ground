name: Gen3 historical verified-predecessor compatibility and scaling

on:
  push:
    branches:
      - research/acsie-gen3-historical-state-arm-20261012
    paths:
      - ".github/workflows/acsie-gen3-historical-state-scaling.yml"
      - "lab/verify_historical_gen2_predecessor.py"
      - "lab/summarize_historical_gen3_scaling.py"

permissions:
  contents: read
  actions: read

jobs:
  historical-predecessor-current-gen3:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout proving-ground harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Predeclare historical compatibility arm and scale matrix
        shell: bash
        run: |
          set -euo pipefail
          root="evidence/gen3-historical-arm"
          mkdir -p "$root/artifact" "$root/materialized"
          {
            echo "EXECUTOR_REPOSITORY=Infrasigma/subsume-proving-ground"
            echo "EXECUTOR_BRANCH=${GITHUB_REF_NAME}"
            echo "EXECUTOR_COMMIT=${GITHUB_SHA}"
            echo "WORKFLOW_RUN_ID=${GITHUB_RUN_ID}"
            echo "ARM_TYPE=HISTORICAL_VERIFIED_PREDECESSOR_CURRENT_GEN3_COMPATIBILITY_AND_SCALING"
            echo "HISTORICAL_ARTIFACT_ID=10950102751"
            echo "HISTORICAL_ARTIFACT_RUN_ID=36374197614"
            echo "HISTORICAL_ARTIFACT_SHA256=8a1afedbac85317e031ec043aace643c1f4c87822dd302a19b888e23c58596c9"
            echo "HISTORICAL_RAW_STATE_SHA256=0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9"
            echo "HISTORICAL_GEN2_PARENT=b31109864ae547320d877e6c1575b805d950edf9"
            echo "HISTORICAL_GEN2_EXPORTER=94a2a770a5799fd386217998bc21b585632ef7ed"
            echo "CURRENT_GEN2_EXPORTER=0e9c2ad9a146775c162a278b0330c596d29055b9"
            echo "CURRENT_GEN2_EXPORTER_DISPOSITION=FAILED_SEPARATE_RESULT_NOT_SUBSTITUTED"
            echo "ACSIE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "ACSIE_TREE=12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
            echo "SEEDS=771221,771222"
            echo "GEN3_INNER_STREAM_COUNTS=3,6,12"
            echo "FIXED_CANDIDATE_CAP=128"
            echo "PER_CHILD_WALL_LIMIT_SECONDS=600"
            echo "GEN1_GEN2_AND_ALL_OUTER_STREAM_COUNTS=6"
            echo "GAIN_GATE=0.05"
            echo "PREDECESSOR_SUBSTITUTION=FORBIDDEN; historical arm remains separately labeled"
          } | tee "$root/contract.txt"
          python -m py_compile lab/verify_historical_gen2_predecessor.py lab/summarize_historical_gen3_scaling.py lab/acsie_gen6_gen3_scalability.py

      - name: Download immutable historical evidence artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="evidence/gen3-historical-arm/artifact/protected-gen3-historical-pass-10950102751.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Infrasigma/subsume-proving-ground/actions/artifacts/10950102751/zip" \
            -o "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          echo "DOWNLOADED_HISTORICAL_ZIP_SHA256=$actual" | tee -a evidence/gen3-historical-arm/contract.txt
          test "$actual" = "8a1afedbac85317e031ec043aace643c1f4c87822dd302a19b888e23c58596c9"

      - name: Checkout exact ACSIE source pin
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify current source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acsie rev-parse HEAD)" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$(git -C acsie rev-parse 'HEAD^{tree}')" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          {
            echo "ACSIE_COMMIT=$(git -C acsie rev-parse HEAD)"
            echo "ACSIE_TREE=$(git -C acsie rev-parse 'HEAD^{tree}')"
            sha256sum acsie/cognitive_core/native_independent_core.py
            sha256sum acsie/research/native_self_learning_kernel_gen3_compositional_retention_v1.py
            sha256sum acsie/research/gen3_from_frozen_verified_gen2_v1.py
            sha256sum acsie/cognitive_core/behavioral_search.py
          } | tee evidence/gen3-historical-arm/current-source-identity.txt

      - name: Setup Python 3.11 and pytest
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify historical evidence, raw state, and current schema compatibility
        shell: bash
        run: |
          set -euo pipefail
          python lab/verify_historical_gen2_predecessor.py \
            --archive "$GITHUB_WORKSPACE/evidence/gen3-historical-arm/artifact/protected-gen3-historical-pass-10950102751.zip" \
            --materialized-dir "$GITHUB_WORKSPACE/evidence/gen3-historical-arm/materialized" \
            --acsie-root "$GITHUB_WORKSPACE/acsie" \
            --evidence "$GITHUB_WORKSPACE/evidence/gen3-historical-arm" \
            2>&1 | tee evidence/gen3-historical-arm/predecessor-verification-stdout.txt

      - name: Run six-file cognitive regression suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 \
            python -m pytest -q \
              acsie/tests/test_open_ended_growth.py \
              acsie/tests/test_core014_recursive_cognitive_compiler.py \
              acsie/tests/test_core015_semantic_operator_discovery.py \
              acsie/tests/test_core016_open_semantic_substrate.py \
              acsie/tests/test_adaptive_capability_repair.py \
              acsie/tests/test_asi_claim_gate.py \
            2>&1 | tee evidence/gen3-historical-arm/six-file-regression.txt
          python - evidence/gen3-historical-arm/six-file-regression.txt <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding="utf-8").read()
          m=re.search(r"(\d+) passed(?:,|\s)",text)
          if not m or int(m.group(1)) != 61:
              raise SystemExit("six-file cognitive suite did not pass exactly 61 tests")
          print("SIX_FILE_REGRESSION=61/61 PASSED")
          PY

      - name: Run historical-predecessor Gen3 scaling matrix
        timeout-minutes: 70
        shell: bash
        run: |
          set -uo pipefail
          root="$GITHUB_WORKSPACE/evidence/gen3-historical-arm"
          frozen="$root/materialized/verified-gen2-export.json"
          test -s "$root/historical-gen2-predecessor-verification.json"
          for streams in 3 6 12; do
            for seed in 771221 771222; do
              stem="gen3-streams-$streams-seed-$seed"
              echo "GEN3_HISTORICAL_ARM streams=$streams seed=$seed cap=128"
              set +e
              (
                cd "$GITHUB_WORKSPACE/acsie"
                PYTHONHASHSEED=0 PYTHONPATH="$GITHUB_WORKSPACE/acsie" \
                  timeout 600s python "$GITHUB_WORKSPACE/lab/acsie_gen6_gen3_scalability.py" \
                    --mode gen3 --seed "$seed" --gen3-inner-streams "$streams" \
                    --frozen-state "$frozen"
              ) > "$root/$stem.json" 2> "$root/$stem.stderr"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then status="CHILD_EXIT_0"; \
              elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then status="CHILD_WALL_TIMEOUT"; \
              else status="CHILD_EXIT_$rc"; fi
              printf '{"streams":%s,"seed":%s,"child_returncode":%s,"wrapper_status":"%s"}\n' \
                "$streams" "$seed" "$rc" "$status" > "$root/$stem.status.json"
              echo "RESULT streams=$streams seed=$seed rc=$rc wrapper_status=$status"
            done
          done
          set -e
          python lab/summarize_historical_gen3_scaling.py --evidence "$root" \
            2>&1 | tee "$root/scaling-summary-stdout.txt"

      - name: Upload historical predecessor compatibility and Gen3 scaling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen3-historical-predecessor-scaling-${{ github.run_id }}
          path: evidence/gen3-historical-arm/
          if-no-files-found: error
          compression-level: 6
