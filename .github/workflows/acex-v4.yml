name: ACE-X V4 equivalence-aware concept gate

on:
  push:
    branches:
      - ace-x-v4-equivalence-aware-20260921
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  v4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - run: |
          set -euo pipefail
          go test -mod=mod -run '^TestV4ArchitectureTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-v4-result.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v4-result
          path: acex-v4-result.txt
