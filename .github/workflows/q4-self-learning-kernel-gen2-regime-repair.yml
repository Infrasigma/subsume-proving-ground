name: q4 self-learning kernel Gen2 regime-memory repair

on:
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Exact ACSIE commit SHA"
        required: true
        default: "cbb3379bf97ab749a86ca37a141ce6fd0fb60322"
        type: string

permissions:
  contents: read

jobs:
  gen2-regime-memory-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run pinned ACSIE Gen2 regime-memory repair
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: ${{ inputs.acsie_ref }}
        run: |
          set -euo pipefail
          WORK=/tmp/acsie-gen2-regime-memory-repair
          ASKPASS=/tmp/acsie-askpass.sh
          VENV=/tmp/acsie-venv
          EVIDENCE="$GITHUB_WORKSPACE/gen2-evidence"
          cleanup() { rm -rf "$WORK" "$VENV" "$ASKPASS"; }
          trap cleanup EXIT
          mkdir -p "$EVIDENCE"

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s
' 'x-access-token' ;;
            *) printf '%s
' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git -C "$WORK" init
          git -C "$WORK" remote add origin https://github.com/Infrasigma/ACSIE.git
          git -C "$WORK" fetch --no-tags --depth 1 origin "$ACSIE_REF"
          git -C "$WORK" checkout --detach --force FETCH_HEAD
          cd "$WORK"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse HEAD^{tree})"
          echo "ACSIE_COMMIT=$ACTUAL_COMMIT" | tee "$EVIDENCE/provenance.txt"
          echo "ACSIE_TREE=$ACTUAL_TREE" | tee -a "$EVIDENCE/provenance.txt"
          test "$ACTUAL_COMMIT" = "$ACSIE_REF"

          python3 -m venv "$VENV"
          . "$VENV/bin/activate"
          python -m pip install --upgrade pip pytest

          python -m compileall -q cognitive_core research

          python -m pytest -q             tests/test_native_independent_core.py::test_native_core_roundtrip_is_exact             tests/test_native_independent_core.py::test_native_core_roundtrip_restores_relation_expression_ast             tests/test_native_independent_core.py::test_native_observe_batch_matches_sequential_final_state             tests/test_gen2_regime_memory_repair.py::test_observe_batch_preserves_existing_final_state_contract             tests/test_gen2_regime_memory_repair.py::test_regime_archive_is_generic_and_persistent             tests/test_gen2_regime_memory_repair.py::test_prediction_context_reset_is_explicit             2>&1 | tee "$EVIDENCE/integrity-tests.log"

          set +e
          PYTHONPATH="$WORK" python -u -m research.native_self_learning_kernel_v2             2>&1 | tee "$EVIDENCE/gen2.log"
          RC=${PIPESTATUS[0]}
          set -e

          echo "ACSIE_GEN2_REPAIR_EXIT_CODE=$RC" | tee "$EVIDENCE/exit-code.txt"
          exit "$RC"

      - name: Upload Gen2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen2-regime-memory-repair
          path: gen2-evidence/
          if-no-files-found: warn
