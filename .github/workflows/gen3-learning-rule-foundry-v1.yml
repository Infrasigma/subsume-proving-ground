name: Gen3 native learning-rule Foundry v1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gen3-foundry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    strategy:
      fail-fast: false
      matrix:
        seed: [771221, 771222, 771223, 771224, 771225]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4
      - name: Checkout exact ACSIE Foundry source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: 3fe72e9633ec8e762ca674df5c0e664b7bafd222
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-foundry
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source
        working-directory: acsie-foundry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3fe72e9633ec8e762ca674df5c0e664b7bafd222"
          git merge-base --is-ancestor "b4beeeb792abe45a62d583287356fb80c87c2fb7" HEAD
      - name: Syntax-check Foundry
        working-directory: acsie-foundry
        run: python -m py_compile research/gen3_learning_rule_foundry_v1.py
      - name: Run Foundry
        working-directory: acsie-foundry
        env:
          SEED: "${{ matrix.seed }}"
        run: |
          set +e
          export PYTHONPATH="$PWD"
          mkdir -p evidence/gen3-learning-rule-foundry-v1
          python research/gen3_learning_rule_foundry_v1.py "$SEED" > "evidence/gen3-learning-rule-foundry-v1/result-$SEED.json"
          status=$?
          set -e
          test -s "evidence/gen3-learning-rule-foundry-v1/result-$SEED.json"
          exit "$status"
      - name: Upload seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen3-learning-rule-foundry-v1-${{ matrix.seed }}
          path: acsie-foundry/evidence/gen3-learning-rule-foundry-v1/**
          if-no-files-found: error

  aggregate:
    needs: foundry
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download seed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: gen3-learning-rule-foundry-v1-*
          path: evidence/gen3-learning-rule-foundry-v1
          merge-multiple: true
      - name: Aggregate scientific result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json
          from pathlib import Path
          paths=sorted(glob.glob("evidence/gen3-learning-rule-foundry-v1/result-*.json"))
          expected={f"result-{s}.json" for s in (771221,771222,771223,771224,771225)}
          found={Path(p).name for p in paths}
          rows=[json.load(open(p)) for p in paths]
          crashes=[r for r in rows if r.get("scientific_status")=="CRASHED"]
          passed=[r for r in rows if r.get("passed") is True]
          integrity=all(all(v is False for k,v in r.get("integrity",{}).items()
                            if k.endswith("_used_for_selection") or k.endswith("_scan")
                            or k in {"external_model","network_dependency","task_family_routing","target_identity_available","holdout_used_for_training"})
                         for r in rows) if rows else False
          if found != expected or len(rows)!=5:
              status="INCONCLUSIVE"
          elif crashes:
              status="CRASHED"
          elif len(passed)==5 and integrity:
              status="PASSED"
          else:
              status="FAILED"
          out={"version":"gen3-learning-rule-foundry-v1","scientific_status":status,
               "seed_count":len(rows),"passed_seed_count":len(passed),
               "crashed_seed_count":len(crashes),"integrity_ok":integrity,
               "per_seed":[{
                 "seed":r.get("seed"),"passed":r.get("passed"),"scientific_status":r.get("scientific_status"),
                 "reason":r.get("reason"),"candidate_program_space_total":r.get("candidate_program_space_total"),
                 "candidate_program_evaluations":r.get("candidate_program_evaluations"),
                 "context_program_candidates":r.get("context_program_candidates"),
                 "behavioral_classes":r.get("behavioral_classes"),
                 "eligible_representatives":r.get("eligible_representatives"),
                 "selected_program":r.get("selected_program"),
                 "outer_holdout_gain":r.get("outer_holdout_gain"),
                 "outer_transfer_gain":r.get("outer_transfer_gain"),
                 "legacy_before":r.get("legacy_before"),"legacy_after":r.get("legacy_after"),
                 "legacy_retention_ok":r.get("legacy_retention_ok"),
                 "replay_exact":r.get("replay_exact"),
                 "persistent_state_delta":r.get("persistent_state_delta"),
                 "integrity":r.get("integrity"),
                 "exception_type":r.get("exception_type"),"exception":r.get("exception")
               } for r in rows]}
          Path("evidence/gen3-learning-rule-foundry-v1").mkdir(parents=True,exist_ok=True)
          Path("evidence/gen3-learning-rule-foundry-v1/aggregate.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen3-learning-rule-foundry-v1-aggregate
          path: evidence/gen3-learning-rule-foundry-v1/aggregate.json
          if-no-files-found: error
