name: Gen6 direct-vocabulary grouped frontier diagnostic

on:
  push:
    branches:
      - research/acsie-h7-r3-exact-source-20261011
    paths:
      - ".github/workflows/gen6-frontier-direct-grouping.yml"

permissions:
  contents: read

jobs:
  gen6-frontier-direct-grouping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout proving-ground executor
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pin the single-change hypothesis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/gen6-direct-grouping diagnostics
          {
            echo "EXECUTOR_COMMIT=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "ACSIE_SOURCE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "HYPOTHESIS=group Pareto candidates by exact direct-vocabulary set under default objective; precompute candidate metadata once"
            echo "UNCHANGED=maximize_direct_vocabulary code path, ranking keys, dominance semantics, thresholds, search ordering within each direct group"
            echo "FRONTIER_CACHE=OFF"
            echo "STRUCTURAL_EXPANSION_CACHE=OFF"
            echo "SEED=2026100301; generations 0..6"
            echo "CHILD_WALL_LIMIT_SECONDS=120; RSS_GUARD_MIB=2048"
          } | tee evidence/gen6-direct-grouping/provenance.txt

      - name: Checkout exact ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and install comparison-only frontier implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acsie rev-parse HEAD)" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$(git -C acsie rev-parse 'HEAD^{tree}')" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          src="$GITHUB_WORKSPACE/acsie/cognitive_core/behavioral_search.py"
          actual="$(sha256sum "$src" | awk '{print $1}')"
          test "$actual" = "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          echo "ACSIE_BEHAVIORAL_SEARCH_ORIGINAL_SHA256=$actual" | tee evidence/gen6-direct-grouping/source-identity.txt
          python - "$src" <<'PY'
          import hashlib, pathlib, sys

          p = pathlib.Path(sys.argv[1])
          source = p.read_text()
          base_sha = hashlib.sha256(source.encode()).hexdigest()
          end_marker = "    def build_extreme_lookup("
          start_marker = "    def lineage_frontier(states: Sequence[tuple]) -> tuple[tuple, ...]:"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("frontier function markers are not unique")
          start = source.index(start_marker)
          end = source.index(end_marker, start + len(start_marker))
          original_block = source[start:end]
          if "_h7_direct_group_diag" in source:
              raise SystemExit("unexpected existing grouping patch")
          # Preserve the original function exactly and make it selectable during parity checks.
          inject = '''    _h7_lineage_frontier_original = lineage_frontier
          _h7_direct_group_diag = {
              "frontier_calls": 0,
              "input_states": 0,
              "context_groups": 0,
              "representative_candidates": 0,
              "all_pairs_upper_bound": 0,
              "same_direct_group_pair_upper_bound": 0,
              "pairwise_comparisons_actual": 0,
              "dominated_candidate_hits": 0,
              "max_direct_group_size": 0,
          }

          def _h7_lineage_frontier_grouped(states: Sequence[tuple]) -> tuple[tuple, ...]:
              """Default-objective frontier path with exact direct-vocabulary pre-grouping."""
              if not states:
                  return ()
              _h7_direct_group_diag["frontier_calls"] += 1
              _h7_direct_group_diag["input_states"] += len(states)
              contexts: dict[tuple, dict[tuple, tuple]] = {}
              for state in states:
                  context = (tuple(state[1]), tuple(state[3]))
                  meta = _H7_meta(state)
                  direct_vocabulary = tuple(sorted(meta["direct"]))
                  executable_signature = tuple(sorted(meta["lineage"]))
                  signature = (
                      direct_vocabulary,
                      executable_signature,
                      meta["ast_depth"],
                      meta["depth"],
                      meta["nodes"],
                  )
                  bucket = contexts.setdefault(context, {})
                  old = bucket.get(signature)
                  if old is None or rank(state) < rank(old):
                      bucket[signature] = state

              frontier = []
              for representatives in contexts.values():
                  candidates = tuple(representatives.values())
                  _h7_direct_group_diag["context_groups"] += 1
                  _h7_direct_group_diag["representative_candidates"] += len(candidates)
                  _h7_direct_group_diag["all_pairs_upper_bound"] += len(candidates) * max(0, len(candidates) - 1)

                  # Default/min-cost dominance requires the exact same direct macro set.
                  # Grouping on it is therefore a necessary-condition filter, not a new
                  # dominance rule. Metadata is materialized once per representative.
                  by_direct: dict[frozenset, list[tuple[tuple, dict]]] = {}
                  for state in candidates:
                      meta = _H7_meta(state)
                      by_direct.setdefault(meta["direct"], []).append((state, meta))

                  for direct_group in by_direct.values():
                      group_size = len(direct_group)
                      _h7_direct_group_diag["max_direct_group_size"] = max(
                          _h7_direct_group_diag["max_direct_group_size"], group_size
                      )
                      _h7_direct_group_diag["same_direct_group_pair_upper_bound"] += (
                          group_size * max(0, group_size - 1)
                      )
                      for state, state_meta in direct_group:
                          is_dominated = False
                          for other, other_meta in direct_group:
                              if other is state:
                                  continue
                              _h7_direct_group_diag["pairwise_comparisons_actual"] += 1
                              if (
                                  other_meta["ast_depth"] <= state_meta["ast_depth"]
                                  and state_meta["lineage"].issubset(other_meta["lineage"])
                                  and other_meta["depth"] <= state_meta["depth"]
                                  and other_meta["nodes"] <= state_meta["nodes"]
                              ):
                                  is_dominated = True
                                  _h7_direct_group_diag["dominated_candidate_hits"] += 1
                                  break
                          if not is_dominated:
                              frontier.append(state)
              return tuple(sorted(frontier, key=rank))

          def lineage_frontier(states: Sequence[tuple]) -> tuple[tuple, ...]:
              if __import__("os").environ.get("ACSIE_DISABLE_DIRECT_GROUPING") == "1":
                  return _h7_lineage_frontier_original(states)
              if selection_objective == "maximize_direct_vocabulary":
                  # Preserve the exact old path for the opt-in vocabulary objective.
                  return _h7_lineage_frontier_original(states)
              return _h7_lineage_frontier_grouped(states)

          '''
          # The injected text indentation is part of find_exact_expression's local scope.
          source = source[:start] + original_block + inject + source[end:]
          # Export local comparison counters outside the scientific result, immediately
          # before the last successful return. A timeout still captures live locals.
          result_marker = "        return BehavioralSearchResult("
          ret_pos = source.rfind(result_marker)
          if ret_pos < 0:
              raise SystemExit("final result-return marker missing")
          source = source[:ret_pos] + (
              '        find_exact_expression._H7_LAST_DIRECT_GROUP_DIAG = dict(_h7_direct_group_diag)\n'
              + source[ret_pos:]
          )
          p.write_text(source)
          print("ORIGINAL_SOURCE_SHA256=" + base_sha)
          print("DIAGNOSTIC_SOURCE_SHA256=" + hashlib.sha256(source.encode()).hexdigest())
          PY
          python -m py_compile "$src"
          sha256sum "$src" | tee evidence/gen6-direct-grouping/diagnostic-source-sha256.txt

      - name: Run six-file cognitive regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 python -m pytest -q \
            acsie/tests/test_open_ended_growth.py \
            acsie/tests/test_core014_recursive_cognitive_compiler.py \
            acsie/tests/test_core015_semantic_operator_discovery.py \
            acsie/tests/test_core016_open_semantic_substrate.py \
            acsie/tests/test_adaptive_capability_repair.py \
            acsie/tests/test_asi_claim_gate.py 2>&1 | tee evidence/gen6-direct-grouping/six-file-regression.txt

      - name: Require exact signatures against unchanged original implementation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 python - "$GITHUB_WORKSPACE/evidence/gen6-direct-grouping" <<'PY'
          import json, os, pathlib, sys, time
          from cognitive_core.behavioral_search import find_exact_expression
          from cognitive_core.open_ended_growth import OpenEndedRecursiveCognitiveCompiler
          from cognitive_core.recursive_cognitive_compiler import ArchiveRecord, CognitivePrimitive, Trace

          out = pathlib.Path(sys.argv[1])

          def build(op, seed):
              c = OpenEndedRecursiveCognitiveCompiler(max_depth=4, seed=seed)
              px = CognitivePrimitive("prim:x", {"op":"get","key":"x"}, ("x","y"), "delta", 0, (), ("opaque",), 0.0, 0.0, 0.0, 1, {})
              py = CognitivePrimitive("prim:y", {"op":"get","key":"y"}, ("x","y"), "delta", 0, (), ("opaque",), 0.0, 0.0, 0.0, 1, {})
              pz = CognitivePrimitive("prim:z", {"op":"get","key":"z"}, ("x","y","z"), "delta", 0, (), ("opaque",), 0.0, 0.0, 0.0, 1, {})
              c.primitives = {p.primitive_id:p for p in (px,py,pz)}
              c.archive = {p.primitive_id:ArchiveRecord(p) for p in (px,py,pz)}
              rows=[]
              for i in range(10):
                  x,y,z=float(i),float(i+1),float((i*3)%7)
                  target=max(x,y) if op=="max" else min(x,y) if op=="min" else x+y+z
                  rows.append(Trace({"x":x,"y":y,"z":z},target,"opaque",{},f"{op}-{seed}-{i}"))
              objective="maximize_direct_vocabulary" if op=="sum" else "minimize_expanded_cost"
              depth=2 if op=="sum" else 4
              return c,tuple(rows),depth,objective

          def signature(result):
              return None if result is None else {
                  "expression":result.expression,
                  "used_primitives":result.used_primitives,
                  "alternatives":result.alternatives,
                  "stats":dict(result.stats),
              }

          records=[]
          total_comparison_counts={"original":0,"grouped":0}
          all_pairs=0
          grouped_pairs=0
          for op in ("max","min","sum"):
              for seed in (771221,771222,771223):
                  c0,r0,d0,o0=build(op,seed)
                  os.environ["ACSIE_DISABLE_DIRECT_GROUPING"]="1"
                  t0=time.perf_counter()
                  before=find_exact_expression(c0,r0,max_depth=d0,require_macro=True,selection_objective=o0,max_alternatives=8)
                  elapsed_original=(time.perf_counter()-t0)*1000
                  sig0=signature(before)

                  c1,r1,d1,o1=build(op,seed)
                  os.environ.pop("ACSIE_DISABLE_DIRECT_GROUPING",None)
                  t1=time.perf_counter()
                  after=find_exact_expression(c1,r1,max_depth=d1,require_macro=True,selection_objective=o1,max_alternatives=8)
                  elapsed_grouped=(time.perf_counter()-t1)*1000
                  sig1=signature(after)
                  diag=dict(getattr(find_exact_expression,"_H7_LAST_DIRECT_GROUP_DIAG",{}))
                  equal=(sig0==sig1)
                  all_pairs += int(diag.get("all_pairs_upper_bound",0))
                  grouped_pairs += int(diag.get("same_direct_group_pair_upper_bound",0))
                  row={"fixture":op,"seed":seed,"exact_signature_equal":equal,
                       "original_ms":round(elapsed_original,3),"grouped_ms":round(elapsed_grouped,3),
                       "grouped_diag":diag,"result_found":after is not None}
                  records.append(row); print(json.dumps(row,sort_keys=True))
                  if not equal:
                      raise SystemExit(f"exact signature mismatch: {op}/{seed}")

          summary={"schema":"ACSIE.gen6_direct_vocabulary_grouping_parity.v1",
                   "cases":records,"case_count":len(records),
                   "all_exact_signatures_equal":all(x["exact_signature_equal"] for x in records),
                   "sum_all_pair_upper_bound":all_pairs,"sum_direct_group_pair_upper_bound":grouped_pairs,
                   "candidate_pair_bound_reduction_ratio":(1-grouped_pairs/all_pairs) if all_pairs else 0.0,
                   "interpretation_guard":"Nine bounded fixtures including the unchanged maximize_direct_vocabulary branch; no Gen6 scientific pass follows."}
          (out/"grouping-parity.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          PY

      - name: Prepare external live-counter sampler
        shell: bash
        run: |
          set -euo pipefail
          cat > diagnostics/sitecustomize.py <<'PY'
          import faulthandler,json,os,signal,sys,time
          faulthandler.enable(file=sys.stderr,all_threads=True); t0=time.monotonic(); log=os.environ.get("ACSIE_DIRECT_GROUP_LOG")
          def snap(sig,frame):
              faulthandler.dump_traceback(file=sys.stderr,all_threads=True)
              f=frame
              while f is not None and f.f_code.co_name!="find_exact_expression": f=f.f_back
              row={"elapsed_s":round(time.monotonic()-t0,3),"signal":int(sig)}
              if f is not None:
                  loc=f.f_locals
                  row["search"]={k:loc.get("stats",{}).get(k) for k in ("rows","max_depth","primitive_count","generated_expressions","unique_states","dominance_pruned_states","dominance_frontier_max","status")}
                  row["direct_group_diag"]=dict(loc.get("_h7_direct_group_diag",{}))
              if log:
                  with open(log,"a",buffering=1) as h:h.write(json.dumps(row,sort_keys=True)+"\n")
          signal.signal(signal.SIGUSR1,snap)
          PY
          python -m py_compile diagnostics/sitecustomize.py

      - name: Run one actual Gen6 seed with grouped frontier comparisons
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          root="$GITHUB_WORKSPACE/evidence/gen6-direct-grouping"; seed=2026100301
          ACSIE_DIRECT_GROUP_LOG="$root/gen6-live-counters.jsonl" \
          PYTHONPATH="$GITHUB_WORKSPACE/diagnostics:$GITHUB_WORKSPACE/lab:$GITHUB_WORKSPACE/acsie" \
            python -c 'import json,sys,acsie_open_ended_self_extending_proving as g; print(json.dumps(g.run_seed(int(sys.argv[1]),7),sort_keys=True),flush=True)' \
            "$seed" > "$root/gen6.stdout.jsonl" 2> "$root/gen6.stderr" &
          child=$!; start=$(date +%s); next=$((start+10)); timed_out=0; rss_guard=0; max_rss=0
          while kill -0 "$child" 2>/dev/null; do
            if ps -p "$child" -o stat= 2>/dev/null | grep -q 'Z'; then break; fi
            now=$(date +%s); elapsed=$((now-start)); rss=$(ps -p "$child" -o rss= 2>/dev/null | tr -d ' ' || echo 0)
            case "$rss" in ''|*[!0-9]*) rss=0;; esac
            if [ "$rss" -gt "$max_rss" ]; then max_rss=$rss; fi
            if [ "$rss" -ge 2097152 ]; then rss_guard=1; kill -TERM "$child" 2>/dev/null || true; sleep 3; kill -KILL "$child" 2>/dev/null || true; break; fi
            if [ "$now" -ge "$next" ]; then kill -USR1 "$child" 2>/dev/null || true; next=$((now+10)); fi
            if [ "$elapsed" -ge 120 ]; then timed_out=1; kill -TERM "$child" 2>/dev/null || true; sleep 3; kill -KILL "$child" 2>/dev/null || true; break; fi
            sleep 1
          done
          set +e; wait "$child"; rc=$?; set -e
          if [ "$rss_guard" -eq 1 ]; then status=RESOURCE_GUARD_RSS_LIMIT; elif [ "$timed_out" -eq 1 ]; then status=INCONCLUSIVE_CHILD_WALL_TIMEOUT; elif [ "$rc" -eq 0 ] && [ -s "$root/gen6.stdout.jsonl" ]; then status=CHILD_RETURNED_RECORD; else status=CHILD_ERROR_OR_EMPTY_OUTPUT; fi
          printf '{"seed":%s,"child_returncode":%s,"timeout_hit":%s,"rss_guard_hit":%s,"max_rss_kib":%s,"status":"%s"}\n' "$seed" "$rc" "$timed_out" "$rss_guard" "$max_rss" "$status" | tee "$root/gen6-child-status.json"
          python - "$root" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); p=root/"gen6-live-counters.jsonl"; samples=[]
          if p.exists():
              for line in p.read_text(errors="replace").splitlines():
                  try:samples.append(json.loads(line))
                  except Exception:pass
          child=json.loads((root/"gen6-child-status.json").read_text())
          summary={"schema":"ACSIE.gen6_direct_grouping_diagnostic.v1","source_commit":"d83cb60286f195eec02b4d7aa45a60539316d115",
                   "seed":2026100301,"child_status":child,"live_samples":samples,
                   "stdout_bytes":(root/"gen6.stdout.jsonl").stat().st_size,"stderr_bytes":(root/"gen6.stderr").stat().st_size,
                   "guard":"Only default-objective frontier candidate grouping and metadata precomputation changed; vocabulary-max objective keeps the original path. Timeout is inconclusive."}
          (root/"gen6-summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload exact-signature and Gen6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen6-direct-grouping-${{ github.run_id }}
          path: evidence/gen6-direct-grouping/
          if-no-files-found: error
