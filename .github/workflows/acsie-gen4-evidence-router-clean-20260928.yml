name: ACSIE evidence-router same-path probe
on:
  push:
    branches:
      - acsie/gen4-evidence-router-calibration-repair-20260928
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "same-path probe reached: run=${{ github.run_id }} sha=${{ github.sha }}" > same-path.txt
          gh issue comment 82 --repo Infrasigma/subsume-proving-ground --body-file same-path.txt
