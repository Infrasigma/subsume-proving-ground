name: ACSIE clean Gen4 evidence router qualification

on:
  push:
    branches:
      - acsie/gen4-evidence-router-calibration-repair-20260928
  pull_request:
    branches:
      - acsie/gen4-evidence-router-clean-20260928
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  ACSIE_SOURCE: "acsie/gen4-evidence-router-calibration-repair-20260928"
  SOURCE_RUN: "36376031059"
  VERIFIED_PARENT: "b31109864ae547320d877e6c1575b805d950edf9"
  EXPORT_SOURCE: "94a2a770a5799fd386217998bc21b585632ef7ed"
  VERIFIED_STATE_SHA256: "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9"

jobs:
  evidence-router-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Report workflow entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "ACSIE evidence-router workflow entered: commit=${{ github.sha }} run=${{ github.run_id }}" > workflow-entry.txt
          gh issue comment 82 --repo Infrasigma/subsume-proving-ground --body-file workflow-entry.txt
      - uses: actions/checkout@v4
      - name: Checkout exact evidence-router harness
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_SOURCE }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact evidence-router harness
        working-directory: acsie
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse "${ACSIE_SOURCE}")"
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${expected_sha}"
          test -f research/gen4_evidence_router_v1.py
          ! grep -F "\\n" research/gen4_evidence_router_v1.py
          echo "ACSIE_SOURCE_REF=${ACSIE_SOURCE}"
          echo "ACSIE_SOURCE_COMMIT=${actual_sha}"
          sha256sum research/gen4_evidence_router_v1.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact frozen Gen2 input
        uses: actions/download-artifact@v4
        with:
          name: acsie-gen4-verified-gen2-input-${{ env.SOURCE_RUN }}
          path: input
          run-id: ${{ env.SOURCE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact eight Gen4 shards
        uses: actions/download-artifact@v4
        with:
          pattern: acsie-gen4-multi-shard-*-${{ env.SOURCE_RUN }}
          path: shards
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact inputs
        run: |
          set -euo pipefail
          test -f input/verified-gen2-export.json
          test -f input/verified-gen2-state.json
          test "$(find shards -maxdepth 1 -name "shard-*.json" | wc -l)" = "8"
          python - <<'PY'
          import hashlib, json
          r=json.load(open("input/verified-gen2-export.json"))
          assert r["scientific_status"] == "PASSED", r
          assert r["scientific_parent_commit"] == "b31109864ae547320d877e6c1575b805d950edf9", r
          h=hashlib.sha256(open("input/verified-gen2-state.json","rb").read()).hexdigest()
          assert h == "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9", h
          PY
      - name: Execute exact evidence-calibrated gate
        working-directory: acsie
        run: |
          set -u
          PYTHONPATH=. python research/gen4_evidence_router_v1.py \
            ../input/verified-gen2-export.json \
            --merge \
            ../shards/shard-0.json \
            ../shards/shard-1.json \
            ../shards/shard-2.json \
            ../shards/shard-3.json \
            ../shards/shard-4.json \
            ../shards/shard-5.json \
            ../shards/shard-6.json \
            ../shards/shard-7.json \
            > ../evidence-router-final.json
          rc=$?
          cat ../evidence-router-final.json
          python - <<'PY'
          import json
          r=json.load(open("../evidence-router-final.json"))
          print("SCIENTIFIC_STATUS",r["scientific_status"])
          print("GEN4_HOLDOUT_GAIN",r["gen4_overlay"]["holdout_gain"])
          print("GEN4_TRANSFER_GAIN",r["gen4_overlay"]["transfer_gain"])
          print("GEN1_OVERLAY",r["retention"]["gen1_base"],r["retention"]["gen1_overlay"])
          print("GEN2_OVERLAY",r["retention"]["gen2_base"],r["retention"]["gen2_overlay"])
          print("GEN3_OVERLAY",r["retention"]["gen3_base"],r["retention"]["gen3_overlay"])
          print("DETERMINISTIC_REPLAY",r["replay"]["deterministic_replay"])
          assert r["scientific_status"] in {"PASSED","FAILED"}
          PY
          test "$rc" = "0"
      - name: Publish compact execution result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f evidence-router-final.json ]; then
            python - <<'PY'
          import json
          r=json.load(open("evidence-router-final.json"))
          p=r.get("provenance",{})
          g=r.get("gen4_overlay",{})
          ret=r.get("retention",{})
          replay=r.get("replay",{})
          print("## ACSIE H-GEN4-EVIDENCE-ROUTER execution")
          print(f"- workflow_run: ${{ github.run_id }}")
          print(f"- workflow_sha: ${{ github.sha }}")
          print(f"- ACSIE source ref: ${{ env.ACSIE_SOURCE }}")
          print(f"- executed_harness_commit: {p.get('executed_harness_commit')}")
          print(f"- scientific_core_source_commit: {p.get('scientific_core_source_commit')}")
          print(f"- shard_source_run: {p.get('shard_source_run')}")
          print(f"- scientific_status: {r.get('scientific_status')}")
          print(f"- selected_candidate: {r.get('selected',{}).get('fingerprint')}")
          print(f"- selected_context_program: {r.get('selected',{}).get('context_program')}")
          print(f"- gen4_holdout_gain: {g.get('holdout_gain')}")
          print(f"- gen4_transfer_gain: {g.get('transfer_gain')}")
          print(f"- gen1_base_overlay: {ret.get('gen1_base')} -> {ret.get('gen1_overlay')}")
          print(f"- gen2_base_overlay: {ret.get('gen2_base')} -> {ret.get('gen2_overlay')}")
          print(f"- gen3_base_overlay: {ret.get('gen3_base')} -> {ret.get('gen3_overlay')}")
          print(f"- stored_preserved: {ret.get('stored_preserved')}")
          print(f"- gen3_branch_unchanged: {ret.get('gen3_branch_unchanged')}")
          print(f"- deterministic_replay: {replay.get('deterministic_replay')}")
          print(f"- failure_boundary: {r.get('failure_boundary')}")
          print(f"- candidate_set_digest: {r.get('candidate_set_digest')}")
          print(f"- stream_digest: {r.get('stream_digest')}")
          PY
          else
            echo "## ACSIE H-GEN4-EVIDENCE-ROUTER execution"
            echo "- scientific_status: BLOCKED"
            echo "- reason: evidence-router-final.json was not produced"
          fi > execution-comment.md
          gh issue comment 82 --repo Infrasigma/subsume-proving-ground --body-file execution-comment.md

      - name: Package evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp input/verified-gen2-export.json evidence/
          cp input/verified-gen2-state.json evidence/
          cp shards/shard-*.json evidence/
          cp evidence-router-final.json evidence/
          sha256sum evidence/verified-gen2-state.json > evidence/state.sha256
          printf "%s\n" \
            "experiment=H-GEN4-EVIDENCE-ROUTER" \
            "source_candidate_run=${SOURCE_RUN}" \
            "evidence_router_harness=${ACSIE_SOURCE}" \
            "acsie_source_commit=$(git -C acsie rev-parse HEAD)" \
            "router_source_sha256=$(sha256sum acsie/research/gen4_evidence_router_v1.py | awk '{print $1}')" \
            "workflow_run=${{ github.run_id }}" \
            "workflow_sha=${{ github.sha }}" \
            "verified_state_sha256=${VERIFIED_STATE_SHA256}" \
            "candidate_count=128" \
            "shard_count=8" > evidence/execution-provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acsie-gen4-evidence-router-calibration-repair-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
