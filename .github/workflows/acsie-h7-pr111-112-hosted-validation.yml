name: ACSIE H7 PR111-112 exact-source hosted validation

on:
  push:
    branches:
      - research/acsie-pr112-hosted-validation-20261013
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  hosted-runner-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report hosted runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "ACSIE_H7_HOSTED_PREFLIGHT=START"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "KERNEL=$(uname -srm)"
          echo "PYTHON=$(python3 --version 2>&1 || true)"
          echo "LOGICAL_CPUS=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc || echo unknown)"
          awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/ {print}' /proc/meminfo || true
          df -h .
          echo "ACSIE_H7_HOSTED_PREFLIGHT=PASS"
          echo "ACSIE_SEARCH_STARTED=no"

  exact-source-validation:
    needs: hosted-runner-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout laboratory validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up isolated Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded test dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Verify exact ACSIE source snapshots and compute true SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          base = Path("research/acsie-h7-pr112-validation")
          manifest = json.loads((base / "manifest.json").read_text())
          records = []
          for item in manifest["files"]:
              path = Path(item["path"])
              data = path.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              entry = {
                  "variant": item["variant"],
                  "path": item["path"],
                  "source_ref": item["ref"],
                  "source_git_blob_sha1": item["git_blob_sha1"],
                  "actual_sha256": sha256,
                  "bytes": len(data),
              }
              if item["git_blob_sha1"] not in {"generated-lab-test", "not-original-file-blob"}:
                  actual_blob = subprocess.check_output(
                      ["git", "hash-object", str(path)], text=True
                  ).strip()
                  entry["actual_git_blob_sha1"] = actual_blob
                  assert actual_blob == item["git_blob_sha1"], (path, actual_blob, item["git_blob_sha1"])
              records.append(entry)
          output = {
              "schema": "ACSIE.H7.PR112.exact-source-check.v1",
              "source_repository": manifest["source_repository"],
              "baseline_ref": manifest["baseline"]["ref"],
              "candidate_ref": manifest["candidate"]["ref"],
              "files": records,
          }
          out = Path("research/acsie-h7-pr112-validation/evidence/source-integrity.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(output, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "status": "PASS",
              "verified_git_blob_sha1_files": sum("actual_git_blob_sha1" in f for f in records),
              "recorded_true_sha256_files": len(records),
              "manifest_schema": manifest["schema"],
          }, sort_keys=True))
          PY

      - name: Verify runtime import provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib, json, os
          from pathlib import Path
          base = Path("research/acsie-h7-pr112-validation").resolve()
          rows = []
          for variant in ("baseline", "candidate"):
              variant_root = base / variant
              env_path = str(variant_root)
              env = os.environ.copy()
              env["PYTHONPATH"] = env_path
              # Use isolated child processes so sys.modules cannot cross-contaminate the variants.
              import subprocess, sys
              code = r'''
          import hashlib, importlib, json
          from pathlib import Path
          expected = Path(__import__("sys").argv[1]).resolve()
          modules = {}
          for name in ("cognitive_core.recursive_cognitive_compiler", "cognitive_core.behavioral_search", "cognitive_core.open_ended_growth"):
              module = importlib.import_module(name)
              path = Path(module.__file__).resolve()
              assert expected in path.parents, (name, path, expected)
              modules[name] = {"path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          print(json.dumps(modules, sort_keys=True))
          '''
              p = subprocess.run(
                  [sys.executable, "-c", code, str(variant_root)],
                  cwd=base.parents[1], env=env, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True,
              )
              records = json.loads(p.stdout.splitlines()[-1])
              rows.append({"variant": variant, "modules": records})
          out = base / "evidence" / "runtime-import-provenance.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({"schema":"ACSIE.H7.PR112.import-provenance.v1","variants":rows}, indent=2, sort_keys=True)+"\n")
          print(json.dumps({"status":"PASS","variants":len(rows),"modules_per_variant":3}, sort_keys=True))
          PY

      - name: Run PR111 policy-baseline tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/acsie-h7-pr112-validation/baseline"
          set +e
          python -m pytest -q research/acsie-h7-pr112-validation/baseline/tests/test_open_ended_growth.py \
            > research/acsie-h7-pr112-validation/evidence/baseline-pytest.log 2>&1
          rc=$?
          set -e
          cat research/acsie-h7-pr112-validation/evidence/baseline-pytest.log
          echo "BASELINE_PYTEST_EXIT=$rc"
          exit "$rc"

      - name: Run PR112 candidate tests plus restored PR111 regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research/acsie-h7-pr112-validation/candidate"
          set +e
          python -m pytest -q \
            research/acsie-h7-pr112-validation/candidate/tests/test_open_ended_growth.py \
            research/acsie-h7-pr112-validation/candidate/tests/test_h7_preserved_lineage_frontier_regression.py \
            > research/acsie-h7-pr112-validation/evidence/candidate-pytest.log 2>&1
          rc=$?
          set -e
          cat research/acsie-h7-pr112-validation/evidence/candidate-pytest.log
          echo "CANDIDATE_PYTEST_EXIT=$rc"
          exit "$rc"

      - name: Run independent six-cell full-result and full-statistics parity benchmark
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          set +e
          python research/acsie-h7-pr112-validation/parity_benchmark.py \
            > research/acsie-h7-pr112-validation/evidence/parity-benchmark.stdout.log 2>&1
          rc=$?
          set -e
          cat research/acsie-h7-pr112-validation/evidence/parity-benchmark.stdout.log
          echo "PARITY_BENCHMARK_EXIT=$rc"
          exit "$rc"

      - name: Upload source, test, and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-h7-pr111-112-hosted-validation
          path: research/acsie-h7-pr112-validation/evidence/
          if-no-files-found: warn
          retention-days: 90
