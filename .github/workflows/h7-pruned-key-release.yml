name: H7 pruned expression-key lifetime diagnostic

on:
  push:
    branches:
      - research/acsie-h7-pruned-key-release-20261012
    paths:
      - ".github/workflows/h7-pruned-key-release.yml"
      - "lab/patch_h7_pruned_key_release.py"
      - "lab/run_h7_pruned_key_release.py"

permissions:
  contents: read

jobs:
  pruned-key-lifetime-preflight-and-gen6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proving-ground experiment harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze experiment contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/h7-pruned-key-release
          {
            echo "EXECUTOR_REPOSITORY=Infrasigma/subsume-proving-ground"
            echo "EXECUTOR_BRANCH=${GITHUB_REF_NAME}"
            echo "EXECUTOR_COMMIT=${GITHUB_SHA}"
            echo "WORKFLOW_RUN_ID=${GITHUB_RUN_ID}"
            echo "ACSIE_SOURCE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "ACSIE_SOURCE_TREE=12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
            echo "ACSIE_BEHAVIORAL_SEARCH_SHA256=2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
            echo "FACTOR=remove expression_key_by_state_token only for dominance-rejected candidates and actually pruned existing states"
            echo "FIXED_FACTOR=lineage-frontier FIFO cache capacity 128 in both arms"
            echo "OTHER_CACHES=OFF; GROUPING=OFF"
            echo "SEED=2026100301"
            echo "GENERATION_INDICES=0..6"
            echo "CHILD_WALL_LIMIT_SECONDS=180"
            echo "RSS_GUARD_BYTES=2147483648"
            echo "PREFLIGHT=exact max/min/sum result-statistics parity + 61/61 six-file regression + both key-release paths exercised"
            echo "SCIENCE_GATE=complete child record required; timeout/empty stdout is INCONCLUSIVE"
          } | tee evidence/h7-pruned-key-release/initial-contract.txt
          python -m py_compile lab/patch_h7_pruned_key_release.py lab/run_h7_pruned_key_release.py

      - name: Checkout exact ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acsie rev-parse HEAD)" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$(git -C acsie rev-parse 'HEAD^{tree}')" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          test "$(sha256sum acsie/cognitive_core/behavioral_search.py | awk '{print $1}')" = "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          {
            git -C acsie rev-parse HEAD
            git -C acsie rev-parse 'HEAD^{tree}'
            sha256sum acsie/cognitive_core/behavioral_search.py
          } | tee evidence/h7-pruned-key-release/acsie-source-identity.txt

      - name: Setup Python 3.11 and pytest
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install regression test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run exact signature parity, regression, and paired Gen6 diagnostic
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          python lab/run_h7_pruned_key_release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --acsie-root "$GITHUB_WORKSPACE/acsie" \
            --evidence "$GITHUB_WORKSPACE/evidence/h7-pruned-key-release" \
            --seed 2026100301 \
            --generations 7 \
            --timeout-seconds 180 \
            --rss-guard-bytes 2147483648 \
            2>&1 | tee evidence/h7-pruned-key-release/runner-stdout.txt

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h7-pruned-key-release-${{ github.run_id }}
          path: evidence/h7-pruned-key-release/
          if-no-files-found: error
          compression-level: 6
