name: Gen2 behavioral equivalence diagnostic

on:
  push:
    branches:
      - research/gen2-behavioral-equivalence-20261002
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  behavioral-equivalence:
    strategy:
      fail-fast: false
      matrix:
        seed: [771221, 771222, 771223, 771224, 771225]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4

      - name: Checkout exact ACSIE diagnostic source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: research/gen2-behavioral-equivalence-20261002
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-diagnostic
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact diagnostic source
        working-directory: acsie-diagnostic
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a3b772928f14aaa8373953801507aefd1c195427"
          git merge-base --is-ancestor "0a7b344c20ddfa9b73b78fdf00ad4f2fc3033fbe" HEAD

      - name: Run inner-data behavioral diagnostic
        working-directory: acsie-diagnostic
        env:
          SEED: "${{ matrix.seed }}"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          mkdir -p evidence/gen2-behavioral-equivalence
          python research/gen2_behavioral_equivalence_v1.py "$SEED"             > "evidence/gen2-behavioral-equivalence/result-$SEED.json"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen2-behavioral-equivalence-${{ matrix.seed }}
          path: acsie-diagnostic/evidence/gen2-behavioral-equivalence/**
          if-no-files-found: error

  aggregate:
    needs: behavioral-equivalence
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download seed diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: gen2-behavioral-equivalence-*
          path: evidence/gen2-behavioral-equivalence
          merge-multiple: true

      - name: Aggregate diagnostic result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path

          paths = sorted(glob.glob("evidence/gen2-behavioral-equivalence/result-*.json"))
          expected = {
              "result-771221.json",
              "result-771222.json",
              "result-771223.json",
              "result-771224.json",
              "result-771225.json",
          }
          found = {Path(p).name for p in paths}
          if found != expected:
              print("DIAGNOSTIC_STATUS=INCONCLUSIVE")
              print("missing_or_extra=", sorted(found ^ expected))
              raise SystemExit(0)

          data = [json.load(open(p)) for p in paths]
          collapse = all(
              d["summary"]["semantic_collapse_across_all_candidates"]
              for d in data
          )
          all_prediction_zero = all(
              d["summary"]["all_prediction_deltas_zero"]
              for d in data
          )
          all_winner_zero = all(
              d["summary"]["all_winner_deltas_zero"]
              for d in data
          )
          all_struct_state_zero = all(
              d["summary"]["all_structural_state_deltas_zero"]
              for d in data
          )

          status = "SEMANTIC_COLLAPSE_CONFIRMED" if (
              collapse and all_prediction_zero and
              all_winner_zero and all_struct_state_zero
          ) else "SEMANTIC_COLLAPSE_NOT_CONFIRMED"

          out = {
              "version": "gen2-behavioral-equivalence-v1",
              "status": status,
              "seed_count": len(data),
              "all_prediction_deltas_zero": all_prediction_zero,
              "all_winner_deltas_zero": all_winner_zero,
              "all_structural_state_deltas_zero": all_struct_state_zero,
              "per_seed": [
                  {
                      "seed": d["seed"],
                      "summary": d["summary"],
                      "integrity": d["integrity"],
                  }
                  for d in data
              ],
          }

          Path("evidence/gen2-behavioral-equivalence").mkdir(parents=True, exist_ok=True)
          Path("evidence/gen2-behavioral-equivalence/aggregate.json").write_text(
              json.dumps(out, indent=2, sort_keys=True)
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Upload aggregate diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen2-behavioral-equivalence-aggregate
          path: evidence/gen2-behavioral-equivalence/aggregate.json
          if-no-files-found: error
