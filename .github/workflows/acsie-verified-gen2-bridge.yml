name: ACSIE verified-Gen2 lineage bridge

on:
  push:
    paths:
      - ".github/workflows/acsie-verified-gen2-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: 302d8f981999b662399f2a72b474130ad5d59dd6
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source
        working-directory: acsie
        run: git rev-parse HEAD && git rev-parse HEAD^{tree}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Run lineage-compatible corrected Gen2
        working-directory: acsie
        run: PYTHONPATH=. python research/native_self_learning_kernel_gen2_corrected_retention_v1.py | tee ../gen2-bridge.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen2-bridge-${{ github.run_id }}
          path: gen2-bridge.json
