name: ACE G15 Metacognitive Self Model Gate

on:
  pull_request:

concurrency:
  group: ace-g15-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g15:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: G15 metacognitive self model
        run: go test -mod=mod -run '^TestG15MetacognitiveSelfModelAndRegulation$' ./internal/ace -count=1 -v -timeout 20m
      - name: G15 race
        run: go test -mod=mod -race -run '^TestG15MetacognitiveSelfModelAndRegulation$' ./internal/ace -count=1 -v -timeout 20m
