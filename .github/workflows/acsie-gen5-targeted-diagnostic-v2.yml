name: ACSIE Gen5 targeted diagnostic v2

on:
  push:
    paths:
      - ".github/workflows/acsie-gen5-targeted-diagnostic-v2.yml"

permissions:
  contents: read

jobs:
  gen5-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public proving harness
        uses: actions/checkout@v4
        with:
          path: lab-harness
          fetch-depth: 1

      - name: Checkout exact private ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: b2349fc24803fa01cf2da27dccc1f17fe3df21f4
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        working-directory: acsie
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "b2349fc24803fa01cf2da27dccc1f17fe3df21f4"
          echo "ACSIE_COMMIT=$(git rev-parse HEAD)"
          echo "ACSIE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Execute exact two-seed Gen5 diagnostic
        working-directory: acsie
        env:
          ACSIE_GITHUB_ACTIONS: "1"
        run: |
          set +e
          bash research/run_gen5_gate.sh > /tmp/gen5-gate.stdout 2> /tmp/gen5-gate.stderr
          rc=$?
          echo "${rc}" > /tmp/gen5-gate.exit_code
          cat /tmp/gen5-gate.stdout
          cat /tmp/gen5-gate.stderr >&2
          echo "GEN5_GATE_EXIT=${rc}"
          exit 0

      - name: Validate and summarize scientific records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for seed in (2026092801, 2026092804):
              p = Path(f"/tmp/acsie-gen5-run/experiment-{seed}.json")
              d = json.loads(p.read_text())
              print(json.dumps({
                  "seed": seed,
                  "scientific_status": d.get("scientific_status"),
                  "known_bank_insufficient": (d.get("discovery") or {}).get("known_bank_insufficient"),
                  "prior_bank_best_selection": (d.get("discovery") or {}).get("prior_bank_best_selection"),
                  "prior_bank_best_selection_lower_bound": (d.get("discovery") or {}).get("prior_bank_best_selection_lower_bound"),
                  "selection_uncertainty": (d.get("discovery") or {}).get("selection_uncertainty"),
                  "selected": (d.get("discovery") or {}).get("selected"),
                  "final_holdout": d.get("final_holdout"),
                  "final_transfer": d.get("final_transfer"),
                  "same_episode_reuse": d.get("same_episode_reuse"),
                  "retention_status": (d.get("gen1_to_gen4_retention") or {}).get("status"),
                  "retention_checks": (d.get("gen1_to_gen4_retention") or {}).get("checks"),
                  "retention": {
                      k: {
                          "baseline_expected_branch": v.get("baseline_expected_branch"),
                          "post_expected_branch": v.get("post_expected_branch"),
                          "p4_selected_rows": v.get("p4_selected_rows"),
                          "baseline_coverage": v.get("baseline_coverage"),
                          "post_coverage": v.get("post_coverage"),
                      }
                      for k,v in ((d.get("gen1_to_gen4_retention") or {}).get("post_acquisition") or {}).items()
                  } if False else d.get("gen1_to_gen4_retention"),
              }, sort_keys=True))
          PY

      - name: Package evidence
        if: always()
        run: |
          mkdir -p /tmp/gen5-artifact
          cp -a /tmp/gen5-gate.stdout /tmp/gen5-gate.stderr /tmp/gen5-gate.exit_code /tmp/gen5-artifact/
          cp -a /tmp/acsie-gen5-run /tmp/gen5-artifact/
          (cd /tmp/gen5-artifact && find . -type f -print0 | sort -z | xargs -0 sha256sum > manifest.sha256)

      - name: Upload Gen5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen5-targeted-v2-b2349fc2
          path: /tmp/gen5-artifact
          if-no-files-found: error
