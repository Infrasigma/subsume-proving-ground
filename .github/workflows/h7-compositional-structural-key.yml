name: H7 compositional structural-key exactness and Gen6 diagnostic

on:
  push:
    branches:
      - research/acsie-h7-compositional-structural-key-20261012
    paths:
      - ".github/workflows/h7-compositional-structural-key.yml"
      - "lab/patch_h7_compositional_structural_key.py"
      - "lab/run_h7_compositional_structural_key.py"

permissions:
  contents: read

jobs:
  exact-key-parity-and-gen6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout proving-ground experiment harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze experiment contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/h7-compositional-structural-key
          {
            echo "EXECUTOR_REPOSITORY=Infrasigma/subsume-proving-ground"
            echo "EXECUTOR_BRANCH=${GITHUB_REF_NAME}"
            echo "EXECUTOR_COMMIT=${GITHUB_SHA}"
            echo "WORKFLOW_RUN_ID=${GITHUB_RUN_ID}"
            echo "ACSIE_SOURCE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "ACSIE_SOURCE_TREE=12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
            echo "ACSIE_BEHAVIORAL_SEARCH_SHA256=2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
            echo "FACTOR=compose exact canonical JSON structural keys recursively; do not materialize expanded AST or re-dump expanded child trees"
            echo "FIXED_FACTOR=lineage-frontier FIFO cache capacity 128 in both arms"
            echo "ARMS=original structural_expand+JSON key; compositional structural JSON key"
            echo "SEED=2026100301"
            echo "GENERATION_INDICES=0..6"
            echo "CHILD_WALL_LIMIT_SECONDS=180 per arm"
            echo "RSS_GUARD_BYTES=2147483648 per arm"
            echo "PREFLIGHT=expanded-reference exact-key matrix + commutative/noncommutative/alias/cycle witnesses + max/min/sum full-result parity + 61/61 regression per arm"
            echo "SAMPLING=10-second stack/live-state only; no per-node counters or recursive timers"
            echo "SCIENCE_GATE=complete child record required; timeout or empty stdout is INCONCLUSIVE"
          } | tee evidence/h7-compositional-structural-key/initial-contract.txt
          python -m py_compile \
            lab/patch_h7_compositional_structural_key.py \
            lab/run_h7_compositional_structural_key.py \
            lab/patch_h7_metadata_only_bucket_duplicate.py

      - name: Checkout exact private ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acsie rev-parse HEAD)" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$(git -C acsie rev-parse 'HEAD^{tree}')" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          test "$(sha256sum acsie/cognitive_core/behavioral_search.py | awk '{print $1}')" = "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          {
            echo "ACSIE_COMMIT=$(git -C acsie rev-parse HEAD)"
            echo "ACSIE_TREE=$(git -C acsie rev-parse 'HEAD^{tree}')"
            sha256sum acsie/cognitive_core/behavioral_search.py
          } | tee evidence/h7-compositional-structural-key/acsie-source-identity.txt

      - name: Setup Python 3.11 and pytest
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install regression test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run exact key parity, regression, and paired Gen6 diagnostic
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python lab/run_h7_compositional_structural_key.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --acsie-root "$GITHUB_WORKSPACE/acsie" \
            --evidence "$GITHUB_WORKSPACE/evidence/h7-compositional-structural-key" \
            --seed 2026100301 \
            --generations 7 \
            --timeout-seconds 180 \
            --rss-guard-bytes 2147483648 \
            2>&1 | tee evidence/h7-compositional-structural-key/runner-stdout.txt

      - name: Upload exactness and Gen6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h7-compositional-structural-key-${{ github.run_id }}
          path: evidence/h7-compositional-structural-key/
          if-no-files-found: error
          compression-level: 6
