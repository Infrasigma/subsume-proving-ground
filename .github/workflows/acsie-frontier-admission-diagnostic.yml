name: ACSIE frontier-admission generation-8 diagnostic

on:
  push:
    branches:
      - research/acceptance-telemetry-frontier-admission-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-0302:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Clone exact ACSIE runtime
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "7e905d73c15ece4b8b5d7cb73218bac34c2e1314"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-frontier-admission
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-frontier-admission
          git -C /tmp/acsie-frontier-admission fetch --depth 1 origin "$ACSIE_REF"
          git -C /tmp/acsie-frontier-admission checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-frontier-admission rev-parse HEAD)" = "$ACSIE_REF"

      - name: Run exact unit tests
        run: |
          set -euo pipefail
          python3 -m venv /tmp/acsie-frontier-admission-venv
          . /tmp/acsie-frontier-admission-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-frontier-admission pytest -q /tmp/acsie-frontier-admission/tests/test_open_ended_growth.py
          PYTHONPATH=/tmp/acsie-frontier-admission:. pytest -q lab/test_open_ended_bootstrap_language.py

      - name: Run seed 0302 through generation 8 diagnostic point
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: /tmp/acsie-frontier-admission
        run: |
          set +e
          . /tmp/acsie-frontier-admission-venv/bin/activate
          set -o pipefail
          {
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "ACSIE_REF=7e905d73c15ece4b8b5d7cb73218bac34c2e1314"
            echo "SEED=2026100302"
            echo "GENERATIONS=9"
            python3 -u - <<'PY'
          import json
          import lab.acsie_open_ended_self_extending_proving as proving
          result = proving.run_seed(2026100302, 9)
          print(json.dumps(result, sort_keys=True), flush=True)
          for row in result["generations_detail"]:
              if row["generation"] in (7, 8):
                  print(json.dumps({
                      "generation": row["generation"],
                      "accepted": row["accepted"],
                      "acceptance_reason": row.get("acceptance_reason"),
                      "primitive_found": row.get("primitive_found"),
                      "candidate_count": row.get("primitive_candidate_count"),
                      "frontier_validated_candidate_count": row.get("frontier_validated_candidate_count"),
                      "selected_candidate": row.get("selected_candidate"),
                      "transfer_error": row.get("transfer_error"),
                      "ood_error": row.get("ood_error"),
                      "lineage_ok": row.get("lineage_ok"),
                      "probe_success_rate": row.get("probe_success_rate"),
                      "probe_reuse_rate": row.get("probe_reuse_rate"),
                  }, sort_keys=True), flush=True)
          PY
          } 2>&1 | tee diagnostic-result.txt
          rc=${PIPESTATUS[0]}
          echo "DIAGNOSTIC_RC=$rc" | tee -a diagnostic-result.txt
          exit "$rc"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-frontier-admission-seed0302-${{ github.sha }}
          path: diagnostic-result.txt

  scientific-gate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [2026100301, 2026100302, 2026100303, 2026100304, 2026100305]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Clone exact ACSIE runtime
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "7e905d73c15ece4b8b5d7cb73218bac34c2e1314"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-hfva
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-hfva
          git -C /tmp/acsie-hfva fetch --depth 1 origin "$ACSIE_REF"
          git -C /tmp/acsie-hfva checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-hfva rev-parse HEAD)" = "$ACSIE_REF"

      - name: Run exact unit tests
        run: |
          set -euo pipefail
          python3 -m venv /tmp/hfva-venv
          . /tmp/hfva-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-hfva pytest -q /tmp/acsie-hfva/tests/test_open_ended_growth.py
          PYTHONPATH=/tmp/acsie-hfva:. pytest -q lab/test_open_ended_bootstrap_language.py

      - name: Run strict 12-generation H-FVA seed
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: /tmp/acsie-hfva
        run: |
          set +e
          . /tmp/hfva-venv/bin/activate
          set -o pipefail
          {
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "ACSIE_REF=7e905d73c15ece4b8b5d7cb73218bac34c2e1314"
            echo "SEED=${{ matrix.seed }}"
            echo "GENERATIONS=12"
            echo "HYPOTHESIS=H-FVA"
            python3 -u - <<PY
          import json
          import lab.acsie_open_ended_self_extending_proving as proving
          result = proving.run_seed(int("${{ matrix.seed }}"), 12)
          print(json.dumps(result, sort_keys=True), flush=True)
          details = result.get("generations_detail", [])
          h_fva = bool(details) and all(
              row.get("acceptance_reason") == "ACCEPTED_FRONTIER"
              for row in details if row.get("accepted")
          )
          frontier_validated = bool(details) and all(
              int(row.get("frontier_validated_candidate_count", 0)) >= 1
              for row in details if row.get("accepted")
          )
          integrity = (
              not result.get("external_model", True)
              and not result.get("target_identity_available_to_runtime", True)
              and not result.get("task_family_route", True)
              and not result.get("holdout_used_for_search_selection", True)
              and not result.get("transfer_used_for_search_selection", True)
              and not result.get("ood_used_for_search_selection", True)
          )
          ok = bool(
              result.get("finite_open_ended_growth_gate")
              and result.get("every_generation_accepted")
              and h_fva
              and frontier_validated
              and integrity
          )
          print("H_FVA_ACTIVE=" + ("PASS" if h_fva else "FAIL"), flush=True)
          print("H_FVA_FRONTIER_VALIDATION=" + ("PASS" if frontier_validated else "FAIL"), flush=True)
          print("SCIENTIFIC_SEED_GATE=" + ("PASS" if ok else "FAIL"), flush=True)
          raise SystemExit(0 if ok else 2)
          PY
          } 2>&1 | tee hfva-seed-result.txt
          rc=${PIPESTATUS[0]}
          echo "SCIENTIFIC_SEED_GATE_RC=$rc" | tee -a hfva-seed-result.txt
          exit "$rc"

      - name: Upload H-FVA seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-hfva-seed-${{ matrix.seed }}-${{ github.sha }}
          path: hfva-seed-result.txt

  scientific-aggregate:
    if: always()
    needs: scientific-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download H-FVA evidence
        uses: actions/download-artifact@v4
        with:
          pattern: acsie-hfva-seed-*-${{ github.sha }}
          path: hfva-evidence
          merge-multiple: false
      - name: Evaluate H-FVA five-seed gate
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {2026100301,2026100302,2026100303,2026100304,2026100305}
          rows = {}
          hashes = {}
          for p in sorted(Path("hfva-evidence").glob("**/hfva-seed-result.txt")):
              hashes[str(p)] = hashlib.sha256(p.read_bytes()).hexdigest()
              for line in p.read_text().splitlines():
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if isinstance(obj, dict) and "seed" in obj and "finite_open_ended_growth_gate" in obj:
                      rows[int(obj["seed"])] = obj
          complete = set(rows) == expected
          integrity = complete and all(
              not rows[s].get("external_model", True)
              and not rows[s].get("target_identity_available_to_runtime", True)
              and not rows[s].get("task_family_route", True)
              and not rows[s].get("holdout_used_for_search_selection", True)
              and not rows[s].get("transfer_used_for_search_selection", True)
              and not rows[s].get("ood_used_for_search_selection", True)
              for s in expected
          )
          science = complete and integrity and all(
              rows[s].get("finite_open_ended_growth_gate")
              and rows[s].get("every_generation_accepted")
              and rows[s].get("lineage_closed")
              and rows[s].get("strict_growth")
              and rows[s].get("depth_growth_contract")
              and rows[s].get("closure_trap_count") == 0
              and rows[s].get("probe_trap_count") == 0
              for s in expected
          )
          hfva = complete and all(
              any(x == "H_FVA_ACTIVE=PASS" for x in Path(p).read_text().splitlines())
              and any(x == "H_FVA_FRONTIER_VALIDATION=PASS" for x in Path(p).read_text().splitlines())
              for p in hashes
          )
          if not complete:
              status = "INCONCLUSIVE"
              classification = "INCOMPLETE_SEED_EVIDENCE"
          elif science and hfva:
              status = "PASS"
              classification = "SCIENTIFIC_PASS_H_FVA"
          else:
              status = "FAIL"
              classification = "SCIENTIFIC_FAIL"
          report = {
              "scientific_gate": status,
              "status_classification": classification,
              "hypothesis": "H-FVA",
              "acsie_ref": "7e905d73c15ece4b8b5d7cb73218bac34c2e1314",
              "expected_seeds": sorted(expected),
              "observed_seeds": sorted(rows),
              "missing_seeds": sorted(expected - set(rows)),
              "integrity_ok": integrity,
              "h_fva_invariant_ok": hfva,
              "seed_results": {
                  str(s): {
                      "finite_open_ended_growth_gate": rows[s].get("finite_open_ended_growth_gate"),
                      "every_generation_accepted": rows[s].get("every_generation_accepted"),
                      "lineage_closed": rows[s].get("lineage_closed"),
                      "strict_growth": rows[s].get("strict_growth"),
                      "depth_growth_contract": rows[s].get("depth_growth_contract"),
                      "closure_trap_count": rows[s].get("closure_trap_count"),
                      "probe_trap_count": rows[s].get("probe_trap_count"),
                      "retained_count": rows[s].get("retained_count"),
                  } for s in sorted(rows)
              },
              "evidence_sha256": hashes,
          }
          print(json.dumps(report, sort_keys=True, indent=2))
          Path("hfva-aggregate-scientific-gate.json").write_text(json.dumps(report, sort_keys=True, indent=2) + "\n")
          raise SystemExit(0 if status == "PASS" else 2)
          PY
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-hfva-aggregate-${{ github.sha }}
          path: hfva-aggregate-scientific-gate.json
