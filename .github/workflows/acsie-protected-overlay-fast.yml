name: ACSIE protected-overlay fast diagnostic

on:
  push:
    paths:
      - ".github/workflows/acsie-protected-overlay-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: e876eaca1446e26295702d0a1ccca64d99f6276e
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - name: Focused tests
        working-directory: acsie
        run: PYTHONPATH=. python -m pytest -q tests/test_native_independent_core.py -k "compositional_context_program or protected_overlay or historical_competence"
      - name: Exact candidate gate
        working-directory: acsie
        shell: bash
        run: |
          PYTHONPATH=. python research/gen3_exact_candidate_retention_gate_v1.py | tee ../exact-candidate.json
      - name: Autonomous Gen3 gate
        working-directory: acsie
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python research/native_self_learning_kernel_gen3_compositional_retention_v1.py | tee ../autonomous-gen3.json
          rc=${PIPESTATUS[0]}
          echo "AUTONOMOUS_RC=$rc"
          exit 0
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-overlay-fast-${{ github.run_id }}
          path: |
            exact-candidate.json
            autonomous-gen3.json
