name: ACE Focused Validation

on:
  push:
    branches: ["ace-full-system-20260911"]
  pull_request:

permissions:
  contents: read

jobs:
  ace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go mod tidy
      - run: go test -timeout 45m ./internal/ace
      - run: go test -race -timeout 45m ./internal/ace
      - run: go vet ./internal/ace
      - run: go build ./cmd/ace
