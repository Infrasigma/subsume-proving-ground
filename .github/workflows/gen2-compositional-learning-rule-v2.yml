name: Gen2 compositional persistent learning-rule v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compositional-learning-rule:
    strategy:
      fail-fast: false
      matrix:
        seed: [771221, 771222, 771223, 771224, 771225]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4

      - name: Checkout exact ACSIE compositional-rule source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: research/gen2-compositional-learning-rule-v2-20261002
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-compositional-rule
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact ACSIE source
        working-directory: acsie-compositional-rule
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "20e4ee955c5b420bb637029b40590e99da665aa5"
          git merge-base --is-ancestor "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d" HEAD

      - name: Syntax-check experiment
        working-directory: acsie-compositional-rule
        run: |
          set -euo pipefail
          python -m py_compile research/gen2_compositional_learning_rule_v2.py

      - name: Run compositional learning-rule experiment
        working-directory: acsie-compositional-rule
        env:
          SEED: "${{ matrix.seed }}"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          mkdir -p evidence/gen2-compositional-learning-rule-v2
          set +e
          python research/gen2_compositional_learning_rule_v2.py "$SEED"             > "evidence/gen2-compositional-learning-rule-v2/result-$SEED.json"
          status=$?
          set -e
          test -s "evidence/gen2-compositional-learning-rule-v2/result-$SEED.json"
          exit "$status"

      - name: Upload compositional-rule evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen2-compositional-learning-rule-v2-${{ matrix.seed }}
          path: acsie-compositional-rule/evidence/gen2-compositional-learning-rule-v2/**
          if-no-files-found: error

  aggregate:
    needs: compositional-learning-rule
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gen2-compositional-learning-rule-v2-*
          path: evidence/gen2-compositional-learning-rule-v2
          merge-multiple: true

      - name: Aggregate five-seed scientific result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path

          paths = sorted(glob.glob("evidence/gen2-compositional-learning-rule-v2/result-*.json"))
          expected = {f"result-{s}.json" for s in (771221,771222,771223,771224,771225)}
          found = {Path(p).name for p in paths}

          if found != expected:
              out = {
                  "version": "gen2-compositional-learning-rule-v2",
                  "scientific_status": "INCONCLUSIVE",
                  "expected": sorted(expected),
                  "found": sorted(found),
              }
          else:
              rows = [json.load(open(p)) for p in paths]
              passed = [r for r in rows if bool(r.get("passed"))]
              integrity_ok = all(
                  not r.get("integrity", {}).get("outer_holdout_used_for_selection", True)
                  and not r.get("integrity", {}).get("outer_transfer_used_for_selection", True)
                  and not r.get("integrity", {}).get("final_legacy_holdout_used_for_selection", True)
                  and not r.get("integrity", {}).get("candidate_outer_oracle_scan", True)
                  and not r.get("integrity", {}).get("external_model", True)
                  and not r.get("integrity", {}).get("network_dependency", True)
                  and not r.get("integrity", {}).get("task_family_routing", True)
                  for r in rows
              )
              out = {
                  "version": "gen2-compositional-learning-rule-v2",
                  "scientific_status": "PASSED" if len(passed) == 5 and integrity_ok else "FAILED",
                  "seed_count": len(rows),
                  "passed_seed_count": len(passed),
                  "integrity_ok": integrity_ok,
                  "per_seed": [
                      {
                          "seed": r.get("seed"),
                          "passed": r.get("passed"),
                          "reason": r.get("reason"),
                          "candidate_program_space_total": r.get("candidate_program_space_total"),
                          "candidate_program_evaluations": r.get("candidate_program_evaluations"),
                          "behavioral_classes": r.get("behavioral_classes"),
                          "eligible_representatives": r.get("eligible_representatives"),
                          "selected_program": r.get("selected_program"),
                          "outer_holdout_gain": r.get("outer_holdout_gain"),
                          "outer_transfer_gain": r.get("outer_transfer_gain"),
                          "legacy_before": r.get("legacy_before"),
                          "legacy_after": r.get("legacy_after"),
                          "replay_exact": r.get("replay_exact"),
                          "integrity": r.get("integrity"),
                      }
                      for r in rows
                  ],
              }

          Path("evidence/gen2-compositional-learning-rule-v2").mkdir(parents=True, exist_ok=True)
          Path("evidence/gen2-compositional-learning-rule-v2/aggregate.json").write_text(
              json.dumps(out, indent=2, sort_keys=True)
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen2-compositional-learning-rule-v2-aggregate
          path: evidence/gen2-compositional-learning-rule-v2/aggregate.json
          if-no-files-found: error
