name: ACSIE open-ended bounded depth-continuation v2

on:
  push:
    branches:
      - research/open-ended-depth-continuation-bounded-v2-20261004
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        seed: [2026100301, 2026100302, 2026100303, 2026100304, 2026100305]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Clone exact ACSIE bounded-continuation commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "7e905d73c15ece4b8b5d7cb73218bac34c2e1314"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-open-ended-bounded-v2
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-open-ended-bounded-v2
          git -C /tmp/acsie-open-ended-bounded-v2 fetch --depth 1 origin "$ACSIE_REF"
          git -C /tmp/acsie-open-ended-bounded-v2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-open-ended-bounded-v2 rev-parse HEAD)" = "$ACSIE_REF"

      - name: Run exact ACSIE unit tests
        run: |
          set -euo pipefail
          python3 -m venv /tmp/open-ended-bounded-v2-venv
          . /tmp/open-ended-bounded-v2-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-open-ended-bounded-v2 pytest -q /tmp/acsie-open-ended-bounded-v2/tests/test_open_ended_growth.py
          PYTHONPATH=/tmp/acsie-open-ended-bounded-v2:. pytest -q lab/test_open_ended_bootstrap_language.py

      - name: Run strict 12-generation seed
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: /tmp/acsie-open-ended-bounded-v2
          ACSIE_REF: "7e905d73c15ece4b8b5d7cb73218bac34c2e1314"
        run: |
          set +e
          . /tmp/open-ended-bounded-v2-venv/bin/activate
          set -o pipefail
          {
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "ACSIE_REF=7e905d73c15ece4b8b5d7cb73218bac34c2e1314"
            echo "SEED=${{ matrix.seed }}"
            echo "GENERATIONS=12"
            echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 -u - <<PY
          import json
          import lab.acsie_open_ended_self_extending_proving as proving
          seed = int("${{ matrix.seed }}")
          result = proving.run_seed(seed, 12)
          print(json.dumps(result, sort_keys=True), flush=True)
          ok = bool(
              result.get("finite_open_ended_growth_gate")
              and not result.get("external_model")
              and not result.get("target_identity_available_to_runtime")
              and not result.get("task_family_route")
              and not result.get("holdout_used_for_search_selection")
              and not result.get("transfer_used_for_search_selection")
              and not result.get("ood_used_for_search_selection")
          )
          print("SCIENTIFIC_SEED_GATE=" + ("PASS" if ok else "FAIL"), flush=True)
          raise SystemExit(0 if ok else 2)
          PY
          } 2>&1 | tee seed-result.txt
          rc=${PIPESTATUS[0]}
          echo "SCIENTIFIC_SEED_GATE_RC=$rc" | tee -a seed-result.txt
          exit "$rc"

      - name: Upload seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-open-ended-bounded-v2-seed-${{ matrix.seed }}-${{ github.sha }}
          path: seed-result.txt

  aggregate:
    if: always()
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download seed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: acsie-open-ended-bounded-v2-seed-*-${{ github.sha }}
          path: seed-evidence
          merge-multiple: false

      - name: Evaluate frozen aggregate gate
        run: |
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          expected = {2026100301,2026100302,2026100303,2026100304,2026100305}
          rows = {}
          hashes = {}

          for p in sorted(Path("seed-evidence").glob("**/seed-result.txt")):
              hashes[str(p)] = hashlib.sha256(p.read_bytes()).hexdigest()
              for line in p.read_text().splitlines():
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if isinstance(obj, dict) and "seed" in obj and "finite_open_ended_growth_gate" in obj:
                      rows[int(obj["seed"])] = obj

          integrity_ok = (
              set(rows) == expected
              and all(not rows[s].get("external_model", True) for s in expected)
              and all(not rows[s].get("target_identity_available_to_runtime", True) for s in expected)
              and all(not rows[s].get("task_family_route", True) for s in expected)
              and all(not rows[s].get("holdout_used_for_search_selection", True) for s in expected)
              and all(not rows[s].get("transfer_used_for_search_selection", True) for s in expected)
              and all(not rows[s].get("ood_used_for_search_selection", True) for s in expected)
          )

          complete_seed_evidence = set(rows) == expected
          scientific_ok = complete_seed_evidence and integrity_ok and all(
              bool(rows[s]["finite_open_ended_growth_gate"]) for s in expected
          )

          if not complete_seed_evidence:
              gate_status = "INCONCLUSIVE"
              status_classification = "INCOMPLETE_SEED_EVIDENCE"
          elif scientific_ok:
              gate_status = "PASS"
              status_classification = "SCIENTIFIC_PASS"
          else:
              gate_status = "FAIL"
              status_classification = "SCIENTIFIC_FAIL"

          report = {
              "scientific_gate": gate_status,
              "status_classification": status_classification,
              "missing_seeds": sorted(expected - set(rows)),
              "integrity_ok": integrity_ok,
              "acsie_ref": "7e905d73c15ece4b8b5d7cb73218bac34c2e1314",
              "expected_seeds": sorted(expected),
              "observed_seeds": sorted(rows),
              "seed_results": {
                  str(s): {
                      "finite_open_ended_growth_gate": rows[s]["finite_open_ended_growth_gate"],
                      "every_generation_accepted": rows[s].get("every_generation_accepted"),
                      "every_closure_perfect": rows[s].get("every_closure_perfect"),
                      "every_probe_perfect": rows[s].get("every_probe_perfect"),
                      "lineage_closed": rows[s].get("lineage_closed"),
                      "strict_growth": rows[s].get("strict_growth"),
                      "depth_growth_contract": rows[s].get("depth_growth_contract"),
                      "closure_trap_count": rows[s].get("closure_trap_count"),
                      "probe_trap_count": rows[s].get("probe_trap_count"),
                      "final_closure_reuse_rate": rows[s].get("final_closure_reuse_rate"),
                      "final_probe_reuse_rate": rows[s].get("final_probe_reuse_rate"),
                      "final_target_depth": rows[s].get("final_target_depth"),
                      "retained_count": rows[s].get("retained_count"),
                  }
                  for s in sorted(rows)
              },
              "evidence_sha256": hashes,
          }

          print(json.dumps(report, sort_keys=True, indent=2))
          Path("aggregate-scientific-gate.json").write_text(json.dumps(report, sort_keys=True, indent=2) + "\n")
          raise SystemExit(0 if scientific_ok else 2)
          PY

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-open-ended-bounded-v2-aggregate-${{ github.sha }}
          path: aggregate-scientific-gate.json
