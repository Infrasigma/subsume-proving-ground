name: ACSIE L2-B canonical sequential acquisition

on:
  push:
    paths:
      - "lab/l2b_canonical_trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l2b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact private canonical-plus-L2B ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: 85dddea2631dc46d8b5c79ab03c08b7bab6a5f3d
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "85dddea2631dc46d8b5c79ab03c08b7bab6a5f3d"
          test "$(git rev-parse HEAD^{tree})" = "dd3f211151a847f8c7d650b966167f7e691a297a"
          test -z "$(git status --porcelain)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        working-directory: acsie
        run: python -m compileall -q cognitive_core research

      - name: Check p7 target is reachable in discovery frontier
        working-directory: acsie
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          python - <<'PY'
          import json, random
          from cognitive_core.native_independent_core import NativeCognitiveCore, canon
          seed=2026092901
          rng=random.Random(seed)
          rows=[]
          for _ in range(40):
              x=rng.choice(tuple(range(-8,0))+tuple(range(1,9)))
              y=rng.choice(tuple(range(-8,0))+tuple(range(1,9)))
              z=rng.choice(tuple(range(-8,0))+tuple(range(1,9)))
              px=x%2; pz=z%2
              condition=(px==pz) ^ ((y<0)==(z<0))
              delta=3 if condition else 8
              rows.append(({"x":x,"y":y,"z":z},"step",{"x":x,"y":y,"z":z+delta}))
          discovery=tuple(rows[:12])
          target=("xor",("eq",("atom",("x",),"parity"),("atom",("z",),"parity")),("eq",("atom",("y",),"sign"),("atom",("z",),"sign")))
          programs=NativeCognitiveCore._context_programs_from_streams((discovery,),max_programs=128)
          present=canon(target) in {canon(p) for p in programs}
          print(json.dumps({"target_present":present,"program_count":len(programs)},sort_keys=True))
          assert present
          PY

      - name: Run exact L2-A protocol against canonical-plus-L2B source
        working-directory: acsie
        env:
          ACSIE_GITHUB_ACTIONS: "1"
          ACSIE_L2_SEEDS: "2026092901"
          PYTHONHASHSEED: "0"
        run: |
          set +e
          unset GITHUB_WORKSPACE
          export PYTHONPATH="$PWD"
          bash research/run_l2_sequential_gate.sh > /tmp/l2b-canonical.stdout 2> /tmp/l2b-canonical.stderr
          rc=$?
          echo "$rc" > /tmp/l2b-canonical.exit_code
          cat /tmp/l2b-canonical.stdout
          cat /tmp/l2b-canonical.stderr >&2
          echo "L2B_CANONICAL_EXIT=$rc"
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l2b-canonical-${{ github.run_id }}
          path: |
            /tmp/l2b-canonical.stdout
            /tmp/l2b-canonical.stderr
            /tmp/l2b-canonical.exit_code
            /tmp/acsie-l2-sequential-run
          if-no-files-found: warn
