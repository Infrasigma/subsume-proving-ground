name: ACSIE H-G1g corrected typed-bitset depth-stratified 20260930

on:
  push:
    paths:
      - ".github/workflows/acsie-hg1g-corrected-typed-bitset-20260930.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_REF: fff7ffcdacc397effd37963bbaaf78b556040819
  PYTHONHASHSEED: "0"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        seed: [2026093001,2026093002,2026093003,2026093004,2026093005]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_REF }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity
        working-directory: acsie
        run: test "$(git rev-parse HEAD)" = "$ACSIE_REF"
      - name: Run corrected probe
        working-directory: acsie
        env:
          SEED: "${{ matrix.seed }}"
        run: |
          set +e
          export PYTHONPATH="$PWD"
          python3 -u research/run_recursive_frontier_coverage_probe_v7.py "$SEED" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > probe.stdout.txt 2> probe.stderr.txt
          rc=$?
          set -e
          mkdir -p evidence/hg1g_coverage
          cp probe.stdout.txt probe.stderr.txt evidence/hg1g_coverage/
          if [ -f "/tmp/hg1b-coverage-${SEED}.json" ]; then cp "/tmp/hg1b-coverage-${SEED}.json" evidence/hg1g_coverage/; fi
          printf "%s\n" "$rc" > evidence/hg1g_coverage/exit_code.txt
          cat probe.stdout.txt
          cat probe.stderr.txt || true
          test "$rc" -eq 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-hg1g-corrected-${{ matrix.seed }}
          path: acsie/evidence/hg1g_coverage/**
          if-no-files-found: error