name: PR110 bounded Gen6 phase localization
# Diagnostic-only continuation: starts at saved generation 6 and stops at its first checkpoint boundary.
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  locate-gen6-stall:
    name: Resume pinned B checkpoint with phase markers (45m cap)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SEED: "2026100305"
      GENERATIONS: "12"
      PROVING_SHA: "33259fc5c69d87b99c604f0050508c433a279daf"
      RUNTIME_SHA: "af0c7ef503c51a5bc7872717b263a01f495c855f"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieve original immutable B checkpoint
        uses: actions/download-artifact@v4
        with:
          name: pr110-snapshot-causal-replay
          run-id: 37570567635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior

      - name: Verify pinned runtime and immutable checkpoint bytes
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp prior/B-checkpoint-current.json evidence/input-checkpoint.json
          cp prior/B-checkpoint-manifest.json evidence/input-checkpoint-manifest.json
          PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B:$GITHUB_WORKSPACE" python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from lab.exact_checkpoint import load_checkpoint
          seed = int("2026100305")
          proving_sha = "33259fc5c69d87b99c604f0050508c433a279daf"
          runtime_sha = "af0c7ef503c51a5bc7872717b263a01f495c855f"
          expected_blob = "f21654220651001f3ac63f67a983a516ff8ba236732bb58e47f611c41dd87ced"
          expected_state = "e284699d06649788b58071783651f087c57e0511ee10f93948b878d68f49e28a"
          manifest = json.loads(Path("research/pr110_acsie_snapshot/manifest.json").read_text())
          assert manifest["fixed_seed"] == seed
          assert manifest["generations"] == 12
          assert manifest["selected_generations"] == [5, 6, 9, 10, 11]
          assert manifest["proving_harness_sha"] == proving_sha
          assert manifest["B"]["runtime_sha"] == runtime_sha
          expected_lab = {
              "cognitive_core/open_ended_growth.py": "ec94fc545badde972510f2db9cbf008cc214e705",
              "cognitive_core/recursive_cognitive_compiler.py": "284d4abd5ab467d465be21973090bc24cee26e69",
              "cognitive_core/behavioral_search.py": "ab658a2e49adf479bf9ea4892dfef930624c6e7b",
          }
          identities = {}
          for rel, expected in expected_lab.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", str(Path("research/pr110_acsie_snapshot/B") / rel)],
                  text=True,
              ).strip()
              assert actual == expected, f"runtime copy changed: {rel} {actual}"
              identities[rel] = actual
          p = Path("evidence/input-checkpoint.json")
          raw_sha = hashlib.sha256(p.read_bytes()).hexdigest()
          assert raw_sha == expected_blob, f"checkpoint blob digest mismatch: {raw_sha}"
          envelope = load_checkpoint(
              p,
              expected_seed=seed,
              expected_metadata={"proving_sha": proving_sha, "acsie_ref": runtime_sha},
          )
          assert envelope["generation_next"] == 6
          assert envelope["state_digest"] == expected_state
          Path("evidence/preflight.json").write_text(json.dumps({
              "preflight": "PASS",
              "seed": seed,
              "generations": 12,
              "selected_generations": [5, 6, 9, 10, 11],
              "proving_sha": proving_sha,
              "runtime_sha": runtime_sha,
              "runtime_lab_blobs": identities,
              "checkpoint_raw_sha256": raw_sha,
              "checkpoint_state_digest": envelope["state_digest"],
              "generation_next": envelope["generation_next"],
              "resume_policy": "diagnostic-only; stop_after=7; scientific gate unchanged",
              "resume_hash_seed": 0,
              "hash_seed_caveat": "Original checkpoint-producing process did not pin PYTHONHASHSEED; this is an exact checkpoint continuation, not byte-identical process replay.",
          }, indent=2, sort_keys=True) + "\n")
          print("PINNED_B_RUNTIME=PASS")
          print("IMMUTABLE_GEN5_CHECKPOINT=PASS")
          print("RESUME_BOUNDARY=GEN6")
          PY

      - name: Run B continuation with a 45-minute ceiling and stop after Gen6
        run: |
          set -u
          cp evidence/input-checkpoint.json evidence/working-checkpoint.json
          ARM_ROOT="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B"
          export ARM_ROOT RUNTIME_SHA
          set +e
          timeout --signal=TERM --kill-after=60s 45m env \
            PYTHONHASHSEED=0 \
            PYTHONPATH="$ARM_ROOT:$GITHUB_WORKSPACE" \
            python3 -u - <<'PY' > evidence/phase-timed-raw.txt 2>&1
          import json, os, time
          from pathlib import Path
          from lab.acsie_open_ended_self_extending_proving import run_seed
          started = time.perf_counter()
          checkpoint = "evidence/working-checkpoint.json"
          result = run_seed(
              int(os.environ["SEED"]),
              int(os.environ["GENERATIONS"]),
              checkpoint_path=checkpoint,
              resume_from=checkpoint,
              stop_after=7,
              checkpoint_metadata={
                  "proving_sha": os.environ["PROVING_SHA"],
                  "acsie_ref": os.environ["RUNTIME_SHA"],
              },
          )
          result["phase_diagnostic_wall_time_seconds"] = time.perf_counter() - started
          result["runtime_sha"] = os.environ["RUNTIME_SHA"]
          result["proving_sha"] = os.environ["PROVING_SHA"]
          result["hash_seed_at_resume_boundary"] = 0
          Path("evidence/completed-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print("GEN6_DIAGNOSTIC_RETURNED=PASS", flush=True)
          PY
          rc=$?
          set -e
          printf "%s\n" "$rc" > evidence/diagnostic-exit-code.txt
          echo "DIAGNOSTIC_PROCESS_EXIT_CODE=$rc"

      - name: Summarize the last phase marker and last durable checkpoint
        if: always()
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B:$GITHUB_WORKSPACE" python3 - <<'PY'
          import json
          from pathlib import Path
          from lab.exact_checkpoint import load_checkpoint
          raw_path = Path("evidence/phase-timed-raw.txt")
          raw = raw_path.read_text(errors="replace") if raw_path.exists() else ""
          events = []
          for line in raw.splitlines():
              try:
                  item = json.loads(line)
                  if isinstance(item, dict) and item.get("event"):
                      events.append(item)
              except Exception:
                  pass
          starts = [(i, e) for i, e in enumerate(events) if e.get("event") == "PROCESS_PHASE_START"]
          timings = [(i, e) for i, e in enumerate(events) if e.get("event") == "PROCESS_PHASE_TIMING"]
          progress = [e for e in events if e.get("event") == "GENERATION_PROGRESS"]
          last_open_phase = None
          if starts:
              last_i, last = starts[-1]
              completed_after_start = any(
                  idx > last_i and e.get("phase") == last.get("phase")
                  for idx, e in timings
              )
              if not completed_after_start:
                  last_open_phase = last
          p = Path("evidence/working-checkpoint.json")
          checkpoint_summary = {"checkpoint_present": p.exists(), "checkpoint_validation": "MISSING"}
          if p.exists():
              envelope = load_checkpoint(
                  p,
                  expected_seed=2026100305,
                  expected_metadata={
                      "proving_sha": "33259fc5c69d87b99c604f0050508c433a279daf",
                      "acsie_ref": "af0c7ef503c51a5bc7872717b263a01f495c855f",
                  },
              )
              checkpoint_summary.update({
                  "checkpoint_validation": "PASS",
                  "generation_next": int(envelope["generation_next"]),
                  "state_digest": envelope["state_digest"],
                  "completed_rows": len(envelope.get("generations_out", [])),
              })
          summary = {
              "schema": "ACSIE.PR110.Gen6PhaseLocalization.v1",
              "classification": "DIAGNOSTIC_ONLY_NOT_A_SCIENTIFIC_GATE",
              "phase_markers_present": bool(starts),
              "phase_start_count": len(starts),
              "phase_timing_count": len(timings),
              "last_10_phase_starts": [e for _, e in starts[-10:]],
              "last_10_completed_phase_timings": [e for _, e in timings[-10:]],
              "last_open_phase_at_stop": last_open_phase,
              "generation_progress_count_in_this_continuation": len(progress),
              "last_generation_progress": progress[-1] if progress else None,
              "diagnostic_exit_code": (
                  int(Path("evidence/diagnostic-exit-code.txt").read_text().strip())
                  if Path("evidence/diagnostic-exit-code.txt").exists() else None
              ),
              "raw_log_bytes": len(raw.encode()),
              **checkpoint_summary,
              "completed_result_present": Path("evidence/completed-result.json").exists(),
              "interpretation": (
                  "Use the last unmatched PROCESS_PHASE_START as the interruption location. "
                  "If the Gen6 checkpoint advanced to generation_next=7, Gen6 completed; "
                  "otherwise no Gen6 scientific result is claimed."
              ),
              "original_frozen_5x12_scientific_budget": "UNTOUCHED",
              "promotion_status": "DO_NOT_PROMOTE",
          }
          Path("evidence/phase-diagnostic.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload phase-localization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr110-gen6-phase-localization
          path: evidence/
          retention-days: 30
