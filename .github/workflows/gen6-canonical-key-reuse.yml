name: Gen6 canonical expression-key reuse diagnostic

on:
  push:
    branches:
      - research/acsie-h7-r3-exact-source-20261011
    paths:
      - ".github/workflows/gen6-canonical-key-reuse.yml"

permissions:
  contents: read

jobs:
  canonical-key-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Predeclare factorial and resource contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/gen6-canonical-key-reuse diagnostics
          {
            echo "EXECUTOR_COMMIT=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "ACSIE_SOURCE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "FACTORS=canonical expression-key reuse OFF/ON; frontier cache fixed ON at 128; expansion cache OFF"
            echo "FRONTIER_CACHE_KEY=state-token ID plus current structural-lineage union"
            echo "FRONTIER_CACHE_CAPACITY=128 FIFO entries per search call"
            echo "EXPR_KEY_CACHE_KEY=exact canonical JSON by AST identity; strong object refs retained to prevent id reuse"
            echo "EXPR_KEY_CACHE_CAPACITY=8192 FIFO entries per find_exact_expression invocation"
            echo "REQUIRED_GATE=both key-cache arms match pristine signatures and six-file suite passes before matched Gen6 runs"
            echo "REAL_GEN6_SEED=2026100301; generations=7 (indices 0..6)"
            echo "CHILD_WALL_LIMIT_SECONDS=120; RSS_GUARD_MIB=2048"
          } | tee evidence/gen6-canonical-key-reuse/provenance.txt

      - name: Checkout pinned ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source before diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acsie rev-parse HEAD)" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$(git -C acsie rev-parse 'HEAD^{tree}')" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          src="$(sha256sum acsie/cognitive_core/behavioral_search.py | awk '{print $1}')"
          test "$src" = "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          echo "ACSIE_SOURCE_SHA256=$src" | tee evidence/gen6-canonical-key-reuse/source-identity.txt

      - name: Apply canonical key reuse and frontier cache in isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          git -C acsie worktree add --detach "$GITHUB_WORKSPACE/baseline-acsie" d83cb60286f195eec02b4d7aa45a60539316d115
          python - "$GITHUB_WORKSPACE/acsie/cognitive_core/behavioral_search.py" <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); original_sha=hashlib.sha256(s.encode()).hexdigest()
          expected="2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          if original_sha!=expected: raise SystemExit(f"unexpected original source SHA {original_sha}")
          if "_h7_expr_key_cache" in s: raise SystemExit("cache marker already present")
          def rep(old,new,count=1):
           global s
           n=s.count(old)
           if n!=count: raise SystemExit(f"expected {count} occurrences, found {n}: {old[:70]!r}")
           s=s.replace(old,new)
          rep('ident = json.dumps(expr, sort_keys=True, separators=(",", ":"))','ident = expr_key(expr)',3)
          rep('left_key = json.dumps(left, sort_keys=True, separators=(",", ":"))','left_key = expr_key(left)')
          rep('right_key = json.dumps(right, sort_keys=True, separators=(",", ":"))','right_key = expr_key(right)')
          rep('''return json.dumps(
                      structural_expand(expr),
                      sort_keys=True,
                      separators=(",", ":"),
                  )''','''return expr_key(structural_expand(expr))''')
          rep('''left_key = json.dumps(
                          expr["left"], sort_keys=True, separators=(",", ":")
                      )''','''left_key = expr_key(expr["left"])''')
          rep('''right_key = json.dumps(
                          expr["right"], sort_keys=True, separators=(",", ":")
                      )''','''right_key = expr_key(expr["right"])''')
          rep('json.dumps(x, sort_keys=True, separators=(",", ":")),','expr_key(x),')
          rep('lk = json.dumps(left[0], sort_keys=True, separators=(",", ":"))','lk = expr_key(left[0])')
          rep('rk = json.dumps(right[0], sort_keys=True, separators=(",", ":"))','rk = expr_key(right[0])')
          a=s.index("    def rank(state: tuple)");b=s.index("    levels:",a);rb=s[a:b]
          old='json.dumps(expr, sort_keys=True, separators=(",", ":")),'
          if rb.count(old)!=1: raise SystemExit("rank key marker mismatch")
          rb=rb.replace(old,'''(
                          expression_key_by_state_token.get(state[5]) or expr_key(expr)
                      ) if _h7_expr_key_cache_enabled else expr_key(expr),''',1);s=s[:a]+rb+s[b:]
          old='''    def expr_key(expr: Mapping[str, Any]) -> str:
                  return json.dumps(expr, sort_keys=True, separators=(",", ":"))'''
          if s.count(old)!=1: raise SystemExit("expr_key helper marker mismatch")
          helper='''    _h7_expr_key_cache_enabled = __import__("os").environ.get("ACSIE_DISABLE_EXPR_KEY_CACHE") != "1"
              _h7_expr_key_cache_capacity = 8192
              _h7_expr_key_cache = {}
              _h7_expr_key_cache_stats = {"hits": 0, "misses": 0, "evictions": 0, "seeded": 0, "serializations": 0}
          
              def expr_key(expr: Mapping[str, Any]) -> str:
                  if _h7_expr_key_cache_enabled:
                      entry = _h7_expr_key_cache.get(id(expr))
                      if entry is not None and entry[0] is expr:
                          _h7_expr_key_cache_stats["hits"] += 1
                          return entry[1]
                  _h7_expr_key_cache_stats["misses"] += 1
                  value = json.dumps(expr, sort_keys=True, separators=(",", ":"))
                  _h7_expr_key_cache_stats["serializations"] += 1
                  if _h7_expr_key_cache_enabled:
                      if len(_h7_expr_key_cache) >= _h7_expr_key_cache_capacity:
                          del _h7_expr_key_cache[next(iter(_h7_expr_key_cache))]
                          _h7_expr_key_cache_stats["evictions"] += 1
                      _h7_expr_key_cache[id(expr)] = (expr, value)
                  return value
          
              def remember_expr_key(expr: Mapping[str, Any], value: str) -> None:
                  if not _h7_expr_key_cache_enabled:
                      return
                  ident=id(expr); entry=_h7_expr_key_cache.get(ident)
                  if entry is not None and entry[0] is expr:
                      if entry[1] != value:
                          raise AssertionError("precomputed canonical expression key mismatch")
                      return
                  if len(_h7_expr_key_cache) >= _h7_expr_key_cache_capacity:
                      del _h7_expr_key_cache[next(iter(_h7_expr_key_cache))]
                      _h7_expr_key_cache_stats["evictions"] += 1
                  _h7_expr_key_cache[ident]=(expr,value)
                  _h7_expr_key_cache_stats["seeded"] += 1'''
          s=s.replace(old,helper,1)
          a=s.index("    def register(expr:");b=s.index("    def register_binary(",a);rb=s[a:b]
          old='''        else:
                      expression_ident = str(metadata_hint["expression_ident"])
                  if expression_ident in seen_expression_keys:'''
          new='''        else:
                      expression_ident = str(metadata_hint["expression_ident"])
                  remember_expr_key(expr, expression_ident)
                  if expression_ident in seen_expression_keys:'''
          if rb.count(old)!=1: raise SystemExit("register precomputed-key marker mismatch")
          rb=rb.replace(old,new,1);s=s[:a]+rb+s[b:]
          at=s.rfind('        return BehavioralSearchResult(')
          if at<0: raise SystemExit("final result marker missing")
          s=s[:at]+'        find_exact_expression._H7_LAST_EXPR_KEY_CACHE_STATS = dict(_h7_expr_key_cache_stats)\n'+s[at:]
          p.write_text(s);print("ORIGINAL_SOURCE_SHA256="+original_sha);print("CANONICAL_KEY_REUSE_PATCH_SHA256="+hashlib.sha256(s.encode()).hexdigest());print("KEY_CACHE_CAPACITY=8192; FRONTIER_CACHE=128; STRUCTURAL_EXPANSION_CACHE=OFF")
          
          PY
          python -m py_compile acsie/cognitive_core/behavioral_search.py
          sha256sum acsie/cognitive_core/behavioral_search.py | tee evidence/gen6-canonical-key-reuse/diagnostic-source-sha256.txt
          python - "$GITHUB_WORKSPACE/acsie/cognitive_core/behavioral_search.py" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text();start="    def lineage_frontier(states: Sequence[tuple]) -> tuple[tuple, ...]:";end="    def build_extreme_lookup("
          if s.count(start)!=1 or "_h7_lf_cache" in s: raise SystemExit("frontier markers mismatch")
          s=s.replace(start,'    _h7_lf_cache = {}\n    _h7_lf_cache_stats = {"hits": 0, "misses": 0, "evictions": 0}\n\n'+start,1)
          a=s.index(start);b=s.index(end,a+len(start));block=s[a:b];old="        if not states:\n            return ()"
          if block.count(old)!=1: raise SystemExit("frontier empty marker mismatch")
          lookup=('        if not states:\n            return ()\n'
          '        cache_enabled = __import__("os").environ.get("ACSIE_DISABLE_LF_CACHE") != "1"\n'
          '        cache_key = tuple(sorted((int(st[5]), tuple(sorted(structural_lineage_by_key.get(str(st[4]), set())))) for st in states)) if cache_enabled else None\n'
          '        cached = _h7_lf_cache.get(cache_key) if cache_enabled else None\n'
          '        if cached is not None:\n            _h7_lf_cache_stats["hits"] += 1\n            return cached\n'
          '        if cache_enabled: _h7_lf_cache_stats["misses"] += 1')
          block=block.replace(old,lookup,1);old="        return tuple(sorted(frontier, key=rank))"
          if block.count(old)!=1: raise SystemExit("frontier return marker mismatch")
          store=('        result = tuple(sorted(frontier, key=rank))\n'
          '        if cache_enabled:\n            if len(_h7_lf_cache) >= 128:\n                del _h7_lf_cache[next(iter(_h7_lf_cache))]\n                _h7_lf_cache_stats["evictions"] += 1\n'
          '            _h7_lf_cache[cache_key] = result\n        return result')
          block=block.replace(old,store,1);s=s[:a]+block+s[b:]
          at=s.rfind('        return BehavioralSearchResult(')
          if at<0: raise SystemExit("final result marker missing")
          s=s[:at]+'        find_exact_expression._H7_LAST_EXPR_KEY_CACHE_STATS = dict(_h7_expr_key_cache_stats)\n        find_exact_expression._H7_LAST_LF_CACHE_STATS = dict(_h7_lf_cache_stats)\n'+s[at:]
          p.write_text(s);print("FRONTIER_CACHE=128_FIFO")
          PY
          python -m py_compile acsie/cognitive_core/behavioral_search.py

      - name: Run six-file regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 python -m pytest -q \
            acsie/tests/test_open_ended_growth.py \
            acsie/tests/test_core014_recursive_cognitive_compiler.py \
            acsie/tests/test_core015_semantic_operator_discovery.py \
            acsie/tests/test_core016_open_semantic_substrate.py \
            acsie/tests/test_adaptive_capability_repair.py \
            acsie/tests/test_asi_claim_gate.py 2>&1 | tee evidence/gen6-canonical-key-reuse/six-file-regression.txt

      - name: Require canonical-key ON/OFF signatures to equal pristine
        shell: bash
        run: |
          set -euo pipefail
          cat > evidence/gen6-canonical-key-reuse/signature_probe.py <<'PY'
          import json,os,sys
          from cognitive_core.behavioral_search import find_exact_expression
          from cognitive_core.open_ended_growth import OpenEndedRecursiveCognitiveCompiler
          from cognitive_core.recursive_cognitive_compiler import ArchiveRecord,CognitivePrimitive,Trace
          mode=sys.argv[1]
          if mode=="key_off": os.environ["ACSIE_DISABLE_EXPR_KEY_CACHE"]="1"
          elif mode=="key_on": os.environ.pop("ACSIE_DISABLE_EXPR_KEY_CACHE",None)
          elif mode!="baseline": raise SystemExit("unknown mode "+mode)
          if mode!="baseline": os.environ.pop("ACSIE_DISABLE_LF_CACHE",None)
          def build(op):
           c=OpenEndedRecursiveCognitiveCompiler(max_depth=4,seed=771221)
           px=CognitivePrimitive("prim:x",{"op":"get","key":"x"},("x","y"),"delta",0,(),("opaque",),0.0,0.0,0.0,1,{})
           py=CognitivePrimitive("prim:y",{"op":"get","key":"y"},("x","y"),"delta",0,(),("opaque",),0.0,0.0,0.0,1,{})
           c.primitives={px.primitive_id:px,py.primitive_id:py};c.archive={px.primitive_id:ArchiveRecord(px),py.primitive_id:ArchiveRecord(py)}
           rows=[]
           for i in range(8):
            x,y=float(i),float(i+1);target=max(x,y) if op=="max" else min(x,y) if op=="min" else x+y
            rows.append(Trace({"x":x,"y":y},target,"opaque",{},f"{op}-{i}"))
           return c,tuple(rows),2 if op=="sum" else 4,"maximize_direct_vocabulary" if op=="sum" else "minimize_expanded_cost"
          def sig(r):return None if r is None else {"expression":r.expression,"used_primitives":r.used_primitives,"alternatives":r.alternatives,"stats":dict(r.stats)}
          signatures={};counters={}
          for op in ("max","min","sum"):
           c,rows,depth,obj=build(op);r=find_exact_expression(c,rows,max_depth=depth,require_macro=True,selection_objective=obj,max_alternatives=8)
           signatures[op]=sig(r);counters[op]={"expr_key_cache":dict(getattr(find_exact_expression,"_H7_LAST_EXPR_KEY_CACHE_STATS",{})),"frontier_cache":dict(getattr(find_exact_expression,"_H7_LAST_LF_CACHE_STATS",{})),"found":r is not None}
          print(json.dumps({"mode":mode,"signatures":signatures,"counters":counters},sort_keys=True,separators=(",",":")))
          
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/baseline-acsie" PYTHONHASHSEED=0 python evidence/gen6-canonical-key-reuse/signature_probe.py baseline > evidence/gen6-canonical-key-reuse/pristine-signatures.json
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 python evidence/gen6-canonical-key-reuse/signature_probe.py key_off > evidence/gen6-canonical-key-reuse/key_off-signatures.json
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 python evidence/gen6-canonical-key-reuse/signature_probe.py key_on > evidence/gen6-canonical-key-reuse/key_on-signatures.json
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path("evidence/gen6-canonical-key-reuse");base=json.loads((r/"pristine-signatures.json").read_text())["signatures"]
          off=json.loads((r/"key_off-signatures.json").read_text());on=json.loads((r/"key_on-signatures.json").read_text())
          report={"schema":"ACSIE.gen6_canonical_key_reuse_parity.v1","key_cache_capacity":8192,"frontier_cache_capacity":128,"expansion_cache":"OFF","key_off_arm_matches_pristine":off["signatures"]==base,"key_on_arm_matches_pristine":on["signatures"]==base,"both_arms_match_pristine":off["signatures"]==base and on["signatures"]==base,"counters":{"key_off":off["counters"],"key_on":on["counters"]},"interpretation_guard":"Exact returned science signatures compared with pristine source on max/min/sum fixtures."}
          (r/"key-reuse-parity.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n");print(json.dumps(report,indent=2,sort_keys=True))
          if not report["both_arms_match_pristine"]:raise SystemExit("cache arms differ from pristine")
          if sum(on["counters"][x]["expr_key_cache"].get("hits",0) for x in ("max","min","sum"))<1:raise SystemExit("no canonical key cache hits")
          if sum(on["counters"][x]["frontier_cache"].get("hits",0) for x in ("max","min","sum"))<1:raise SystemExit("no frontier cache hits")
          PY

      - name: Prepare canonical-key cache sampler
        shell: bash
        run: |
          set -euo pipefail
          cat > diagnostics/sitecustomize.py <<'PY'
          import faulthandler,json,os,signal,time,sys
          faulthandler.enable(file=sys.stderr,all_threads=True);t0=time.monotonic();log=os.environ.get("ACSIE_EXPR_KEY_CACHE_LOG")
          def snap(sig,frame):
           faulthandler.dump_traceback(file=sys.stderr,all_threads=True);f=frame
           while f is not None and f.f_code.co_name!="find_exact_expression":f=f.f_back
           row={"elapsed_s":round(time.monotonic()-t0,3),"signal":int(sig)}
           if f is not None:
            loc=f.f_locals;row["search"]={k:loc.get("stats",{}).get(k) for k in ("rows","max_depth","primitive_count","generated_expressions","unique_states","dominance_pruned_states","dominance_frontier_max","status")}
            row["expr_key_cache"]=dict(loc.get("_h7_expr_key_cache_stats",{}));row["expr_key_entries"]=len(loc.get("_h7_expr_key_cache",{}))
            row["frontier_cache"]=dict(loc.get("_h7_lf_cache_stats",{}));row["frontier_entries"]=len(loc.get("_h7_lf_cache",{}))
           if log:
            with open(log,"a",buffering=1) as h:h.write(json.dumps(row,sort_keys=True)+"\n")
          signal.signal(signal.SIGUSR1,snap)
          PY
          python -m py_compile diagnostics/sitecustomize.py
      - name: Run matched actual Gen6 control and canonical-key reuse arms
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0;root="$GITHUB_WORKSPACE/evidence/gen6-canonical-key-reuse";seed=2026100301
          for arm in key_cache_off_frontier128 key_cache_on_frontier128; do
           stdout="$root/$arm.stdout.jsonl";stderr="$root/$arm.stderr";counters="$root/$arm-counters.jsonl";status_file="$root/$arm-status.json";rm -f "$stdout" "$stderr" "$counters"
           if [ "$arm" = "key_cache_off_frontier128" ]; then
            env ACSIE_DISABLE_EXPR_KEY_CACHE=1 ACSIE_EXPR_KEY_CACHE_LOG="$counters" PYTHONPATH="$GITHUB_WORKSPACE/diagnostics:$GITHUB_WORKSPACE/lab:$GITHUB_WORKSPACE/acsie" python -c 'import json,sys,acsie_open_ended_self_extending_proving as g; print(json.dumps(g.run_seed(int(sys.argv[1]),7),sort_keys=True),flush=True)' "$seed" > "$stdout" 2> "$stderr" &
           else
            env -u ACSIE_DISABLE_EXPR_KEY_CACHE ACSIE_EXPR_KEY_CACHE_LOG="$counters" PYTHONPATH="$GITHUB_WORKSPACE/diagnostics:$GITHUB_WORKSPACE/lab:$GITHUB_WORKSPACE/acsie" python -c 'import json,sys,acsie_open_ended_self_extending_proving as g; print(json.dumps(g.run_seed(int(sys.argv[1]),7),sort_keys=True),flush=True)' "$seed" > "$stdout" 2> "$stderr" &
           fi
           child=$!;start=$(date +%s);next=$((start+10));timed_out=0;rss_guard=0;max_rss=0
           while kill -0 "$child" 2>/dev/null;do
            if ps -p "$child" -o stat= 2>/dev/null|grep -q 'Z';then break;fi
            now=$(date +%s);elapsed=$((now-start));rss=$(ps -p "$child" -o rss= 2>/dev/null|tr -d ' '||echo 0);case "$rss" in ''|*[!0-9]*)rss=0;;esac
            if [ "$rss" -gt "$max_rss" ];then max_rss=$rss;fi
            if [ "$rss" -ge 2097152 ];then rss_guard=1;kill -TERM "$child" 2>/dev/null||true;sleep 3;kill -KILL "$child" 2>/dev/null||true;break;fi
            if [ "$now" -ge "$next" ];then kill -USR1 "$child" 2>/dev/null||true;next=$((now+10));fi
            if [ "$elapsed" -ge 120 ];then timed_out=1;kill -TERM "$child" 2>/dev/null||true;sleep 3;kill -KILL "$child" 2>/dev/null||true;break;fi
            sleep 1
           done
           set +e;wait "$child";rc=$?;set -e
           if [ "$rss_guard" -eq 1 ];then status=RESOURCE_GUARD_RSS_LIMIT;elif [ "$timed_out" -eq 1 ];then status=INCONCLUSIVE_CHILD_WALL_TIMEOUT;elif [ "$rc" -eq 0 ]&&[ -s "$stdout" ];then status=CHILD_RETURNED_RECORD;else status=CHILD_ERROR_OR_EMPTY_OUTPUT;fi
           printf '{"arm":"%s","seed":%s,"child_returncode":%s,"timeout_hit":%s,"rss_guard_hit":%s,"max_rss_kib":%s,"status":"%s"}\n' "$arm" "$seed" "$rc" "$timed_out" "$rss_guard" "$max_rss" "$status"|tee "$status_file"
          done
          python - "$root" <<'PY'
          import collections,json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]);d={"schema":"ACSIE.gen6_canonical_key_reuse_diagnostic.v1","source_commit":"d83cb60286f195eec02b4d7aa45a60539316d115","seed":2026100301,"key_cache_capacity":8192,"frontier_cache_capacity":128,"expansion_cache":"OFF","arms":{}}
          for arm in ("key_cache_off_frontier128","key_cache_on_frontier128"):
           stderr=(root/f"{arm}.stderr").read_text(errors="replace");stacks=[]
           for block in re.split(r"(?=Current thread 0x)",stderr):
            fs=re.findall(r'File "([^"]+)", line (\d+) in ([^\n]+)',block)
            if fs:stacks.append([{"file":f,"line":int(n),"function":fn} for f,n,fn in fs])
           counters=[];q=root/f"{arm}-counters.jsonl"
           if q.exists():
            for line in q.read_text(errors="replace").splitlines():
             try:counters.append(json.loads(line))
             except Exception:pass
           child=json.loads((root/f"{arm}-status.json").read_text())
           d["arms"][arm]={"child_status":child,"live_counter_samples":counters,"stack_snapshot_count":len(stacks),"stack_function_frequency":dict(collections.Counter(fr["function"] for st in stacks for fr in st)),"stdout_bytes":(root/f"{arm}.stdout.jsonl").stat().st_size,"stderr_bytes":len(stderr.encode()),"stderr_tail":stderr[-2500:]}
          (root/"gen6-summary.json").write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"schema":d["schema"],"arms":{a:{k:v for k,v in x.items() if k not in ("stderr_tail","live_counter_samples")} for a,x in d["arms"].items()}},indent=2,sort_keys=True))
          PY

      - name: Upload canonical-key factorial and Gen6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen6-canonical-key-reuse-${{ github.run_id }}
          path: evidence/gen6-canonical-key-reuse/
          if-no-files-found: error
