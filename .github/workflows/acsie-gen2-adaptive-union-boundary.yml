name: ACSIE Gen2 adaptive-union boundary diagnostic

on:
  push:
    paths:
      - ".github/workflows/acsie-gen2-adaptive-union-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: b1b6007d980d27d2d2d3240b34ee3df515e687df
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source
        working-directory: acsie
        run: git rev-parse HEAD && git rev-parse HEAD^{tree}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Run boundary diagnostic
        working-directory: acsie
        run: PYTHONPATH=. python research/gen2_adaptive_union_failure_boundary_v1.py | tee ../gen2-boundary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen2-boundary-${{ github.run_id }}
          path: gen2-boundary.json
