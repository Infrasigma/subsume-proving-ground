name: ICS Experiment
on:
  push:
    branches:
      - ics-live-20260921
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Run interventional schema falsification
        run: |
          set +e
          go run ./cmd/ics-experiment | tee ics_artifacts/stdout.txt
          exit 0
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ics-experiment
          path: |
            ics_artifacts/result.json
            ics_artifacts/stdout.txt
      - name: Print verdict
        if: always()
        run: |
          python3 - <<'PY'
          import json
          with open("ics_artifacts/result.json", encoding="utf-8") as f:
              r=json.load(f)
          print("ICS VERDICT:", r["Verdict"])
          for x in r["KillReasons"]:
              print("KILL:", x)
          PY
