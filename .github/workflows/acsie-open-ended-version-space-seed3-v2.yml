name: ACSIE open-ended version-space seed3 diagnostic v2
on:
  push:
    branches:
      - research/open-ended-primitive-version-space-v1-20261004
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed3:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact ACSIE version-space commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "6d39c3aa9818e10c8bb728cf9067037681db02fa"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-open-ended-version-space
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-open-ended-version-space
          git -C /tmp/acsie-open-ended-version-space fetch --depth 1 origin "$ACSIE_REF"
          git -C /tmp/acsie-open-ended-version-space checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-open-ended-version-space rev-parse HEAD)" = "$ACSIE_REF"
      - name: Run ACSIE unit tests
        run: |
          set -euo pipefail
          python3 -m venv /tmp/open-ended-vs-venv
          . /tmp/open-ended-vs-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-open-ended-version-space pytest -q /tmp/acsie-open-ended-version-space/tests/test_open_ended_growth.py
          PYTHONPATH=/tmp/acsie-open-ended-version-space:. pytest -q lab/test_open_ended_bootstrap_language.py
      - name: Static protocol audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root = Path("/tmp/acsie-open-ended-version-space")
          growth = ast.parse((root / "cognitive_core/open_ended_growth.py").read_text())
          for fn_name in ("invent_primitive", "synthesize_process"):
              fn = next(n for n in ast.walk(growth) if isinstance(n, ast.FunctionDef) and n.name == fn_name)
              calls = [
                  n for n in ast.walk(fn)
                  if isinstance(n, ast.Call)
                  and isinstance(n.func, ast.Name)
                  and n.func.id == "find_exact_expression"
              ]
              assert calls
              assert any(
                  len(c.args) >= 2 and isinstance(c.args[1], ast.Name)
                  and c.args[1].id == "discovery_rows"
                  for c in calls
              )
          print("VERSION_SPACE_PROTOCOL_SOURCE_AUDIT=PASS")
          PY
      - name: Run seed-3 twelve-generation version-space diagnostic
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: /tmp/acsie-open-ended-version-space:.
        run: |
          set +e
          . /tmp/open-ended-vs-venv/bin/activate
          set -o pipefail
          {
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "ACSIE_REF=6d39c3aa9818e10c8bb728cf9067037681db02fa"
            echo "SEED=2026100303"
            echo "GENERATIONS=12"
            python3 -u lab/acsie_open_ended_version_space_diagnostic.py
          } 2>&1 | tee version-space-seed3-v2.txt
          rc=${PIPESTATUS[0]}
          echo "SCIENTIFIC_DIAGNOSTIC_RC=$rc" | tee -a version-space-seed3-v2.txt
          exit 0
      - name: Upload seed-3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-open-ended-version-space-seed3-v2-${{ github.sha }}
          path: version-space-seed3-v2.txt
