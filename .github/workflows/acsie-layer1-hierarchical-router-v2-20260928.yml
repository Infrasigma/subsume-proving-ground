name: acsie-layer1-hierarchical-router-v2-20260928

on:
  push:
    paths:
      - ".github/workflows/acsie-layer1-hierarchical-router-v2-20260928.yml"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Exact ACSIE commit SHA"
        required: true
        default: "ba090a4fd2143adfd4b30123455f50614d23df5d"
        type: string

permissions:
  contents: read

jobs:
  layer1-hierarchical-router-v2:
    name: seed MATRIX_SEED
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        seed: [2026092801, 2026092802, 2026092803, 2026092804, 2026092805]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact private ACSIE source
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.acsie_ref || 'ba090a4fd2143adfd4b30123455f50614d23df5d' }}
        run: |
          set -euo pipefail
          WORK=/tmp/acsie-l1-hier-v2
          ASKPASS=/tmp/acsie-askpass.sh
          rm -rf "$WORK" "$ASKPASS"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          mkdir -p "$WORK"
          git -C "$WORK" init
          git -C "$WORK" remote add origin https://github.com/Infrasigma/ACSIE.git
          git -C "$WORK" fetch --no-tags --depth 1 origin "$ACSIE_REF"
          git -C "$WORK" checkout --detach --force FETCH_HEAD
          test "$(git -C "$WORK" rev-parse HEAD)" = "$ACSIE_REF"
          echo "$WORK" > acsie.work
          git -C "$WORK" rev-parse HEAD > acsie.commit
          git -C "$WORK" rev-parse HEAD^{tree} > acsie.tree

      - name: Execute v2 diagnostic
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -u
          WORK="$(cat acsie.work)"
          EVIDENCE="$GITHUB_WORKSPACE/evidence-layer1-hierarchical-v2-$SEED-${{ github.run_id }}"
          mkdir -p "$EVIDENCE"
          cp acsie.commit "$EVIDENCE/acsie.commit"
          cp acsie.tree "$EVIDENCE/acsie.tree"
          cp "$WORK/research/l1_prediction_error_guard_router_v1.py" "$EVIDENCE/l1_prediction_error_guard_router_v1.py"
          sha256sum "$EVIDENCE/l1_prediction_error_guard_router_v1.py" > "$EVIDENCE/source.sha256"
          set +e
          PYTHONHASHSEED=0 PYTHONPATH="$WORK" timeout 900s python "$WORK/research/l1_prediction_error_guard_router_v1.py" "$SEED" > "$EVIDENCE/$SEED.stdout.json" 2> "$EVIDENCE/$SEED.stderr.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$EVIDENCE/exit_code"
          python - "$EVIDENCE/$SEED.stdout.json" "$EVIDENCE/scientific_status.txt" <<'PY'
          import json,sys
          try:
              x=json.load(open(sys.argv[1]))
              status=x.get("scientific_status","INVALID")
          except Exception:
              status="CRASHED"
          open(sys.argv[2],"w").write(status+"\n")
          PY
          {
            echo "workflow_run=${{ github.run_id }}"
            echo "workflow_sha=${{ github.sha }}"
            echo "seed=$SEED"
            echo "acsie_ref=$(cat acsie.commit)"
            echo "acsie_tree=$(cat acsie.tree)"
            echo "fresh_process_per_seed=true"
            echo "external_model=false"
            echo "network_dependency=false"
            echo "task_routing=false"
            echo "holdout_contamination=false"
            echo "manual_runtime_strategy=false"
          } > "$EVIDENCE/execution.provenance"
          sha256sum "$EVIDENCE"/* > "$EVIDENCE/manifest.sha256"
          cat "$EVIDENCE/scientific_status.txt"
          echo "EVIDENCE_DIR=$EVIDENCE"

      - name: Upload seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-layer1-hierarchical-v2-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: evidence-layer1-hierarchical-v2-${{ matrix.seed }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate five-seed evidence
    needs: layer1-hierarchical-router-v2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acsie-layer1-hierarchical-v2-seed-*-${{ github.run_id }}
          path: multiseed-evidence
          merge-multiple: true

      - name: Aggregate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("multiseed-evidence")
          rows, bad = [], []
          for p in sorted(root.glob("*.stdout.json")):
              try:
                  rows.append(json.loads(p.read_text()))
              except Exception as exc:
                  bad.append(f"{p.name}: {exc}")

          strict_layer1 = len(rows) == 5 and all(
              r.get("decisions",{}).get("H15") == "PASSED"
              and r.get("decisions",{}).get("H28") == "PASSED"
              and r.get("decisions",{}).get("H18") == "PASSED"
              for r in rows
          )
          strict_integrity = len(rows) == 5 and all(
              r.get("replay",{}).get("deterministic_replay") is True
              and r.get("preconditions",{}).get("all_pass") is True
              and not any(r.get("integrity",{}).values())
              for r in rows
          )

          if bad or len(rows) < 5 or any(r.get("scientific_status") == "CRASHED" for r in rows):
              status = "CRASHED"
          elif strict_layer1 and strict_integrity:
              status = "PASSED"
          else:
              status = "FAILED"

          out = {
              "schema": "ACSIE.layer1-prediction-error-guard-router-v1-multiseed",
              "scientific_status": status,
              "seed_count": len(rows),
              "expected_seeds": [2026092801,2026092802,2026092803,2026092804,2026092805],
              "strict_layer1": strict_layer1,
              "strict_integrity": strict_integrity,
              "decision_matrix": {
                  "H15": [r.get("decisions",{}).get("H15") for r in rows],
                  "H18": [r.get("decisions",{}).get("H18") for r in rows],
                  "H23": [r.get("decisions",{}).get("H23") for r in rows],
                  "H28": [r.get("decisions",{}).get("H28") for r in rows],
              },
              "source_commit": "ba090a4fd2143adfd4b30123455f50614d23df5d",
              "workflow_run": "${{ github.run_id }}",
              "workflow_sha": "${{ github.sha }}",
              "failures": bad,
          }
          pathlib.Path("multiseed-aggregate.json").write_text(json.dumps(out, indent=2, sort_keys=True))
          print(json.dumps(out, indent=2, sort_keys=True))
          if status != "PASSED":
              sys.exit(1)
          PY

      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-layer1-hierarchical-v2-multiseed-aggregate-${{ github.run_id }}
          path: multiseed-aggregate.json
          if-no-files-found: error
          retention-days: 90

# retrigger D42 challenger validation without scientific source changes
