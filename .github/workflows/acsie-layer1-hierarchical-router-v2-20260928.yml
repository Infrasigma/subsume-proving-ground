name: acsie-layer1-hierarchical-router-v2-20260928

on:
  push:
    paths:
      - ".github/workflows/acsie-layer1-hierarchical-router-v2-20260928.yml"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Exact ACSIE commit SHA"
        required: true
        default: "fc0f8ca0e9440e51bf2e9aaf31b9e8293bd0f875"
        type: string

permissions:
  contents: read

jobs:
  layer1-hierarchical-router-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact private ACSIE source
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.acsie_ref || 'fc0f8ca0e9440e51bf2e9aaf31b9e8293bd0f875' }}
        run: |
          set -euo pipefail
          WORK=/tmp/acsie-l1-hier-v2
          ASKPASS=/tmp/acsie-askpass.sh
          rm -rf "$WORK" "$ASKPASS"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          mkdir -p "$WORK"
          git -C "$WORK" init
          git -C "$WORK" remote add origin https://github.com/Infrasigma/ACSIE.git
          git -C "$WORK" fetch --no-tags --depth 1 origin "$ACSIE_REF"
          git -C "$WORK" checkout --detach --force FETCH_HEAD
          test "$(git -C "$WORK" rev-parse HEAD)" = "$ACSIE_REF"
          echo "$WORK" > "$GITHUB_WORKSPACE/acsie.work"
          git -C "$WORK" rev-parse HEAD > "$GITHUB_WORKSPACE/acsie.commit"
          git -C "$WORK" rev-parse HEAD^{tree} > "$GITHUB_WORKSPACE/acsie.tree"

      - name: Execute v2 diagnostic
        run: |
          set -u
          WORK="$(cat acsie.work)"
          EVIDENCE="$GITHUB_WORKSPACE/evidence-layer1-hierarchical-v2-${{ github.run_id }}"
          mkdir -p "$EVIDENCE"
          cp acsie.commit "$EVIDENCE/acsie.commit"
          cp acsie.tree "$EVIDENCE/acsie.tree"
          cp "$WORK/research/l1_hierarchical_router_v1.py" "$EVIDENCE/l1_hierarchical_router_v2.py"
          sha256sum "$EVIDENCE/l1_hierarchical_router_v2.py" > "$EVIDENCE/source.sha256"
          set +e
          PYTHONPATH="$WORK" timeout 420s python "$WORK/research/l1_hierarchical_router_v1.py" 2026092801 > "$EVIDENCE/results.json" 2> "$EVIDENCE/stderr.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$EVIDENCE/exit_code"
          python - "$EVIDENCE/results.json" "$EVIDENCE/scientific_status.txt" <<'PY'
          import json,sys
          try:
              x=json.load(open(sys.argv[1]))
              status=x.get("scientific_status","INVALID")
          except Exception:
              status="CRASHED"
          open(sys.argv[2],"w").write(status+"\n")
          PY
          {
            echo "workflow_run=${{ github.run_id }}"
            echo "workflow_sha=${{ github.sha }}"
            echo "acsie_ref=$(cat acsie.commit)"
            echo "inherited_gen4_run=36386355578"
            echo "inherited_gen4_artifact=10954382992"
            echo "inherited_gen4_artifact_sha256=9f1ffc606a143cf8f70101ec10dbb935c066fa8a742e592159bbeb964091fda3"
          } > "$EVIDENCE/execution.provenance"
          sha256sum "$EVIDENCE"/* > "$EVIDENCE/manifest.sha256"
          cat "$EVIDENCE/scientific_status.txt"
          echo "EVIDENCE_DIR=$EVIDENCE"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: acsie-layer1-hierarchical-v2-${{ github.run_id }}
          path: evidence-layer1-hierarchical-v2-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90

# retrigger v2 evidence gate
