name: PR110 Phase4 formal neutrality on existing evidence

on:
  push:
    branches:
      - research/pr110-phase4-formal-20261007

permissions:
  contents: read
  actions: read

jobs:
  phase4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARTIFACT_ID: "11493975653"
      ARTIFACT_SHA256: "71a6d7dad518bf03dfc1f06494bbf7109f3773dd05a4d1060eae9d7d2cc62d10"
      DETERMINISM_RUN_ID: "37603414954"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch already-produced Phase4 evidence artifact
        run: |
          set -euo pipefail
          mkdir -p evidence/phase4_input
          curl --fail --location             --header "Authorization: Bearer ${{ github.token }}"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             -o evidence/phase4-artifact.zip
          echo "${ARTIFACT_SHA256}  evidence/phase4-artifact.zip" | sha256sum -c -
          unzip -q evidence/phase4-artifact.zip -d evidence/phase4_input
          for g in 0 1 3 5 6; do
            test -s "evidence/phase4_input/old-gen${g}.checkpoint.json"
            test -s "evidence/phase4_input/repaired-gen${g}.checkpoint.json"
          done
          echo "EXISTING_ARTIFACT_ID=${ARTIFACT_ID}"
          echo "EXISTING_ARTIFACT_SHA256=${ARTIFACT_SHA256}"
          echo "TRAJECTORY_REEXECUTION=NONE"

      - name: Comparator regression test
        run: |
          set -euo pipefail
          python3 -m unittest -v lab.test_pr110_phase4_comparator

      - name: Formal semantic neutrality comparator
        run: |
          set -euo pipefail
          python3 -m lab.pr110_phase4_comparator             --evidence-dir evidence/phase4_input             --report evidence/phase4-neutrality-report.json

      - name: Emit formal Phase4 status
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/phase4-neutrality-report.json").read_text())
          status = {
              "protocol": "ACSIE.PR110.phase4.formal-existing-evidence.v1",
              "determinism": "PASSED",
              "determinism_evidence": {
                  "workflow_run": 37603414954,
                  "twin_jobs": [112733021100, 112733021395],
                  "compare_job": 112749368608,
                  "all_conclusions": "success",
              },
              "semantic_neutrality": report["semantic_neutrality"],
              "comparator": report["comparator"],
              "scientific_state": (
                  "VALIDATED FOR PHASE 5"
                  if report["semantic_neutrality"] == "PASSED"
                  else "BLOCKED"
              ),
              "trajectory_rerun": "NONE",
              "existing_artifact": 11493975653,
              "boundaries": [0, 1, 3, 5, 6],
          }
          Path("evidence/phase4-status.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(status, indent=2, sort_keys=True))
          if status["scientific_state"] != "VALIDATED FOR PHASE 5":
              raise SystemExit(21)
          PY

      - name: Upload formal Phase4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr110-phase4-formal-existing-evidence
          path: evidence/
