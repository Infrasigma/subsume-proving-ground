
name: ACE G4 G5 Autonomous Cognition Gates

on:
  push:
    branches:
      - "feat/autonomous-abstract-compounding-20260922"
  pull_request:

permissions:
  contents: read

jobs:
  g4-g5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: G4 autonomous memory selection
        run: go test -mod=mod -run '^TestG4AutonomousMemorySelection$' ./internal/ace -count=1 -v -timeout 15m
      - name: G5 representation escape
        run: go test -mod=mod -run '^TestG5RepresentationEscapeOperatorInvention$' ./internal/ace -count=1 -v -timeout 15m
      - name: G4/G5 race
        run: go test -mod=mod -race -run '^(TestG4AutonomousMemorySelection|TestG5RepresentationEscapeOperatorInvention)$' ./internal/ace -count=1 -v -timeout 15m
