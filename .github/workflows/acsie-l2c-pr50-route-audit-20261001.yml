name: ACSIE L2-C PR50 quarantine wiring audit

on:
  push:
    branches:
      - research/l2c-pr50-wire-quarantine-20261001

permissions:
  contents: read

jobs:
  l2c-audit:
    strategy:
      fail-fast: false
      matrix:
        seed: [2026100121, 2026100122, 2026100123, 2026100124, 2026100125]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact PR50 source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: 484e83950ac14550ad2cfd558ea3f1988d5f3cf2
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact PR50 source
        working-directory: acsie
        env:
          EXPECTED_HARNESS_BLOB: "9bd93ca1ee5e0ac0e49005cd7f84c893a58598c4"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "484e83950ac14550ad2cfd558ea3f1988d5f3cf2"
          test "$(git hash-object research/run_l2_sequential_gate.sh)" = "$EXPECTED_HARNESS_BLOB"

      - name: Patch only harness wiring + audit
        run: |
          set -euo pipefail
          python3 research/patch_l2c_pr50_route_audit_20261001.py \
            acsie/research/run_l2_sequential_gate.sh \
            9bd93ca1ee5e0ac0e49005cd7f84c893a58598c4

      - name: Run audited scientific qualification
        working-directory: acsie
        env:
          ACSIE_L2_SEEDS: "${{ matrix.seed }}"
          ACSIE_L2_SELECTION_MODE: "cv_partition"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          export ACSIE_SOURCE_COMMIT="$(git rev-parse HEAD)"
          export ACSIE_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          set +e
          bash research/run_l2_sequential_gate.sh > gate.stdout.txt 2> gate.stderr.txt
          rc=$?
          set -e
          mkdir -p evidence/l2c-pr50-route-audit
          cp /tmp/acsie-l2-sequential-run/l2a-${{ matrix.seed }}.json evidence/l2c-pr50-route-audit/
          cp gate.stdout.txt gate.stderr.txt evidence/l2c-pr50-route-audit/
          printf '%s\n' "$rc" > evidence/l2c-pr50-route-audit/gate.rc
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("evidence/l2c-pr50-route-audit") / "l2a-${{ matrix.seed }}.json"
          d = json.loads(p.read_text())
          r = d.get("retention_after_p7") or {}
          checks = r.get("checks") or {}
          ri = r.get("route_invariance") or {}
          summary = {
              "schema":"ACSIE.l2c.pr50.route-audit.v1",
              "seed":d.get("seed"),
              "scientific_status":d.get("scientific_status"),
              "failure_boundary":d.get("failure_boundary"),
              "source_commit":d.get("source_commit"),
              "source_tree":d.get("source_tree"),
              "checks":checks,
              "route_invariance":ri,
              "integrity":d.get("integrity"),
          }
          print(json.dumps(summary, sort_keys=True, indent=2))
          if d.get("scientific_status") != "PASSED":
              raise SystemExit(1)
          if not all(all(v.values()) for v in checks.values()):
              raise SystemExit(2)
          if ri.get("all_rows_unchanged") is not True:
              raise SystemExit(3)
          if any(bool(v) for v in (d.get("integrity") or {}).values()):
              raise SystemExit(4)
          PY
          exit "$rc"

      - name: Upload audited evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l2c-pr50-route-audit-${{ matrix.seed }}
          path: acsie/evidence/l2c-pr50-route-audit/**
          if-no-files-found: error
