name: ACE G13 Hierarchical Long Horizon Planning Gate

on:
  pull_request:

concurrency:
  group: ace-g13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g13:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: G13 hierarchical long-horizon planning
        run: go test -mod=mod -run '^TestG13HierarchicalLongHorizonPlanning$' ./internal/ace -count=1 -v -timeout 20m
      - name: G13 race
        run: go test -mod=mod -race -run '^TestG13HierarchicalLongHorizonPlanning$' ./internal/ace -count=1 -v -timeout 20m
