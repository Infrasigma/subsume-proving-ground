name: ACSIE PR110 exact checkpoint recovery and resume

on:
  push:
    branches:
      - research/pr110-acsie-snapshot-replay-20261007

permissions:
  contents: read

env:
  SEED: "2026100305"
  GENERATIONS: "12"
  EVALUATOR_SHA: "33259fc5c69d87b99c604f0050508c433a279daf"
  EVALUATOR_FILE_BLOB_SHA: "b1e0e42e6dd136de882a0b325bde16ac8c6b63e1"

jobs:
  recover-A:
    name: "Recover exact A Gen10 checkpoint"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare A
        run: |
          set -euo pipefail
          mkdir -p /tmp/acsie-A/cognitive_core recovery-A
          cp -a research/pr110_acsie_snapshot/A/cognitive_core/. /tmp/acsie-A/cognitive_core/
          test "$(git hash-object /tmp/acsie-A/cognitive_core/open_ended_growth.py)" = "ec94fc545badde972510f2db9cbf008cc214e705"
          test "$(git hash-object /tmp/acsie-A/cognitive_core/recursive_cognitive_compiler.py)" = "ccfb096e0fa2ae5a39f95aa54017c6a223a5b8fd"
          test "$(git hash-object /tmp/acsie-A/cognitive_core/behavioral_search.py)" = "e1c461571d775e510ee1d02762909e683468be5e"
          test "$(git hash-object lab/acsie_open_ended_self_extending_proving.py)" = "$EVALUATOR_FILE_BLOB_SHA"
      - name: Reconstruct and verify A Gen10
        run: |
          set -euo pipefail
          PYTHONPATH="/tmp/acsie-A:$GITHUB_WORKSPACE" python -u - <<'PY'
          import json, os
          from lab.acsie_open_ended_self_extending_proving import run_seed
          from lab.exact_checkpoint import load_checkpoint
          p="/tmp/pr110-A-recovered-g10.checkpoint.json"
          r=run_seed(int(os.environ["SEED"]),int(os.environ["GENERATIONS"]),checkpoint_path=p,stop_after=10,checkpoint_metadata={"proving_sha":os.environ["EVALUATOR_SHA"],"acsie_ref":"7e905d73c15ece4b8b5d7cb73218bac34c2e1314"})
          e=load_checkpoint(p,expected_seed=int(os.environ["SEED"]),expected_metadata={"proving_sha":os.environ["EVALUATOR_SHA"],"acsie_ref":"7e905d73c15ece4b8b5d7cb73218bac34c2e1314"})
          assert e["generation_next"]==10 and len(e["generations_out"])==10
          assert e["state_digest"]=="227eb06c90c080c7eff58c0982a8bc959798a0f4f67afaccae2d18ada853dd30"
          json.dump({"verified":True,"generation_next":10,"checkpoint_digest":e["state_digest"],"completed_generations":r["completed_generations"]},open("recovery-A/verification.json","w"),indent=2)
          PY
          cp /tmp/pr110-A-recovered-g10.checkpoint.json recovery-A/checkpoint.json
          echo '{"schema":"ACSIE.PR110.forensic-checkpoint-recovery.v1","label":"A","seed":2026100305,"generation_next":10,"checkpoint_digest":"227eb06c90c080c7eff58c0982a8bc959798a0f4f67afaccae2d18ada853dd30","interpretation":"deterministic reconstruction of prior checkpoint"}' > recovery-A/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr110-recovered-A-g10
          path: recovery-A
          retention-days: 14

  recover-B:
    name: "Recover exact B Gen5 checkpoint"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare B
        run: |
          set -euo pipefail
          mkdir -p /tmp/acsie-B/cognitive_core recovery-B
          cp -a research/pr110_acsie_snapshot/B/cognitive_core/. /tmp/acsie-B/cognitive_core/
          test "$(git hash-object /tmp/acsie-B/cognitive_core/open_ended_growth.py)" = "ec94fc545badde972510f2db9cbf008cc214e705"
          test "$(git hash-object /tmp/acsie-B/cognitive_core/recursive_cognitive_compiler.py)" = "284d4abd5ab467d465be21973090bc24cee26e69"
          test "$(git hash-object /tmp/acsie-B/cognitive_core/behavioral_search.py)" = "fdd75290600458976e63c2c58771ed7a254da5a0"
          test "$(git hash-object lab/acsie_open_ended_self_extending_proving.py)" = "$EVALUATOR_FILE_BLOB_SHA"
      - name: Reconstruct and verify B Gen5
        run: |
          set -euo pipefail
          PYTHONPATH="/tmp/acsie-B:$GITHUB_WORKSPACE" python -u - <<'PY'
          import json, os
          from lab.acsie_open_ended_self_extending_proving import run_seed
          from lab.exact_checkpoint import load_checkpoint
          p="/tmp/pr110-B-recovered-g5.checkpoint.json"
          r=run_seed(int(os.environ["SEED"]),int(os.environ["GENERATIONS"]),checkpoint_path=p,stop_after=5,checkpoint_metadata={"proving_sha":os.environ["EVALUATOR_SHA"],"acsie_ref":"af0c7ef503c51a5bc7872717b263a01f495c855f"})
          e=load_checkpoint(p,expected_seed=int(os.environ["SEED"]),expected_metadata={"proving_sha":os.environ["EVALUATOR_SHA"],"acsie_ref":"af0c7ef503c51a5bc7872717b263a01f495c855f"})
          assert e["generation_next"]==5 and len(e["generations_out"])==5
          assert e["state_digest"]=="f67fb6e73ed1c32a944f95470a2c62a64650350c9de4c6959c09896fdd90de2a"
          json.dump({"verified":True,"generation_next":5,"checkpoint_digest":e["state_digest"],"completed_generations":r["completed_generations"]},open("recovery-B/verification.json","w"),indent=2)
          PY
          cp /tmp/pr110-B-recovered-g5.checkpoint.json recovery-B/checkpoint.json
          echo '{"schema":"ACSIE.PR110.forensic-checkpoint-recovery.v1","label":"B","seed":2026100305,"generation_next":5,"checkpoint_digest":"f67fb6e73ed1c32a944f95470a2c62a64650350c9de4c6959c09896fdd90de2a","interpretation":"deterministic reconstruction of prior checkpoint"}' > recovery-B/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr110-recovered-B-g5
          path: recovery-B
          retention-days: 14

  resume-A:
    name: "Resume A Gen11-12"
    needs: recover-A
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pr110-recovered-A-g10
          path: recovered
      - name: Resume A from exact checkpoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/acsie-A/cognitive_core result-A
          cp -a research/pr110_acsie_snapshot/A/cognitive_core/. /tmp/acsie-A/cognitive_core/
          cp recovered/checkpoint.json /tmp/pr110-A-resume.checkpoint.json
          PYTHONPATH="/tmp/acsie-A:$GITHUB_WORKSPACE" python -u - <<'PY'
          import json, os, time
          from pathlib import Path
          from lab.exact_checkpoint import load_checkpoint
          from lab.acsie_open_ended_self_extending_proving import run_seed
          meta={"proving_sha":os.environ["EVALUATOR_SHA"],"acsie_ref":"7e905d73c15ece4b8b5d7cb73218bac34c2e1314"}
          e=load_checkpoint("/tmp/pr110-A-resume.checkpoint.json",expected_seed=2026100305,expected_metadata=meta)
          assert e["generation_next"]==10 and e["state_digest"]=="227eb06c90c080c7eff58c0982a8bc959798a0f4f67afaccae2d18ada853dd30"
          sw=time.perf_counter(); sc=time.process_time()
          r=run_seed(2026100305,12,resume_from="/tmp/pr110-A-resume.checkpoint.json",checkpoint_path="/tmp/pr110-A-resume.checkpoint.json",checkpoint_metadata=meta)
          out={"label":"A","runtime_sha":"7e905d73c15ece4b8b5d7cb73218bac34c2e1314","proving_sha":os.environ["EVALUATOR_SHA"],"seed":2026100305,"completed_generations":r["completed_generations"],"generations_detail":r["generations_detail"],"finite_open_ended_growth_gate":r["finite_open_ended_growth_gate"],"max_generated_expressions":r["max_generated_expressions"],"max_unique_search_states":r["max_unique_search_states"],"max_search_states_in_depth":r["max_search_states_in_depth"],"resume_base_checkpoint_digest":e["state_digest"],"final_checkpoint_digest":r["last_checkpoint_digest"],"wall_time_seconds":time.perf_counter()-sw,"cpu_time_seconds":time.process_time()-sc}
          Path("result-A/final_result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          cp /tmp/pr110-A-resume.checkpoint.json result-A/final_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr110-resumed-A-g12
          path: result-A
          retention-days: 14

  resume-B:
    name: "Resume B Gen6-12"
    needs: recover-B
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pr110-recovered-B-g5
          path: recovered
      - name: Resume B from exact checkpoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/acsie-B/cognitive_core result-B
          cp -a research/pr110_acsie_snapshot/B/cognitive_core/. /tmp/acsie-B/cognitive_core/
          cp recovered/checkpoint.json /tmp/pr110-B-resume.checkpoint.json
          PYTHONPATH="/tmp/acsie-B:$GITHUB_WORKSPACE" python -u - <<'PY'
          import json, os, time
          from pathlib import Path
          from lab.exact_checkpoint import load_checkpoint
          from lab.acsie_open_ended_self_extending_proving import run_seed
          meta={"proving_sha":os.environ["EVALUATOR_SHA"],"acsie_ref":"af0c7ef503c51a5bc7872717b263a01f495c855f"}
          e=load_checkpoint("/tmp/pr110-B-resume.checkpoint.json",expected_seed=2026100305,expected_metadata=meta)
          assert e["generation_next"]==5 and e["state_digest"]=="f67fb6e73ed1c32a944f95470a2c62a64650350c9de4c6959c09896fdd90de2a"
          sw=time.perf_counter(); sc=time.process_time()
          r=run_seed(2026100305,12,resume_from="/tmp/pr110-B-resume.checkpoint.json",checkpoint_path="/tmp/pr110-B-resume.checkpoint.json",checkpoint_metadata=meta)
          out={"label":"B","runtime_sha":"af0c7ef503c51a5bc7872717b263a01f495c855f","proving_sha":os.environ["EVALUATOR_SHA"],"seed":2026100305,"completed_generations":r["completed_generations"],"generations_detail":r["generations_detail"],"finite_open_ended_growth_gate":r["finite_open_ended_growth_gate"],"max_generated_expressions":r["max_generated_expressions"],"max_unique_search_states":r["max_unique_search_states"],"max_search_states_in_depth":r["max_search_states_in_depth"],"resume_base_checkpoint_digest":e["state_digest"],"final_checkpoint_digest":r["last_checkpoint_digest"],"wall_time_seconds":time.perf_counter()-sw,"cpu_time_seconds":time.process_time()-sc}
          Path("result-B/final_result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          cp /tmp/pr110-B-resume.checkpoint.json result-B/final_checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr110-resumed-B-g12
          path: result-B
          retention-days: 14

  paired-report:
    name: "PR110 exact-resume paired report"
    if: always()
    needs: [resume-A, resume-B]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pr110-resumed-*
          path: resumed
          merge-multiple: false
      - name: Build comparison
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(label):
              p=Path("resumed")/f"pr110-resumed-{label}-g12"/"final_result.json"
              return json.loads(p.read_text()) if p.exists() else {"status":"MISSING"}
          A=load("A"); B=load("B")
          ar={int(x["generation"]):x for x in A.get("generations_detail",[])}
          br={int(x["generation"]):x for x in B.get("generations_detail",[])}
          comp=[]
          for g in [5,6,9,10,11]:
              a,b=ar.get(g,{}),br.get(g,{})
              comp.append({"generation_index":g,"human_generation":g+1,"target_digest_match":(a.get("target_digest")==b.get("target_digest") if a.get("target_digest") and b.get("target_digest") else None),"A_target_digest":a.get("target_digest"),"B_target_digest":b.get("target_digest"),"A_expected_parent_ids":a.get("expected_parent_ids"),"B_expected_parent_ids":b.get("expected_parent_ids"),"A_recursive_reuse_ok":a.get("recursive_reuse_ok"),"B_recursive_reuse_ok":b.get("recursive_reuse_ok"),"A_closure_reuse_rate":a.get("closure_reuse_rate"),"B_closure_reuse_rate":b.get("closure_reuse_rate"),"A_probe_reuse_rate":a.get("probe_reuse_rate"),"B_probe_reuse_rate":b.get("probe_reuse_rate"),"A_closure_trap_count":a.get("closure_trap_count"),"B_closure_trap_count":b.get("closure_trap_count"),"A_probe_trap_count":a.get("probe_trap_count"),"B_probe_trap_count":b.get("probe_trap_count"),"A_retained_count":a.get("retained_count"),"B_retained_count":b.get("retained_count"),"A_runtime_max_depth":a.get("runtime_max_depth"),"B_runtime_max_depth":b.get("runtime_max_depth"),"A_generated_expressions":a.get("search_stats",{}).get("generated_expressions"),"B_generated_expressions":b.get("search_stats",{}).get("generated_expressions"),"A_unique_search_states":a.get("search_stats",{}).get("unique_states"),"B_unique_search_states":b.get("search_stats",{}).get("unique_states"),"A_max_states_in_depth":a.get("search_stats",{}).get("max_states_in_depth"),"B_max_states_in_depth":b.get("search_stats",{}).get("max_states_in_depth")})
          complete=(A.get("completed_generations")==12 and B.get("completed_generations")==12)
          out={"schema":"ACSIE.PR110.exact-resume.v1","status":"READY_FOR_SCIENTIFIC_REVIEW" if complete else "INCONCLUSIVE","A":A,"B":B,"selected_generation_comparison":comp,"frozen_5x12_budget":"UNTOUCHED","promotion_status":"DO_NOT_PROMOTE","recovery_verified_against_prior_checkpoint_digest":True,"evaluator_sha":"33259fc5c69d87b99c604f0050508c433a279daf","seed":2026100305,"generations":12}
          Path("pr110-exact-resume-paired-comparison.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr110-exact-resume-paired-comparison
          path: pr110-exact-resume-paired-comparison.json
          retention-days: 14
