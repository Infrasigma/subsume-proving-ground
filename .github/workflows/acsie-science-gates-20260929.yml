name: ACSIE quarantine-new-branch retention screen 20260929

on:
  push:
    paths:
      - ".github/workflows/acsie-science-gates-20260929.yml"
      - ".github/workflows/acsie-science-gates-20260929.trigger"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_REF: 0229c5c823848f36a5c28cf5d7fae995b25634d8
  ACSIE_EXPECTED_TREE: 7654068c0af40ec5987892093ca7ecdc4d130e2c
  ACSIE_L2_SEEDS: "2026092902"
  PYTHONHASHSEED: "0"

jobs:
  l2c:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact ACSIE L2-C source
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
        run: |
          set -euo pipefail
          W=/tmp/acsie-science
          ASK=/tmp/acsie-askpass.sh
          rm -rf "$W" "$ASK"
          cat > "$ASK" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASK"
          export GIT_ASKPASS="$ASK"
          export GIT_TERMINAL_PROMPT=0
          git clone --no-checkout https://github.com/Infrasigma/ACSIE.git "$W"
          git -C "$W" fetch --no-tags origin "$ACSIE_REF"
          git -C "$W" checkout --detach --force FETCH_HEAD
          ACTUAL_COMMIT="$(git -C "$W" rev-parse HEAD)"
          ACTUAL_TREE="$(git -C "$W" rev-parse HEAD^{tree})"
          test "$ACTUAL_COMMIT" = "$ACSIE_REF"
          test "$ACTUAL_TREE" = "$ACSIE_EXPECTED_TREE"
          echo "$ACTUAL_COMMIT" > "$W/SOURCE_COMMIT"
          echo "$ACTUAL_TREE" > "$W/SOURCE_TREE"

      - name: Compile exact ACSIE L2-C tree
        run: |
          set -euo pipefail
          cd /tmp/acsie-science
          python -m compileall -q cognitive_core research

      - name: Run native independence final gate
        run: |
          set +e
          cd /tmp/acsie-science
          export PYTHONPATH="$PWD"
          python research/native_independent_final_gate.py > native_gate.stdout.txt 2> native_gate.stderr.txt
          rc=$?
          echo "rc=$rc" | tee native_gate.rc
          cat native_gate.stdout.txt
          cat native_gate.stderr.txt >&2 || true
          exit 0

      - name: Run exact five-seed L2-C sequential gate
        run: |
          set +e
          cd /tmp/acsie-science
          export PYTHONPATH="$PWD"
          unset GITHUB_WORKSPACE
          export ACSIE_GITHUB_ACTIONS=1
          export ACSIE_L2_SEEDS="$ACSIE_L2_SEEDS"
          export PYTHONHASHSEED=0
          bash research/run_l2_sequential_gate.sh > l2a.stdout.txt 2> l2a.stderr.txt
          rc=$?
          echo "rc=$rc" | tee l2a.rc
          cat l2a.stdout.txt
          cat l2a.stderr.txt >&2 || true
          exit 0

      - name: Collect exact L2-C telemetry and aggregate gates
        if: always()
        run: |
          set -euo pipefail
          cd /tmp/acsie-science
          mkdir -p evidence/l2c
          cp /tmp/acsie-l2-sequential-run/l2a-*.json evidence/l2c/ 2>/dev/null || true
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/acsie-science")
          run_root=Path("/tmp/acsie-l2-sequential-run")
          seeds=[2026092901,2026092902,2026092903,2026092904,2026092905]
          results=[]
          for seed in seeds:
              p=run_root/f"l2a-{seed}.json"
              if p.exists():
                  results.append(json.loads(p.read_text()))
          keys=["holdout_contamination","external_model","task_routing"]
          integrity_ok=len(results)==5 and all(
              all(r.get("integrity",{}).get(k) is False for k in keys) for r in results
          )
          targets=[
              ["xor",["eq",["atom",["x"],"parity"],["atom",["z"],"parity"]],["eq",["atom",["y"],"sign"],["atom",["z"],"sign"]]],
              ["xor",["eq",["atom",["y"],"sign"],["atom",["z"],"sign"]],["eq",["atom",["x"],"parity"],["atom",["z"],"parity"]]]
          ]
          def p7_selected(r):
              for st in r.get("stages",[]):
                  if st.get("regime",{}).get("name")=="p7":
                      return st.get("discovery",{}).get("selected_program") in targets
              return False
          gate_a1=len(results)==5 and all(
              p7_selected(r) or any(st.get("regime",{}).get("name")=="p7" and st.get("status")=="PASSED" for st in r.get("stages",[]))
              for r in results
          )
          gate_a2=len(results)==5 and all(
              r.get("scientific_status")=="PASSED" and p7_selected(r) for r in results
          )
          gate_a3=len(results)==5 and all(
              r.get("retention_after_p7",{}).get("all_checks_pass") is True for r in results
          )
          statuses=[r.get("scientific_status") for r in results]
          if len(results)<5:
              status="INCONCLUSIVE"
          elif gate_a1 and gate_a2 and gate_a3 and integrity_ok:
              status="PASSED"
          elif "CRASHED" in statuses:
              status="CRASHED"
          elif "BLOCKED" in statuses:
              status="BLOCKED"
          else:
              status="FAILED"
          aggregate={
              "schema":"ACSIE.l2c.aggregate.v1",
              "experiment":"L2-C untruncated first-order beam sequential acquisition",
              "source_commit":(root/"SOURCE_COMMIT").read_text().strip(),
              "source_tree":(root/"SOURCE_TREE").read_text().strip(),
              "aggregate_status":status,
              "seeds_requested":seeds,
              "seeds_executed":len(results),
              "seed_statuses":statuses,
              "holdout_contamination":False if integrity_ok else None,
              "external_model":False if integrity_ok else None,
              "task_routing":False if integrity_ok else None,
              "gates":{
                  "L2-C.1_frontier_penetration":gate_a1,
                  "L2-C.2_candidate_acquisition":gate_a2,
                  "L2-C.3_sequential_retention":gate_a3
              },
              "integrity_ok":integrity_ok,
              "results":results
          }
          (root/"evidence/aggregate.json").write_text(json.dumps(aggregate,indent=2,sort_keys=True)+"\n")
          (root/"evidence/experiment.json").write_text(json.dumps({
              "schema":"ACSIE.l2c.experiment.v1",
              "source_commit":aggregate["source_commit"],
              "source_tree":aggregate["source_tree"],
              "requested_seeds":seeds,
              "seeds_executed":len(results),
              "results":results
          },indent=2,sort_keys=True)+"\n")
          print(json.dumps(aggregate,indent=2,sort_keys=True))
          PY

      - name: Upload exact L2-C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l2c-85dddea2631dc46d8b5c79ab03c08b7bab6a5f3d
          path: |
            /tmp/acsie-science/SOURCE_COMMIT
            /tmp/acsie-science/SOURCE_TREE
            /tmp/acsie-science/native_gate.stdout.txt
            /tmp/acsie-science/native_gate.stderr.txt
            /tmp/acsie-science/native_gate.rc
            /tmp/acsie-science/l2a.stdout.txt
            /tmp/acsie-science/l2a.stderr.txt
            /tmp/acsie-science/l2a.rc
            /tmp/acsie-science/science_gate_manifest.json
            /tmp/acsie-science/evidence/**
            /tmp/acsie-science/evidence/experiment.json
            /tmp/acsie-science/evidence/aggregate.json
            /tmp/acsie-science/evidence/l2c/**
