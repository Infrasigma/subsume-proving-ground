name: ACE-X V2 protected cognitive gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  ace-x-forensic:
    if: github.event.pull_request.head.ref == 'ace-x-v2-live-20260921' && github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X protected terminal gate
        env:
          ACEX_RUNTIME_SEED: ${{ github.run_id }}
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -tags v2kill -mod=mod -run '^TestV2ArchitectureTerminal
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v2-protected-result
          path: acex-result.txt
 ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v2-protected-result
          path: acex-result.txt
