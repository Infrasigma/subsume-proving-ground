name: ACSIE H9-E independent proving
on:
  push:
    paths:
      - ".github/workflows/acsie-h9e-independent-proving.yml"
      - "lab/acsie_h9e_independent_proving.py"
  pull_request:
    branches: [research/h9e-execution-base-20261003b]
    paths:
      - ".github/workflows/acsie-h9e-independent-proving.yml"
      - "lab/acsie_h9e_independent_proving.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h9e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact ACSIE H9-E research commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "2c305db9fab8d6fbedd47262cb3da950479f705b2"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-h9e
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-h9e
          git -C /tmp/acsie-h9e fetch --depth 1 origin "$ACSIE_REF"
          git -C /tmp/acsie-h9e checkout --detach "$ACSIE_REF"
          test "$(git -C /tmp/acsie-h9e rev-parse HEAD)" = "$ACSIE_REF"
      - name: Run H9-E unit tests
        run: |
          python3 -m venv /tmp/acsie-h9e-venv
          . /tmp/acsie-h9e-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-h9e pytest -q /tmp/acsie-h9e/tests/test_h9_posterior_sampling_demand.py
      - name: Run independent five-seed H9-E gate
        env:
          PYTHONPATH: /tmp/acsie-h9e
          ACSIE_REF: "2c305db9fab8d6fbedd47262cb3da950479f705b2"
        run: |
          . /tmp/acsie-h9e-venv/bin/activate
          python3 lab/acsie_h9e_independent_proving.py --strict
