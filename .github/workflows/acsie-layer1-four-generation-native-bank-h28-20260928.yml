name: ACSIE Layer1 four-generation native H28 bank 20260928

on:
  push:
    branches:
      - acsie/l1-four-generation-native-bank-h28-20260928
    paths:
      - ".github/workflows/acsie-layer1-four-generation-native-bank-h28-20260928.yml"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Exact ACSIE source commit"
        required: true
        default: "d8932278862fe7996a46dfc88ec130583148b0c0"
        type: string

permissions:
  contents: read
  actions: read

env:
  ACSIE_SOURCE: "d8932278862fe7996a46dfc88ec130583148b0c0"
  SOURCE_RUN: "36376031059"
  VERIFIED_PARENT: "b31109864ae547320d877e6c1575b805d950edf9"
  EXPORT_SOURCE: "94a2a770a5799fd386217998bc21b585632ef7ed"
  VERIFIED_STATE_SHA256: "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9"

jobs:
  bank:
    name: seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [2026092801,2026092802,2026092803,2026092804,2026092805]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact ACSIE source
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.acsie_ref || env.ACSIE_SOURCE }}
        run: |
          set -euo pipefail
          WORK=/tmp/acsie-l1-fourgen
          ASKPASS=/tmp/acsie-askpass.sh
          rm -rf "$WORK" "$ASKPASS"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          mkdir -p "$WORK"
          git -C "$WORK" init
          git -C "$WORK" remote add origin https://github.com/Infrasigma/ACSIE.git
          git -C "$WORK" fetch --no-tags --depth 1 origin "$ACSIE_REF"
          git -C "$WORK" checkout --detach --force FETCH_HEAD
          test "$(git -C "$WORK" rev-parse HEAD)" = "$ACSIE_REF"
          echo "$WORK" > acsie.work
          git -C "$WORK" rev-parse HEAD > acsie.commit
          git -C "$WORK" rev-parse HEAD^{tree} > acsie.tree

      - name: Download exact frozen Gen2 input
        uses: actions/download-artifact@v4
        with:
          name: acsie-gen4-verified-gen2-input-${{ env.SOURCE_RUN }}
          path: input
          run-id: ${{ env.SOURCE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact eight Gen4 shards
        uses: actions/download-artifact@v4
        with:
          pattern: acsie-gen4-multi-shard-*-${{ env.SOURCE_RUN }}
          path: shards
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact inputs
        run: |
          set -euo pipefail
          test -f input/verified-gen2-export.json
          test -f input/verified-gen2-state.json
          test "$(find shards -maxdepth 1 -name 'shard-*.json' | wc -l)" = "8"
          python - <<'PY'
          import hashlib, json
          r=json.load(open("input/verified-gen2-export.json"))
          assert r["scientific_status"] == "PASSED"
          assert r["scientific_parent_commit"] == "b31109864ae547320d877e6c1575b805d950edf9"
          h=hashlib.sha256(open("input/verified-gen2-state.json","rb").read()).hexdigest()
          assert h == "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9"
          PY

      - name: Execute four-generation H28 bank
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -u
          WORK="$(cat acsie.work)"
          EVIDENCE="$GITHUB_WORKSPACE/evidence-fourgen-$SEED-${{ github.run_id }}"
          mkdir -p "$EVIDENCE"
          cp acsie.commit "$EVIDENCE/acsie.commit"
          cp acsie.tree "$EVIDENCE/acsie.tree"
          cp "$WORK/research/l1_four_generation_native_bank_h28_v1.py" "$EVIDENCE/l1_four_generation_native_bank_h28_v1.py"
          sha256sum "$EVIDENCE/l1_four_generation_native_bank_h28_v1.py" > "$EVIDENCE/source.sha256"
          set +e
          PYTHONHASHSEED=0 PYTHONPATH="$WORK" timeout 1500s python             "$WORK/research/l1_four_generation_native_bank_h28_v1.py"             input/verified-gen2-export.json             --merge             shards/shard-0.json             shards/shard-1.json             shards/shard-2.json             shards/shard-3.json             shards/shard-4.json             shards/shard-5.json             shards/shard-6.json             shards/shard-7.json             --seed "$SEED"             > "$EVIDENCE/$SEED.stdout.json"             2> "$EVIDENCE/$SEED.stderr.log"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$EVIDENCE/exit_code"
          python - "$EVIDENCE/$SEED.stdout.json" "$EVIDENCE/scientific_status.txt" <<'PY'
          import json,sys
          try:
              x=json.load(open(sys.argv[1]))
              status=x.get("scientific_status","INVALID")
          except Exception:
              status="CRASHED"
          open(sys.argv[2],"w").write(status+"\n")
          PY
          {
            echo "workflow_run=${{ github.run_id }}"
            echo "workflow_sha=${{ github.sha }}"
            echo "seed=$SEED"
            echo "acsie_ref=$(cat acsie.commit)"
            echo "acsie_tree=$(cat acsie.tree)"
            echo "verified_state_sha256=${VERIFIED_STATE_SHA256}"
            echo "router_labels_exposed=false"
            echo "task_routing=false"
            echo "external_model=false"
            echo "network_dependency=false"
            echo "holdout_contamination=false"
            echo "manual_runtime_strategy=false"
          } > "$EVIDENCE/execution.provenance"
          cp input/verified-gen2-export.json "$EVIDENCE/verified-gen2-export.json"
          cp input/verified-gen2-state.json "$EVIDENCE/verified-gen2-state.json"
          cp shards/shard-*.json "$EVIDENCE"/
          sha256sum "$EVIDENCE"/* > "$EVIDENCE/manifest.sha256"
          cat "$EVIDENCE/scientific_status.txt"
          echo "EVIDENCE_DIR=$EVIDENCE"

      - name: Upload seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l1-fourgen-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: evidence-fourgen-${{ matrix.seed }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate five-seed evidence
    needs: bank
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acsie-l1-fourgen-seed-*-${{ github.run_id }}
          path: multiseed
          merge-multiple: true

      - name: Strict aggregate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path("multiseed")
          rows=[]; bad=[]
          for p in sorted(root.glob("*.stdout.json")):
              try: rows.append(json.loads(p.read_text()))
              except Exception as exc: bad.append(f"{p.name}: {exc}")
          def good(r):
              pm=r.get("phase_metrics",{})
              return (
                  r.get("scientific_status")=="PASSED"
                  and r.get("reconstruction",{}).get("gen2_exact") is True
                  and r.get("replay",{}).get("deterministic_replay") is True
                  and all(pm.get(g,{}).get("coverage",0.0)>=0.70 and pm.get(g,{}).get("accuracy_on_covered",0.0)>=0.75 for g in ("gen1","gen2","gen3","gen4"))
                  and r.get("conflict",{}).get("coverage",1.0)<=0.25
                  and (r.get("conflict",{}).get("coverage",0.0)==0.0 or r.get("conflict",{}).get("accuracy_on_covered",1.0)<=0.50)
                  and r.get("unseen_gen4",{}).get("coverage",0.0)>=0.70
                  and r.get("unseen_gen4",{}).get("accuracy_on_covered",0.0)>=0.75
                  and all(v>=0.60 for v in r.get("retention_after_sequence",{}).values())
                  and not any(r.get("integrity",{}).values())
              )
          strict=len(rows)==5 and all(good(r) for r in rows)
          status="CRASHED" if bad or len(rows)<5 else ("PASSED" if strict else "FAILED")
          out={
            "schema":"ACSIE.layer1-four-generation-native-bank-h28-v1-multiseed",
            "scientific_status":status,
            "seed_count":len(rows),
            "strict":strict,
            "source_commit":"d8932278862fe7996a46dfc88ec130583148b0c0",
            "gen2_exact":[r.get("reconstruction",{}).get("gen2_exact") for r in rows],
            "replay":[r.get("replay",{}).get("deterministic_replay") for r in rows],
            "phase_metrics":[r.get("phase_metrics") for r in rows],
            "conflict":[r.get("conflict") for r in rows],
            "unseen_gen4":[r.get("unseen_gen4") for r in rows],
            "retention":[r.get("retention_after_sequence") for r in rows],
            "failures":bad,
          }
          pathlib.Path("multiseed-aggregate.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          if status!="PASSED": sys.exit(1)
          PY

      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l1-fourgen-aggregate-${{ github.run_id }}
          path: multiseed-aggregate.json
          if-no-files-found: error
          retention-days: 90
