name: ACSIE L1 router H31 row diagnostic 20260928

on:
  push:
    branches:
      - acsie/l1-gen2-materialization-h29b-20260928
    paths:
      - "research/l1_router_h31_row_diagnostic_v1.py"
      - ".github/workflows/acsie-l1-router-h31-row-diagnostic-20260928.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_SOURCE: "cc6c5d8e83e4b698550638bb440b2c51fb8b9f1a"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_SOURCE }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source
        working-directory: acsie
        run: test "$(git rev-parse HEAD)" = "${ACSIE_SOURCE}"
      - name: Run diagnostic
        run: PYTHONHASHSEED=0 PYTHONPATH="$GITHUB_WORKSPACE/acsie" python research/l1_router_h31_row_diagnostic_v1.py > h31.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: acsie-h31-router-diagnostic-${{ github.run_id }}
          path: h31.json
