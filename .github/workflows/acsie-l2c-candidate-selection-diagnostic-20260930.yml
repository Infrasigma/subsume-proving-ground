name: ACSIE L2-C candidate selection diagnostic 20260930

on:
  push:
    paths:
      - ".github/workflows/acsie-l2c-candidate-selection-diagnostic-20260930.yml"
      - ".github/workflows/acsie-l2c-candidate-selection-diagnostic-20260930.trigger"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_REF: fd8fdd861e9e6c2cef4d031659b210c642dc055b
  ACSIE_FETCH_BRANCH: research/l2c-candidate-selection-diagnostic-20260930
  ACSIE_L2_SEEDS: "2026092901 2026092902 2026092903 2026092904 2026092905"
  PYTHONHASHSEED: "0"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact diagnostic ACSIE source
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
        run: |
          set -euo pipefail
          W=/tmp/acsie-science
          ASK=/tmp/acsie-askpass.sh
          rm -rf "$W" "$ASK"
          cat > "$ASK" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASK"
          export GIT_ASKPASS="$ASK"
          export GIT_TERMINAL_PROMPT=0
          git clone --no-checkout https://github.com/Infrasigma/ACSIE.git "$W"
          git -C "$W" fetch --no-tags origin "refs/heads/$ACSIE_FETCH_BRANCH:refs/remotes/origin/$ACSIE_FETCH_BRANCH"
          git -C "$W" checkout --detach --force "$ACSIE_REF"
          test "$(git -C "$W" rev-parse HEAD)" = "$ACSIE_REF"
          test -n "$(git -C "$W" rev-parse HEAD^{tree})"

      - name: Run unchanged-selection diagnostic
        run: |
          set -euo pipefail
          cd /tmp/acsie-science
          export PYTHONPATH="$PWD"
          export ACSIE_GITHUB_ACTIONS=1
          unset GITHUB_WORKSPACE
          export ACSIE_L2_SEEDS="$ACSIE_L2_SEEDS"
          export ACSIE_L2_DIAGNOSTIC=1
          export PYTHONHASHSEED=0
          set +e
          bash research/run_l2_sequential_gate.sh > diagnostic.stdout.txt 2> diagnostic.stderr.txt
          rc=$?
          set -e
          echo "$rc" > diagnostic.rc
          cat diagnostic.stdout.txt
          cat diagnostic.stderr.txt >&2 || true
          mkdir -p evidence/l2c-candidate-selection
          cp /tmp/acsie-l2-sequential-run/candidate-records-*.json evidence/l2c-candidate-selection/ 2>/dev/null || true
          cp /tmp/acsie-l2-sequential-run/l2a-*.json evidence/l2c-candidate-selection/ 2>/dev/null || true
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path("evidence/l2c-candidate-selection")
          manifest={}
          for p in sorted(root.glob("*")):
              if p.is_file():
                  manifest[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/"manifest.sha256.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY
          exit 0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l2c-candidate-selection-diagnostic-20260930
          path: /tmp/acsie-science/evidence/l2c-candidate-selection/**
