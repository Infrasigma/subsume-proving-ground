name: ACE G14 Closed Loop Execution Recovery Gate

on:
  pull_request:

concurrency:
  group: ace-g14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g14:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: G14 execution and recovery
        run: go test -mod=mod -run '^TestG14ClosedLoopExecutionAndRecovery$' ./internal/ace -count=1 -v -timeout 20m
      - name: G14 race
        run: go test -mod=mod -race -run '^TestG14ClosedLoopExecutionAndRecovery$' ./internal/ace -count=1 -v -timeout 20m
