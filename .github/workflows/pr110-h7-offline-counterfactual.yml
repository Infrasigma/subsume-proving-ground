name: PR110 H7 offline representative counterfactual

on:
  push:
    branches:
      - research/pr110-h7-redundant-representative-compression-20261008

permissions:
  contents: read
  actions: read

jobs:
  offline-counterfactual:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout proving harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact repaired ACSIE runtime
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: 9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be
          path: acsie-runtime
          fetch-depth: 1

      - name: Download exact Phase6 Gen5 checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 37738748858
          artifact-ids: 11536026911
          github-token: ${{ github.token }}
          path: evidence

      - name: Verify exact checkpoint provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("evidence/B-forensics.json").read_text())
          ck=json.loads(Path("evidence/B-checkpoint.json").read_text())
          assert b["runtime_sha"] == "9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"
          assert b["proving_sha"] == "33259fc5c69d87b99c604f0050508c433a279daf"
          assert b["seed"] == 2026100305
          assert ck["seed"] == 2026100305
          assert ck["generation_next"] == 5
          print("H7_OFFLINE_INPUT_PROVENANCE=PASS")
          PY

      - name: Verify runtime checkout SHA
        run: |
          set -euo pipefail
          test "$(git -C acsie-runtime rev-parse HEAD)" = "9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"
          echo "ACSIE_RUNTIME_SHA=9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"

      - name: Syntax smoke
        run: |
          set -euo pipefail
          python3 -m py_compile lab/pr110_h7_offline_capture.py lab/pr110_h7_offline_counterfactual.py

      - name: Capture exact Gen5 frontier identity at depths 2-4
        run: |
          set -euo pipefail
          env PYTHONPATH="$GITHUB_WORKSPACE/acsie-runtime:$GITHUB_WORKSPACE"             RUNTIME_SHA="9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"             PROVING_SHA="33259fc5c69d87b99c604f0050508c433a279daf"             python3 -u lab/pr110_h7_offline_capture.py               --checkpoint evidence/B-checkpoint.json               --output evidence/h7-offline-frontiers.json

      - name: Compute offline K counterfactual
        run: |
          set -euo pipefail
          python3 -u lab/pr110_h7_offline_counterfactual.py             --input evidence/h7-offline-frontiers.json             --output evidence/h7-offline-counterfactual.json

      - name: Upload offline H7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr110-h7-offline-counterfactual
          path: evidence/h7-offline-*.json
          retention-days: 90
