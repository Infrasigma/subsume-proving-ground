name: Gen6 one-seed phase localization

on:
  push:
    branches:
      - research/acsie-h7-r3-exact-source-20261011
    paths:
      - ".github/workflows/gen6-one-seed-phase-localization.yml"

permissions:
  contents: read

jobs:
  gen6-phase-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proving-ground executor
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record experiment contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/gen6-phase
          {
            echo "EXECUTOR_COMMIT=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "ACSIE_SOURCE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "SEED=2026100301"
            echo "GENERATION_INDICES=0..6"
            echo "PAIRED_RUNS=plain control then faulthandler-only sampling"
            echo "CHILD_TIMEOUT_SECONDS=120 per run"
            echo "OBSERVER=faulthandler only; no method wrappers, profile hooks, or algorithm changes"
          } | tee evidence/gen6-phase/provenance.txt

      - name: Checkout pinned ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git -C acsie rev-parse HEAD)"
          actual_tree="$(git -C acsie rev-parse 'HEAD^{tree}')"
          source_sha="$(sha256sum acsie/cognitive_core/behavioral_search.py | awk '{print $1}')"
          growth_sha="$(sha256sum lab/acsie_open_ended_self_extending_proving.py | awk '{print $1}')"
          test "$actual_commit" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$actual_tree" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          test "$source_sha" = "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          {
            echo "ACSIE_COMMIT=$actual_commit"
            echo "ACSIE_TREE=$actual_tree"
            echo "BEHAVIORAL_SEARCH_SHA256=$source_sha"
            echo "SELF_EXTENDING_HARNESS_SHA256=$growth_sha"
          } | tee evidence/gen6-phase/source-identity.txt

      - name: Prepare stack sampler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cat > diagnostics/sitecustomize.py <<'PY'
          import faulthandler
          import sys
          faulthandler.enable(file=sys.stderr, all_threads=True)
          faulthandler.dump_traceback_later(10, repeat=True, file=sys.stderr)
          PY
          python -m py_compile diagnostics/sitecustomize.py
          sha256sum diagnostics/sitecustomize.py | tee evidence/gen6-phase/observer-sha256.txt

      - name: Run same-seed plain control and low-overhead stack sample
        timeout-minutes: 6
        shell: bash
        run: |
          set -uo pipefail
          root="$GITHUB_WORKSPACE/evidence/gen6-phase"
          seed=2026100301

          echo "CONTROL seed=$seed generations=7 wall=120s"
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/lab:$GITHUB_WORKSPACE/acsie" \
            timeout --signal=TERM --kill-after=5s 120s \
            python -c 'import json,sys,acsie_open_ended_self_extending_proving as g; print(json.dumps(g.run_seed(int(sys.argv[1]),7),sort_keys=True),flush=True)' \
            "$seed" > "$root/plain.stdout.jsonl" 2> "$root/plain.stderr"
          plain_rc=$?
          set -e
          if [ "$plain_rc" -eq 0 ]; then plain_status=COMPLETED; elif [ "$plain_rc" -eq 124 ] || [ "$plain_rc" -eq 137 ]; then plain_status=WALL_TIMEOUT; else plain_status=CHILD_ERROR; fi
          printf '{"seed":%s,"child_returncode":%s,"timeout_seconds":120,"status":"%s"}\n' "$seed" "$plain_rc" "$plain_status" > "$root/plain.status.json"

          echo "FAULTHANDLER_ONLY seed=$seed generations=7 wall=120s interval=10s"
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/diagnostics:$GITHUB_WORKSPACE/lab:$GITHUB_WORKSPACE/acsie" \
            timeout --signal=TERM --kill-after=5s 120s \
            python -c 'import json,sys,acsie_open_ended_self_extending_proving as g; print(json.dumps(g.run_seed(int(sys.argv[1]),7),sort_keys=True),flush=True)' \
            "$seed" > "$root/sampled.stdout.jsonl" 2> "$root/sampled.stderr"
          sample_rc=$?
          set -e
          if [ "$sample_rc" -eq 0 ]; then sample_status=COMPLETED; elif [ "$sample_rc" -eq 124 ] || [ "$sample_rc" -eq 137 ]; then sample_status=WALL_TIMEOUT; else sample_status=CHILD_ERROR; fi
          printf '{"seed":%s,"child_returncode":%s,"timeout_seconds":120,"status":"%s"}\n' "$seed" "$sample_rc" "$sample_status" > "$root/sampled.status.json"

          python - "$root" <<'PY'
          import collections, json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          plain = json.loads((root / "plain.status.json").read_text())
          sampled = json.loads((root / "sampled.status.json").read_text())
          stderr = (root / "sampled.stderr").read_text(errors="replace")
          sections = re.split(r"(?=Timeout \\(0:00:10\\)!|Timeout \\(0:00:20\\)!|Timeout \\(0:00:30\\)!)", stderr)
          snapshots = []
          for section in sections:
              if "most recent call first" not in section:
                  continue
              frames = re.findall(r'File "([^"]+)", line (\\d+), in ([^\\n]+)', section)
              snapshots.append({"frames": [{"file": f, "line": int(line), "function": fun} for f,line,fun in frames]})
          top_frames = collections.Counter()
          for sample in snapshots:
              if sample["frames"]:
                  frame = sample["frames"][0]
                  top_frames[(frame["file"], frame["line"], frame["function"])] += 1
          summary = {
              "schema": "ACSIE.gen6_faulthandler_phase_localization.v1",
              "source_commit": "d83cb60286f195eec02b4d7aa45a60539316d115",
              "seed": 2026100301, "generation_indices_requested": list(range(7)),
              "plain_control": plain, "faulthandler_only": sampled,
              "stack_snapshot_count": len(snapshots),
              "stack_sample_count_from_banner": stderr.count("Timeout (0:00:10)!"),
              "most_common_top_frames": [
                  {"file": k[0], "line": k[1], "function": k[2], "samples": n}
                  for k,n in top_frames.most_common(15)
              ],
              "stderr_tail": stderr[-12000:],
              "plain_stdout_bytes": (root / "plain.stdout.jsonl").stat().st_size,
              "sampled_stdout_bytes": (root / "sampled.stdout.jsonl").stat().st_size,
              "observer_scope": "faulthandler only; no method wrapping, sys.setprofile, or sys.settrace",
              "interpretation_guard": "Timeout means INCONCLUSIVE, not scientific failure. Stack samples localize the active Python path but do not prove a unique root cause."
          }
          (root / "summary.json").write_text(json.dumps(summary, sort_keys=True, indent=2) + "\n")
          print(json.dumps({k:v for k,v in summary.items() if k != "stderr_tail"}, sort_keys=True, indent=2))
          PY

      - name: Upload durable phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen6-one-seed-phase-localization-${{ github.run_id }}
          path: evidence/gen6-phase/
          if-no-files-found: error
