name: hosted-runner-smoke

on:
  push:
    paths:
      - ".github/workflows/hosted-runner-smoke.yml"
      - "lab/acsie_private_lab.sh"

permissions:
  contents: read

jobs:
  acsie-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned ACSIE lab
        run: bash lab/acsie_private_lab.sh
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }
          ACSIE_REF: dfc5af45da17a5d49b35aebbce2c30a61a4368e5
