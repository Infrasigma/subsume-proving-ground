name: hosted-runner-smoke

on:
  push:
    paths:
      - ".github/workflows/hosted-runner-smoke.yml"
      - "lab/acsie_private_lab.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hosted-runner-smoke.yml"
      - "lab/acsie_h9e_independent_proving.py"
      - "lab/acsie_open_ended_growth_proving.py"
      - "lab/pr110_h7_offline_capture.py"
      - "lab/pr110_h7_offline_counterfactual.py"
      - "research/pr110_h7/H7.md"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Exact ACSIE commit SHA (preferred) or trusted ref"
        required: true
        default: "1a67903eb56ec32b829769f7d842d44b3edc410b"
        type: string

permissions:
  contents: read

jobs:
  acsie-lab:
    if: github.event_name != 'pull_request' || (
      !startsWith(github.event.pull_request.head.ref, 'research/acsie-h9e-independent-proof-20261003') &&
      !startsWith(github.event.pull_request.head.ref, 'research/open-ended-growth-proving-20261003')
    )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned ACSIE lab
        run: bash lab/acsie_private_lab.sh
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.acsie_ref || '1a67903eb56ec32b829769f7d842d44b3edc410b' }}


  h9e:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'research/acsie-h9e-independent-proof-20261003')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact ACSIE H9-E research commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "9b80411c1df70badb14bfeda38a151b640f76531"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-h9e
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-h9e
          git -C /tmp/acsie-h9e fetch --depth 1 origin "research/h9-posterior-sampling-demand-20261003"
          git -C /tmp/acsie-h9e checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-h9e rev-parse HEAD)" = "$ACSIE_REF"
      - name: Run exact H9-E unit tests
        run: |
          python3 -m venv /tmp/acsie-h9e-venv
          . /tmp/acsie-h9e-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-h9e pytest -q /tmp/acsie-h9e/tests/test_h9_posterior_sampling_demand.py
      - name: Run independent five-seed H9-E gate
        env:
          PYTHONPATH: /tmp/acsie-h9e
          ACSIE_REF: "2c305db9fab8d6fbedd47262cb3da950479f705b"
        run: |
          . /tmp/acsie-h9e-venv/bin/activate
          python3 lab/acsie_h9e_independent_proving.py --strict


  open-ended-growth:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'research/open-ended-growth-proving-20261003')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact ACSIE main
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "9e12988c576b7fa16909b527edff6b677f549fe5"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-open-ended
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-open-ended
          git -C /tmp/acsie-open-ended fetch --depth 1 origin "main"
          git -C /tmp/acsie-open-ended checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-open-ended rev-parse HEAD)" = "$ACSIE_REF"
          echo "ACSIE_HEAD=$(git -C /tmp/acsie-open-ended rev-parse HEAD)"
      - name: Run open-ended growth evaluator
        env:
          PYTHONPATH: /tmp/acsie-open-ended
        run: |
          set -euo pipefail
          python3 -m venv /tmp/acsie-open-ended-venv
          . /tmp/acsie-open-ended-venv/bin/activate
          python -m pip install --upgrade pip pytest
          python3 lab/acsie_open_ended_growth_proving.py --strict | tee open-ended-growth-result.txt
      - name: Upload open-ended evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-open-ended-growth-evidence-${{ github.sha }}
          path: open-ended-growth-result.txt

  h7-offline-counterfactual:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/pr110-h7-redundant-representative-compression-20261008')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout H7 proving harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact Phase6 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 37738748858
          artifact-ids: 11536026911
          github-token: ${{ github.token }}
          path: evidence

      - name: Verify exact fixed inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path("research/pr110_acsie_snapshot/manifest.json").read_text())
          b=json.loads(Path("evidence/pr110-phase6-scalability-forensics/B-forensics.json").read_text())
          ck=json.loads(Path("evidence/pr110-phase6-scalability-forensics/B-checkpoint.json").read_text())
          assert m["B"]["runtime_sha"] == "9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"
          assert m["proving_harness_sha"] == "33259fc5c69d87b99c604f0050508c433a279daf"
          assert b["runtime_sha"] == m["B"]["runtime_sha"]
          assert b["proving_sha"] == m["proving_harness_sha"]
          assert b["seed"] == 2026100305 and ck["seed"] == 2026100305
          assert ck["generation_next"] == 5
          for rel, expected in m["B"]["files"].items():
              data=Path("research/pr110_acsie_snapshot/B", rel).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert actual == expected, (rel, actual, expected)
          print("H7_INPUTS=PASS")
          PY

      - name: Syntax smoke
        run: |
          set -euo pipefail
          python3 -m py_compile             lab/pr110_h7_offline_capture.py             lab/pr110_h7_offline_counterfactual.py             lab/exact_checkpoint.py             lab/acsie_open_ended_self_extending_proving.py             research/pr110_acsie_snapshot/B/cognitive_core/behavioral_search.py             research/pr110_acsie_snapshot/B/cognitive_core/open_ended_growth.py             research/pr110_acsie_snapshot/B/cognitive_core/recursive_cognitive_compiler.py

      - name: Capture current-state Gen5 lineage representatives
        run: |
          set -euo pipefail
          env PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B:$GITHUB_WORKSPACE"             RUNTIME_SHA="9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"             PROVING_SHA="33259fc5c69d87b99c604f0050508c433a279daf"             python3 -u lab/pr110_h7_offline_capture.py               --checkpoint evidence/pr110-phase6-scalability-forensics/B-checkpoint.json               --output evidence/h7-offline-frontiers.json

      - name: Compute K counterfactuals
        run: |
          set -euo pipefail
          python3 -u lab/pr110_h7_offline_counterfactual.py             --input evidence/h7-offline-frontiers.json             --output evidence/h7-offline-counterfactual.json

      - name: Upload H7 offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr110-h7-final-offline-counterfactual-${{ github.sha }}
          path: evidence/h7-offline-*.json
          retention-days: 90
