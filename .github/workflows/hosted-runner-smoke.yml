name: hosted-runner-smoke

on:
  push:
    paths:
      - ".github/workflows/hosted-runner-smoke.yml"
      - "lab/acsie_private_lab.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hosted-runner-smoke.yml"
      - "lab/acsie_h9e_independent_proving.py"
      - "lab/acsie_open_ended_growth_proving.py"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Exact ACSIE commit SHA (preferred) or trusted ref"
        required: true
        default: "1a67903eb56ec32b829769f7d842d44b3edc410b"
        type: string

permissions:
  contents: read

jobs:
  acsie-lab:
    if: >-
      ${{
        (github.event_name != 'push' || github.ref != 'refs/heads/research/acsie-h7-r3-exact-source-20261011')
        &&
        (github.event_name != 'pull_request' || (
          !startsWith(github.event.pull_request.head.ref, 'research/acsie-h9e-independent-proof-20261003') &&
          !startsWith(github.event.pull_request.head.ref, 'research/open-ended-growth-proving-20261003') &&
          !startsWith(github.event.pull_request.head.ref, 'research/acsie-h7-r3-exact-source-20261011')
        ))
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned ACSIE lab
        run: bash lab/acsie_private_lab.sh
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.acsie_ref || '1a67903eb56ec32b829769f7d842d44b3edc410b' }}


  h7-r3-exact-source:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/acsie-h7-r3-exact-source-20261011' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proving-ground workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare evidence directory
        run: mkdir -p evidence/h7-r3

      - name: Checkout exact private ACSIE R3 commit
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact commit and source/test digests
        id: verify-source
        working-directory: acsie
        env:
          EXPECTED_COMMIT: d83cb60286f195eec02b4d7aa45a60539316d115
          EXPECTED_SOURCE_SHA256: 2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea
          EXPECTED_TEST_SHA256: 685c92ee3a825013323ea92d40a45e8e684a0867f7e72cd1317f5db72e9ced53
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          actual_source="$(sha256sum cognitive_core/behavioral_search.py | awk '{print $1}')"
          actual_test="$(sha256sum tests/test_open_ended_growth.py | awk '{print $1}')"
          test "$actual_commit" = "$EXPECTED_COMMIT"
          test "$actual_source" = "$EXPECTED_SOURCE_SHA256"
          source_identity_status="PASS"
          test "$actual_test" = "$EXPECTED_TEST_SHA256"
          {
            echo "ACSIE_COMMIT=$actual_commit"
            echo "ACSIE_TREE=$actual_tree"
            echo "BEHAVIORAL_SEARCH_SHA256=$actual_source"
            echo "TEST_OPEN_ENDED_GROWTH_SHA256=$actual_test"
            echo "SOURCE_IDENTITY=$source_identity_status"
          } | tee "$GITHUB_WORKSPACE/evidence/h7-r3/source-identity.txt"

      - name: Checkout exact R2 control source
        if: ${{ steps.verify-source.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: 5b6dc50d36a2584ab9c05525ed19047ca1792b3b
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-r2
          fetch-depth: 1
          persist-credentials: false

      - name: Verify R2 control commit
        id: verify-r2-source
        if: ${{ steps.verify-source.outcome == 'success' }}
        working-directory: acsie-r2
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "5b6dc50d36a2584ab9c05525ed19047ca1792b3b"
          echo "ACSIE_R2_CONTROL_COMMIT=$actual_commit" | tee "$GITHUB_WORKSPACE/evidence/h7-r3/r2-control-identity.txt"

      - name: Setup Python 3.11
        if: ${{ steps.verify-source.outcome == 'success' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        id: install-pytest
        if: ${{ steps.verify-source.outcome == 'success' }}
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile cognitive core
        if: ${{ always() && steps.verify-source.outcome == 'success' && steps.install-pytest.outcome == 'success' }}
        working-directory: acsie
        run: |
          set -euo pipefail
          python -m compileall -q cognitive_core 2>&1 | tee "$GITHUB_WORKSPACE/evidence/h7-r3/compile.txt"

      - name: Run exact open-ended-growth test file
        if: ${{ always() && steps.verify-source.outcome == 'success' && steps.install-pytest.outcome == 'success' }}
        working-directory: acsie
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_open_ended_growth.py 2>&1 | tee "$GITHUB_WORKSPACE/evidence/h7-r3/open-ended-growth.txt"

      - name: Compare indexed frontier to linear oracle under two hash seeds
        if: ${{ always() && steps.verify-source.outcome == 'success' && steps.install-pytest.outcome == 'success' }}
        working-directory: acsie
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie
        run: |
          set -euo pipefail
          test_name="tests/test_open_ended_growth.py::test_h7_frontier_keeps_cost_tradeoffs_and_bucket_index_identity_consistent"
          for seed in 0 1 42 731 2026; do
            echo "PYTHONHASHSEED=$seed"
            PYTHONHASHSEED="$seed" python -m pytest -q "$test_name" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/h7-r3/indexed-linear-seed-$seed.txt"
          done

      - name: Run six-file H7 regression suite
        id: six-file-suite
        if: ${{ always() && steps.verify-source.outcome == 'success' && steps.install-pytest.outcome == 'success' }}
        working-directory: acsie
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_open_ended_growth.py \
            tests/test_core014_recursive_cognitive_compiler.py \
            tests/test_core015_semantic_operator_discovery.py \
            tests/test_core016_open_semantic_substrate.py \
            tests/test_adaptive_capability_repair.py \
            tests/test_asi_claim_gate.py 2>&1 | tee "$GITHUB_WORKSPACE/evidence/h7-r3/six-file-regression.txt"

      - name: Confirm R3 frontier regression fails on exact R2 control
        if: ${{ steps.six-file-suite.outcome == 'success' && steps.verify-r2-source.outcome == 'success' && steps.install-pytest.outcome == 'success' }}
        id: r2-negative-control
        working-directory: acsie-r2
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie-r2
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/acsie/tests/test_open_ended_growth.py" "$GITHUB_WORKSPACE/evidence/h7-r3/r3_test_against_r2.py"
          set +e
          python -m pytest -q "$GITHUB_WORKSPACE/evidence/h7-r3/r3_test_against_r2.py::test_h7_frontier_keeps_cost_tradeoffs_and_bucket_index_identity_consistent" > "$GITHUB_WORKSPACE/evidence/h7-r3/r2-negative-control.txt" 2>&1
          rc=$?
          set -e
          cat "$GITHUB_WORKSPACE/evidence/h7-r3/r2-negative-control.txt"
          if [ "$rc" -eq 0 ]; then
            echo "R2_NEGATIVE_CONTROL=INVALID_OLD_SOURCE_PASSED_R3_REGRESSION" | tee "$GITHUB_WORKSPACE/evidence/h7-r3/r2-negative-control-result.txt"
            exit 1
          fi
          if ! grep -Fq 'assert (7, 14) in paired_profiles' "$GITHUB_WORKSPACE/evidence/h7-r3/r2-negative-control.txt"; then
            echo "R2_NEGATIVE_CONTROL=INVALID_FAILURE_DID_NOT_MATCH_EXPECTED_COST_PROFILE_ASSERTION" | tee "$GITHUB_WORKSPACE/evidence/h7-r3/r2-negative-control-result.txt"
            exit 1
          fi
          echo "R2_NEGATIVE_CONTROL=EXPECTED_FAILURE_ON_LOST_PARETO_COST_PROFILE" | tee "$GITHUB_WORKSPACE/evidence/h7-r3/r2-negative-control-result.txt"

      - name: Run bounded H7 determinism and scalability ladder
        id: bounded-scale
        if: ${{ steps.six-file-suite.outcome == 'success' && steps.verify-source.outcome == 'success' && steps.install-pytest.outcome == 'success' }}
        working-directory: acsie
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie
        run: |
          set -euo pipefail
          for seed in 0 1 42 731 2026; do
            echo "PYTHONHASHSEED=$seed"
            PYTHONHASHSEED="$seed" timeout 60s python "$GITHUB_WORKSPACE/lab/h7_r3_bounded_scalability.py" \
              | tee "$GITHUB_WORKSPACE/evidence/h7-r3/scale-seed-$seed.jsonl"
          done
          python - "$GITHUB_WORKSPACE/evidence/h7-r3" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          seeds = (0, 1, 42, 731, 2026)
          runs = {}
          performance = []
          for seed in seeds:
              path = root / f"scale-seed-{seed}.jsonl"
              records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              if [r["stable"]["n_primitives"] for r in records] != [2, 4, 6, 8]:
                  raise SystemExit(f"invalid case ladder for seed {seed}")
              if len(records) != 4:
                  raise SystemExit(f"expected four cases for seed {seed}, got {len(records)}")
              stable = [r["stable"] for r in records]
              if not all(row["active_identity_consistent"] for row in stable):
                  raise SystemExit(f"frontier/index identity mismatch for seed {seed}")
              if not all(row["status"] == "TARGET_NOT_FOUND" and not row["target_found"] for row in stable):
                  raise SystemExit(f"unexpected target result invalidates stress workload for seed {seed}")
              runs[seed] = stable
              for record in records:
                  performance.append({
                      "seed": seed,
                      "n_primitives": record["stable"]["n_primitives"],
                      **record["performance"],
                  })
          baseline = runs[seeds[0]]
          mismatches = [seed for seed in seeds[1:] if runs[seed] != baseline]
          summary = {
              "schema": "ACSIE.H7_R3.bounded_scalability.v1",
              "case_sizes": [2, 4, 6, 8],
              "rows_per_case": 8,
              "max_depth": 2,
              "hash_seeds": list(seeds),
              "stable_counters_match_across_hash_seeds": not mismatches,
              "mismatching_seeds": mismatches,
              "max_elapsed_ms": max(item["elapsed_ms"] for item in performance),
              "max_tracemalloc_peak_bytes": max(item["tracemalloc_peak_bytes"] for item in performance),
              "performance_records": performance,
          }
          text = json.dumps(summary, sort_keys=True, indent=2)
          (root / "scalability-summary.json").write_text(text + "\\n")
          print(text)
          if mismatches:
              raise SystemExit("determinism counters differ across PYTHONHASHSEED values")
          PY

      - name: Run H7 R3 representative-size benchmark (16/24/32 primitives)
        if: ${{ steps.six-file-suite.outcome == 'success' && steps.bounded-scale.outcome == 'success' && steps.verify-source.outcome == 'success' && steps.install-pytest.outcome == 'success' }}
        id: representative-scale
        working-directory: acsie
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie
        run: |
          set -euo pipefail
          for seed in 0 731; do
            repeats=1
            if [ "$seed" = "0" ]; then repeats=3; fi
            echo "PYTHONHASHSEED=$seed repeats=$repeats"
            PYTHONHASHSEED="$seed" timeout 300s python "$GITHUB_WORKSPACE/lab/h7_r3_representative_scale.py" --repeats "$repeats" \
              | tee "$GITHUB_WORKSPACE/evidence/h7-r3/representative-scale-seed-$seed.jsonl"
          done
          python - "$GITHUB_WORKSPACE/evidence/h7-r3" <<'PY'
          import hashlib
          import json
          import pathlib
          import statistics
          import sys

          root = pathlib.Path(sys.argv[1])
          seeds = (0, 731)
          expected = {(n, task) for n in (16, 24, 32) for task in ("reachable_add", "unreachable")}
          runs = {}
          performance = []
          for seed in seeds:
              path = root / f"representative-scale-seed-{seed}.jsonl"
              records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              if {(r["stable"]["n_primitives"], r["stable"]["task"]) for r in records} != expected:
                  raise SystemExit(f"invalid size/task matrix for seed {seed}")
              expected_count = 18 if seed == 0 else 6
              if len(records) != expected_count:
                  raise SystemExit(f"expected {expected_count} records for seed {seed}, got {len(records)}")
              per_cell = {}
              for record in records:
                  stable = record["stable"]
                  key = (stable["n_primitives"], stable["task"])
                  per_cell.setdefault(key, []).append(stable["signature_sha256"])
                  if not stable["active_identity_consistent"]:
                      raise SystemExit(f"frontier/index identity mismatch at seed={seed}, cell={key}")
                  if record["performance"]["elapsed_ms"] > 15000:
                      raise SystemExit(f"15-second per-search guard exceeded at seed={seed}, cell={key}")
                  if record["performance"]["process_peak_rss_mb"] > 2048:
                      raise SystemExit(f"2-GiB process RSS guard exceeded at seed={seed}, cell={key}")
                  performance.append({"seed": seed, **stable, **record["performance"]})
              for key, digests in per_cell.items():
                  if len(set(digests)) != 1:
                      raise SystemExit(f"unstable repeated result/stat digest at seed={seed}, cell={key}")
              runs[seed] = {key: digests[0] for key, digests in per_cell.items()}
          mismatches = [
              {"cell": key, "seed0": runs[0][key], "seed731": runs[731][key]}
              for key in sorted(expected)
              if runs[0][key] != runs[731][key]
          ]
          medians = {}
          for key in sorted(expected):
              values = [
                  row["elapsed_ms"] for row in performance
                  if row["seed"] == 0
                  and (row["n_primitives"], row["task"]) == key
              ]
              medians[f"n{key[0]}_{key[1]}"] = round(statistics.median(values), 3)
          summary = {
              "schema": "ACSIE.H7_R3.representative_scale.v1",
              "source_commit": "d83cb60286f195eec02b4d7aa45a60539316d115",
              "source_sha256": "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea",
              "test_sha256": "685c92ee3a825013323ea92d40a45e8e684a0867f7e72cd1317f5db72e9ced53",
              "primitive_sizes": [16, 24, 32],
              "rows": 10,
              "max_depth": 2,
              "tasks": ["reachable_add", "unreachable"],
              "performance_trials_at_seed_0": 3,
              "cross_hash_seed_check": [0, 731],
              "repeated_payload_and_stats_stable": True,
              "cross_hash_seed_payloads_identical": not mismatches,
              "cross_hash_seed_mismatches": mismatches,
              "median_elapsed_ms_seed_0": medians,
              "max_elapsed_ms_all_trials": round(max(row["elapsed_ms"] for row in performance), 3),
              "max_process_peak_rss_mb": round(max(row["process_peak_rss_mb"] for row in performance), 3),
              "records": performance,
          }
          out = json.dumps(summary, sort_keys=True, indent=2)
          (root / "representative-scale-summary.json").write_text(out + "\\n")
          print(out)
          if mismatches:
              raise SystemExit("R3 result/stat payload differs across hash seeds")
          PY

      - name: Run exact R2 control on same representative workloads
        if: ${{ steps.representative-scale.outcome == 'success' && steps.verify-r2-source.outcome == 'success' && steps.install-pytest.outcome == 'success' }}
        id: r2-control-scale
        working-directory: acsie-r2
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie-r2
        run: |
          set -euo pipefail
          for seed in 0 731; do
            repeats=1
            if [ "$seed" = "0" ]; then repeats=3; fi
            echo "R2_CONTROL PYTHONHASHSEED=$seed repeats=$repeats"
            PYTHONHASHSEED="$seed" timeout 300s python "$GITHUB_WORKSPACE/lab/h7_r3_representative_scale.py" --repeats "$repeats" \
              | tee "$GITHUB_WORKSPACE/evidence/h7-r3/r2-control-scale-seed-$seed.jsonl"
          done

      - name: Compare exact R2 control and R3 candidate
        if: ${{ steps.r2-control-scale.outcome == 'success' && steps.representative-scale.outcome == 'success' }}
        id: compare-r2-r3-scale
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/evidence/h7-r3" <<'PY'
          import json
          import pathlib
          import statistics
          import sys

          root = pathlib.Path(sys.argv[1])
          seeds = (0, 731)
          cells = {(n, task) for n in (16, 24, 32) for task in ("reachable_add", "unreachable")}
          sources = {}
          records_out = []
          medians = {}
          for label in ("r2-control", "r3-candidate"):
              source_runs = {}
              performance = []
              for seed in seeds:
                  path = root / (
                      f"{label}-scale-seed-{seed}.jsonl"
                      if label == "r2-control"
                      else f"representative-scale-seed-{seed}.jsonl"
                  )
                  rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
                  expected_count = 18 if seed == 0 else 6
                  if len(rows) != expected_count:
                      raise SystemExit(f"{label} seed {seed}: expected {expected_count} records, got {len(rows)}")
                  per_cell = {}
                  for row in rows:
                      stable, perf = row["stable"], row["performance"]
                      key = (stable["n_primitives"], stable["task"])
                      if key not in cells:
                          raise SystemExit(f"{label}: unexpected cell {key}")
                      if not stable["active_identity_consistent"]:
                          raise SystemExit(f"{label}: live-level/frontier/index identity mismatch at {key}")
                      if perf["elapsed_ms"] > 15000 or perf["process_peak_rss_mb"] > 2048:
                          raise SystemExit(f"{label}: resource guard exceeded at {key}")
                      if stable["result_found"] != (stable["task"] == "reachable_add"):
                          raise SystemExit(f"{label}: reachability control failed at {key}")
                      per_cell.setdefault(key, []).append(stable["signature_sha256"])
                      if seed == 0:
                          performance.append({"source": label, **stable, **perf})
                  if set(per_cell) != cells:
                      raise SystemExit(f"{label} seed {seed}: wrong cell set")
                  for key, signatures in per_cell.items():
                      if len(set(signatures)) != 1:
                          raise SystemExit(f"{label} seed {seed}: unstable repeated full result/stats for {key}")
                  source_runs[seed] = {key: signatures[0] for key, signatures in per_cell.items()}
              hash_mismatches = [
                  {"cell": key, "seed0": source_runs[0][key], "seed731": source_runs[731][key]}
                  for key in sorted(cells) if source_runs[0][key] != source_runs[731][key]
              ]
              if hash_mismatches:
                  raise SystemExit(f"{label}: full result/stats vary across hash seeds: {hash_mismatches}")
              sources[label] = {"signatures": source_runs[0], "hashseed_matches": True}
              for key in sorted(cells):
                  vals = [
                      row["elapsed_ms"] for row in performance
                      if (row["n_primitives"], row["task"]) == key
                  ]
                  medians[f"{label}_n{key[0]}_{key[1]}"] = round(statistics.median(vals), 3)
              records_out.extend(performance)

          deltas = []
          r2_by_cell = {
              (r["n_primitives"], r["task"]): r
              for r in records_out if r["source"] == "r2-control"
          }
          r3_by_cell = {
              (r["n_primitives"], r["task"]): r
              for r in records_out if r["source"] == "r3-candidate"
          }
          for key in sorted(cells):
              old, new = r2_by_cell[key], r3_by_cell[key]
              deltas.append({
                  "n_primitives": key[0],
                  "task": key[1],
                  "r2_median_ms": round(statistics.median([
                      r["elapsed_ms"] for r in records_out
                      if r["source"] == "r2-control"
                      and (r["n_primitives"], r["task"]) == key
                  ]), 3),
                  "r3_median_ms": round(statistics.median([
                      r["elapsed_ms"] for r in records_out
                      if r["source"] == "r3-candidate"
                      and (r["n_primitives"], r["task"]) == key
                  ]), 3),
                  "r2_unique_states": old["unique_states"],
                  "r3_unique_states": new["unique_states"],
                  "r2_generated": old["generated_expressions"],
                  "r3_generated": new["generated_expressions"],
                  "r2_frontier_max": old["dominance_frontier_max"],
                  "r3_frontier_max": new["dominance_frontier_max"],
                  "r2_r3_result_stats_digest_equal": old["signature_sha256"] == new["signature_sha256"],
              })
          summary = {
              "schema": "ACSIE.H7_R2_vs_R3.same-workload-benchmark.v1",
              "r2_source_commit": "5b6dc50d36a2584ab9c05525ed19047ca1792b3b",
              "r3_source_commit": "d83cb60286f195eec02b4d7aa45a60539316d115",
              "workload": {"primitive_sizes": [16, 24, 32], "rows": 10, "max_depth": 2, "tasks": ["reachable_add", "unreachable"]},
              "trials": {"hashseed_0": 3, "hashseed_731": 1},
              "same_source_full_result_stats_repeatability": True,
              "same_source_cross_hashseed_payload_stability": True,
              "r2_r3_payload_equality_expected": False,
              "medians_ms": medians,
              "paired_deltas": deltas,
              "performance_records_seed_0": records_out,
              "interpretation_guard": "Performance comparison is diagnostic only. R3 intentionally preserves additional valid Pareto/context representatives, so R2/R3 result or state-count equality is not required. Do not promote on timings alone."
          }
          out = json.dumps(summary, sort_keys=True, indent=2)
          (root / "r2-vs-r3-representative-scale-summary.json").write_text(out + "\\n")
          print(out)
          PY

      - name: Test natural target reconstruction preserves Pareto alternatives
        if: ${{ steps.compare-r2-r3-scale.outcome == 'success' && steps.verify-r2-source.outcome == 'success' }}
        id: target-frontier-integration
        run: |
          set -euo pipefail
          for source in r2 r3; do
            if [ "$source" = "r2" ]; then
              source_path="$GITHUB_WORKSPACE/acsie-r2"
            else
              source_path="$GITHUB_WORKSPACE/acsie"
            fi
            for seed in 0 731; do
              echo "NATURAL_TARGET_FRONTIER source=$source PYTHONHASHSEED=$seed"
              PYTHONHASHSEED="$seed" PYTHONPATH="$source_path" ACSIE_SOURCE_LABEL="$source" \
                timeout 30s python "$GITHUB_WORKSPACE/lab/h7_r3_target_frontier_integration.py" \
                | tee "$GITHUB_WORKSPACE/evidence/h7-r3/target-frontier-$source-seed-$seed.jsonl"
            done
          done
          python - "$GITHUB_WORKSPACE/evidence/h7-r3" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          rows = {}
          natural_retained_profile = (7, 14)
          for source in ("r2", "r3"):
              by_seed = {}
              for seed in (0, 731):
                  path = root / f"target-frontier-{source}-seed-{seed}.jsonl"
                  records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
                  if len(records) != 1:
                      raise SystemExit(f"{source} seed {seed}: expected one JSON result")
                  record = records[0]
                  if record["source_label"] != source or record["seed"] != seed:
                      raise SystemExit(f"{source} seed {seed}: source/seed identity mismatch")
                  if not record["target_found"]:
                      raise SystemExit(f"{source} seed {seed}: exact target was not found")
                  natural = {tuple(item) for item in record["natural_level_profiles"]}
                  returned = {tuple(item) for item in record["returned_alternative_profiles"]}
                  if natural_retained_profile not in natural:
                      raise SystemExit(f"{source} seed {seed}: expected profile is absent from natural search levels: {natural}")
                  by_seed[seed] = record
              if by_seed[0]["result_stats_sha256"] != by_seed[731]["result_stats_sha256"]:
                  raise SystemExit(f"{source}: natural target result/stats differ across hash seeds")
              rows[source] = by_seed
          r2_returned = {tuple(x) for x in rows["r2"][0]["returned_alternative_profiles"]}
          r3_returned = {tuple(x) for x in rows["r3"][0]["returned_alternative_profiles"]}
          if natural_retained_profile in r2_returned:
              raise SystemExit(f"negative control invalid: exact R2 already returns profile (7,14): {r2_returned}")
          if natural_retained_profile not in r3_returned:
              raise SystemExit(f"R3 integration failure: result alternatives dropped profile (7,14): {r3_returned}")
          if (6, 15) not in r2_returned or (6, 15) not in r3_returned:
              raise SystemExit(f"unexpected control profile mismatch: R2={r2_returned}, R3={r3_returned}")
          summary = {
              "schema": "ACSIE.H7_R2_vs_R3.natural_target_frontier.v2",
              "r2_commit": "5b6dc50d36a2584ab9c05525ed19047ca1792b3b",
              "r3_commit": "d83cb60286f195eec02b4d7aa45a60539316d115",
              "hash_seeds": [0, 731],
              "search_naturally_generated_profile_7_14": True,
              "result_stats_stable_across_hash_seeds": True,
              "r2_returned_profiles": [list(x) for x in sorted(r2_returned)],
              "r3_returned_profiles": [list(x) for x in sorted(r3_returned)],
              "r2_natural_target_reconstruction_dropped_7_14": True,
              "r3_natural_target_reconstruction_preserved_7_14": True,
              "interpretation": "Profile (6,21) in the direct helper unit test is manually registered after the search. Natural search creates profile (7,14); R2 drops it from returned alternatives while R3 retains it alongside (6,15).",
              "r2_performance": [rows["r2"][s]["performance"] for s in (0, 731)],
              "r3_performance": [rows["r3"][s]["performance"] for s in (0, 731)],
          }
          text = json.dumps(summary, sort_keys=True, indent=2)
          (root / "target-frontier-integration-summary.json").write_text(text + "\\n")
          print(text)
          PY

      - name: Measure H7 lineage-frontier pressure with redundant executable aliases
        if: ${{ steps.target-frontier-integration.outcome == 'success' && steps.verify-r2-source.outcome == 'success' }}
        id: lineage-pressure
        run: |
          set -euo pipefail
          for source in r2 r3; do
            if [ "$source" = "r2" ]; then
              source_path="$GITHUB_WORKSPACE/acsie-r2"
            else
              source_path="$GITHUB_WORKSPACE/acsie"
            fi
            for seed in 0 731; do
              echo "LINEAGE_PRESSURE source=$source PYTHONHASHSEED=$seed"
              PYTHONHASHSEED="$seed" PYTHONPATH="$source_path" timeout 90s \
                python "$GITHUB_WORKSPACE/lab/h7_r3_lineage_pressure_ladder.py" --source "$source" --seed "$seed" \
                | tee "$GITHUB_WORKSPACE/evidence/h7-r3/lineage-pressure-$source-seed-$seed.jsonl"
            done
          done
          python - "$GITHUB_WORKSPACE/evidence/h7-r3" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected_sizes = [2, 4, 6, 8]
          source_runs = {}
          all_records = []
          for source in ("r2", "r3"):
              by_seed = {}
              for seed in (0, 731):
                  path = root / f"lineage-pressure-{source}-seed-{seed}.jsonl"
                  records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
                  if [row["stable"]["n_primitives"] for row in records] != expected_sizes:
                      raise SystemExit(f"{source} seed {seed}: invalid alias-size ladder")
                  if any(not row["stable"]["target_found"] for row in records):
                      raise SystemExit(f"{source} seed {seed}: exact target missing")
                  if any(not row["stable"]["active_identity_consistent"] for row in records):
                      raise SystemExit(f"{source} seed {seed}: active frontier/index identity mismatch")
                  if any(row["performance"]["elapsed_ms"] > 15000 or row["performance"]["process_peak_rss_mb"] > 2048 for row in records):
                      raise SystemExit(f"{source} seed {seed}: per-search resource guard exceeded")
                  signatures = [row["signature_sha256"] for row in records]
                  by_seed[seed] = {
                      "records": records,
                      "signatures": signatures,
                  }
                  all_records.extend({"source": source, "seed": seed, **row["stable"], **row["performance"]} for row in records)
              mismatches = [
                  n for index, n in enumerate(expected_sizes)
                  if by_seed[0]["signatures"][index] != by_seed[731]["signatures"][index]
              ]
              if mismatches:
                  raise SystemExit(f"{source}: stable result/counter signature changes across hash seeds at n={mismatches}")
              source_runs[source] = by_seed

          comparison = []
          for index, n in enumerate(expected_sizes):
              r2 = source_runs["r2"][0]["records"][index]
              r3 = source_runs["r3"][0]["records"][index]
              comparison.append({
                  "n_primitives": n,
                  "r2_expected_profile_live": r2["stable"]["expected_profile_live"],
                  "r3_expected_profile_live": r3["stable"]["expected_profile_live"],
                  "r2_expected_profile_returned": r2["stable"]["expected_profile_returned"],
                  "r3_expected_profile_returned": r3["stable"]["expected_profile_returned"],
                  "r2_generated_expressions": r2["stable"]["stats"]["generated_expressions"],
                  "r3_generated_expressions": r3["stable"]["stats"]["generated_expressions"],
                  "r2_unique_states": r2["stable"]["stats"]["unique_states"],
                  "r3_unique_states": r3["stable"]["stats"]["unique_states"],
                  "r2_dominance_pruned": r2["stable"]["stats"]["dominance_pruned_states"],
                  "r3_dominance_pruned": r3["stable"]["stats"]["dominance_pruned_states"],
                  "r2_returned_alternatives": r2["stable"]["returned_alternative_count"],
                  "r3_returned_alternatives": r3["stable"]["returned_alternative_count"],
                  "r2_elapsed_ms": r2["performance"]["elapsed_ms"],
                  "r3_elapsed_ms": r3["performance"]["elapsed_ms"],
                  "r2_peak_rss_mb": r2["performance"]["process_peak_rss_mb"],
                  "r3_peak_rss_mb": r3["performance"]["process_peak_rss_mb"],
              })
          summary = {
              "schema": "ACSIE.H7_R2_vs_R3.lineage-pressure.v1",
              "source_commits": {
                  "r2": "5b6dc50d36a2584ab9c05525ed19047ca1792b3b",
                  "r3": "d83cb60286f195eec02b4d7aa45a60539316d115",
              },
              "hash_seeds": [0, 731],
              "primitive_sizes": expected_sizes,
              "alias_design": "Each step adds one executable alias to A and one to B; each alias wraps its parent macro in two negations, preserving behavior while altering executable ancestry/cost.",
              "cross_hash_seed_result_stats_stable": True,
              "r2_r3_comparison": comparison,
              "interpretation_guard": "Bounded synthetic lineage-pressure diagnostic only. Report truncation and growth; neither timing nor a single pass proves open-ended scalability."
          }
          out = json.dumps(summary, sort_keys=True, indent=2)
          (root / "lineage-pressure-summary.json").write_text(out + "\\n")
          print(out)
          PY

      - name: Profile R2/R3 H7 search hotspots at eight executable primitives
        if: ${{ steps.lineage-pressure.outcome == 'success' && steps.verify-r2-source.outcome == 'success' }}
        id: profile-hotspots
        run: |
          set -euo pipefail
          for source in r2 r3; do
            if [ "$source" = "r2" ]; then
              source_path="$GITHUB_WORKSPACE/acsie-r2"
            else
              source_path="$GITHUB_WORKSPACE/acsie"
            fi
            for seed in 0 731; do
              echo "PROFILE_HOTSPOTS source=$source PYTHONHASHSEED=$seed"
              PYTHONHASHSEED="$seed" PYTHONPATH="$source_path" ACSIE_SOURCE_LABEL="$source" timeout 60s \
                python "$GITHUB_WORKSPACE/lab/h7_r3_profile_hotspots.py" --source "$source" --seed "$seed" --alias-pairs 3 \
                | tee "$GITHUB_WORKSPACE/evidence/h7-r3/profile-hotspots-$source-seed-$seed.jsonl"
            done
          done
          python - "$GITHUB_WORKSPACE/evidence/h7-r3" <<'PY'
          import json
          import pathlib
          import statistics
          import sys

          root = pathlib.Path(sys.argv[1])
          profiles = {}
          function_maps = {}
          for source in ("r2", "r3"):
              records = {}
              maps = {}
              for seed in (0, 731):
                  path = root / f"profile-hotspots-{source}-seed-{seed}.jsonl"
                  lines = [line for line in path.read_text().splitlines() if line.strip()]
                  if len(lines) != 1:
                      raise SystemExit(f"{source} seed {seed}: expected one profile record")
                  record = json.loads(lines[0])
                  stable = record["stable"]
                  if stable["primitive_count"] != 8 or stable["alias_pairs"] != 3 or not stable["target_found"]:
                      raise SystemExit(f"{source} seed {seed}: unexpected profile workload")
                  expected_retention = source == "r3"
                  if stable["expected_profile_7_14_returned"] != expected_retention:
                      raise SystemExit(f"{source} seed {seed}: Pareto-preservation control failed")
                  records[seed] = record
                  maps[seed] = {
                  (row["function"], row["line"]): row
                  for row in stable["hot_functions"]
              }
              if records[0]["signature_sha256"] != records[731]["signature_sha256"]:
                  raise SystemExit(f"{source}: result and search-counter signature changed across hash seeds")
              # Distinguish separate generator/list-comprehension code objects
              # by source line while checking invocation counts for determinism.
              for identity in set(maps[0]) | set(maps[731]):
                  a, b = maps[0].get(identity), maps[731].get(identity)
                  if a is None or b is None:
                      raise SystemExit(f"{source}: profile code-object set changed across seeds at {identity}")
                  if (a["primitive_calls"], a["total_calls"]) != (b["primitive_calls"], b["total_calls"]):
                      raise SystemExit(f"{source}: invocation counts changed across hash seeds at {identity}")
              profiles[source] = records

              # For cross-version reporting, aggregate multiple same-named
              # code objects (such as generator expressions) as one family.
              def grouped(seed):
                  groups = {}
                  for row in maps[seed].values():
                      group = groups.setdefault(row["function"], {
                          "primitive_calls": 0, "total_calls": 0,
                          "self_seconds": 0.0, "cumulative_seconds": 0.0,
                          "locations": [],
                      })
                      group["primitive_calls"] += row["primitive_calls"]
                      group["total_calls"] += row["total_calls"]
                      group["self_seconds"] += row["self_seconds"]
                      group["cumulative_seconds"] += row["cumulative_seconds"]
                      group["locations"].append(row["line"])
                  for group in groups.values():
                      group["locations"] = sorted(group["locations"])
                  return groups

              grouped0, grouped731 = grouped(0), grouped(731)
              if set(grouped0) != set(grouped731):
                  raise SystemExit(f"{source}: grouped profile function families changed across seeds")
              function_maps[source] = {}
              for name in grouped0:
                  a, b = grouped0[name], grouped731[name]
                  if (a["primitive_calls"], a["total_calls"]) != (b["primitive_calls"], b["total_calls"]):
                      raise SystemExit(f"{source}: grouped invocation counts changed across seeds at {name}")
                  function_maps[source][name] = {
                      "primitive_calls": a["primitive_calls"],
                      "total_calls": a["total_calls"],
                      "self_seconds_mean": statistics.mean([a["self_seconds"], b["self_seconds"]]),
                      "cumulative_seconds_mean": statistics.mean([a["cumulative_seconds"], b["cumulative_seconds"]]),
                      "locations": a["locations"],
                  }

          comparison = []
          all_names = set(function_maps["r2"]) | set(function_maps["r3"])
          for name in all_names:
              r2, r3 = function_maps["r2"].get(name), function_maps["r3"].get(name)
              comparison.append({
                  "function_family": name,
                  "r2_present": r2 is not None,
                  "r3_present": r3 is not None,
                  "r2_locations": [] if r2 is None else r2["locations"],
                  "r3_locations": [] if r3 is None else r3["locations"],
                  "r2_total_calls": 0 if r2 is None else r2["total_calls"],
                  "r3_total_calls": 0 if r3 is None else r3["total_calls"],
                  "total_call_ratio_r3_over_r2": (
                      round(r3["total_calls"] / r2["total_calls"], 4)
                      if r2 is not None and r3 is not None and r2["total_calls"] else None
                  ),
                  "r2_self_seconds_mean": 0.0 if r2 is None else round(r2["self_seconds_mean"], 6),
                  "r3_self_seconds_mean": 0.0 if r3 is None else round(r3["self_seconds_mean"], 6),
                  "r2_cumulative_seconds_mean": 0.0 if r2 is None else round(r2["cumulative_seconds_mean"], 6),
                  "r3_cumulative_seconds_mean": 0.0 if r3 is None else round(r3["cumulative_seconds_mean"], 6),
                  "self_seconds_delta_r3_minus_r2": round(
                      (0.0 if r3 is None else r3["self_seconds_mean"])
                      - (0.0 if r2 is None else r2["self_seconds_mean"]), 6
                  ),
              })
          comparison.sort(
              key=lambda row: (row["r3_self_seconds_mean"], row["r3_cumulative_seconds_mean"]),
              reverse=True,
          )
          summary = {
              "schema": "ACSIE.H7_R2_vs_R3.cProfile_hotspots.v1",
              "source_commits": {
                  "r2": "5b6dc50d36a2584ab9c05525ed19047ca1792b3b",
                  "r3": "d83cb60286f195eec02b4d7aa45a60539316d115",
              },
              "fixture": {"primitive_count": 8, "alias_pairs": 3, "rows": 8, "max_depth": 3},
              "hash_seeds": [0, 731],
              "result_and_counter_signature_stable_across_seeds": True,
              "R2_expected_profile_7_14_returned": False,
              "R3_expected_profile_7_14_returned": True,
              "cProfile_warning": "Profiler instrumentation changes timings. Treat this as hotspot attribution, not an uninstrumented speed benchmark.",
              "runs": {
                  source: {
                      str(seed): {
                          "profile_total_seconds": profiles[source][seed]["stable"]["profile_total_seconds"],
                          "profile_total_calls": profiles[source][seed]["stable"]["profile_total_calls"],
                          "wall_ms_including_profiler": profiles[source][seed]["performance"]["unprofiled_wrapper_wall_ms_includes_cprofile"],
                          "process_peak_rss_mb": profiles[source][seed]["performance"]["process_peak_rss_mb"],
                          "result_stats_signature": profiles[source][seed]["signature_sha256"],
                      }
                      for seed in (0, 731)
                  }
                  for source in ("r2", "r3")
              },
              "functions_common_to_both_versions_sorted_by_R3_self_time": comparison,
              "top_15_self_time_functions": comparison[:15],
              "top_15_cumulative_functions": sorted(
                  comparison, key=lambda row: row["r3_cumulative_seconds_mean"], reverse=True
              )[:15],
              "interpretation_guard": "Do not make code changes from this profile alone. Identify one hotspot; then make an isolated optimization and re-run retention, negative-control, indexed-vs-linear, and deterministic checks."
          }
          out = json.dumps(summary, sort_keys=True, indent=2)
          (root / "profile-hotspots-summary.json").write_text(out + "\\n")
          print(out)
          PY

      - name: Run uninstrumented order-balanced H7 R2/R3 timing ladder
        if: ${{ steps.profile-hotspots.outcome == 'success' && steps.lineage-pressure.outcome == 'success' }}
        id: uninstrumented-timing
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for seed in 0 731; do
            for aliases in 0 1 2 3; do
              for pair in 1 2 3 4; do
                case "$pair" in
                  1|4) order="r2 r3" ;;
                  2|3) order="r3 r2" ;;
                  *) echo "invalid pair $pair" >&2; exit 2 ;;
                esac
                for source in $order; do
                  if [ "$source" = "r2" ]; then
                    source_path="$GITHUB_WORKSPACE/acsie-r2"
                  else
                    source_path="$GITHUB_WORKSPACE/acsie"
                  fi
                  out="$GITHUB_WORKSPACE/evidence/h7-r3/uninstrumented-a$aliases-seed$seed-pair$pair-$source.jsonl"
                  echo "UNINSTRUMENTED_TIMING seed=$seed aliases=$aliases pair=$pair source=$source"
                  PYTHONHASHSEED="$seed" PYTHONPATH="$source_path" timeout 30s \
                    python "$GITHUB_WORKSPACE/lab/h7_r3_uninstrumented_timing.py" \
                    --source "$source" --seed "$seed" --alias-pairs "$aliases" --pair "$pair" \
                    | tee "$out"
                done
              done
            done
          done
          python - "$GITHUB_WORKSPACE/evidence/h7-r3" <<'PY'
          import json
          import pathlib
          import statistics
          import sys

          root = pathlib.Path(sys.argv[1])
          seeds = (0, 731)
          aliases = (0, 1, 2, 3)
          pairs = (1, 2, 3, 4)
          rows = {}
          all_records = []

          for seed in seeds:
              for alias_pairs in aliases:
                  for pair in pairs:
                      pair_rows = {}
                      for source in ("r2", "r3"):
                          path = root / (
                              f"uninstrumented-a{alias_pairs}-seed{seed}-pair{pair}-{source}.jsonl"
                          )
                          lines = [line for line in path.read_text().splitlines() if line.strip()]
                          if len(lines) != 1:
                              raise SystemExit(f"{path.name}: expected one JSON record")
                          record = json.loads(lines[0])
                          stable, perf = record["stable"], record["performance"]
                          if stable["source"] != source or stable["hash_seed"] != seed:
                              raise SystemExit(f"{path.name}: source/hashseed identity mismatch")
                          if stable["alias_pairs"] != alias_pairs or stable["order_pair"] != pair:
                              raise SystemExit(f"{path.name}: workload identity mismatch")
                          expected_profile = source == "r3"
                          if stable["expected_profile_7_14_returned"] != expected_profile:
                              raise SystemExit(f"{path.name}: Pareto negative-control/retention gate failed")
                          if not stable["target_found"]:
                              raise SystemExit(f"{path.name}: exact target not found")
                          if perf["search_elapsed_ms"] > 15000 or perf["process_peak_rss_mb"] > 2048:
                              raise SystemExit(f"{path.name}: resource guard exceeded")
                          pair_rows[source] = record
                          all_records.append({
                              "seed": seed,
                              "alias_pairs": alias_pairs,
                              "pair": pair,
                              "source": source,
                              **perf,
                              "returned_alternatives": stable["returned_alternative_count"],
                              "generated_expressions": stable["search_stats"]["generated_expressions"],
                              "unique_states": stable["search_stats"]["unique_states"],
                              "expected_profile_7_14_returned": expected_profile,
                          })
                      if pair_rows["r2"]["stable_signature_sha256"] != pair_rows["r3"]["stable_signature_sha256"]:
                          # R2 and R3 are expected to differ in alternatives / counters.
                          pass
                      rows[(seed, alias_pairs, pair)] = pair_rows

          cell_summaries = []
          for seed in seeds:
              for alias_pairs in aliases:
                  cell = {}
                  for source in ("r2", "r3"):
                      records = [rows[(seed, alias_pairs, pair)][source] for pair in pairs]
                      signatures = [row["stable_signature_sha256"] for row in records]
                      if len(set(signatures)) != 1:
                          raise SystemExit(
                              f"{source} seed={seed} aliases={alias_pairs}: result/counter signatures differ across timing repetitions"
                          )
                      cell[source] = records
                  if cell["r2"][0]["stable_signature_sha256"] != cell["r2"][1]["stable_signature_sha256"]:
                      raise SystemExit("R2 stable identity unexpectedly changed")
                  for source in ("r2", "r3"):
                      sig0 = cell[source][0]["stable_signature_sha256"]
                      sig731 = next(
                          rows[(other_seed, alias_pairs, 1)][source]["stable_signature_sha256"]
                          for other_seed in seeds if other_seed != seed
                      )
                      # Cross-seed equality is checked exactly once per source/cell below.
                  r2_times = [
                      rows[(seed, alias_pairs, pair)]["r2"]["performance"]["search_elapsed_ms"]
                      for pair in pairs
                  ]
                  r3_times = [
                      rows[(seed, alias_pairs, pair)]["r3"]["performance"]["search_elapsed_ms"]
                      for pair in pairs
                  ]
                  paired_ratios = [r3 / r2 for r2, r3 in zip(r2_times, r3_times)]
                  cell_summaries.append({
                      "seed": seed,
                      "alias_pairs": alias_pairs,
                      "primitive_count": 2 + 2 * alias_pairs,
                      "pair_order": {"1": "R2_then_R3", "2": "R3_then_R2", "3": "R3_then_R2", "4": "R2_then_R3"},
                      "r2_times_ms_by_pair": r2_times,
                      "r3_times_ms_by_pair": r3_times,
                      "median_r2_ms": round(statistics.median(r2_times), 3),
                      "median_r3_ms": round(statistics.median(r3_times), 3),
                      "paired_r3_over_r2_ratios": [round(x, 4) for x in paired_ratios],
                      "median_paired_r3_over_r2_ratio": round(statistics.median(paired_ratios), 4),
                      "median_relative_time_change_pct": round((statistics.median(paired_ratios) - 1.0) * 100.0, 2),
                      "r2_stable_signature": cell["r2"][0]["stable_signature_sha256"],
                      "r3_stable_signature": cell["r3"][0]["stable_signature_sha256"],
                  })

          cross_seed_checks = []
          for alias_pairs in aliases:
              for source in ("r2", "r3"):
                  sig0 = rows[(0, alias_pairs, 1)][source]["stable_signature_sha256"]
                  sig731 = rows[(731, alias_pairs, 1)][source]["stable_signature_sha256"]
                  match = sig0 == sig731
                  cross_seed_checks.append({
                      "source": source,
                      "alias_pairs": alias_pairs,
                      "seed0_signature": sig0,
                      "seed731_signature": sig731,
                      "matches": match,
                  })
                  if not match:
                      raise SystemExit(f"{source} aliases={alias_pairs}: stable result/counter signature differs across hash seeds")

          summary = {
              "schema": "ACSIE.H7_R2_vs_R3.uninstrumented_order_balanced_timing.v1",
              "r2_source_commit": "5b6dc50d36a2584ab9c05525ed19047ca1792b3b",
              "r3_source_commit": "d83cb60286f195eec02b4d7aa45a60539316d115",
              "r3_source_sha256": "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea",
              "primitive_sizes": [2, 4, 6, 8],
              "rows": 8,
              "max_depth": 3,
              "hash_seeds": list(seeds),
              "four_order_balanced_pairs_per_cell_and_seed": True,
              "profiler_installed_during_search": False,
              "result_counter_signatures_stable_across_repeats": True,
              "result_counter_signatures_match_across_hash_seeds": True,
              "cross_seed_checks": cross_seed_checks,
              "cell_summaries": cell_summaries,
              "raw_performance_records": all_records,
              "interpretation_guard": "Uninstrumented search-only timers; startup/import is excluded. Bounded synthetic workload only, with no claim of open-ended scalability. Compare paired R2/R3 order-balanced ratios rather than relying on a single runner timing."
          }
          out = json.dumps(summary, sort_keys=True, indent=2)
          (root / "uninstrumented-timing-summary.json").write_text(out + "\\n")
          print(out)
          PY

      - name: Upload auditable H7 R3 regression logs
