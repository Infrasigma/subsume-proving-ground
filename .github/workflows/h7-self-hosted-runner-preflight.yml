name: H7 GitHub-hosted runner preflight (no ACSIE workload)

on:
  push:
    branches:
      - research/h7-self-hosted-runner-preflight-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-preflight:
    # Use GitHub-managed disposable compute; no phone or self-hosted runner required.
    # This job only reports capacity and does not check out or execute repository code.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report minimal runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "H7_RUNNER_PREFLIGHT=START"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "RUNNER_NAME_PRESENT=$([ -n "${RUNNER_NAME:-}" ] && echo yes || echo no)"
          echo "KERNEL=$(uname -srm)"
          echo "PYTHON=$(python3 --version 2>&1 || true)"
          echo "GIT=$(git --version 2>&1 || true)"
          echo "LOGICAL_CPUS=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc || echo unknown)"
          if [ -r /proc/meminfo ]; then
            awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/ {print}' /proc/meminfo
          fi
          echo "DISK_CAPACITY:"
          df -h "${GITHUB_WORKSPACE:-.}" 2>/dev/null || df -h .
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            echo "CGROUP_CPU_MAX=$(cat /sys/fs/cgroup/cpu.max)"
          fi
          if [ -r /sys/fs/cgroup/memory.max ]; then
            echo "CGROUP_MEMORY_MAX=$(cat /sys/fs/cgroup/memory.max)"
          fi
          echo "H7_RUNNER_PREFLIGHT=PASS"
          echo "ACSIE_COMPUTATION_STARTED=no"
