name: ACSIE L2-C complete frontier sequential acquisition

on:
  push:
    paths:
      - "lab/l2c_trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l2c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact L2-C ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: 85dddea2631dc46d8b5c79ab03c08b7bab6a5f3d
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "85dddea2631dc46d8b5c79ab03c08b7bab6a5f3d"
          test "$(git rev-parse HEAD^{tree})" = "cafac1eae0400a6d3467a309b5f896d5aa6fdfcf"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        working-directory: acsie
        run: python -m compileall -q cognitive_core research
      - name: Discovery-only p7 frontier diagnostic
        working-directory: acsie
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          python - <<'PY'
          import json, random
          from cognitive_core.native_independent_core import NativeCognitiveCore, canon
          seed=2026092901; rng=random.Random(seed); rows=[]
          for _ in range(40):
              x=rng.choice(tuple(range(-8,0))+tuple(range(1,9))); y=rng.choice(tuple(range(-8,0))+tuple(range(1,9))); z=rng.choice(tuple(range(-8,0))+tuple(range(1,9)))
              condition=((x%2)==(z%2)) ^ ((y<0)==(z<0)); delta=3 if condition else 8
              rows.append(({"x":x,"y":y,"z":z},"step",{"x":x,"y":y,"z":z+delta}))
          target=("xor",("eq",("atom",("x",),"parity"),("atom",("z",),"parity")),("eq",("atom",("y",),"sign"),("atom",("z",),"sign")))
          programs=NativeCognitiveCore._context_programs_from_streams((tuple(rows[:12]),),max_programs=128)
          present=canon(target) in {canon(p) for p in programs}
          print(json.dumps({"target_present":present,"program_count":len(programs)},sort_keys=True)); assert present
          PY
      - name: Run exact L2-A protocol on L2-C source
        working-directory: acsie
        env:
          ACSIE_GITHUB_ACTIONS: "1"
          ACSIE_L2_SEEDS: "2026092901"
          PYTHONHASHSEED: "0"
        run: |
          set +e
          unset GITHUB_WORKSPACE
          export PYTHONPATH="$PWD"
          bash research/run_l2_sequential_gate.sh > /tmp/l2c.stdout 2> /tmp/l2c.stderr
          rc=$?
          echo "$rc" > /tmp/l2c.exit_code
          cat /tmp/l2c.stdout
          cat /tmp/l2c.stderr >&2
          echo "L2C_EXIT=$rc"
          exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l2c-${{ github.run_id }}
          path: |
            /tmp/l2c.stdout
            /tmp/l2c.stderr
            /tmp/l2c.exit_code
            /tmp/acsie-l2-sequential-run
          if-no-files-found: warn
