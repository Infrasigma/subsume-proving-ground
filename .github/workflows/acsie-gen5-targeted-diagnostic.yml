name: ACSIE Gen5 targeted diagnostic via proving ground

on:
  push:
    paths:
      - ".github/workflows/acsie-gen5-targeted-diagnostic.yml"
      - "lab/current_acsie_ref.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen5-targeted-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACSIE_REF: a0e147ca07a16bd5b2fb40c992575751df074eed
      ACSIE_GITHUB_ACTIONS: "1"
      PYTHONHASHSEED: "0"
      RUN_MARKER: "activation-5"
    steps:
      - name: Checkout public proving-ground harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact private ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_REF }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact ACSIE source identity
        working-directory: acsie
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          test "$COMMIT" = "$ACSIE_REF"
          test -z "$(git status --porcelain)"
          printf '%s\n' "source_commit=$COMMIT" "source_tree=$TREE" | tee ../source.txt
          python3 - <<'PY'
          from pathlib import Path
          source = Path("research/l1_four_generation_native_bank_h28_v1.py").read_text()
          gate = Path("research/run_gen5_gate.sh").read_text()
          assert "ROUTER_MARGIN=0.30" in source
          assert "ROUTER_MARGIN=0.05" not in source
          assert "post_scores[g] >= baseline_scores[g]" in gate
          assert "SEEDS=(2026092801 2026092804)" in gate
          print("repaired_source_checks=PASS")
          PY
          python3 -m py_compile research/l1_gen5_autonomous_acquisition_v1.py research/gen5_capstone_aggregate.py

      - name: Execute corrected Gen5 targeted diagnostic
        working-directory: acsie
        shell: bash
        run: |
          set +e
          export GITHUB_WORKSPACE="$PWD"
          bash research/run_gen5_gate.sh > ../gate.stdout 2> ../gate.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > ../gate.exit_code
          echo "gate_exit_code=$RC"
          test "$RC" -ne 0
          grep -F "CAPSTONE_GATE_DIAGNOSTIC_SUMMARY_READY" ../gate.stdout
          grep -F "CAPSTONE_GATE_FATAL_TELEMETRY_BOUNDARY" ../gate.stderr
          grep -F "CAPSTONE_SEED_START=2026092801" ../gate.stdout
          grep -F "CAPSTONE_SEED_START=2026092804" ../gate.stdout

      - name: Validate Seed 1 and Seed 4 scientific boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("acsie")
          expected = [2026092801, 2026092804]
          commit = (Path("source.txt").read_text().split("source_commit=",1)[1].splitlines()[0]).strip()

          rows = {}
          for seed in expected:
              p = root / "tmp"  # unused; keep path construction explicit below
              artifact = Path("/tmp/acsie-gen5-run") / f"experiment-{seed}.json"
              exit_code = Path("/tmp/acsie-gen5-run") / f"experiment-{seed}.exit_code"
              assert artifact.exists(), f"missing artifact: {artifact}"
              assert exit_code.exists(), f"missing exit code: {exit_code}"
              row = json.loads(artifact.read_text())
              rows[seed] = row
              assert row.get("seed") == seed
              assert row.get("source_commit") == commit, (seed, row.get("source_commit"), commit)
              assert exit_code.read_text().strip() == "0"

          s1 = rows[2026092801]
          r1 = s1.get("gen1_to_gen4_retention") or {}
          c1 = r1.get("checks") or {}
          assert c1.get("no_coverage_loss") is True, c1
          assert c1.get("expected_branch_preserved") is True, c1
          assert c1.get("no_accuracy_loss") is True, c1
          assert c1.get("no_p4_historical_takeover") is True, c1

          b2 = (r1.get("baseline") or {}).get("gen2") or {}
          p2 = (r1.get("post_acquisition") or {}).get("gen2") or {}
          assert p2.get("coverage", -1) >= b2.get("coverage", 0), (b2, p2)
          assert p2.get("expected_branch_selection_rate", -1) >= b2.get("expected_branch_selection_rate", 0), (b2, p2)
          assert p2.get("p4_selected_rows") == 0, p2

          s4 = rows[2026092804]
          d4 = s4.get("discovery") or {}
          g4 = s4.get("gates") or {}
          assert d4.get("known_bank_insufficient") is True, d4
          assert g4.get("known_bank_insufficient") is True, g4
          assert s4.get("scientific_status") in {"PASSED","FAILED"}, s4.get("scientific_status")

          summary = {
              "schema": "ACSIE.layer1-gen5-targeted-diagnostic.v1",
              "source_commit": commit,
              "source_tree": Path("source.txt").read_text().split("source_tree=",1)[1].strip(),
              "seeds": expected,
              "seed1": {
                  "scientific_status": s1.get("scientific_status"),
                  "gen2_baseline": b2,
                  "gen2_post": p2,
                  "retention_checks": c1,
              },
              "seed4": {
                  "scientific_status": s4.get("scientific_status"),
                  "known_bank_insufficient": d4.get("known_bank_insufficient"),
                  "gate": g4.get("known_bank_insufficient"),
              },
              "gate_exit_code": int(Path("gate.exit_code").read_text().strip()),
          }
          Path("diagnostic-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload targeted Gen5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen5-targeted-diagnostic-${{ github.run_id }}
          path: |
            source.txt
            gate.stdout
            gate.stderr
            gate.exit_code
            diagnostic-summary.json
            /tmp/acsie-gen5-run/experiment-2026092801.json
            /tmp/acsie-gen5-run/experiment-2026092801.stderr
            /tmp/acsie-gen5-run/experiment-2026092801.exit_code
            /tmp/acsie-gen5-run/experiment-2026092804.json
            /tmp/acsie-gen5-run/experiment-2026092804.stderr
            /tmp/acsie-gen5-run/experiment-2026092804.exit_code
          if-no-files-found: error
          retention-days: 90
