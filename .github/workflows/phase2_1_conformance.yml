name: Phase 2.1 Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Execute bounded real development path
        env:
          PHASE2_1_DECOY: SECRET-SOLUTION-DECOY
        run: PYTHONPATH=. python3 conformance/dev_gate.py
      - name: Execute legacy differential regression suite
        run: PYTHONPATH=. python3 conformance/differential.py
