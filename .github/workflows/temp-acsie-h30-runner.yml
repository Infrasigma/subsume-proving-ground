name: TEMP ACSIE H30 runner

on:
  push:
    paths:
      - ".github/workflows/temp-acsie-h30-runner.yml"

permissions:
  contents: read
  actions: read

env:
  TARGET_REF: "acsie/l1-independent-procedure-bank-h30-20260928"
  ACSIE_SOURCE: "cc6c5d8e83e4b698550638bb440b2c51fb8b9f1a"
  GEN2_FREEZE_RUN: "36407812884"

jobs:
  screen:
    name: H30 seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [2026092801,2026092802,2026092803,2026092804,2026092805]
    steps:
      - name: Checkout H30 proving-ground branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Checkout exact ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_SOURCE }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Download repaired Gen2 freeze
        uses: actions/download-artifact@v4
        with:
          name: acsie-gen2-behavioral-frozen-state-20260928-36407812884
          path: input
          run-id: ${{ env.GEN2_FREEZE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute H30
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          test -f input/verified-gen2-state.json
          PYTHONHASHSEED=0 PYTHONPATH="$GITHUB_WORKSPACE/acsie"             python research/l1_independent_procedure_bank_h30_v1.py             "$GITHUB_WORKSPACE/input/verified-gen2-state.json"             --seed "$SEED" > "h30-$SEED.json"

      - name: Upload H30 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-h30-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: h30-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: screen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: temp-h30-seed-*-${{ github.run_id }}
          path: evidence
          merge-multiple: true
      - name: Aggregate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          rows=[json.loads(p.read_text()) for p in sorted(pathlib.Path("evidence").glob("h30-*.json"))]
          strict=len(rows)==5 and {r.get("seed") for r in rows}=={2026092801,2026092802,2026092803,2026092804,2026092805} and all(r.get("scientific_status")=="PASSED" for r in rows)
          out={"schema":"ACSIE.temp-h30-aggregate.v1","scientific_status":"PASSED" if strict else "FAILED","strict":strict,"rows":rows}
          pathlib.Path("h30-aggregate.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          if not strict: sys.exit(1)
          PY
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-h30-aggregate-${{ github.run_id }}
          path: h30-aggregate.json
          if-no-files-found: error
          retention-days: 7
