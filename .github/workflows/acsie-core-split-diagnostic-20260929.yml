name: ACSIE core split diagnostic 20260929

on:
  push:
    paths:
      - ".github/workflows/acsie-core-split-diagnostic-20260929.yml"
      - ".github/workflows/acsie-core-split-diagnostic-20260929.trigger"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_REF: cf5787af5a812a46784b2678fc23d9c2ed918a11
  PYTHONHASHSEED: "0"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact ACSIE
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
        run: |
          set -euo pipefail
          W=/tmp/acsie-core-diagnostic
          ASK=/tmp/acsie-askpass.sh
          cat > "$ASK" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASK"
          export GIT_ASKPASS="$ASK"
          export GIT_TERMINAL_PROMPT=0
          git clone --no-checkout https://github.com/Infrasigma/ACSIE.git "$W"
          git -C "$W" fetch --no-tags origin "$ACSIE_REF"
          git -C "$W" checkout --detach --force FETCH_HEAD
          test "$(git -C "$W" rev-parse HEAD)" = "$ACSIE_REF"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run native core suite with timing
        run: |
          set +e
          cd /tmp/acsie-core-diagnostic
          export PYTHONPATH="$PWD"
          timeout 600s pytest -vv --durations=20 tests/test_native_independent_core.py > /tmp/core.txt 2>&1
          rc=$?
          echo "rc=$rc" | tee -a /tmp/core.txt
          cat /tmp/core.txt
          exit "$rc"
      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-core-diagnostic
          path: /tmp/core.txt

  recursive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact ACSIE
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
        run: |
          set -euo pipefail
          W=/tmp/acsie-recursive-diagnostic
          ASK=/tmp/acsie-askpass.sh
          cat > "$ASK" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASK"
          export GIT_ASKPASS="$ASK"
          export GIT_TERMINAL_PROMPT=0
          git clone --no-checkout https://github.com/Infrasigma/ACSIE.git "$W"
          git -C "$W" fetch --no-tags origin "$ACSIE_REF"
          git -C "$W" checkout --detach --force FETCH_HEAD
          test "$(git -C "$W" rev-parse HEAD)" = "$ACSIE_REF"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run recursive-intelligence suite with timing
        run: |
          set +e
          cd /tmp/acsie-recursive-diagnostic
          export PYTHONPATH="$PWD"
          timeout 600s pytest -vv --durations=20 tests/test_native_recursive_intelligence.py > /tmp/recursive.txt 2>&1
          rc=$?
          echo "rc=$rc" | tee -a /tmp/recursive.txt
          cat /tmp/recursive.txt
          exit "$rc"
      - name: Upload recursive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-recursive-diagnostic
          path: /tmp/recursive.txt
