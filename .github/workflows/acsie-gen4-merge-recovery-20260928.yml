name: ACSIE Gen4 merge recovery from exact shard evidence

on:
  push:
    branches:
      - acsie/gen4-multi-transition-20260928
    paths:
      - ".github/workflows/acsie-gen4-merge-recovery-20260928.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ACSIE_SOURCE: "596f9655c7f2372149234c2ed6168ce123fbf45e"
  SOURCE_RUN: "36376031059"
  VERIFIED_PARENT: "b31109864ae547320d877e6c1575b805d950edf9"
  EXPORT_SOURCE: "94a2a770a5799fd386217998bc21b585632ef7ed"
  VERIFIED_STATE_SHA256: "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9"

jobs:
  merge-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched exact Gen4 merge harness
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_SOURCE }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact patched Gen4 harness
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${ACSIE_SOURCE}"
          echo "ACSIE_SOURCE=$(git rev-parse HEAD)"
          test -f research/gen4_selected_retention_gate_v1.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download exact frozen Gen2 input from source run
        uses: actions/download-artifact@v4
        with:
          name: acsie-gen4-verified-gen2-input-${{ env.SOURCE_RUN }}
          path: input
          run-id: ${{ env.SOURCE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all eight exact Gen4 candidate shards from source run
        uses: actions/download-artifact@v4
        with:
          pattern: acsie-gen4-multi-shard-*-${{ env.SOURCE_RUN }}
          path: shards
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact frozen input and eight-shard coverage
        run: |
          set -euo pipefail
          test -f input/verified-gen2-export.json
          test -f input/verified-gen2-state.json
          test "$(find shards -maxdepth 1 -name 'shard-*.json' | wc -l)" = "8"
          python - <<'PY'
          import hashlib, json
          r=json.load(open("input/verified-gen2-export.json"))
          assert r["scientific_status"] == "PASSED", r
          assert r["scientific_parent_commit"] == "b31109864ae547320d877e6c1575b805d950edf9", r
          h=hashlib.sha256(open("input/verified-gen2-state.json","rb").read()).hexdigest()
          assert h == "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9", h
          print("VERIFIED_STATE_SHA256", h)
          PY

      - name: Merge exact Gen4 shard evidence with patched harness
        working-directory: acsie
        run: |
          set -u
          PYTHONPATH=. python research/gen4_multi_transition_v1.py \
            ../input/verified-gen2-export.json \
            --merge \
            ../shards/shard-0.json \
            ../shards/shard-1.json \
            ../shards/shard-2.json \
            ../shards/shard-3.json \
            ../shards/shard-4.json \
            ../shards/shard-5.json \
            ../shards/shard-6.json \
            ../shards/shard-7.json \
            > ../gen4-final.json
          rc=$?
          echo "MERGE_RC=${rc}"
          test -s ../gen4-final.json
          cat ../gen4-final.json
          python - <<'PY'
          import json
          r=json.load(open("../gen4-final.json"))
          status=r.get("scientific_status")
          print("SCIENTIFIC_STATUS", status)
          print("ELIGIBLE_COUNT", r.get("eligible_count"))
          print("HOLDOUT_GAIN", r.get("gen4",{}).get("holdout_gain"))
          print("TRANSFER_GAIN", r.get("gen4",{}).get("transfer_gain"))
          print("REGRESSION_PRESERVED", r.get("retention",{}).get("regression_preserved"))
          print("STORED_PRESERVED", r.get("retention",{}).get("stored_preserved"))
          print("DETERMINISTIC_REPLAY", r.get("replay",{}).get("deterministic_replay"))
          assert status in {"PASSED","FAILED"}, r
          if r.get("gen4"):
              print("SELECTED_FINGERPRINT", r["selected"]["fingerprint"])
              print("SELECTED_CONTEXT_PROGRAM", r["selected"]["context_program"])
          PY
          test "${rc}" = "0"

      - name: Package complete Gen4 recovery evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp input/verified-gen2-export.json evidence/
          cp input/verified-gen2-state.json evidence/
          cp shards/shard-*.json evidence/
          cp gen4-final.json evidence/
          sha256sum evidence/verified-gen2-state.json > evidence/state.sha256
          printf '%s\n' \
            "source_candidate_run=${SOURCE_RUN}" \
            "recovery_workflow=${{ github.run_id }}" \
            "recovery_workflow_sha=${{ github.sha }}" \
            "acsie_source=${ACSIE_SOURCE}" \
            "historical_parent=${VERIFIED_PARENT}" \
            "export_source=${EXPORT_SOURCE}" \
            "verified_state_sha256=${VERIFIED_STATE_SHA256}" \
            "candidate_count=128" \
            "shard_count=8" > evidence/execution-provenance.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acsie-gen4-merge-recovery-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
# exact-shard recovery trigger

# move non-gating ablations off the scientific merge critical path

# selected-only exact retention gate
