name: ACSIE L1 Gen2 procedure synthesis H31 20260928
on:
  push:
    branches:
      - acsie/l1-gen2-procedure-synthesis-h31-20260928
    paths:
      - ".github/workflows/acsie-l1-gen2-procedure-synthesis-h31-20260928.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  ACSIE_SOURCE: "cc6c5d8e83e4b698550638bb440b2c51fb8b9f1a"
  DIAGNOSTIC_VERSION: "h31-2"
jobs:
  screen:
    name: canonical Gen2 H31 screen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_SOURCE }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source
        working-directory: acsie
        run: test "$(git rev-parse HEAD)" = "${ACSIE_SOURCE}"
      - name: Execute H31 screen
        run: |
          set -euo pipefail
          PYTHONHASHSEED=0 PYTHONPATH="$GITHUB_WORKSPACE/acsie" python research/l1_gen2_procedure_synthesis_h31_v1.py --seed 771221 > h31.json
      - name: Upload screen
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l1-gen2-procedure-synthesis-h31-${{ github.run_id }}
          path: h31.json
          if-no-files-found: error
          retention-days: 90
