name: ACSIE private-source lab v3

on:
  push:
    paths:
      - "lab/current_acsie_ref.txt"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Private ACSIE branch or commit to test"
        required: true
        default: "repair/q0-candidate-20260926-r3"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  acsie-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public lab harness
        uses: actions/checkout@v4
        with:
          path: lab-harness
          fetch-depth: 1

      - name: Select ACSIE ref
        id: acsie-ref
        shell: bash
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            ref="$(cat lab-harness/lab/current_acsie_ref.txt)"
          else
            ref="${{ inputs.acsie_ref }}"
          fi
          test -n "$ref"
          echo "ref=$ref" >> "${GITHUB_OUTPUT}"
          echo "Testing ACSIE ref: $ref"

      - name: Checkout private ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ steps.acsie-ref.outputs.ref }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Record source identity
        working-directory: acsie
        run: |
          set -eu
          echo "ACSIE_COMMIT=$(git rev-parse HEAD)"
          echo "ACSIE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Compile cognitive core
        working-directory: acsie
        run: python -m compileall -q cognitive_core

      - name: CORE-013 H003 integration
        working-directory: acsie
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie
        run: pytest -q tests/test_core013_h003_integration.py

      - name: CORE-013 cognitive-core import smoke
        working-directory: acsie
        run: |
          python - <<'PY'
from cognitive_core import GeneralLearner, CognitiveProcedure
from cognitive_core import continual_learning, open_capability, interactive_learning
l = GeneralLearner()
assert not l.cognitive_evolution_state()["enabled"]
assert CognitiveProcedure is not None
assert continual_learning is not None
assert open_capability is not None
assert interactive_learning is not None
print("current cognitive_core smoke: PASS")
PY

      - name: CORE-015 semantic operator gate
        working-directory: acsie
        run: python -m pytest -q tests/test_core015_semantic_operator_discovery.py

      - name: CORE-016 semantic operator-class gate
        working-directory: acsie
        run: python -m pytest -q tests/test_core016_open_semantic_substrate.py

      - name: Native core tests
        working-directory: acsie
        run: python -m pytest -q tests/test_native_independent_core.py tests/test_native_recursive_intelligence.py

      - name: L2-C patched retention quarantine five-seed gate
        if: always()
        working-directory: acsie
        env:
          ACSIE_GITHUB_ACTIONS: "1"
          ACSIE_L2_SELECTION_MODE: "cv_partition"
          ACSIE_L2_SEEDS: "2026092901 2026092902 2026092903 2026092904 2026092905"
          PYTHONHASHSEED: "0"
        run: |
          set +e
          bash research/run_l2_sequential_gate.sh > /tmp/l2c-retention.stdout 2> /tmp/l2c-retention.stderr
          rc=$?
          echo "$rc" > /tmp/l2c-retention.exit_code
          cat /tmp/l2c-retention.stdout
          cat /tmp/l2c-retention.stderr >&2
          echo "L2C_RETENTION_GATE_EXIT=$rc"
          exit 0

      - name: Upload L2-C patched retention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l2c-retention-quarantine
          path: |
            /tmp/l2c-retention.stdout
            /tmp/l2c-retention.stderr
            /tmp/l2c-retention.exit_code
            /tmp/acsie-l2-sequential-run
          if-no-files-found: warn

      - name: Native final pre-flight gate
        working-directory: acsie
        run: python research/native_independent_final_gate.py

      - name: ACSIE Gen5 targeted two-seed diagnostic
        working-directory: acsie
        env:
          ACSIE_GITHUB_ACTIONS: "1"
        run: |
          set +e
          bash research/run_gen5_gate.sh > /tmp/gen5-gate.stdout 2> /tmp/gen5-gate.stderr
          rc=$?
          echo "${rc}" > /tmp/gen5-gate.exit_code
          cat /tmp/gen5-gate.stdout
          cat /tmp/gen5-gate.stderr >&2
          echo "GEN5_GATE_EXIT=${rc}"
          exit 0

      - name: Upload ACSIE Gen5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen5-targeted-two-seed-${{ github.run_id }}
          path: |
            /tmp/gen5-gate.stdout
            /tmp/gen5-gate.stderr
            /tmp/gen5-gate.exit_code
            /tmp/acsie-gen5-run
          if-no-files-found: warn

      - name: Remove private source
        if: always()
        run: rm -rf acsie


  h7-offline:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/pr110-h7-redundant-representative-compression-20261008')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout H7 proving harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download existing Phase6 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 37738748858
          artifact-ids: 11536026911
          github-token: ${{ github.token }}
          path: evidence

      - name: Verify exact fixed inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path("research/pr110_acsie_snapshot/manifest.json").read_text())
          b=json.loads(Path("evidence/pr110-phase6-scalability-forensics/B-forensics.json").read_text())
          ck=json.loads(Path("evidence/pr110-phase6-scalability-forensics/B-checkpoint.json").read_text())
          assert m["B"]["runtime_sha"] == "9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"
          assert m["proving_harness_sha"] == "33259fc5c69d87b99c604f0050508c433a279daf"
          assert b["runtime_sha"] == m["B"]["runtime_sha"]
          assert b["proving_sha"] == m["proving_harness_sha"]
          assert b["seed"] == 2026100305 and ck["seed"] == 2026100305
          assert ck["generation_next"] == 5
          for rel, expected in m["B"]["files"].items():
              data=Path("research/pr110_acsie_snapshot/B", rel).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert actual == expected, (rel, actual, expected)
          print("H7_INPUTS=PASS")
          PY

      - name: Syntax smoke
        run: |
          set -euo pipefail
          python3 -m py_compile             lab/pr110_h7_offline_capture.py             lab/pr110_h7_offline_counterfactual.py             lab/exact_checkpoint.py             lab/acsie_open_ended_self_extending_proving.py             research/pr110_acsie_snapshot/B/cognitive_core/behavioral_search.py             research/pr110_acsie_snapshot/B/cognitive_core/open_ended_growth.py             research/pr110_acsie_snapshot/B/cognitive_core/recursive_cognitive_compiler.py

      - name: Capture current-state Gen5 lineage representatives
        run: |
          set -euo pipefail
          env PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B:$GITHUB_WORKSPACE"             RUNTIME_SHA="9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"             PROVING_SHA="33259fc5c69d87b99c604f0050508c433a279daf"             python3 -u lab/pr110_h7_offline_capture.py               --checkpoint evidence/pr110-phase6-scalability-forensics/B-checkpoint.json               --output evidence/h7-offline-frontiers.json

      - name: Compute K counterfactuals
        run: |
          set -euo pipefail
          python3 -u lab/pr110_h7_offline_counterfactual.py             --input evidence/h7-offline-frontiers.json             --output evidence/h7-offline-counterfactual.json

      - name: Upload H7 offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr110-h7-final-offline-counterfactual-${{ github.sha }}
          path: evidence/h7-offline-*.json
          retention-days: 90
