name: ACSIE private-source lab v3

on:
  push:
    paths:
      - "lab/current_acsie_ref.txt"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Private ACSIE branch or commit to test"
        required: true
        default: "repair/q0-candidate-20260926-r3"
        type: string

permissions:
  contents: read

jobs:
  acsie-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public lab harness
        uses: actions/checkout@v4
        with:
          path: lab-harness
          fetch-depth: 1

      - name: Select ACSIE ref
        id: acsie-ref
        shell: bash
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            ref="$(cat lab-harness/lab/current_acsie_ref.txt)"
          else
            ref="${{ inputs.acsie_ref }}"
          fi
          test -n "$ref"
          echo "ref=$ref" >> "${GITHUB_OUTPUT}"
          echo "Testing ACSIE ref: $ref"

      - name: Checkout private ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ steps.acsie-ref.outputs.ref }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Record source identity
        working-directory: acsie
        run: |
          set -eu
          echo "ACSIE_COMMIT=$(git rev-parse HEAD)"
          echo "ACSIE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Compile cognitive core
        working-directory: acsie
        run: python -m compileall -q cognitive_core

      - name: CORE-013 H003 integration
        working-directory: acsie
        env:
          PYTHONPATH: ${{ github.workspace }}/acsie
        run: pytest -q tests/test_core013_h003_integration.py

      - name: CORE-013 cognitive-core import smoke
        working-directory: acsie
        run: |
          python - <<'PY'
from cognitive_core import GeneralLearner, CognitiveProcedure
from cognitive_core import continual_learning, open_capability, interactive_learning
l = GeneralLearner()
assert not l.cognitive_evolution_state()["enabled"]
assert CognitiveProcedure is not None
assert continual_learning is not None
assert open_capability is not None
assert interactive_learning is not None
print("current cognitive_core smoke: PASS")
PY

      - name: CORE-015 semantic operator gate
        working-directory: acsie
        run: python -m pytest -q tests/test_core015_semantic_operator_discovery.py

      - name: CORE-016 semantic operator-class gate
        working-directory: acsie
        run: python -m pytest -q tests/test_core016_open_semantic_substrate.py

      - name: Native core tests
        working-directory: acsie
        run: python -m pytest -q tests/test_native_independent_core.py tests/test_native_recursive_intelligence.py

      - name: Native final pre-flight gate
        working-directory: acsie
        run: python research/native_independent_final_gate.py

      - name: Remove private source
        if: always()
        run: rm -rf acsie

  h30-procedure-bank:
    name: H30 reusable procedure bank seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [2026092801,2026092802,2026092803,2026092804,2026092805]
    steps:
      - name: Checkout H30 proving-ground branch
        uses: actions/checkout@v4
        with:
          ref: acsie/l1-independent-procedure-bank-h30-20260928
          fetch-depth: 1

      - name: Checkout exact ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: cc6c5d8e83e4b698550638bb440b2c51fb8b9f1a
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Download repaired Gen2 freeze
        uses: actions/download-artifact@v4
        with:
          name: acsie-gen2-behavioral-frozen-state-20260928-36407812884
          path: input
          run-id: 36407812884
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute H30
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          test -f input/verified-gen2-state.json
          PYTHONHASHSEED=0 PYTHONPATH="$GITHUB_WORKSPACE/acsie"             python research/l1_independent_procedure_bank_h30_v1.py             "$GITHUB_WORKSPACE/input/verified-gen2-state.json"             --seed "$SEED" > "h30-$SEED.json"

      - name: Upload H30 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-h30-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: h30-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 7
