name: H7 cycle-safe expanded macro tree cache diagnostic

on:
  push:
    branches:
      - research/acsie-h7-expanded-macro-tree-cache-20261012
    paths:
      - ".github/workflows/h7-expanded-macro-tree-cache.yml"
      - "lab/patch_h7_expanded_macro_tree_cache.py"
      - "lab/run_h7_expanded_macro_tree_cache.py"

permissions:
  contents: read

jobs:
  macro-tree-cache-preflight-and-gen6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout proving-ground diagnostic harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze isolated experiment contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/h7-expanded-macro-tree-cache
          {
            echo "EXECUTOR_REPOSITORY=Infrasigma/subsume-proving-ground"
            echo "EXECUTOR_BRANCH=${GITHUB_REF_NAME}"
            echo "EXECUTOR_COMMIT=${GITHUB_SHA}"
            echo "WORKFLOW_RUN_ID=${GITHUB_RUN_ID}"
            echo "ACSIE_SOURCE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "ACSIE_SOURCE_TREE=12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
            echo "ACSIE_BEHAVIORAL_SEARCH_SHA256=2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
            echo "FACTOR=acyclic-only per-primitive expanded macro-tree Mapping cache"
            echo "FIXED_ALGORITHM_FACTOR=lineage-frontier FIFO cache capacity 128 in both arms"
            echo "OTHER_CACHES=structural ID interning OFF; macro-ID string memoization OFF; grouping OFF"
            echo "SEED=2026100301"
            echo "GENERATION_INDICES=0..6"
            echo "CHILD_WALL_LIMIT_SECONDS=180 per arm"
            echo "RSS_GUARD_BYTES=2147483648 per arm"
            echo "PREFLIGHT=exact max/min/sum signatures + 61/61 regression per arm + cache exercised"
            echo "CYCLE_POLICY=disable cache globally if any dependency graph cycle is found"
            echo "SCIENCE_GATE=complete child record required; timeout/empty stdout is INCONCLUSIVE"
          } | tee evidence/h7-expanded-macro-tree-cache/initial-contract.txt
          python -m py_compile \
            lab/patch_h7_metadata_only_bucket_duplicate.py \
            lab/patch_h7_expanded_macro_tree_cache.py \
            lab/run_h7_expanded_macro_tree_cache.py

      - name: Checkout exact private ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned ACSIE source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acsie rev-parse HEAD)" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$(git -C acsie rev-parse 'HEAD^{tree}')" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          test "$(sha256sum acsie/cognitive_core/behavioral_search.py | awk '{print $1}')" = "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          {
            git -C acsie rev-parse HEAD
            git -C acsie rev-parse 'HEAD^{tree}'
            sha256sum acsie/cognitive_core/behavioral_search.py
          } | tee evidence/h7-expanded-macro-tree-cache/acsie-source-identity.txt

      - name: Setup Python 3.11 and pytest
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run exact-parity preflight and paired Gen6 diagnostic
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python lab/run_h7_expanded_macro_tree_cache.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --acsie-root "$GITHUB_WORKSPACE/acsie" \
            --evidence "$GITHUB_WORKSPACE/evidence/h7-expanded-macro-tree-cache" \
            --seed 2026100301 \
            --generations 7 \
            --timeout-seconds 180 \
            --rss-guard-bytes 2147483648 \
            2>&1 | tee evidence/h7-expanded-macro-tree-cache/runner-stdout.txt

      - name: Upload complete experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h7-expanded-macro-tree-cache-${{ github.run_id }}
          path: evidence/h7-expanded-macro-tree-cache/
          if-no-files-found: error
          compression-level: 6
