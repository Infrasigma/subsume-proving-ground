name: ACE-X V6 protected semantic-prospective gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  ace-x-v6-forensic:
    if: github.event.pull_request.head.ref == 'ace-x-v6-semantic-prospective-20260921' && github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact V6 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - name: Run protected V6 terminal
        env:
          ACEX_V6_RUNTIME_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestV6SemanticEquivalenceQuotient$|^TestV6ProspectiveLibraryLearning$|^TestV6ExecutableMechanismSelection$|^TestV6FailureCurriculum$' ./internal/acex -count=1 -timeout=15m -v | tee acex-v6-protected-result.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v6-protected-result
          path: acex-v6-protected-result.txt

# Protected evaluator infrastructure is now provided by main's ACE-X router. Candidate-specific workflow retained for forensic provenance: v6.
