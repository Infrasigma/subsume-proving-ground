name: ACSIE open-ended version-space candidate audit seed3

on:
  push:
    branches:
      - research/open-ended-vs-candidate-audit-seed3-20261004
    paths:
      - ".github/workflows/acsie-open-ended-version-space-candidate-audit-seed3.yml"
      - "lab/acsie_open_ended_version_space_diagnostic_v4.py"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed3:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Clone exact ACSIE candidate-audit commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "6788bccee5754a530c504a4101bc14ae0fd17608"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-open-ended-candidate-audit
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-open-ended-candidate-audit
          git -C /tmp/acsie-open-ended-candidate-audit fetch --depth 1 origin "$ACSIE_REF"
          git -C /tmp/acsie-open-ended-candidate-audit checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-open-ended-candidate-audit rev-parse HEAD)" = "$ACSIE_REF"

      - name: Run ACSIE unit tests
        run: |
          set -euo pipefail
          python3 -m venv /tmp/open-ended-audit-venv
          . /tmp/open-ended-audit-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-open-ended-candidate-audit pytest -q /tmp/acsie-open-ended-candidate-audit/tests/test_open_ended_growth.py
          PYTHONPATH=/tmp/acsie-open-ended-candidate-audit:. pytest -q lab/test_open_ended_bootstrap_language.py

      - name: Static protocol audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root = Path("/tmp/acsie-open-ended-candidate-audit")
          growth = ast.parse((root / "cognitive_core/open_ended_growth.py").read_text())
          fn_names = {"invent_primitive", "synthesize_process"}
          for fn_name in fn_names:
              fn = next(n for n in ast.walk(growth) if isinstance(n, ast.FunctionDef) and n.name == fn_name)
              calls = [
                  n for n in ast.walk(fn)
                  if isinstance(n, ast.Call)
                  and isinstance(n.func, ast.Name)
                  and n.func.id == "find_exact_expression"
              ]
              assert calls, fn_name + ": no exact search call"
              assert any(
                  len(c.args) >= 2
                  and isinstance(c.args[1], ast.Name)
                  and c.args[1].id == "discovery_rows"
                  for c in calls
              ), fn_name + ": search input is not discovery_rows"
          print("CANDIDATE_AUDIT_PROTOCOL_SOURCE_AUDIT=PASS")
          PY

      - name: Run seed3 twelve-generation candidate audit
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: /tmp/acsie-open-ended-candidate-audit:.
        run: |
          set +e
          . /tmp/open-ended-audit-venv/bin/activate
          set -o pipefail
          {
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "ACSIE_REF=6788bccee5754a530c504a4101bc14ae0fd17608"
            echo "SEED=2026100303"
            echo "GENERATIONS=12"
            echo "TARGET_IDENTITY_AVAILABLE_TO_RUNTIME=false"
            echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 -u lab/acsie_open_ended_version_space_diagnostic_v4.py
          } 2>&1 | tee version-space-candidate-audit-seed3.txt
          rc=${PIPESTATUS[0]}
          echo "SCIENTIFIC_DIAGNOSTIC_RC=$rc" | tee -a version-space-candidate-audit-seed3.txt
          exit 0

      - name: Upload candidate audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-open-ended-version-space-candidate-audit-seed3-${{ github.sha }}
          path: version-space-candidate-audit-seed3.txt
