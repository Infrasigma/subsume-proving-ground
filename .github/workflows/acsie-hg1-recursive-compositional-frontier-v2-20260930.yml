name: ACSIE H-G1 recursive compositional frontier v2 20260930

on:
  push:
    paths:
      - ".github/workflows/acsie-hg1-recursive-compositional-frontier-v2-20260930.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_REF: 95040df1bbb4a67ddf668ed22672ce129ec96e81
  PYTHONHASHSEED: "0"

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        seed: [2026093001, 2026093002, 2026093003, 2026093004, 2026093005]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact ACSIE H-G1 v2 source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_REF }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACSIE_REF"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Run optimized H-G1 gate
        working-directory: acsie
        env:
          H_G1_SEED: "${{ matrix.seed }}"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          set +e
          python3 -u research/run_recursive_context_frontier_gate.py \
            "$H_G1_SEED" \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^{tree})" \
            > gate.stdout.txt 2> gate.stderr.txt
          rc=$?
          set -e
          mkdir -p evidence/hg1v2
          cp gate.stdout.txt gate.stderr.txt evidence/hg1v2/
          printf "%s\n" "$rc" > evidence/hg1v2/gate.rc
          if [ -f "/tmp/acsie-hg1-${H_G1_SEED}.json" ]; then
            cp "/tmp/acsie-hg1-${H_G1_SEED}.json" evidence/hg1v2/
          fi
          echo "H_G1_EXIT_CODE=$rc"
          echo "---- STDERR ----"
          cat gate.stderr.txt || true
          echo "---- STDOUT (tail) ----"
          tail -n 120 gate.stdout.txt || true
          test "$rc" -eq 0

      - name: Upload H-G1 v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-hg1v2-recursive-frontier-${{ matrix.seed }}
          path: acsie/evidence/hg1v2/**
          if-no-files-found: error