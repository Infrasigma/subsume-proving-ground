name: ACE-X V3 typed library growth gate

on:
  push:
    branches:
      - ace-x-v3-library-growth-20260921
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - run: |
          set -euo pipefail
          go test -mod=mod -run '^TestV3ArchitectureTerminal
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v3-result
          path: acex-v3-result.txt
 ./internal/acex -count=1 -timeout=10m -v | tee acex-v3-result.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v3-result
          path: acex-v3-result.txt

