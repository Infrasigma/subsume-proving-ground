name: ACE Capability Compounding

on:
  push:
    branches: ["ace-full-system-20260911"]
  pull_request:

permissions:
  contents: read

jobs:
  compounding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Isolated universal branching diagnostic
        run: go test -mod=mod -run '^TestUniversalBranchingSynthesizesThresholdDiagnostic$' ./internal/ace -count=1 -v
      - name: CSI artifact preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.csi-artifact-preflight"
          sentinel="$GITHUB_WORKSPACE/.csi-artifact-preflight/sentinel"
          touch "$sentinel"
          test -f "$sentinel"
          test "$GITHUB_WORKSPACE/ACE_CSI_BASELINE.json" = "$GITHUB_WORKSPACE/ACE_CSI_BASELINE.json"
          test "$GITHUB_WORKSPACE/ACE_CSI_BASELINE.md" = "$GITHUB_WORKSPACE/ACE_CSI_BASELINE.md"
          test "$GITHUB_WORKSPACE/ACE_CSI_EXPERIMENT.json" = "$GITHUB_WORKSPACE/ACE_CSI_EXPERIMENT.json"
          test "$GITHUB_WORKSPACE/ACE_CSI_EXPERIMENT.md" = "$GITHUB_WORKSPACE/ACE_CSI_EXPERIMENT.md"
          rm -f "$sentinel"
          rmdir "$GITHUB_WORKSPACE/.csi-artifact-preflight"
      - name: Capability-substrate induction boundary
        run: go test -mod=mod -run '^TestCapabilitySubstrateInductionBoundary$' ./internal/ace -count=1 -v
      - name: Upload CSI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-csi-capability-substrate-induction
          path: |
            ${{ github.workspace }}/ACE_CSI_BASELINE.json
            ${{ github.workspace }}/ACE_CSI_BASELINE.md
            ${{ github.workspace }}/ACE_CSI_EXPERIMENT.json
            ${{ github.workspace }}/ACE_CSI_EXPERIMENT.md
          if-no-files-found: error
      - name: Open-ended operator invention boundary
        run: go test -mod=mod -run '^TestOpenEndedOperatorInventionBoundary$' ./internal/ace -count=1 -v
      - name: Upload open-ended invention artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-open-ended-operator-invention
          path: |
            ACE_BASELINE_FRONTIER.json
            ACE_BASELINE_FRONTIER.md
            ACE_OPEN_ENDED_OPERATOR_INVENTION.json
            ACE_OPEN_ENDED_OPERATOR_INVENTION.md
          if-no-files-found: error
      - name: Test
        run: go test -mod=mod ./...
      - name: Upload V3 forensic runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-v3-rejection-forensics
          path: |
            ACE_V3_REJECTION_MATRIX.json
            ACE_V3_REJECTION_FORENSICS.md
            ACE_V3_LIBRARY_REACHABILITY.json
            ACE_V3_FRONTIER_PREDICATE_AUDIT.md
            ACE_V3_SELF_EXTENSIBLE_FORENSICS.md
            ACE_V3_FRONTIER_FALSIFICATION.json
            ACE_V3_FRONTIER_FALSIFICATION.md
          if-no-files-found: error
      - name: Upload autonomous discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-autonomous-operator-discovery
          path: |
            ACE_AUTONOMOUS_OPERATOR_DISCOVERY.json
            ACE_AUTONOMOUS_OPERATOR_DISCOVERY.md
          if-no-files-found: error
      - name: Race
        run: go test -mod=mod -race ./...
      - name: Vet
        run: go vet -mod=mod ./...
      - name: Build
        run: go build ./cmd/ace
      - name: Capability compounding gate
        run: go test -mod=mod -run 'Test(RecursiveCapabilityCompoundingCore|ReplicatedCapabilityCompoundingCore|AutonomousMethodImprovementFromTelemetry|ExecutableAcquisitionMethodIsSerializableAndComposable|SelfExtensibleCapabilityProbe|ExecutableMethodPersistsAcrossRestart|BootstrapExpansionB0ToB1CausalAndIndependent|BootstrapExpansionRecursiveLibraryRestartAndAblation|AdaptiveAcquisitionRuntimeEndogenousAbstractionLearning|V3FrontierExpansionFalsification|AutonomousOperatorDiscovery|OpenEndedOperatorInventionBoundary|CapabilitySubstrateInductionBoundary)$' ./internal/ace
