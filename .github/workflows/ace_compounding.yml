name: ACE Capability Compounding

on:
  push:
    branches: ["ace-full-system-20260911"]
  pull_request:

permissions:
  contents: read

jobs:
  compounding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Isolated universal branching diagnostic
        run: go test -mod=mod -run '^TestUniversalBranchingSynthesizesThresholdDiagnostic$' ./internal/ace -count=1 -v
      - name: Test
        run: go test -mod=mod ./...
      - name: Race
        run: go test -mod=mod -race ./...
      - name: Vet
        run: go vet -mod=mod ./...
      - name: Build
        run: go build ./cmd/ace
      - name: Capability compounding gate
        run: go test -mod=mod -run 'Test(RecursiveCapabilityCompoundingCore|ReplicatedCapabilityCompoundingCore|AutonomousMethodImprovementFromTelemetry|ExecutableAcquisitionMethodIsSerializableAndComposable|SelfExtensibleCapabilityProbe|ExecutableMethodPersistsAcrossRestart|BootstrapExpansionB0ToB1CausalAndIndependent|BootstrapExpansionRecursiveLibraryRestartAndAblation|AdaptiveAcquisitionRuntimeEndogenousAbstractionLearning)$' ./internal/ace
