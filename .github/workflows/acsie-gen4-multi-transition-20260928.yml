name: ACSIE exact protected Gen4 multi-transition

on:
  push:
    branches:
      - acsie/gen4-multi-transition-20260928
    paths:
      - ".github/workflows/acsie-gen4-multi-transition-20260928.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_SOURCE: "5209272e442a2a11eb8f668581474f738500214f"
  ACSIE_EXPORT_SOURCE: "94a2a770a5799fd386217998bc21b585632ef7ed"
  VERIFIED_PARENT: "b31109864ae547320d877e6c1575b805d950edf9"
  VERIFIED_STATE_SHA256: "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9"
  SHARD_COUNT: "8"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact historical Gen2 exporter
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: \${{ env.ACSIE_EXPORT_SOURCE }}
          token: \${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-old
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exporter source
        working-directory: acsie-old
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "\${ACSIE_EXPORT_SOURCE}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export and validate frozen Gen2 state
        working-directory: acsie-old
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/export_verified_gen2_state_from_b311_v1.py > ../verified-gen2-export.json
          python - <<'PY'
          import hashlib, json
          r=json.load(open("../verified-gen2-export.json"))
          assert r["scientific_status"] == "PASSED", r
          assert r["scientific_parent_commit"] == "b31109864ae547320d877e6c1575b805d950edf9", r
          assert abs(r["verified_gen2_protocol"]["holdout_gain"]-0.10416666666666663) < 1e-12, r
          assert abs(r["verified_gen2_protocol"]["transfer_gain"]-0.0625) < 1e-12, r
          json.dump(r["frozen_state"], open("../verified-gen2-state.json","w"), sort_keys=True)
          h=hashlib.sha256(open("../verified-gen2-state.json","rb").read()).hexdigest()
          assert h == "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9", h
          print("VERIFIED_GEN2_STATE_READY")
          print("STATE_SHA256", h)
          PY
      - name: Package frozen input
        run: |
          set -euo pipefail
          mkdir -p input
          cp verified-gen2-export.json verified-gen2-state.json input/
          printf '%s\n' \
            "historical_parent=\${VERIFIED_PARENT}" \
            "export_source=\${ACSIE_EXPORT_SOURCE}" \
            "acsie_source=\${ACSIE_SOURCE}" \
            "verified_state_sha256=\${VERIFIED_STATE_SHA256}" \
            "shard_count=\${SHARD_COUNT}" \
            "workflow_run=\${{ github.run_id }}" > input/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: acsie-gen4-verified-gen2-input-\${{ github.run_id }}
          path: input/

  shards:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact ACSIE Gen4 source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: \${{ env.ACSIE_SOURCE }}
          token: \${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact ACSIE source
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "\${ACSIE_SOURCE}"
          git status --short
          echo "ACSIE_SOURCE=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: acsie-gen4-verified-gen2-input-\${{ github.run_id }}
          path: .
      - name: Run exact Gen4 candidate shard \${{ matrix.shard }}
        working-directory: acsie
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/gen4_multi_transition_v1.py \
            ../verified-gen2-export.json \
            --shard-index \${{ matrix.shard }} \
            --shard-count \${SHARD_COUNT} \
            > ../shard-\${{ matrix.shard }}.json
          python - <<'PY'
          import json
          p="../shard-\${{ matrix.shard }}.json"
          r=json.load(open(p))
          assert r["scientific_status"]=="COMPUTATION_COMPLETE", r
          assert r["protocol"]["candidate_count"]==128, r
          print("SHARD", r["shard"]["index"], "CANDIDATES", r["shard"]["candidate_count"])
          print("HARNESS_SOURCE", r["provenance"]["executed_harness_commit"])
          print("SET_DIGEST", r["protocol"]["candidate_set_digest"])
          print("GEN3_FP", r["protocol"]["gen3_selected_fingerprint"])
          print("GEN3_HOLDOUT", r["protocol"]["gen3_reproduced_holdout_gain"])
          print("GEN3_TRANSFER", r["protocol"]["gen3_reproduced_transfer_gain"])
          PY
      - name: Upload Gen4 shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen4-multi-shard-\${{ matrix.shard }}-\${{ github.run_id }}
          path: shard-\${{ matrix.shard }}.json

  merge:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact ACSIE Gen4 source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: \${{ env.ACSIE_SOURCE }}
          token: \${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact ACSIE source
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "\${ACSIE_SOURCE}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: acsie-gen4-verified-gen2-input-\${{ github.run_id }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          pattern: acsie-gen4-multi-shard-*-\${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Verify all eight shards are present
        run: |
          set -euo pipefail
          ls -l shards
          test "$(find shards -maxdepth 1 -name 'shard-*.json' | wc -l)" = "8"
      - name: Merge exact Gen4 candidate evaluations and execute final gate
        working-directory: acsie
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python research/gen4_multi_transition_v1.py \
            ../input/verified-gen2-export.json \
            --merge \
            ../shards/shard-0.json \
            ../shards/shard-1.json \
            ../shards/shard-2.json \
            ../shards/shard-3.json \
            ../shards/shard-4.json \
            ../shards/shard-5.json \
            ../shards/shard-6.json \
            ../shards/shard-7.json \
            > ../gen4-final.json
          rc=$?
          set -e
          cat ../gen4-final.json
          test -s ../gen4-final.json
          python - <<'PY'
          import json
          r=json.load(open("../gen4-final.json"))
          assert r.get("scientific_status") in {"PASSED","FAILED"}, r
          print("SCIENTIFIC_STATUS", r["scientific_status"])
          print("ELIGIBLE_COUNT", r.get("eligible_count"))
          print("HOLDOUT_GAIN", r.get("gen4",{}).get("holdout_gain"))
          print("TRANSFER_GAIN", r.get("gen4",{}).get("transfer_gain"))
          print("REGRESSION_PRESERVED", r.get("retention",{}).get("regression_preserved"))
          print("STORED_PRESERVED", r.get("retention",{}).get("stored_preserved"))
          print("DETERMINISTIC_REPLAY", r.get("replay",{}).get("deterministic_replay"))
          PY
          test "$rc" = "0"
      - name: Package complete Gen4 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp input/verified-gen2-export.json evidence/
          cp input/verified-gen2-state.json evidence/
          cp input/provenance.txt evidence/
          cp gen4-final.json evidence/
          cp shards/shard-*.json evidence/
          printf '%s\n' \
            "historical_parent=\${VERIFIED_PARENT}" \
            "export_source=\${ACSIE_EXPORT_SOURCE}" \
            "acsie_source=\${ACSIE_SOURCE}" \
            "verified_state_sha256=\${VERIFIED_STATE_SHA256}" \
            "candidate_count=128" \
            "shard_count=\${SHARD_COUNT}" \
            "workflow_run=\${{ github.run_id }}" \
            "workflow_sha=\${{ github.sha }}" > evidence/execution-provenance.txt
          sha256sum evidence/verified-gen2-state.json > evidence/state.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: acsie-gen4-multi-transition-final-\${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
