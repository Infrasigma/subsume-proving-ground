name: H7 metadata-only same-bucket duplicate Gen6 diagnostic

on:
  push:
    branches:
      - research/acsie-h7-r3-exact-source-20261011
    paths:
      - ".github/workflows/h7-metadata-only-bucket-duplicate.yml"
      - "lab/patch_h7_metadata_only_bucket_duplicate.py"
      - "lab/run_h7_metadata_only_bucket_duplicate.py"

permissions:
  contents: read

jobs:
  metadata-only-bucket-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Predeclare factor and validate harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/h7-metadata-only-bucket-duplicate
          {
            echo "EXECUTOR_COMMIT=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "ACSIE_SOURCE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "ACSIE_SOURCE_TREE=12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
            echo "FACTOR=avoid parent AST materialization for register_binary same-bucket duplicate if exact bucket key already exists"
            echo "FIXED_FACTOR=lineage-frontier FIFO cache capacity 128 in both arms"
            echo "CANDIDATE_PRESERVES=seen-expression check; target flags and target lineage signatures; structural lineage update; generated/duplicate counters; next token; return same retained representative"
            echo "OTHER_FACTORS=structural-ID interning OFF; macro-ID memoization OFF; rank-key reuse OFF; structural-expansion cache OFF; grouping OFF"
            echo "PREDECLARED_SEED=2026100301"
            echo "GENERATIONS=0..6 (7 total)"
            echo "CHILD_TIMEOUT_SECONDS=120 per arm"
            echo "RSS_GUARD_MIB=2048 per arm"
            echo "PRE-GEN6-GATE=exact max/min/sum signature parity + 61/61 six-file tests + at least one metadata-only duplicate hit"
          } | tee evidence/h7-metadata-only-bucket-duplicate/initial-contract.txt
          python -m py_compile             lab/patch_h7_metadata_only_bucket_duplicate.py             lab/run_h7_metadata_only_bucket_duplicate.py

      - name: Checkout pinned private ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Run parity-gated paired Gen6 diagnostic
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python lab/run_h7_metadata_only_bucket_duplicate.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --acsie-root "$GITHUB_WORKSPACE/acsie" \
            --evidence "$GITHUB_WORKSPACE/evidence/h7-metadata-only-bucket-duplicate" \
            --seed 2026100301 \
            --generations 7 \
            --timeout-seconds 120 \
            --rss-guard-bytes 2147483648 \
            --executor-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            2>&1 | tee evidence/h7-metadata-only-bucket-duplicate/runner-stdout.txt

      - name: Upload exact-source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h7-metadata-only-bucket-duplicate-${{ github.run_id }}
          path: evidence/h7-metadata-only-bucket-duplicate/
          if-no-files-found: error
          compression-level: 6
