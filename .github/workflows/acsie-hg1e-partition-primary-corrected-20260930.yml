name: ACSIE H-G1e partition-primary corrected 20260930

on:
  push:
    paths:
      - ".github/workflows/acsie-hg1e-partition-primary-corrected-20260930.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_REF: d151c204c9cd60b2c60719fa258d4e3308a045b5
  PYTHONHASHSEED: "0"
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        seed: [2026093001, 2026093002, 2026093003, 2026093004, 2026093005]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact ACSIE H-G1e source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_REF }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACSIE_REF"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Run H-G1e gate
        working-directory: acsie
        env:
          H_G1_SEED: "${{ matrix.seed }}"
        run: |
          set +e
          export PYTHONPATH="$PWD"
          python3 -u research/run_recursive_context_frontier_gate_v6.py "$H_G1_SEED" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > gate.stdout.txt 2> gate.stderr.txt
          rc=$?
          set -e
          mkdir -p evidence/hg1e
          cp gate.stdout.txt gate.stderr.txt evidence/hg1e/
          printf "%s\n" "$rc" > evidence/hg1e/gate.rc
          if [ -f "/tmp/acsie-hg1-${H_G1_SEED}.json" ]; then cp "/tmp/acsie-hg1-${H_G1_SEED}.json" evidence/hg1e/; fi
          tail -n 160 gate.stdout.txt || true
          cat gate.stderr.txt || true
          test "$rc" -eq 0
      - name: Upload H-G1e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-hg1e-partition-primary-corrected-${{ matrix.seed }}
          path: acsie/evidence/hg1e/**
          if-no-files-found: error