name: PR110 repaired-B two-twin determinism replay

on:
  push:
    branches:
      - research/pr110-determinism-repair-proving-20261007

jobs:
  twin:
    strategy:
      fail-fast: false
      matrix:
        twin: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Run repaired B twin
        run: |
          rm -rf "evidence/twin-${{ matrix.twin }}"
          PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B:$GITHUB_WORKSPACE" \
            python3 lab/pr110_b_determinism_twin.py "evidence/twin-${{ matrix.twin }}"
      - name: Upload twin evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr110-b-twin-${{ matrix.twin }}
          path: evidence/twin-${{ matrix.twin }}

  compare:
    needs: twin
    runs-on: ubuntu-latest
    steps:
      - name: Download twin 1
        uses: actions/download-artifact@v4
        with:
          name: pr110-b-twin-1
          path: evidence/twin-1
      - name: Download twin 2
        uses: actions/download-artifact@v4
        with:
          name: pr110-b-twin-2
          path: evidence/twin-2
      - name: Compare checkpoint bytes and digests
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          gns = [0, 1, 3, 5, 6]
          ma = json.loads(Path("evidence/twin-1/twin-manifest.json").read_text())
          mb = json.loads(Path("evidence/twin-2/twin-manifest.json").read_text())
          for gen in gns:
              a = Path(f"evidence/twin-1/checkpoint-gen{gen}.json").read_bytes()
              b = Path(f"evidence/twin-2/checkpoint-gen{gen}.json").read_bytes()
              assert a == b, f"checkpoint bytes differ at Gen{gen}"
              ra = next(x for x in ma["checkpoints"] if x["generation"] == gen)
              rb = next(x for x in mb["checkpoints"] if x["generation"] == gen)
              assert ra["state_digest"] == rb["state_digest"], f"state digest differs at Gen{gen}"
              assert ra["checkpoint_sha256"] == rb["checkpoint_sha256"], f"checkpoint digest differs at Gen{gen}"
              assert ra["generation_next"] == rb["generation_next"], f"generation_next differs at Gen{gen}"
              assert ra["target_digest"] == rb["target_digest"], f"target digest differs at Gen{gen}"
              print(json.dumps({
                  "generation": gen,
                  "checkpoint_sha256": hashlib.sha256(a).hexdigest(),
                  "state_digest": ra["state_digest"],
                  "target_digest": ra["target_digest"],
              }, sort_keys=True))
          print("PASS: B twin checkpoints are byte-identical at Gen0/1/3/5/6")
          PY

# Trigger-only follow-up; experimental parameters unchanged.
