name: ACSIE self-extending one-shot execution
on:
  push:
    paths:
      - ".github/workflows/acsie-self-extending-one-shot.yml"
      - "lab/acsie_open_ended_self_extending_proving.py"
      - "lab/run-self-extending-once"
permissions:
  contents: read
  issues: write
jobs:
  run-once:
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Initialize forensic result
        run: |
          : > open-ended-self-extending-result.txt
          echo "WORKFLOW_SHA=${{ github.sha }}" >> open-ended-self-extending-result.txt
          echo "ACSIE_REF=77cfa1c3e9e9a2bb06e424b76ad5ac83c39df7ab" >> open-ended-self-extending-result.txt
      - name: Clone exact ACSIE research commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "77cfa1c3e9e9a2bb06e424b76ad5ac83c39df7ab"
        run: |
          set +e
          {
            echo "=== CLONE ==="
            test -n "$ACSIE_READ_TOKEN"
            rm -rf /tmp/acsie-open-ended-self-extending
            git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-open-ended-self-extending
            git -C /tmp/acsie-open-ended-self-extending fetch --depth 1 origin "research/open-ended-self-extending-core-20261003"
            git -C /tmp/acsie-open-ended-self-extending checkout --detach FETCH_HEAD
            actual="$(git -C /tmp/acsie-open-ended-self-extending rev-parse HEAD)"
            echo "ACTUAL_HEAD=$actual"
            test "$actual" = "$ACSIE_REF"
          } >> open-ended-self-extending-result.txt 2>&1
          rc=$?
          echo "CLONE_RC=$rc" >> open-ended-self-extending-result.txt
          test "$rc" -eq 0
      - name: Run exact unit tests
        run: |
          set +e
          python3 -m venv /tmp/open-ended-venv >> open-ended-self-extending-result.txt 2>&1
          . /tmp/open-ended-venv/bin/activate >> open-ended-self-extending-result.txt 2>&1
          python -m pip install --upgrade pip pytest >> open-ended-self-extending-result.txt 2>&1
          PYTHONPATH=/tmp/acsie-open-ended-self-extending pytest -q /tmp/acsie-open-ended-self-extending/tests/test_open_ended_growth.py >> open-ended-self-extending-result.txt 2>&1
          rc=$?
          echo "UNIT_RC=$rc" >> open-ended-self-extending-result.txt
          test "$rc" -eq 0
      - name: Run branching self-extending gate
        env:
          PYTHONPATH: /tmp/acsie-open-ended-self-extending
        run: |
          set +e
          . /tmp/open-ended-venv/bin/activate >> open-ended-self-extending-result.txt 2>&1
          python3 lab/acsie_open_ended_self_extending_proving.py --strict >> open-ended-self-extending-result.txt 2>&1
          rc=$?
          echo "SCIENTIFIC_GATE_RC=$rc" >> open-ended-self-extending-result.txt
          exit "$rc"
      - name: Upload one-shot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-self-extending-one-shot-${{ github.sha }}
          path: open-ended-self-extending-result.txt

      - name: Publish one-shot result to execution ledger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## One-shot self-extending execution"
            echo ""
            echo "workflow_sha=${{ github.sha }}"
            echo ""
            if [ -f open-ended-self-extending-result.txt ]; then
              cat open-ended-self-extending-result.txt
            else
              echo "No result file was produced; inspect workflow logs."
            fi
          } > ledger-body.txt
          gh api repos/Infrasigma/subsume-proving-ground/issues/168/comments             --method POST             -f body="$(cat ledger-body.txt)"
