name: ACSIE L2-C candidate-selection frontier-aware ablation 20260930

on:
  push:
    paths:
      - ".github/workflows/acsie-l2c-candidate-selection-frontier-aware-20260930.yml"
      - ".github/workflows/acsie-l2c-candidate-selection-frontier-aware-20260930.trigger"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACSIE_REF: 821bb43602c016a3b6c4d6dcfe20d986e152ee90
  ACSIE_FETCH_BRANCH: research/l2c-retention-evidence-quarantine-v2-20260930
  ACSIE_L2_SEEDS: "2026092901 2026092902 2026092903 2026092904 2026092905"
  PYTHONHASHSEED: "0"

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [cv_partition]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact frontier-aware ACSIE source
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
        run: |
          set -euo pipefail
          W=/tmp/acsie-ablation
          ASK=/tmp/acsie-askpass.sh
          rm -rf "$W" "$ASK"
          cat > "$ASK" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASK"
          export GIT_ASKPASS="$ASK"
          export GIT_TERMINAL_PROMPT=0
          git clone --no-checkout https://github.com/Infrasigma/ACSIE.git "$W"
          git -C "$W" fetch --no-tags origin "refs/heads/$ACSIE_FETCH_BRANCH:refs/remotes/origin/$ACSIE_FETCH_BRANCH"
          git -C "$W" checkout --detach --force "$ACSIE_REF"
          test "$(git -C "$W" rev-parse HEAD)" = "$ACSIE_REF"
          test -n "$(git -C "$W" rev-parse HEAD^{tree})"

      - name: Run five-seed frontier-aware selector ablation
        run: |
          set -euo pipefail
          cd /tmp/acsie-ablation
          export PYTHONPATH="$PWD"
          export ACSIE_GITHUB_ACTIONS=1
          unset GITHUB_WORKSPACE
          export ACSIE_L2_SEEDS="$ACSIE_L2_SEEDS"
          export ACSIE_L2_SELECTION_MODE="${{ matrix.mode }}"
          export PYTHONHASHSEED=0
          set +e
          bash research/run_l2_sequential_gate.sh > ablation.stdout.txt 2> ablation.stderr.txt
          rc=$?
          set -e
          echo "$rc" > ablation.rc
          mkdir -p evidence/l2c-candidate-frontier-aware
          cp /tmp/acsie-l2-sequential-run/l2a-*.json evidence/l2c-candidate-frontier-aware/ 2>/dev/null || true
          cp ablation.stdout.txt ablation.stderr.txt ablation.rc evidence/l2c-candidate-frontier-aware/
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path("evidence/l2c-candidate-frontier-aware")
          rows=[]
          target_programs={
              json.dumps(["xor",["eq",["atom",["x"],"parity"],["atom",["z"],"parity"]],["eq",["atom",["y"],"sign"],["atom",["z"],"sign"]]],sort_keys=True,separators=(",",":")),
              json.dumps(["xor",["eq",["atom",["y"],"sign"],["atom",["z"],"sign"]],["eq",["atom",["x"],"parity"],["atom",["z"],"parity"]]],sort_keys=True,separators=(",",":"))
          }
          for p in sorted(root.glob("l2a-*.json")):
              d=json.loads(p.read_text())
              p7=[s for s in d.get("stages",[]) if s.get("regime",{}).get("name")=="p7"]
              st=p7[0] if p7 else {}
              prog=st.get("discovery",{}).get("selected_program")
              rows.append({
                  "seed":d.get("seed"),
                  "scientific_status":d.get("scientific_status"),
                  "p7_status":st.get("status"),
                  "selection_mode":st.get("discovery",{}).get("selection_mode"),
                  "selected_index":st.get("discovery",{}).get("selected_index"),
                  "selection_score":st.get("discovery",{}).get("selected_selection_score"),
                  "selection_rank":st.get("discovery",{}).get("selected_selection_rank"),
                  "cv_mean":st.get("discovery",{}).get("selected_cv_mean"),
                  "selected_program":prog,
                  "exact_protocol_target":json.dumps(prog,sort_keys=True,separators=(",",":")) in target_programs if prog is not None else False,
                  "holdout_pass":st.get("fresh_holdout",{}).get("passed"),
                  "transfer_pass":st.get("fresh_transfer",{}).get("passed"),
                  "integrity":st.get("integrity"),
              })
          summary={
              "schema":"ACSIE.l2c.candidate-selection-frontier-aware-ablation.v1",
              "selection_mode":os.environ["ACSIE_L2_SELECTION_MODE"],
              "source_commit":os.environ["ACSIE_REF"],
              "source_tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
              "requested_seed_count":5,
              "rows":rows,
              "scientific_pass_count":sum(r["scientific_status"]=="PASSED" for r in rows),
              "exact_protocol_target_count":sum(bool(r["exact_protocol_target"]) for r in rows),
              "holdout_pass_count":sum(bool(r["holdout_pass"]) for r in rows),
              "transfer_pass_count":sum(bool(r["transfer_pass"]) for r in rows),
              "integrity_clean_count":sum(all(v is False for v in (r["integrity"] or {}).values()) for r in rows),
              "crash_count":sum(r["scientific_status"]=="CRASHED" for r in rows),
          }
          (root/"aggregate.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          m={}
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  m[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/"manifest.sha256.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          cat ablation.stdout.txt
          cat ablation.stderr.txt >&2 || true
          exit 0

      - name: Upload frontier-aware ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l2c-candidate-frontier-aware-${{ matrix.mode }}-20260930
          path: /tmp/acsie-ablation/evidence/l2c-candidate-frontier-aware/**
