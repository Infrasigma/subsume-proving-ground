name: PR110 exact snapshot checkpoint continuation
on:
  push:
    branches:
      - research/pr110-acsie-snapshot-replay-20261007
    paths:
      - .github/workflows/pr110-exact-snapshot-checkpoint-resume.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  resume:
    name: Resume exact pinned snapshot ${{ matrix.arm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arm: [A, B]
    env:
      SEED: "2026100305"
      GENERATIONS: "12"
      PROVING_SHA: "33259fc5c69d87b99c604f0050508c433a279daf"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve preserved checkpoints
        uses: actions/download-artifact@v4
        with:
          name: pr110-snapshot-causal-replay
          run-id: 37570567635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior

      - name: Verify source identities and immutable input checkpoint
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp "prior/${ARM}-checkpoint-current.json" evidence/input-checkpoint.json
          cp "prior/${ARM}-checkpoint-manifest.json" evidence/input-checkpoint-manifest.json
          PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/$ARM:$GITHUB_WORKSPACE" python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from lab.exact_checkpoint import load_checkpoint

          arm=os.environ["ARM"]
          seed=int(os.environ["SEED"])
          proving_sha=os.environ["PROVING_SHA"]
          manifest=json.loads(Path("research/pr110_acsie_snapshot/manifest.json").read_text())
          assert manifest["fixed_seed"] == seed
          assert manifest["generations"] == 12
          assert manifest["selected_generations"] == [5,6,9,10,11]
          assert manifest["proving_harness_sha"] == proving_sha
          runtime={"A":"7e905d73c15ece4b8b5d7cb73218bac34c2e1314","B":"af0c7ef503c51a5bc7872717b263a01f495c855f"}[arm]
          next_gen={"A":10,"B":6}[arm]
          state_digest={
              "A":"4710a1f478878465caffe12e3021311c1dffc1b4f7567d4465062fce3a85ae03",
              "B":"e284699d06649788b58071783651f087c57e0511ee10f93948b878d68f49e28a",
          }[arm]
          blob_digest={
              "A":"3514056be6c862e5aa2e2053b5ce3c3915f2e68c594c8be3bcec64748d088f19",
              "B":"f21654220651001f3ac63f67a983a516ff8ba236732bb58e47f611c41dd87ced",
          }[arm]
          assert manifest[arm]["runtime_sha"] == runtime
          # The lab snapshot adds deterministic lineage memoization to the sorted telemetry patch.
          # It caches immutable per-primitive lineage graph walks and macro-set unions only;
          # candidate generation, ranking, dominance, selection, and gates are unchanged.
          # Keep the original upstream source blob separately in the manifest/evidence.
          expected_lab = {
              "A": {
                  "cognitive_core/open_ended_growth.py":"ec94fc545badde972510f2db9cbf008cc214e705",
                  "cognitive_core/recursive_cognitive_compiler.py":"ccfb096e0fa2ae5a39f95aa54017c6a223a5b8fd",
                  "cognitive_core/behavioral_search.py":"a159f394afce54b8a95e507ed0e2f2e632b69b5d",
              },
              "B": {
                  "cognitive_core/open_ended_growth.py":"ec94fc545badde972510f2db9cbf008cc214e705",
                  "cognitive_core/recursive_cognitive_compiler.py":"284d4abd5ab467d465be21973090bc24cee26e69",
                  "cognitive_core/behavioral_search.py":"ab658a2e49adf479bf9ea4892dfef930624c6e7b",
              },
          }[arm]
          local_files = {}
          for rel, upstream_expected in manifest[arm]["files"].items():
              path=Path("research/pr110_acsie_snapshot")/arm/rel
              actual=subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
              local_expected=expected_lab[rel]
              assert actual == local_expected, f"{arm} laboratory copy mismatch: {rel}: {actual} != {local_expected}"
              if rel != "cognitive_core/behavioral_search.py":
                  assert actual == upstream_expected, f"{arm} pinned source blob mismatch: {rel}: {actual} != {upstream_expected}"
              local_files[rel]={"upstream_manifest_blob_sha":upstream_expected,"laboratory_copy_blob_sha":actual}
          Path("evidence/local-runtime-identity.json").write_text(json.dumps({
              "arm":arm,
              "upstream_runtime_commit":runtime,
              "upstream_source_blobs":manifest[arm]["files"],
              "lab_snapshot_blobs":{rel:item["laboratory_copy_blob_sha"] for rel,item in local_files.items()},
              "known_lab_only_change":"behavioral_search.py: sorted lineage telemetry plus per-call provenance/executable lineage and macro-set memoization; diagnostic counters only; search/gating semantics unchanged",
              "identity_classification":"PINNED_UPSTREAM_RUNTIME_WITH_SORTED_TELEMETRY_AND_EXECUTION_MEMOIZATION",
          },indent=2,sort_keys=True)+"\\n")
          print("PINNED_UPSTREAM_RUNTIME=PASS")
          print("LAB_COPY_IDENTITIES=PASS")
          print("LAB_TELEMETRY_SORT_PATCH=EXPLICITLY_RECORDED")
          checkpoint=Path("evidence/input-checkpoint.json")
          assert hashlib.sha256(checkpoint.read_bytes()).hexdigest() == blob_digest
          envelope=load_checkpoint(checkpoint,expected_seed=seed,expected_metadata={"proving_sha":proving_sha,"acsie_ref":runtime})
          assert envelope["generation_next"] == next_gen
          assert envelope["state_digest"] == state_digest
          print("SNAPSHOT_PROVENANCE=PASS")
          print("INPUT_CHECKPOINT_BYTES=PASS")
          print("INPUT_CHECKPOINT_STATE_DIGEST=PASS")
          print(f"ARM={arm} RUNTIME_SHA={runtime} GENERATION_NEXT={next_gen}")
          PY

      - name: Resume from the exact saved boundary
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -u
          cp evidence/input-checkpoint.json evidence/working-checkpoint.json
          ARM_ROOT="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/$ARM"
          if [ "$ARM" = "A" ]; then
            RUNTIME_SHA="7e905d73c15ece4b8b5d7cb73218bac34c2e1314"
          else
            RUNTIME_SHA="af0c7ef503c51a5bc7872717b263a01f495c855f"
          fi
          export ARM_ROOT RUNTIME_SHA
          set +e
          timeout --signal=TERM --kill-after=60s 330m env \
            PYTHONHASHSEED=0 \
            PYTHONPATH="$ARM_ROOT:$GITHUB_WORKSPACE" \
            python3 -u - <<'PY' > evidence/resume-raw.txt 2>&1
          import json, os, time
          from pathlib import Path
          from lab.acsie_open_ended_self_extending_proving import run_seed
          started=time.perf_counter()
          runtime_sha=os.environ["RUNTIME_SHA"]
          checkpoint="evidence/working-checkpoint.json"
          result=run_seed(
              int(os.environ["SEED"]),
              int(os.environ["GENERATIONS"]),
              checkpoint_path=checkpoint,
              resume_from=checkpoint,
              checkpoint_metadata={"proving_sha":os.environ["PROVING_SHA"],"acsie_ref":runtime_sha},
          )
          result["resume_wall_time_seconds"]=time.perf_counter()-started
          result["runtime_sha"]=runtime_sha
          result["proving_sha"]=os.environ["PROVING_SHA"]
          result["hash_seed_at_resume_boundary"]=0
          Path("evidence/completed-result.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print("RESUME_RETURNED_COMPLETELY=PASS",flush=True)
          PY
          rc=$?
          set -e
          echo "$rc" > evidence/resume-exit-code.txt
          echo "RESUME_EXIT_CODE=$rc"

      - name: Validate and summarize last durable checkpoint
        if: always()
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/$ARM:$GITHUB_WORKSPACE" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from lab.exact_checkpoint import load_checkpoint
          arm=os.environ["ARM"]
          runtime={"A":"7e905d73c15ece4b8b5d7cb73218bac34c2e1314","B":"af0c7ef503c51a5bc7872717b263a01f495c855f"}[arm]
          p=Path("evidence/working-checkpoint.json")
          summary={
              "label":arm,"runtime_sha":runtime,"proving_sha":"33259fc5c69d87b99c604f0050508c433a279daf",
              "seed":2026100305,"generations":12,"selected_generations_expected":[5,6,9,10,11],
              "resume_hash_seed":0,
              "resume_boundary_hash_seed_note":"The original checkpoint-producing process did not pin PYTHONHASHSEED; continuation pins it to 0. This is a controlled checkpoint continuation, not byte-identical process replay.",
              "runtime_identity_file":"local-runtime-identity.json",
              "lab_only_telemetry_patch":"behavioral_search.py selected_structural_lineage_ids list(set(...)) -> sorted(set(...)) at two output sites; upstream commits still recorded separately.",
              "input_checkpoint_sha256":hashlib.sha256(Path("evidence/input-checkpoint.json").read_bytes()).hexdigest(),
              "resume_exit_code":int(Path("evidence/resume-exit-code.txt").read_text()) if Path("evidence/resume-exit-code.txt").exists() else None,
              "checkpoint_present":p.exists(),"selected":[],"completed_generations":0,"generation_next":None,
              "checkpoint_digest":None,"full_blob_digest":None,"checkpoint_validation":"MISSING",
          }
          if p.exists():
              envelope=load_checkpoint(p,expected_seed=2026100305,expected_metadata={"proving_sha":summary["proving_sha"],"acsie_ref":runtime})
              rows=envelope.get("generations_out",[])
              summary.update({
                  "selected":[r for r in rows if int(r.get("generation",-1)) in {5,6,9,10,11}],
                  "completed_generations":len(rows),"generation_next":int(envelope["generation_next"]),
                  "checkpoint_digest":envelope["state_digest"],
                  "full_blob_digest":"sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(),
                  "checkpoint_validation":"PASS",
                  "max_generated_expressions":max([int(r.get("search_stats",{}).get("generated_expressions",0)) for r in rows] or [0]),
                  "max_unique_search_states":max([int(r.get("search_stats",{}).get("unique_states",0)) for r in rows] or [0]),
                  "max_search_states_in_depth":max([int(r.get("search_stats",{}).get("max_states_in_depth",0)) for r in rows] or [0]),
              })
          completed=Path("evidence/completed-result.json")
          if completed.exists():
              summary["completed_result"]=json.loads(completed.read_text())
          Path(f"evidence/{arm}-selected.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload checkpoint continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr110-resume-${{ matrix.arm }}
          path: evidence/
          retention-days: 30
