name: ACE-X V8 protected unified cognitive gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  ace-x-v8-forensic:
    if: github.event.pull_request.head.ref == 'ace-x-v8-unified-cognitive-20260921' && github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact V8 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - name: Run protected V8 terminal
        env:
          ACEX_V8_RUNTIME_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestUniversalProgramBuilderLearnsExecutableCapability
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v8-protected-result
          path: acex-v8-protected-result.txt
 ./internal/ace -count=1 -timeout=5m -v
          go test -mod=mod -run '^TestV8UnifiedCognitiveEntity$|^TestV8SurpriseMemoryAffectsRetrieval
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v8-protected-result
          path: acex-v8-protected-result.txt
 ./internal/acex -count=1 -timeout=20m -v | tee acex-v8-protected-result.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v8-protected-result
          path: acex-v8-protected-result.txt
