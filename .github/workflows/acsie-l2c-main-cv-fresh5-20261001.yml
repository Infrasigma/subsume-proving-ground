name: ACSIE L2-C current-main CV fresh five-seed qualification

on:
  push:
    branches:
      - research/l2c-main-cv-fresh5-20261001

permissions:
  contents: read

jobs:
  l2c-main-cv:
    strategy:
      fail-fast: false
      matrix:
        seed: [2026100131, 2026100132, 2026100133, 2026100134, 2026100135]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact authoritative ACSIE main
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: 34ce504f4f51f963ce1443cfe974f57adca4f223
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main source
        working-directory: acsie
        env:
          EXPECTED_HARNESS_BLOB: "462e4fc483471a2228252f7f87fbf8ab551a8d84"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "34ce504f4f51f963ce1443cfe974f57adca4f223"
          test "$(git hash-object research/run_l2_sequential_gate.sh)" = "$EXPECTED_HARNESS_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          text = Path("research/l1_four_generation_native_bank_h28_v1.py").read_text()
          assert "quarantine_branch" in text
          assert "A quarantined newcomer is removed before candidate construction." in text
          print("CURRENT_MAIN_QUARANTINE=pre-candidate")
          PY

      - name: Patch CV partition + route audit harness only
        run: |
          set -euo pipefail
          python3 research/patch_l2c_cv_quarantine_20261001.py \
            acsie/research/run_l2_sequential_gate.sh \
            462e4fc483471a2228252f7f87fbf8ab551a8d84

      - name: Run fresh scientific qualification
        working-directory: acsie
        env:
          ACSIE_L2_SEEDS: "${{ matrix.seed }}"
          ACSIE_L2_SELECTION_MODE: "cv_partition"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          export ACSIE_SOURCE_COMMIT="$(git rev-parse HEAD)"
          export ACSIE_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          set +e
          bash research/run_l2_sequential_gate.sh > gate.stdout.txt 2> gate.stderr.txt
          rc=$?
          set -e
          mkdir -p evidence/l2c-main-cv-fresh5
          cp /tmp/acsie-l2-sequential-run/l2a-${{ matrix.seed }}.json evidence/l2c-main-cv-fresh5/
          cp gate.stdout.txt gate.stderr.txt evidence/l2c-main-cv-fresh5/
          printf '%s\n' "$rc" > evidence/l2c-main-cv-fresh5/gate.rc
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("evidence/l2c-main-cv-fresh5") / "l2a-${{ matrix.seed }}.json"
          d = json.loads(p.read_text())
          r = d.get("retention_after_p7") or {}
          checks = r.get("checks") or {}
          ri = r.get("route_invariance") or {}
          summary = {
              "schema":"ACSIE.l2c.main.cv.fresh5.v1",
              "seed":d.get("seed"),
              "scientific_status":d.get("scientific_status"),
              "failure_boundary":d.get("failure_boundary"),
              "source_commit":d.get("source_commit"),
              "source_tree":d.get("source_tree"),
              "selection_mode":"cv_partition",
              "checks":checks,
              "route_invariance":ri,
              "integrity":d.get("integrity"),
          }
          print(json.dumps(summary, sort_keys=True, indent=2))
          if d.get("scientific_status") != "PASSED":
              raise SystemExit(1)
          if not all(all(v.values()) for v in checks.values()):
              raise SystemExit(2)
          if ri.get("all_rows_unchanged") is not True:
              raise SystemExit(3)
          if any(bool(v) for v in (d.get("integrity") or {}).values()):
              raise SystemExit(4)
          PY
          exit "$rc"

      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-l2c-main-cv-fresh5-${{ matrix.seed }}
          path: acsie/evidence/l2c-main-cv-fresh5/**
          if-no-files-found: error
