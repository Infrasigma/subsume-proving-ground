name: PR110 H7 final offline counterfactual

on:
  push:
    branches:
      - research/pr110-h7-redundant-representative-compression-20261008
  pull_request:
    branches:
      - research/direct-reuse-dominance-proving-20261006-v2
    paths:
      - ".github/workflows/pr110-h7-final-offline-counterfactual.yml"
      - "lab/pr110_h7_offline_capture.py"
      - "lab/pr110_h7_offline_counterfactual.py"
      - "lab/test_pr110_h7_offline_counterfactual.py"

permissions:
  contents: read
  actions: read

jobs:
  hosted-runner-preflight:
    # Separate minimal job verifies GitHub-hosted allocation before any evidence run.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report runner capacity (no repository code execution)
        shell: bash
        run: |
          set -euo pipefail
          echo "H7_HOSTED_PREFLIGHT=START"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "KERNEL=$(uname -srm)"
          echo "PYTHON=$(python3 --version 2>&1 || true)"
          echo "GIT=$(git --version 2>&1 || true)"
          echo "LOGICAL_CPUS=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc || echo unknown)"
          awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/ {print}' /proc/meminfo || true
          df -h .
          echo "H7_HOSTED_PREFLIGHT=PASS"
          echo "ACSIE_COMPUTATION_STARTED=no"

  h7-offline:
    needs: hosted-runner-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout pinned proving harness branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download existing Phase6 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 37738748858
          artifact-ids: 11536026911
          github-token: ${{ github.token }}
          path: evidence

      - name: Verify fixed scientific inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path("research/pr110_acsie_snapshot/manifest.json").read_text())
          b=json.loads(Path("evidence/pr110-phase6-scalability-forensics/B-forensics.json").read_text())
          ck=json.loads(Path("evidence/pr110-phase6-scalability-forensics/B-checkpoint.json").read_text())
          assert m["B"]["runtime_sha"] == "9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"
          assert m["proving_harness_sha"] == "33259fc5c69d87b99c604f0050508c433a279daf"
          assert b["runtime_sha"] == m["B"]["runtime_sha"]
          assert b["proving_sha"] == m["proving_harness_sha"]
          assert b["seed"] == 2026100305 and ck["seed"] == 2026100305
          assert ck["generation_next"] == 5
          for rel, expected in m["B"]["files"].items():
              data=Path("research/pr110_acsie_snapshot/B", rel).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert actual == expected, (rel, actual, expected)
          print("H7_INPUTS=PASS")
          PY

      - name: Syntax smoke
        run: |
          set -euo pipefail
          python3 -m py_compile \
            lab/pr110_h7_offline_capture.py \
            lab/pr110_h7_offline_counterfactual.py \
            lab/test_pr110_h7_offline_counterfactual.py \
            lab/exact_checkpoint.py \
            lab/acsie_open_ended_self_extending_proving.py \
            research/pr110_acsie_snapshot/B/cognitive_core/behavioral_search.py \
            research/pr110_acsie_snapshot/B/cognitive_core/open_ended_growth.py \
            research/pr110_acsie_snapshot/B/cognitive_core/recursive_cognitive_compiler.py

      - name: Counterfactual unit tests
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B:$GITHUB_WORKSPACE" \
            python3 -m unittest -v lab.test_pr110_h7_offline_counterfactual

      - name: Capture first secondary Gen5 process-search frontier
        shell: bash
        run: |
          set -euo pipefail
          set +e
          env PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B:$GITHUB_WORKSPACE" \
            RUNTIME_SHA="9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be" \
            PROVING_SHA="33259fc5c69d87b99c604f0050508c433a279daf" \
            python3 -u lab/pr110_h7_offline_capture.py \
              --capture-role secondary_process_synthesis \
              --checkpoint evidence/pr110-phase6-scalability-forensics/B-checkpoint.json \
              --output evidence/h7-offline-frontiers.json \
              > evidence/h7-offline-capture.stdout.log \
              2> evidence/h7-offline-capture.stderr.log
          rc=$?
          set -e
          cat evidence/h7-offline-capture.stdout.log
          cat evidence/h7-offline-capture.stderr.log >&2
          exit "$rc"

      - name: Compute separate direct-vocabulary and lineage counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -u lab/pr110_h7_offline_counterfactual.py \
            --input evidence/h7-offline-frontiers.json \
            --output evidence/h7-offline-counterfactual.json \
            > evidence/h7-offline-counterfactual.stdout.log \
            2> evidence/h7-offline-counterfactual.stderr.log
          rc=$?
          set -e
          cat evidence/h7-offline-counterfactual.stdout.log
          cat evidence/h7-offline-counterfactual.stderr.log >&2
          exit "$rc"

      - name: Upload H7 offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr110-h7-secondary-frontier-counterfactual
          path: evidence/h7-offline-*
          if-no-files-found: warn
          retention-days: 90
