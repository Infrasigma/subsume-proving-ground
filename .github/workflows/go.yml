name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build boundary probe
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o /tmp/aacr-boundary-probe ./cmd/aacr-boundary-probe
      - name: Disable AppArmor unprivileged userns restriction for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -v -mod=mod ./...
      - run: go vet -mod=mod ./...

  ace-x:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ace-x-live-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-integrated-result
          path: acex-result.txt

  ace-x-forensic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact ACE-X branch head
        run: |
          git fetch origin refs/heads/ace-x-live-20260921
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-forensic-result
          path: acex-result.txt

# ACE-X forensic trigger revision.

  acsie-stateful-route-stability:
    if: github.ref == 'refs/heads/research/stateful-route-stability-audit-v1-20261002' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        seed: [2026100201, 2026100202, 2026100203, 2026100204, 2026100205]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4

      - name: Checkout exact ACSIE research branch
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: research/stateful-route-stability-audit-v1-20261002
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact ACSIE diagnostic source
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/run_l2_sequential_gate.sh)" = "e62de1f9d8a3c59356ca01b6e288c386df1f9a87"
          git merge-base --is-ancestor "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d" HEAD

      - name: Run stateful route stability audit
        working-directory: acsie
        env:
          ACSIE_L2_SEEDS: "${{ matrix.seed }}"
          ACSIE_L2_SELECTION_MODE: cv_partition
          ACSIE_GITHUB_ACTIONS: "1"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          export ACSIE_SOURCE_COMMIT="$(git rev-parse HEAD)"
          export ACSIE_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          set +e
          bash research/run_l2_sequential_gate.sh > gate.stdout.txt 2> gate.stderr.txt
          rc=$?
          set -e
          mkdir -p evidence/stateful-route-stability-audit-v1
          cp /tmp/acsie-l2-sequential-run/l2a-${{ matrix.seed }}.json evidence/stateful-route-stability-audit-v1/
          cp gate.stdout.txt gate.stderr.txt evidence/stateful-route-stability-audit-v1/
          printf '%s\n' "$rc" > evidence/stateful-route-stability-audit-v1/gate.rc
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/stateful-route-stability-audit-v1/l2a-${{ matrix.seed }}.json')
          d=json.loads(p.read_text())
          assert d.get('source_commit')
          assert d.get('source_tree')
          assert 'state_route_stability' in d
          audit=d['state_route_stability']
          assert set(audit) == {'choose_only','with_feedback'}
          assert audit['choose_only']['integrity']['target_used_for_router_choice'] is False
          assert audit['with_feedback']['integrity']['target_used_for_router_choice'] is False
          print(json.dumps({
              'seed': d.get('seed'),
              'scientific_status': d.get('scientific_status'),
              'source_commit': d.get('source_commit'),
              'source_tree': d.get('source_tree'),
              'state_route_stability': audit
          }, sort_keys=True, indent=2))
          PY
          exit "$rc"

      - name: Upload stateful route stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-route-stability-audit-v1-${{ matrix.seed }}
          path: acsie/evidence/stateful-route-stability-audit-v1/**
          if-no-files-found: error
