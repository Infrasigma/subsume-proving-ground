name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build boundary probe
        run: mkdir -p .tmp && go build -o .tmp/aacr-boundary-probe ./cmd/aacr-boundary-probe
      - run: go test -mod=mod ./...
      - run: go vet -mod=mod ./...
