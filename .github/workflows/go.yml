name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build boundary probe
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o /tmp/aacr-boundary-probe ./cmd/aacr-boundary-probe
      - name: Disable AppArmor unprivileged userns restriction for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -v -mod=mod ./...
      - run: go vet -mod=mod ./...

  ace-x:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ace-x-live-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-integrated-result
          path: acex-result.txt

  ace-x-forensic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact ACE-X branch head
        run: |
          git fetch origin refs/heads/ace-x-live-20260921
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-forensic-result
          path: acex-result.txt

# ACE-X forensic trigger revision.

  acsie-q4-current-main:
    if: github.ref == 'refs/heads/research/q4-current-main-qualification-20261002' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        seed: [771221, 771222, 771223, 771224, 771225]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4

      - name: Checkout authoritative ACSIE main
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: main
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authoritative ACSIE source
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d"
          git merge-base --is-ancestor "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d" HEAD

      - name: Run Q4 current-main experiment
        working-directory: acsie
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          mkdir -p evidence/q4-current-main
          python - <<'PY' > "evidence/q4-current-main/result-${{ matrix.seed }}.json"
          import json
          from research.native_self_learning_kernel_v2 import run
          result = run(seed=int("${{ matrix.seed }}"))
          result["source_commit"] = "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d"
          result["experiment_identity"] = "q4-current-main-qualification-v1"
          print(json.dumps(result, indent=2, sort_keys=True))
          raise SystemExit(0 if result["passed"] else 2)
          PY

      - name: Upload Q4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-current-main-${{ matrix.seed }}
          path: acsie/evidence/q4-current-main/result-${{ matrix.seed }}.json
          if-no-files-found: error

      - name: Checkout authoritative ACSIE main for Q4 qualification
        if: github.ref == 'refs/heads/research/q4-current-main-qualification-20261002' && github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: main
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-q4
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and run five-seed Q4 qualification
        if: github.ref == 'refs/heads/research/q4-current-main-qualification-20261002' && github.event_name == 'push'
        working-directory: acsie-q4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d"
          git merge-base --is-ancestor "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d" HEAD
          export PYTHONPATH="$PWD"
          mkdir -p evidence/q4-current-main
          overall=0
          for seed in 771221 771222 771223 771224 771225; do
            set +e
            SEED="$seed" python - <<'PY' > "evidence/q4-current-main/result-__SEED__.json"
          import json, os
          from research.native_self_learning_kernel_v2 import run
          result = run(seed=int(os.environ["SEED"]))
          result["source_commit"] = "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d"
          result["experiment_identity"] = "q4-current-main-qualification-v1"
          print(json.dumps(result, indent=2, sort_keys=True))
          raise SystemExit(0 if result["passed"] else 2)
          PY
            rc=$?
            set -e
            printf '%s\n' "$rc" > "evidence/q4-current-main/result-__SEED__.rc"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          done
          cat evidence/q4-current-main/result-*.json
          exit "$overall"

      - name: Upload five-seed Q4 qualification evidence
        if: always() && github.ref == 'refs/heads/research/q4-current-main-qualification-20261002' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: q4-current-main-five-seed
          path: acsie-q4/evidence/q4-current-main/**
          if-no-files-found: error
