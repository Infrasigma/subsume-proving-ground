name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build boundary probe
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o /tmp/aacr-boundary-probe ./cmd/aacr-boundary-probe
      - name: Disable AppArmor unprivileged userns restriction for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -v -mod=mod ./...
      - run: go vet -mod=mod ./...

  ace-x:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ace-x-live-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-integrated-result
          path: acex-result.txt

  ace-x-forensic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact ACE-X branch head
        run: |
          git fetch origin refs/heads/ace-x-live-20260921
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-forensic-result
          path: acex-result.txt

  pr110-phase4-neutrality:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout lab branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact PR110 Phase4 provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e8704aa33029aa89dcffc28a10f3c7deaf3bdefd"
          git rev-parse 75d101eabd4be80ce0d7aed2d3cc04e0912925b8 >/dev/null
          test -f research/pr110_acsie_snapshot/B/cognitive_core/behavioral_search.py
          python3 -m py_compile lab/pr110_phase4_neutrality.py
      - name: Run PR110 scientific-neutrality forensic
        run: |
          set -euo pipefail
          python3 -u lab/pr110_phase4_neutrality.py | tee phase4-neutrality.stdout.txt
      - name: Upload PR110 Phase4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr110-phase4-neutrality-run
          path: |
            phase4-neutrality.stdout.txt
            evidence/phase4-neutrality/

# ACE-X forensic trigger revision.
