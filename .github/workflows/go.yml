name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build boundary probe
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o /tmp/aacr-boundary-probe ./cmd/aacr-boundary-probe
      - name: Disable AppArmor unprivileged userns restriction for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -v -mod=mod ./...
      - run: go vet -mod=mod ./...

  ace-x:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ace-x-live-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-integrated-result
          path: acex-result.txt

  ace-x-forensic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact ACE-X branch head
        run: |
          git fetch origin refs/heads/ace-x-live-20260921
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-forensic-result
          path: acex-result.txt

# ACE-X forensic trigger revision.

  acsie-gen2-interference-diagnostic:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'acsie-gen2-interference-diagnostic-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run exact-fdca ACSIE interference diagnostic
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "4128b0b9b3d9a0639c17fa7845e6a742c561936b"
        run: |
          set -euo pipefail
          : "${ACSIE_READ_TOKEN:?ACSIE_READ_TOKEN is required}"
          WORK=/tmp/acsie-gen2-interference-diagnostic
          VENV=/tmp/acsie-venv
          ASKPASS=/tmp/acsie-askpass.sh
          cleanup() { rm -rf "$WORK" "$VENV" "$ASKPASS"; }
          trap cleanup EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          mkdir -p "$WORK"
          git -C "$WORK" init
          git -C "$WORK" remote add origin https://github.com/Infrasigma/ACSIE.git
          git -C "$WORK" fetch --no-tags --depth 1 origin "$ACSIE_REF"
          git -C "$WORK" checkout --detach --force FETCH_HEAD
          cd "$WORK"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse HEAD^{tree})"
          echo "ACSIE_COMMIT=$ACTUAL_COMMIT"
          echo "ACSIE_TREE=$ACTUAL_TREE"
          [[ "$ACTUAL_COMMIT" == "$ACSIE_REF" ]]

          python3 -m venv "$VENV"
          . "$VENV/bin/activate"
          python -m pip install --upgrade pip pytest
          python -m compileall -q cognitive_core research
          PYTHONPATH="$WORK" pytest -q tests/test_native_independent_core.py tests/test_native_self_learning_kernel_v2.py
          PYTHONPATH="$WORK" python research/native_self_learning_kernel_gen2_interference_diagnostic_v2.py | tee "$GITHUB_WORKSPACE/gen2-interference-diagnostic.json"

      - name: Publish exact-fdca diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen2-interference-diagnostic-${{ github.run_id }}
          path: gen2-interference-diagnostic.json
          if-no-files-found: error