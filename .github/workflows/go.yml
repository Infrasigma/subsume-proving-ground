name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build boundary probe
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o /tmp/aacr-boundary-probe ./cmd/aacr-boundary-probe
      - name: Disable AppArmor unprivileged userns restriction for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -v -mod=mod ./...
      - run: go vet -mod=mod ./...

  ace-x:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ace-x-live-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-integrated-result
          path: acex-result.txt

  ace-x-forensic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact ACE-X branch head
        run: |
          git fetch origin refs/heads/ace-x-live-20260921
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-forensic-result
          path: acex-result.txt

  acsie-gen5:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
        with:
          path: lab-harness
          fetch-depth: 1
      - name: Checkout exact private ACSIE
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: b1c75ee5c8e091d12bd6cf76cd411e9028e0f212
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        working-directory: acsie
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "b1c75ee5c8e091d12bd6cf76cd411e9028e0f212"
          echo "ACSIE_COMMIT=$(git rev-parse HEAD)"
          echo "ACSIE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Execute exact two-seed Gen5 diagnostic
        working-directory: acsie
        env:
          ACSIE_GITHUB_ACTIONS: "1"
        run: |
          set +e
          bash research/run_gen5_gate.sh > /tmp/gen5-gate.stdout 2> /tmp/gen5-gate.stderr
          rc=$?
          echo "${rc}" > /tmp/gen5-gate.exit_code
          cat /tmp/gen5-gate.stdout
          cat /tmp/gen5-gate.stderr >&2
          echo "GEN5_GATE_EXIT=${rc}"
          exit 0
      - name: Upload ACSIE Gen5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-gen5-targeted-two-seed-${{ github.run_id }}
          path: |
            /tmp/gen5-gate.stdout
            /tmp/gen5-gate.stderr
            /tmp/gen5-gate.exit_code
            /tmp/acsie-gen5-run
          if-no-files-found: warn

# ACE-X forensic trigger revision.
