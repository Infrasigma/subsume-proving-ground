name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build boundary probe
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o /tmp/aacr-boundary-probe ./cmd/aacr-boundary-probe
      - name: Disable AppArmor unprivileged userns restriction for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -v -mod=mod ./...
      - run: go vet -mod=mod ./...

  ace-x:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ace-x-live-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-integrated-result
          path: acex-result.txt

  ace-x-forensic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact ACE-X branch head
        run: |
          git fetch origin refs/heads/ace-x-live-20260921
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-forensic-result
          path: acex-result.txt

# ACE-X forensic trigger revision.


  acsie-q4-library-reuse-reserve-v2:
    if: github.ref == 'refs/heads/research/q4-library-reuse-reserve-v2-20261002' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        seed: [271828, 271829, 271830, 271831, 271832]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4
      - name: Checkout exact ACSIE Q4 reuse-reserve source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: research/q4-library-reuse-reserve-v2-20261002
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-q4-reuse
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source
        working-directory: acsie-q4-reuse
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bfd621cbac20670933d0fddcae46ce25add38a89"
          test "$(git merge-base --is-ancestor 'dc99642ec3fefa13239342cf4ce5ab1929874f32' HEAD; echo $?)" = "0"
      - name: Run Q4 reuse-reserve experiment
        working-directory: acsie-q4-reuse
        env:
          SEED: "${{ matrix.seed }}"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          mkdir -p evidence/q4-library-reuse-reserve-v2
          python research/q4_library_reuse_reserve_v2.py "$SEED" > "evidence/q4-library-reuse-reserve-v2/result-${SEED}.json"
      - name: Upload Q4 reuse-reserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-library-reuse-reserve-v2-${{ matrix.seed }}
          path: acsie-q4-reuse/evidence/q4-library-reuse-reserve-v2/**
          if-no-files-found: error
