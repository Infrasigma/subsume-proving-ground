name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build boundary probe
        run: CGO_ENABLED=0 go build -a -installsuffix cgo -o /tmp/aacr-boundary-probe ./cmd/aacr-boundary-probe
      - name: Disable AppArmor unprivileged userns restriction for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -v -mod=mod ./...
      - run: go vet -mod=mod ./...

  ace-x:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ace-x-live-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-integrated-result
          path: acex-result.txt

  ace-x-forensic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact ACE-X branch head
        run: |
          git fetch origin refs/heads/ace-x-live-20260921
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Run ACE-X pure-substrate gate
        env:
          ACEX_SEEDS: "610117,830921"
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestACEXIntegratedTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-result.txt
      - name: Publish ACE-X forensic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-forensic-result
          path: acex-result.txt

# ACE-X forensic trigger revision.


  acsie-native-learning-kernel-foundry-v2-ablation:
    if: github.ref == 'refs/heads/research/native-learning-kernel-foundry-v2-ablation-20261002' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        seed: [771221, 771222, 771223, 771224, 771225]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4
      - name: Checkout exact ACSIE Foundry v2 source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: research/native-learning-kernel-foundry-v2-ablation-20261002
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-kernel-foundry-v2
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source
        working-directory: acsie-kernel-foundry-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "926c81adf59fde3e72c3a60066c6dcebe47d5344"
          git merge-base --is-ancestor "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d" HEAD
      - name: Run Foundry v2 matched-budget ablation
        working-directory: acsie-kernel-foundry-v2
        env:
          SEED: "${{ matrix.seed }}"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          mkdir -p evidence/native-learning-kernel-foundry-v2-ablation
          set +e
          python research/native_learning_kernel_foundry_v2_ablation.py "$SEED" > "evidence/native-learning-kernel-foundry-v2-ablation/result-${SEED}.json"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "evidence/native-learning-kernel-foundry-v2-ablation/result-${SEED}.rc"
          exit "$rc"
      - name: Upload Foundry v2 ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-learning-kernel-foundry-v2-ablation-${{ matrix.seed }}
          path: acsie-kernel-foundry-v2/evidence/native-learning-kernel-foundry-v2-ablation/**
          if-no-files-found: error
