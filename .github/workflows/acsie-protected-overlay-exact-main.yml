name: ACSIE protected-overlay exact-source experiment (main trigger)

on:
  push:
    paths:
      - ".github/workflows/acsie-protected-overlay-exact-main.yml"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Exact private ACSIE commit SHA"
        required: true
        default: "e876eaca1446e26295702d0a1ccca64d99f6276e"
        type: string

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4
      - name: Select exact ACSIE source
        id: acsie-ref
        shell: bash
        run: |
          set -euo pipefail
          ref='e876eaca1446e26295702d0a1ccca64d99f6276e'
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ref="${{ inputs.acsie_ref }}"
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private ACSIE
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ steps.acsie-ref.outputs.ref }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source provenance
        working-directory: acsie
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          expected="${{ steps.acsie-ref.outputs.ref }}"
          test "$actual" = "$expected"
          echo "ACSIE_SOURCE_COMMIT=$actual" | tee ../provenance.txt
          echo "ACSIE_SOURCE_TREE=$tree" | tee -a ../provenance.txt
          echo "EXECUTOR_REPO=Infrasigma/subsume-proving-ground" | tee -a ../provenance.txt
          echo "EXECUTOR_BRANCH=$GITHUB_REF_NAME" | tee -a ../provenance.txt
          echo "EXECUTOR_COMMIT=$GITHUB_SHA" | tee -a ../provenance.txt
          echo "RUN_ID=$GITHUB_RUN_ID" | tee -a ../provenance.txt
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Required native-independent-core tests
        working-directory: acsie
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_native_independent_core.py 2>&1 | tee ../native-core-tests.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" | tee ../native-core-tests.rc
          exit 0
      - name: Focused compositional/overlay tests
        working-directory: acsie
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_native_independent_core.py -k "compositional_context_program or protected_overlay or historical_competence" 2>&1 | tee ../focused-overlay-tests.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" | tee ../focused-overlay-tests.rc
          exit 0
      - name: Exact candidate retention diagnostic
        working-directory: acsie
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python research/gen3_exact_candidate_retention_gate_v1.py 2>&1 | tee ../gen3-exact-candidate.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" | tee ../gen3-exact-candidate.rc
          exit 0
      - name: Autonomous compositional Gen3 protocol
        working-directory: acsie
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python research/native_self_learning_kernel_gen3_compositional_retention_v1.py 2>&1 | tee ../gen3-autonomous-protocol.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" | tee ../gen3-autonomous-protocol.rc
          exit 0
      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp provenance.txt native-core-tests.txt native-core-tests.rc focused-overlay-tests.txt focused-overlay-tests.rc gen3-exact-candidate.txt gen3-exact-candidate.rc gen3-autonomous-protocol.txt gen3-autonomous-protocol.rc evidence/
          echo "workflow_run=$GITHUB_RUN_ID" | tee evidence/experiment_provenance.txt
          echo "workflow_url=https://github.com/Infrasigma/subsume-proving-ground/actions/runs/$GITHUB_RUN_ID" | tee -a evidence/experiment_provenance.txt
          echo "acsie_ref=e876eaca1446e26295702d0a1ccca64d99f6276e" | tee -a evidence/experiment_provenance.txt
          echo "native_core_rc=$(cat native-core-tests.rc)" | tee -a evidence/experiment_provenance.txt
          echo "focused_overlay_rc=$(cat focused-overlay-tests.rc)" | tee -a evidence/experiment_provenance.txt
          echo "exact_candidate_rc=$(cat gen3-exact-candidate.rc)" | tee -a evidence/experiment_provenance.txt
          echo "autonomous_gen3_rc=$(cat gen3-autonomous-protocol.rc)" | tee -a evidence/experiment_provenance.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-protected-overlay-e876-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
      - name: Execution summary
        if: always()
        run: |
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "EXECUTION_COMPLETED=TRUE"
          echo "SCIENTIFIC_STATUS_MUST_BE_READ_FROM_CAPTURED_EVIDENCE=TRUE"
