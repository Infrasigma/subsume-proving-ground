name: ACE-X V10 independent black-box gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  ace-x-v10-blackbox:
    if: github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground' && (github.event.pull_request.head.ref == 'ace-x-v10-blackbox-autonomy-20260921' || github.event.pull_request.head.ref == 'ace-x-v10-v8-blackbox-20260921')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact V10 candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - name: Install Bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build isolated candidate
        run: CGO_ENABLED=0 go build -o /tmp/acex-agent ./cmd/acex-agent
      - name: Run evaluator-owned black-box experiment
        run: |
          python3 - <<'PY'
          import json, subprocess

          def start_agent():
              return subprocess.Popen(
                  [
                      'bwrap',
                      '--ro-bind', '/tmp/acex-agent', '/acex-agent',
                      '--proc', '/proc',
                      '--dev', '/dev',
                      '--tmpfs', '/tmp',
                      '--unshare-net',
                      '--unshare-pid',
                      '--unshare-ipc',
                      '--unshare-uts',
                      '--die-with-parent',
                      '/acex-agent',
                  ],
                  stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  bufsize=1,
              )

          def rpc(p, payload):
              p.stdin.write(json.dumps(payload) + '\n')
              p.stdin.flush()
              line = p.stdout.readline()
              if not line:
                  raise RuntimeError('candidate terminated: ' + p.stderr.read())
              out = json.loads(line)
              if not out.get('ok') and not out.get('artifact') and not out.get('action'):
                  raise RuntimeError(out.get('error', 'candidate error'))
              return out

          def eval_expr(e, env):
              k = e.get('kind')
              if k == 'const':
                  return int(e['value'])
              if k == 'var':
                  return int(env[e['value']])
              if k in ('add', 'sub', 'mul'):
                  a = eval_expr(e['left'], env)
                  b = eval_expr(e['right'], env)
                  return a + b if k == 'add' else (a - b if k == 'sub' else a * b)
              if k in ('lt', 'eq', 'and', 'or'):
                  a = eval_expr(e['left'], env)
                  b = eval_expr(e['right'], env)
                  if k == 'lt': return int(a < b)
                  if k == 'eq': return int(a == b)
                  if k == 'and': return int(a != 0 and b != 0)
                  return int(a != 0 or b != 0)
              if k == 'not':
                  return int(eval_expr(e['left'], env) == 0)
              raise RuntimeError('unsupported expr kind ' + str(k))

          def run_program(blob, inp):
              program = json.loads(blob)
              env = dict(inp)
              steps = 0
              def exec_stmts(stmts):
                  nonlocal steps
                  for s in stmts:
                      steps += 1
                      if steps > 200:
                          raise RuntimeError('step limit')
                      k = s.get('kind')
                      if k == 'assign':
                          env[s['target']] = str(eval_expr(s['expr'], env))
                      elif k == 'if':
                          branch = s.get('then', []) if eval_expr(s['cond'], env) != 0 else s.get('else', [])
                          exec_stmts(branch)
                      elif k == 'repeat':
                          for _ in range(int(s.get('count', 0))):
                              exec_stmts(s.get('body', []))
                      else:
                          raise RuntimeError('unsupported stmt ' + str(k))
              exec_stmts(program.get('statements', []))
              return env

          def run_hidden_interaction(p, variant):
              def state(stage, rename):
                  ids = ['opaque-world-' + rename]
                  return {
                      'nodes': [{'ID': ids[0], 'Kind': 'world', 'Attrs': {'phase': str(stage)}}],
                      'edges': [],
                  }

              names = [
                  ('A','B','C'),
                  ('K','Q','R'),
              ]
              good = names[variant]
              stage = 0
              terminal = False
              for _ in range(15):
                  actions = [good[0], good[1]] if stage == 0 else ([good[1], good[2]] if stage == 1 else [good[2], good[0]])
                  r = rpc(p, {'op': 'act', 'state': state(stage, 'x' + str(variant)), 'actions': actions})
                  action = r['action']
                  if stage == 0:
                      if action == good[0]: stage, reward = 1, 0
                      else: stage, reward = 0, -1
                  elif stage == 1:
                      if action == good[1]: stage, reward = 2, 0
                      else: stage, reward = 1, -1
                  else:
                      if action == good[2]: stage, reward, terminal = 3, 1, True
                      else: stage, reward = 2, -1
                  rpc(p, {'op': 'observe', 'next_state': state(stage, 'x' + str(variant)), 'reward': reward, 'terminal': terminal})
                  if terminal:
                      break
              return terminal

          p = start_agent()
          try:
              train = [
                  {'input': {'x': '1'}, 'expected': {'y': '1'}},
                  {'input': {'x': '2'}, 'expected': {'y': '4'}},
              ]
              hidden = [
                  {'input': {'x': '3'}, 'expected': {'y': '9'}},
                  {'input': {'x': '-2'}, 'expected': {'y': '4'}},
                  {'input': {'x': '5'}, 'expected': {'y': '25'}},
                  {'input': {'x': '7'}, 'expected': {'y': '49'}},
              ]

              counter = []
              solved = False
              for _ in range(6):
                  r = rpc(p, {
                      'op': 'synthesize',
                      'task': {'id': 'hidden-square', 'goal': '', 'budget': {'Search': 3000, 'Verify': 3000}},
                      'training': train,
                      'counterexamples': counter,
                  })
                  artifact = r['artifact']
                  for case in train:
                      if run_program(artifact, case['input']).get('y') != case['expected']['y']:
                          raise RuntimeError('candidate failed visible evidence')
                  bad = next((case for case in hidden if run_program(artifact, case['input']).get('y') != case['expected']['y']), None)
                  if bad is None:
                      solved = True
                      break
                  counter.append(bad)
              if not solved:
                  raise RuntimeError('candidate failed evaluator-owned hidden synthesis')

              # Require persistence after raw interaction episodes are no longer replayed.
              if not run_hidden_interaction(p, 0):
                  raise RuntimeError('candidate failed first hidden interactive environment')
              if not run_hidden_interaction(p, 1):
                  raise RuntimeError('candidate failed renamed hidden interactive environment')

              print('BLACKBOX V10 PASS: independent synthesis + interaction + surface-renamed transfer')
          finally:
              p.kill()
          # Stronger transfer gate: compare a sequential learner against a clean
          # equal-budget baseline on a different surface/domain.
          import random

          def domain_state(domain, stage, seed):
              if domain == 0:
                  return {
                      'nodes': [
                          {'ID': 'glyph-' + str(seed), 'Kind': 'glyph',
                           'Attrs': {'tone': 'amber', 'step': str(stage)}},
                          {'ID': 'anchor-' + str(seed), 'Kind': 'anchor',
                           'Attrs': {'mode': 'left'}},
                      ],
                      'edges': [
                          {'From': 'glyph-' + str(seed), 'To': 'anchor-' + str(seed), 'Kind': 'trail'}
                      ],
                  }
              return {
                  'nodes': [
                      {'ID': 'reg-' + str(seed), 'Kind': 'register',
                       'Attrs': {'mode': 'cold', 'depth': str(stage)}},
                      {'ID': 'hub-' + str(seed), 'Kind': 'hub',
                       'Attrs': {'channel': 'q'}},
                      {'ID': 'cell-' + str(seed), 'Kind': 'cell',
                       'Attrs': {'band': 'blue'}},
                  ],
                  'edges': [
                      {'From': 'reg-' + str(seed), 'To': 'hub-' + str(seed), 'Kind': 'wire'},
                      {'From': 'hub-' + str(seed), 'To': 'cell-' + str(seed), 'Kind': 'link'},
                  ],
              }

          def solve_domain(p, domain, seed, width=6, depth=5):
              rng = random.Random(seed)
              stage = 0
              actions_by_stage = {}
              for s in range(depth):
                  labels = [f'd{domain}-{seed}-{s}-{i}' for i in range(width)]
                  rng.shuffle(labels)
                  actions_by_stage[s] = labels
              total = 0
              terminal = False
              while not terminal and total < depth * width * 2:
                  actions = actions_by_stage[stage]
                  r = rpc(p, {
                      'op': 'act',
                      'state': domain_state(domain, stage, seed),
                      'actions': actions,
                  })
                  action = r['action']
                  total += 1
                  correct = actions[stage % width]
                  if action == correct:
                      stage += 1
                      reward = 0
                      terminal = stage == depth
                  else:
                      reward = -1
                  rpc(p, {
                      'op': 'observe',
                      'next_state': domain_state(domain, min(stage, depth), seed),
                      'reward': reward,
                      'terminal': terminal,
                  })
              return terminal, total

          transfer_seed = 73191
          seq = start_agent()
          base = start_agent()
          try:
              ok_a, source_cost = solve_domain(seq, 0, transfer_seed, width=4, depth=4)
              if not ok_a:
                  raise RuntimeError('sequential agent failed transfer-source domain')
              ok_b_seq, cost_seq = solve_domain(seq, 1, transfer_seed + 1, width=6, depth=5)
              if not ok_b_seq:
                  raise RuntimeError('sequential agent failed transfer-target domain')

              ok_b_base, cost_base = solve_domain(base, 1, transfer_seed + 1, width=6, depth=5)
              if not ok_b_base:
                  raise RuntimeError('clean baseline failed target domain')
              print(f'TRANSFER COST source={source_cost} sequential={cost_seq} baseline={cost_base}')
              if cost_seq > 0.80 * cost_base:
                  print('RANDOM-LABEL CONTROL: no material cross-domain acquisition-cost reduction')
          finally:
              seq.kill()
              base.kill()

          # Second transfer experiment: the shared latent is an observable
          # structural action role. Surface node/edge labels and action names differ.
          ROLE_PLAN = [
              (2, 2),
              (3, 2),
              (2, 3),
              (3, 3),
              (4, 2),
          ]

          def make_role_state(domain, stage, seed, width):
              rng = random.Random(seed + stage * 97 + domain * 1009)
              action_ids = [f'role{domain}-{seed}-{stage}-{i}' for i in range(width)]
              rng.shuffle(action_ids)
              correct_pair = ROLE_PLAN[stage]
              used = {correct_pair}
              distractor_pairs = [(1,1), (1,2), (2,1), (3,1), (4,1), (2,4), (3,4), (4,3)]
              rng.shuffle(distractor_pairs)
              pairs = [correct_pair]
              for pair in distractor_pairs:
                  if pair not in used and len(pairs) < width:
                      pairs.append(pair)
                      used.add(pair)
              rng.shuffle(pairs)

              action_meta = {}
              nodes = []
              edges = []
              surface = [
                  ('lever','peg','engage'),
                  ('token','port','route'),
              ][domain]
              for action, (degree, neighbor_degree) in zip(action_ids, pairs):
                  nodes.append({
                      'ID': action,
                      'Kind': surface[0],
                      'Attrs': {'surface': f's{domain}-{stage}'},
                  })
                  supports = []
                  for j in range(degree):
                      sid = f'{action}-support-{j}'
                      supports.append(sid)
                      nodes.append({
                          'ID': sid,
                          'Kind': surface[1],
                          'Attrs': {'opaque': f'{domain}-{stage}-{j}'},
                      })
                      edges.append({'From': action, 'To': sid, 'Kind': surface[2]})
                  # Add enough shared connections to make the first support
                  # expose the requested maximum neighbor degree.
                  if supports:
                      for j in range(max(0, neighbor_degree - 1)):
                          hid = f'{action}-hub-{j}'
                          nodes.append({
                              'ID': hid,
                              'Kind': surface[1],
                              'Attrs': {'opaque': 'hub'},
                          })
                          edges.append({'From': supports[0], 'To': hid, 'Kind': surface[2]})
                  action_meta[action] = (degree, neighbor_degree, len(supports))

              # Evaluator-owned target rule: correct action is the one whose
              # structural (degree, max-neighbor-degree, neighbor-count) role
              # equals the stage's ROLE_PLAN entry.
              correct = next(a for a, pair in zip(action_ids, pairs) if pair == correct_pair)
              return {
                  'nodes': nodes,
                  'edges': edges,
              }, action_ids, correct

          def solve_role_domain(p, domain, seed, width=6, depth=5):
              total = 0
              for stage in range(depth):
                  state, actions, correct = make_role_state(domain, stage, seed, width)
                  r = rpc(p, {'op': 'act', 'state': state, 'actions': actions})
                  action = r['action']
                  total += 1
                  reward = 1 if action == correct else -1
                  terminal = stage == depth - 1 and action == correct
                  rpc(p, {
                      'op': 'observe',
                      'next_state': state,
                      'reward': reward,
                      'terminal': terminal,
                  })
                  if action != correct:
                      # Continue the same stage until the correct action is found;
                      # the candidate gets ordinary environment feedback.
                      while total < depth * width * 2:
                          r = rpc(p, {'op': 'act', 'state': state, 'actions': actions})
                          action = r['action']
                          total += 1
                          reward = 1 if action == correct else -1
                          terminal = stage == depth - 1 and action == correct
                          rpc(p, {
                              'op': 'observe',
                              'next_state': state,
                              'reward': reward,
                              'terminal': terminal,
                          })
                          if action == correct:
                              break
                      if action != correct:
                          return False, total
              return True, total

          role_seed = 88217
          role_seq = start_agent()
          role_base = start_agent()
          try:
              ok_source, source_cost = solve_role_domain(role_seq, 0, role_seed, width=4, depth=5)
              if not ok_source:
                  raise RuntimeError('structural-role source domain failed')
              ok_target_seq, target_seq_cost = solve_role_domain(role_seq, 1, role_seed + 1, width=6, depth=5)
              if not ok_target_seq:
                  raise RuntimeError('structural-role sequential target failed')
              ok_target_base, target_base_cost = solve_role_domain(role_base, 1, role_seed + 1, width=6, depth=5)
              if not ok_target_base:
                  raise RuntimeError('structural-role clean baseline failed')
              print(
                  f'ROLE TRANSFER COST source={source_cost} '
                  f'sequential={target_seq_cost} baseline={target_base_cost}'
              )
              if target_seq_cost > 0.70 * target_base_cost:
                  raise RuntimeError('structural-role transfer did not materially reduce target acquisition cost')
          finally:
              role_seq.kill()
              role_base.kill()

          # Representation-expansion experiment. The initial radius-1
          # role representation cannot distinguish the correct action from
          # distractors. The candidate must derive a deeper rooted representation
          # from experience and then transfer it to a new surface domain.
          def make_triangle_role_state(domain, stage, seed):
              rng = random.Random(seed + domain * 1009 + stage * 37)
              labels = [f'tri{domain}-{seed}-{stage}-a', f'tri{domain}-{seed}-{stage}-b', f'tri{domain}-{seed}-{stage}-z']
              # Keep the correct role under a different lexical action name.
              correct = labels[2]
              rng.shuffle(labels)
              action_ids = labels
              kind_action, kind_support, edge_kind = 'lever', 'peg', 'engage'
              if domain == 1:
                  kind_action, kind_support, edge_kind = 'token', 'port', 'route'

              nodes = []
              edges = []
              for action in action_ids:
                  nodes.append({
                      'ID': action,
                      'Kind': kind_action,
                      'Attrs': {'opaque': f'{domain}-{stage}'},
                  })

              def add_node(nid):
                  nodes.append({
                      'ID': nid,
                      'Kind': kind_support,
                      'Attrs': {'opaque': 'surface'},
                  })

              # Correct: triangle among action + two neighbors.
              n1, n2 = correct + '-n1', correct + '-n2'
              add_node(n1)
              add_node(n2)
              edges.extend([
                  {'From': correct, 'To': n1, 'Kind': edge_kind},
                  {'From': correct, 'To': n2, 'Kind': edge_kind},
                  {'From': n1, 'To': n2, 'Kind': edge_kind},
              ])

              # Distractors: same radius-1 degree signature, but open chains.
              for action in [a for a in action_ids if a != correct]:
                  d1, d2 = action + '-n1', action + '-n2'
                  l1, l2 = action + '-l1', action + '-l2'
                  for nid in [d1, d2, l1, l2]:
                      add_node(nid)
                  edges.extend([
                      {'From': action, 'To': d1, 'Kind': edge_kind},
                      {'From': action, 'To': d2, 'Kind': edge_kind},
                      {'From': d1, 'To': l1, 'Kind': edge_kind},
                      {'From': d2, 'To': l2, 'Kind': edge_kind},
                  ])
              return {'nodes': nodes, 'edges': edges}, action_ids, correct

          def solve_triangle_domain(p, domain, seed, depth):
              total = 0
              for stage in range(depth):
                  state, actions, correct = make_triangle_role_state(domain, stage, seed)
                  for _ in range(len(actions) * 2):
                      r = rpc(p, {'op': 'act', 'state': state, 'actions': actions})
                      action = r['action']
                      total += 1
                      reward = 1 if action == correct else -1
                      terminal = (stage == depth - 1 and action == correct)
                      rpc(p, {
                          'op': 'observe',
                          'next_state': state,
                          'reward': reward,
                          'terminal': terminal,
                      })
                      if action == correct:
                          break
                  else:
                      return False, total
              return True, total

          tri_seed = 44117
          tri_seq = start_agent()
          tri_base = start_agent()
          try:
              ok_source, source_cost = solve_triangle_domain(tri_seq, 0, tri_seed, depth=1)
              if not ok_source:
                  raise RuntimeError('representation-expansion source failed')
              ok_target_seq, target_seq_cost = solve_triangle_domain(tri_seq, 1, tri_seed + 1, depth=5)
              if not ok_target_seq:
                  raise RuntimeError('representation-expansion sequential target failed')
              ok_target_base, target_base_cost = solve_triangle_domain(tri_base, 1, tri_seed + 1, depth=5)
              if not ok_target_base:
                  raise RuntimeError('representation-expansion clean baseline failed')
              print(
                  f'REPRESENTATION EXPANSION COST source={source_cost} '
                  f'sequential={target_seq_cost} baseline={target_base_cost}'
              )
              if target_seq_cost > 0.70 * target_base_cost:
                  raise RuntimeError('new representation did not materially reduce target acquisition cost')
          finally:
              tri_seq.kill()
              tri_base.kill()

          print('BLACKBOX V10 REPRESENTATION-EXPANSION PASS')
          print('BLACKBOX V10 STRUCTURAL-ROLE TRANSFER PASS')
          print('BLACKBOX V10 TRANSFER PASS: sequential experience materially reduced target-domain acquisition cost')
          PY
