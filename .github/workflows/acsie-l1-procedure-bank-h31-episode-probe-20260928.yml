name: ACSIE L1 procedure bank H31 episode probe 20260928
on:
  push:
    branches:
      - acsie/l1-gen2-materialization-h29b-20260928
    paths:
      - "research/l1_procedure_bank_h31_episode_probe_v1.py"
      - ".github/workflows/acsie-l1-procedure-bank-h31-episode-probe-20260928.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  ACSIE_SOURCE: "cc6c5d8e83e4b698550638bb440b2c51fb8b9f1a"
  GEN2_FREEZE_RUN: "36407812884"
jobs:
  seed:
    name: H31 episode probe seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [2026092801,2026092802,2026092803,2026092804,2026092805]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ env.ACSIE_SOURCE }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source
        working-directory: acsie
        run: test "$(git rev-parse HEAD)" = "${ACSIE_SOURCE}"
      - name: Download repaired Gen2 freeze
        uses: actions/download-artifact@v4
        with:
          name: acsie-gen2-behavioral-frozen-state-20260928-36407812884
          path: input
          run-id: ${{ env.GEN2_FREEZE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify freeze
        run: |
          python - <<'PY'
          import hashlib,json
          raw=open("input/verified-gen2-state.json","rb").read()
          assert hashlib.sha256(raw).hexdigest()=="3fc90234b00093d7303ca26d9f5f88824f9d1419ba2ada718213f3c4b547e04b"
          assert json.load(open("input/verified-gen2-export.json"))["scientific_status"]=="PASSED"
          PY
      - name: Execute H31
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          PYTHONHASHSEED=0 PYTHONPATH="$GITHUB_WORKSPACE/acsie" python research/l1_procedure_bank_h31_episode_probe_v1.py input/verified-gen2-state.json --seed "$SEED" > "h31-$SEED.json"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-h31-episode-probe-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: h31-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: seed
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acsie-h31-episode-probe-seed-*-${{ github.run_id }}
          path: evidence
          merge-multiple: true
      - name: Strict aggregate
        run: |
          python - <<'PY'
          import json,pathlib,sys
          rows=[json.loads(p.read_text()) for p in sorted(pathlib.Path("evidence").glob("h31-*.json"))]
          ok=len(rows)==5 and {r.get("seed") for r in rows}=={2026092801,2026092802,2026092803,2026092804,2026092805} and all(r.get("scientific_status")=="PASSED" for r in rows)
          out={"schema":"ACSIE.layer1-procedure-bank-h31-episode-probe-multiseed.v1","scientific_status":"PASSED" if ok else "FAILED","rows":rows}
          pathlib.Path("h31-aggregate.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          if not ok: sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acsie-h31-episode-probe-aggregate-${{ github.run_id }}
          path: h31-aggregate.json
          if-no-files-found: error
