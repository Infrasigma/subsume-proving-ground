name: ACE-X protected evaluator router

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  protected-cognitive-gate:
    if: github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground' && (github.event.pull_request.head.ref == 'ace-x-v6-semantic-prospective-20260921' || github.event.pull_request.head.ref == 'ace-x-v7-interactive-symbolic-20260921' || github.event.pull_request.head.ref == 'ace-x-v8-unified-cognitive-20260921')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - name: Run protected candidate gate
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACEX_RUNTIME_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            ace-x-v6-semantic-prospective-20260921)
              go test -mod=mod -run '^TestV6SemanticEquivalenceQuotient$|^TestV6ProspectiveLibraryLearning$|^TestV6ExecutableMechanismSelection$|^TestV6FailureCurriculum$' ./internal/acex -count=1 -timeout=20m -v
              ;;
            ace-x-v7-interactive-symbolic-20260921)
              go test -mod=mod -run '^TestV7ExplorationGoalPlanningAndPersistence$|^TestV7MacroInductionAndStructuralActionTransfer$|^TestV7ExplorationDoesNotPretendUnobservedTransitionsAreKnown$' ./internal/acex -count=1 -timeout=20m -v
              ;;
            ace-x-v8-unified-cognitive-20260921)
              go test -mod=mod -run '^TestUniversalProgramBuilderLearnsExecutableCapability$' ./internal/ace -count=1 -timeout=5m -v
              go test -mod=mod -run '^TestV8UnifiedCognitiveEntity$|^TestV8SurpriseMemoryAffectsRetrieval$|^TestV8FailureMemoryBlocksRepeatedBadAction
              ;;
            *)
              echo "unexpected candidate ref: $HEAD_REF" >&2
              exit 2
              ;;
          esac
      - name: Emit forensic marker
        if: always()
        run: |
          echo "CANDIDATE_REF=${{ github.event.pull_request.head.ref }}"
          echo "CANDIDATE_SHA=${{ github.event.pull_request.head.sha }}"
          echo "RUN_ID=${{ github.run_id }}"
 ./internal/acex -count=1 -timeout=20m -v
              ;;
            *)
              echo "unexpected candidate ref: $HEAD_REF" >&2
              exit 2
              ;;
          esac
      - name: Emit forensic marker
        if: always()
        run: |
          echo "CANDIDATE_REF=${{ github.event.pull_request.head.ref }}"
          echo "CANDIDATE_SHA=${{ github.event.pull_request.head.sha }}"
          echo "RUN_ID=${{ github.run_id }}"
