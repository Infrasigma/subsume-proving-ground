name: ACSIE Q4 Current-Main Qualification

on:
  push:

permissions:
  contents: read

jobs:
  q4:
    if: github.ref == 'refs/heads/research/q4-current-main-qualification-20261002'
    strategy:
      fail-fast: false
      matrix:
        seed: [771221, 771222, 771223, 771224, 771225]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4

      - name: Checkout exact authoritative ACSIE main
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: main
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authoritative source
        working-directory: acsie
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d"
          git merge-base --is-ancestor "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d" HEAD

      - name: Run Q4 current-main experiment
        working-directory: acsie
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD"
          mkdir -p evidence/q4-current-main
          python - <<'PY' > "evidence/q4-current-main/result-${{ matrix.seed }}.json"
          import json
          from research.native_self_learning_kernel_v2 import run
          result = run(seed=int("${{ matrix.seed }}"))
          result["source_commit"] = "5d9e1229d62d8218398b81ca9f89fa1da2ebf70d"
          result["experiment_identity"] = "q4-current-main-qualification-v1"
          print(json.dumps(result, indent=2, sort_keys=True))
          raise SystemExit(0 if result["passed"] else 2)
          PY

      - name: Upload Q4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-current-main-${{ matrix.seed }}
          path: acsie/evidence/q4-current-main/result-${{ matrix.seed }}.json
          if-no-files-found: error
