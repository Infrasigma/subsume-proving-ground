name: ACSIE Gen4 three-way evidence router qualification

on:
  push:
    branches:
      - acsie/gen4-three-way-router-20260928
    paths:
      - "research/gen4_three_way_router_trigger_20260928.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ACSIE_SOURCE_COMMIT: "db58c95765ba4546c42daed0951f0859507e15a5"
  SOURCE_RUN: "36376031059"
  VERIFIED_PARENT: "b31109864ae547320d877e6c1575b805d950edf9"
  EXPORT_SOURCE: "94a2a770a5799fd386217998bc21b585632ef7ed"
  VERIFIED_STATE_SHA256: "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9"

jobs:
  three-way-router:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact ACSIE harness
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: \${{ env.ACSIE_SOURCE_COMMIT }}
          token: \${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact ACSIE provenance
        working-directory: acsie
        run: |
          set -euo pipefail
          test "\$(git rev-parse HEAD)" = "\${ACSIE_SOURCE_COMMIT}"
          test -f research/gen4_three_way_evidence_router_v1.py
          test -f research/gen4_three_way_router_protocol_20260928.json
          ! grep -F "\\n" research/gen4_three_way_evidence_router_v1.py
          echo "ACSIE_SOURCE_COMMIT=\$(git rev-parse HEAD)"
          sha256sum research/gen4_three_way_evidence_router_v1.py
          sha256sum research/gen4_three_way_router_protocol_20260928.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download exact frozen Gen2 input
        uses: actions/download-artifact@v4
        with:
          name: acsie-gen4-verified-gen2-input-\${{ env.SOURCE_RUN }}
          path: input
          run-id: \${{ env.SOURCE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: \${{ secrets.GITHUB_TOKEN }}

      - name: Download exact eight Gen4 shards
        uses: actions/download-artifact@v4
        with:
          pattern: acsie-gen4-multi-shard-*-\${{ env.SOURCE_RUN }}
          path: shards
          merge-multiple: true
          run-id: \${{ env.SOURCE_RUN }}
          repository: Infrasigma/subsume-proving-ground
          github-token: \${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact frozen state and shard inputs
        run: |
          set -euo pipefail
          test -f input/verified-gen2-export.json
          test -f input/verified-gen2-state.json
          test "\$(find shards -maxdepth 1 -name "shard-*.json" | wc -l)" = "8"
          python - <<'PY'
          import hashlib, json
          r=json.load(open("input/verified-gen2-export.json"))
          assert r["scientific_status"] == "PASSED"
          assert r["scientific_parent_commit"] == "b31109864ae547320d877e6c1575b805d950edf9"
          h=hashlib.sha256(open("input/verified-gen2-state.json","rb").read()).hexdigest()
          assert h == "0b599e436c4578115cc0312dd6545f5d56c14777fcb55562592c5d8f4e8f80a9"
          PY

      - name: Execute preregistered three-way gate
        working-directory: acsie
        run: |
          set -u
          PYTHONPATH=. python research/gen4_three_way_evidence_router_v1.py \
            ../input/verified-gen2-export.json \
            --merge \
            ../shards/shard-0.json \
            ../shards/shard-1.json \
            ../shards/shard-2.json \
            ../shards/shard-3.json \
            ../shards/shard-4.json \
            ../shards/shard-5.json \
            ../shards/shard-6.json \
            ../shards/shard-7.json \
            --seed 771223 \
            > ../three-way-evidence-router-final.json
          rc=$?
          cat ../three-way-evidence-router-final.json
          python - <<'PY'
          import json
          r=json.load(open("../three-way-evidence-router-final.json"))
          print("SCIENTIFIC_STATUS", r["scientific_status"])
          print("GEN4_HOLDOUT_GAIN", r["gen4_gate"]["holdout_gain"])
          print("GEN4_TRANSFER_GAIN", r["gen4_gate"]["transfer_gain"])
          print("GEN1_RETENTION_PASS", r["retention"]["gen1_retention_pass"])
          print("GEN2_RETENTION_PASS", r["retention"]["gen2_retention_pass"])
          print("GEN3_RETENTION_PASS", r["retention"]["gen3_retention_pass"])
          print("DETERMINISTIC_REPLAY", r["replay"]["deterministic_replay"])
          assert r["scientific_status"] in {"PASSED","FAILED"}
          PY
          test "$rc" = "0"

      - name: Package evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp input/verified-gen2-export.json evidence/
          cp input/verified-gen2-state.json evidence/
          cp shards/shard-*.json evidence/
          cp three-way-evidence-router-final.json evidence/
          sha256sum evidence/verified-gen2-state.json > evidence/state.sha256
          printf "%s\n" \
            "experiment=H-MULTI-BRANCH-ROUTER-3WAY" \
            "acsie_source_commit=\${ACSIE_SOURCE_COMMIT}" \
            "source_candidate_run=\${SOURCE_RUN}" \
            "workflow_run=\${{ github.run_id }}" \
            "workflow_sha=\${{ github.sha }}" \
            "verified_state_sha256=\${VERIFIED_STATE_SHA256}" \
            "seed=771223" \
            "candidate_count=128" \
            "selected_gen4_fingerprint=65c7bb20c888d8ea18bb7037233a000e1d651ee4287c2aeac3f073c3c66263a0" > evidence/execution-provenance.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acsie-gen4-three-way-router-\${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
