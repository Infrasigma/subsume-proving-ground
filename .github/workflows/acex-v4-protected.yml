name: ACE-X V4 protected equivalence gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  ace-x-v4-forensic:
    if: github.event.pull_request.head.ref == 'ace-x-v4-equivalence-aware-20260921' && github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - name: Run protected V4 terminal
        env:
          ACEX_RUNTIME_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          go test -mod=mod -run '^TestV4ArchitectureTerminal$' ./internal/acex -count=1 -timeout=12m -v | tee acex-v4-protected-result.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acex-v4-protected-result
          path: acex-v4-protected-result.txt

  ace-x-v6-v7-v8:
    if: (github.event.pull_request.head.ref == 'ace-x-v6-semantic-prospective-20260921' || github.event.pull_request.head.ref == 'ace-x-v7-interactive-symbolic-20260921' || github.event.pull_request.head.ref == 'ace-x-v8-unified-cognitive-20260921' || github.event.pull_request.head.ref == 'ace-x-v8-fresh-integration-20260921') && github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - name: Run protected candidate terminal
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACEX_RUNTIME_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            ace-x-v6-semantic-prospective-20260921)
              go test -mod=mod -run '^TestV6SemanticEquivalenceQuotient$|^TestV6ProspectiveLibraryLearning$|^TestV6ExecutableMechanismSelection$|^TestV6FailureCurriculum$' ./internal/acex -count=1 -timeout=20m -v
              ;;
            ace-x-v7-interactive-symbolic-20260921)
              go test -mod=mod -run '^TestV7ExplorationGoalPlanningAndPersistence$|^TestV7MacroInductionAndStructuralActionTransfer$|^TestV7ExplorationDoesNotPretendUnobservedTransitionsAreKnown$' ./internal/acex -count=1 -timeout=20m -v
              ;;
            ace-x-v8-unified-cognitive-20260921|ace-x-v8-fresh-integration-20260921)
              go test -mod=mod -run '^TestUniversalProgramBuilderLearnsExecutableCapability$' ./internal/ace -count=1 -timeout=5m -v
              go test -mod=mod -run '^TestV8UnifiedCognitiveEntity$|^TestV8SurpriseMemoryAffectsRetrieval$|^TestV8FailureMemoryBlocksRepeatedBadAction$' ./internal/acex -count=1 -timeout=20m -v
              ;;
          esac

  ace-x-v9:
    if: github.event.pull_request.head.ref == 'ace-x-v9-cegis-open-search-20260921' && github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact V9 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - name: Run protected V9 terminal
        run: go test -mod=mod -run '^TestV9CEGISRejectsOverfittingCandidate$|^TestV9MechanismImprovementUsesExecutableCEGIS$' ./internal/acex -count=1 -timeout=20m -v

  ace-x-v10-blackbox:
    if: github.event.pull_request.head.ref == 'ace-x-v10-blackbox-autonomy-20260921' && github.event.pull_request.head.repo.full_name == 'Infrasigma/subsume-proving-ground'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact V10 candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod download
      - name: Install Bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build isolated candidate
        run: CGO_ENABLED=0 go build -o /tmp/acex-agent ./cmd/acex-agent
      - name: Run evaluator-owned black-box test
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          def start_agent():
              cmd = [
                  'bwrap', '--ro-bind', '/tmp/acex-agent', '/acex-agent',
                  '--proc', '/proc', '--dev', '/dev', '--tmpfs', '/tmp',
                  '--unshare-net', '--unshare-pid', '--unshare-ipc', '--unshare-uts',
                  '--die-with-parent', '/acex-agent'
              ]
              return subprocess.Popen(cmd, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)

          def rpc(p, payload):
              p.stdin.write(json.dumps(payload) + '\n')
              p.stdin.flush()
              line = p.stdout.readline()
              if not line:
                  err = p.stderr.read()
                  raise RuntimeError('candidate terminated: ' + err)
              out = json.loads(line)
              if not out.get('ok') and not out.get('artifact') and not out.get('action'):
                  raise RuntimeError(out.get('error','candidate error'))
              return out

          def eval_expr(e, env):
              k = e.get('kind')
              if k == 'const': return int(e['value'])
              if k == 'var': return int(env[e['value']])
              if k in ('add','sub','mul'):
                  a,b = eval_expr(e['left'],env),eval_expr(e['right'],env)
                  return a+b if k=='add' else (a-b if k=='sub' else a*b)
              if k in ('lt','eq','and','or'):
                  a,b = eval_expr(e['left'],env),eval_expr(e['right'],env)
                  if k=='lt': return int(a<b)
                  if k=='eq': return int(a==b)
                  if k=='and': return int(a!=0 and b!=0)
                  return int(a!=0 or b!=0)
              if k == 'not': return int(eval_expr(e['left'],env)==0)
              raise RuntimeError('unsupported expr kind '+str(k))

          def run_program(blob, inp):
              p = json.loads(blob)
              env = dict(inp)
              steps = 0
              def exec_stmts(stmts):
                  nonlocal steps
                  for s in stmts:
                      steps += 1
                      if steps > 200: raise RuntimeError('step limit')
                      k = s.get('kind')
                      if k == 'assign': env[s['target']] = str(eval_expr(s['expr'],env))
                      elif k == 'if':
                          branch = s.get('then',[]) if eval_expr(s['cond'],env) != 0 else s.get('else',[])
                          exec_stmts(branch)
                      elif k == 'repeat':
                          for _ in range(int(s.get('count',0))): exec_stmts(s.get('body',[]))
                      else: raise RuntimeError('unsupported stmt '+str(k))
              exec_stmts(p.get('statements',[]))
              return env

          p = start_agent()
          try:
              train = [
                  {'input': {'x':'1'}, 'expected': {'y':'1'}},
                  {'input': {'x':'2'}, 'expected': {'y':'4'}},
              ]
              counter = []
              hidden = [
                  {'input': {'x':'3'}, 'expected': {'y':'9'}},
                  {'input': {'x':'-2'}, 'expected': {'y':'4'}},
                  {'input': {'x':'5'}, 'expected': {'y':'25'}},
              ]
              solved = False
              saw_counterexample = False
              for round_no in range(5):
                  r = rpc(p, {
                      'op':'synthesize',
                      'task': {'id':'hidden-square','goal':'','budget':{'Search':3000,'Verify':3000}},
                      'training':train,
                      'counterexamples':counter,
                  })
                  artifact = r['artifact']
                  for case in train:
                      got = run_program(artifact, case['input'])
                      if got.get('y') != case['expected']['y']:
                          raise RuntimeError('candidate failed visible synthesis evidence')
                  bad = None
                  for case in hidden:
                      got = run_program(artifact, case['input'])
                      if got.get('y') != case['expected']['y']:
                          bad = case
                          break
                  if bad is None:
                      solved = True
                      break
                  saw_counterexample = True
                  counter.append(bad)
              if not solved:
                  raise RuntimeError('candidate failed evaluator-owned hidden synthesis')
              if not saw_counterexample:
                  print('CEGIS note: candidate solved hidden family without needing a supplied counterexample')

              # Interactive hidden environment. No goal is transmitted.
              state = lambda stage: {'nodes':[{'ID':'opaque','Kind':'world','Attrs':{'stage':str(stage)}}], 'edges':[]}
              stage = 0
              terminal = False
              for step in range(12):
                  actions = ['A','B'] if stage == 0 else (['B','C'] if stage == 1 else ['C','A'])
                  r = rpc(p, {'op':'act','state':state(stage),'actions':actions})
                  action = r['action']
                  if stage == 0:
                      if action == 'A': stage, reward = 1, 0
                      else: stage, reward = 0, -1
                  elif stage == 1:
                      if action == 'B': stage, reward = 2, 0
                      else: stage, reward = 1, -1
                  else:
                      if action == 'C': stage, reward, terminal = 3, 1, True
                      else: stage, reward = 2, -1
                  rpc(p, {'op':'observe','next_state':state(stage),'reward':reward,'terminal':terminal})
                  if terminal: break
              if not terminal:
                  raise RuntimeError('candidate failed hidden interactive environment')
              print('BLACKBOX V10 PASS: synthesis verified independently; interactive environment solved')
          finally:
              try: p.kill()
              except Exception: pass
          PY
