name: q4-recursive-library-gate

on:
  push:
    paths:
      - ".github/workflows/q4-recursive-library-gate.yml"
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: "Exact ACSIE commit SHA"
        required: true
        default: "1a67903eb56ec32b829769f7d842d44b3edc410b"
        type: string

permissions:
  contents: read

jobs:
  q4-recursive-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned ACSIE recursive library gate
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.acsie_ref || '1a67903eb56ec32b829769f7d842d44b3edc410b' }}
        run: |
          set -euo pipefail
          WORK=/tmp/acsie-q4
          ASKPASS=/tmp/acsie-askpass.sh
          VENV=/tmp/acsie-venv
          cleanup() { rm -rf "$WORK" "$VENV" "$ASKPASS"; }
          trap cleanup EXIT
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$ACSIE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          mkdir -p "$WORK"
          git -C "$WORK" init
          git -C "$WORK" remote add origin https://github.com/Infrasigma/ACSIE.git
          git -C "$WORK" fetch --no-tags --depth 1 origin "$ACSIE_REF"
          git -C "$WORK" checkout --detach --force FETCH_HEAD
          cd "$WORK"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse HEAD^{tree})"
          echo "ACSIE_COMMIT=$ACTUAL_COMMIT"
          echo "ACSIE_TREE=$ACTUAL_TREE"
          [[ "$ACTUAL_COMMIT" == "$ACSIE_REF" ]]
          python3 -m venv "$VENV"
          . "$VENV/bin/activate"
          python -m pip install --upgrade pip pytest
          python -m compileall -q cognitive_core
          PYTHONPATH="$WORK" pytest -q tests/test_native_independent_core.py
          set +e
          PYTHONPATH="$WORK" python research/native_q4_library_abstraction_probe_v1.py 913771
          r1=$?
          PYTHONPATH="$WORK" python research/native_q4_sequential_library_probe_v1.py 913771
          r2=$?
          PYTHONPATH="$WORK" python research/native_q4_recursive_library_procedure_v1.py 271828 6 6
          r3=$?
          set -e
          echo "ABSTRACTION_RC=$r1"
          echo "SEQUENTIAL_RC=$r2"
          echo "RECURSIVE_PROCEDURE_RC=$r3"
          if [[ "$r1" -ne 0 || "$r2" -ne 0 || "$r3" -ne 0 ]]; then
            exit 2
          fi
          echo "ACSIE_Q4_RECURSIVE_LIBRARY_GATE=PASS"
