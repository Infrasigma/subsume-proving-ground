name: ACSIE self-extending open-ended proving
# Experiment pin: bounded exact-target depth continuation; no scientific threshold changes.
# Resource-stability experiment: release logically dominated states; scientific gate remains unchanged.
on:
  push:
    branches:
      - research/open-ended-self-extending-proving-20261003-resource-f557
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: acsie-self-extending-open-ended-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  open-ended-self-extending:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact ACSIE research commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "e7b0acdc38a89542a5bc05ad649f9406ed80c7c7"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-open-ended-self-extending
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-open-ended-self-extending
          git -C /tmp/acsie-open-ended-self-extending fetch --depth 1 origin "$ACSIE_REF"
          git -C /tmp/acsie-open-ended-self-extending checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-open-ended-self-extending rev-parse HEAD)" = "$ACSIE_REF"
      - name: Run exact unit tests
        run: |
          python3 -m venv /tmp/open-ended-venv
          . /tmp/open-ended-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-open-ended-self-extending pytest -q /tmp/acsie-open-ended-self-extending/tests/test_open_ended_growth.py
          PYTHONPATH=/tmp/acsie-open-ended-self-extending:. pytest -q lab/test_open_ended_bootstrap_language.py
      - name: Initialize scientific evidence file
        run: |
          : > open-ended-self-extending-result.txt
          {
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "ACSIE_REF=ff525043d641fc312db33843457e86adf690bca1"
            echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> open-ended-self-extending-result.txt
      - name: Run five-seed open-ended growth gate
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: /tmp/acsie-open-ended-self-extending
          ACSIE_REF: "e7b0acdc38a89542a5bc05ad649f9406ed80c7c7"
        run: |
          set +e
          . /tmp/open-ended-venv/bin/activate
          set -o pipefail
          python3 -u - <<PY 2>&1 | tee -a open-ended-self-extending-result.txt
import json
import lab.acsie_open_ended_self_extending_proving as proving
seed = int("${{ matrix.seed }}")
result = proving.run_seed(seed, 12)
print(json.dumps(result, sort_keys=True), flush=True)
PY
          rc=${PIPESTATUS[0]}
          echo "SCIENTIFIC_GATE_RC=$rc" | tee -a open-ended-self-extending-result.txt
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-open-ended-self-extending-evidence-${{ github.sha }}
          path: open-ended-self-extending-result.txt

  h7-offline-counterfactual:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/pr110-h7-redundant-representative-compression-20261008')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download exact Phase6 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 37738748858
          artifact-ids: 11536026911
          github-token: ${{ github.token }}
          path: evidence
      - name: Verify fixed scientific inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path("research/pr110_acsie_snapshot/manifest.json").read_text())
          b=json.loads(Path("evidence/pr110-phase6-scalability-forensics/B-forensics.json").read_text())
          ck=json.loads(Path("evidence/pr110-phase6-scalability-forensics/B-checkpoint.json").read_text())
          assert m["B"]["runtime_sha"] == "9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be"
          assert m["proving_harness_sha"] == "33259fc5c69d87b99c604f0050508c433a279daf"
          assert b["runtime_sha"] == m["B"]["runtime_sha"]
          assert b["proving_sha"] == m["proving_harness_sha"]
          assert b["seed"] == 2026100305 and ck["seed"] == 2026100305 and ck["generation_next"] == 5
          for rel, expected in m["B"]["files"].items():
              data=Path("research/pr110_acsie_snapshot/B", rel).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert actual == expected, (rel, actual, expected)
          print("H7_INPUTS=PASS")
          PY
      - name: Syntax smoke
        run: |
          set -euo pipefail
          python3 -m py_compile lab/pr110_h7_offline_capture.py lab/pr110_h7_offline_counterfactual.py lab/exact_checkpoint.py lab/acsie_open_ended_self_extending_proving.py research/pr110_acsie_snapshot/B/cognitive_core/behavioral_search.py research/pr110_acsie_snapshot/B/cognitive_core/open_ended_growth.py research/pr110_acsie_snapshot/B/cognitive_core/recursive_cognitive_compiler.py
      - name: Capture Gen5 lineage representatives
        run: |
          set -euo pipefail
          env PYTHONPATH="$GITHUB_WORKSPACE/research/pr110_acsie_snapshot/B:$GITHUB_WORKSPACE" RUNTIME_SHA="9b0c42eb4394aee457f8b7adecc45a3f4ea7c4be" PROVING_SHA="33259fc5c69d87b99c604f0050508c433a279daf" python3 -u lab/pr110_h7_offline_capture.py --checkpoint evidence/pr110-phase6-scalability-forensics/B-checkpoint.json --output evidence/h7-offline-frontiers.json
      - name: Compute K counterfactuals
        run: |
          set -euo pipefail
          python3 -u lab/pr110_h7_offline_counterfactual.py --input evidence/h7-offline-frontiers.json --output evidence/h7-offline-counterfactual.json
      - name: Upload H7 offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr110-h7-offline-counterfactual-${{ github.sha }}
          path: evidence/h7-offline-*.json
          retention-days: 90
