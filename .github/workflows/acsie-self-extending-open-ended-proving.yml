name: ACSIE self-extending open-ended proving
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  open-ended-self-extending:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'research/open-ended-self-extending-proving-20261003') || github.event_name == 'push' && startsWith(github.ref_name, 'research/open-ended-self-extending-proving-20261003')
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact ACSIE research commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "2842c01fd5c12e1f420c62660ed3ae2b14ce4987"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-open-ended-self-extending
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-open-ended-self-extending
          git -C /tmp/acsie-open-ended-self-extending fetch --depth 1 origin "research/open-ended-identifiable-recursive-20261003"
          git -C /tmp/acsie-open-ended-self-extending checkout --detach FETCH_HEAD
          test "$(git -C /tmp/acsie-open-ended-self-extending rev-parse HEAD)" = "$ACSIE_REF"
      - name: Run exact unit tests
        run: |
          python3 -m venv /tmp/open-ended-venv
          . /tmp/open-ended-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-open-ended-self-extending pytest -q /tmp/acsie-open-ended-self-extending/tests/test_open_ended_growth.py
          python -m py_compile lab/acsie_open_ended_self_extending_proving.py
          PYTHONPATH=/tmp/acsie-open-ended-self-extending:. pytest -q lab/test_open_ended_bootstrap_language.py
          PYTHONPATH=/tmp/acsie-open-ended-self-extending:. pytest -q lab/test_open_ended_admission.py
      - name: Initialize scientific evidence file
        run: |
          : > open-ended-self-extending-result.txt
          {
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "ACSIE_REF=2842c01fd5c12e1f420c62660ed3ae2b14ce4987"
            echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> open-ended-self-extending-result.txt
      - name: Run five-seed open-ended growth gate
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: /tmp/acsie-open-ended-self-extending
          ACSIE_REF: "2842c01fd5c12e1f420c62660ed3ae2b14ce4987"
        run: |
          set +e
          . /tmp/open-ended-venv/bin/activate
          python3 -u lab/acsie_open_ended_self_extending_proving.py --strict > open-ended-self-extending-result.txt 2>&1
          rc=$?
          echo "SCIENTIFIC_GATE_RC=$rc" >> open-ended-self-extending-result.txt
          cat open-ended-self-extending-result.txt
          exit "$rc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acsie-open-ended-self-extending-evidence-${{ github.sha }}
          path: open-ended-self-extending-result.txt
