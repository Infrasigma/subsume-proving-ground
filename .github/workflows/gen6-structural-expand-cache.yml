name: Gen6 structural expansion cache hypothesis

on:
  push:
    branches:
      - research/acsie-h7-r3-exact-source-20261011
    paths:
      - ".github/workflows/gen6-structural-expand-cache.yml"

permissions:
  contents: read

jobs:
  structural-expand-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout proving-ground
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pin scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/gen6-expand-cache diagnostics
          {
            echo "EXECUTOR_COMMIT=$GITHUB_SHA"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "ACSIE_SOURCE_COMMIT=d83cb60286f195eec02b4d7aa45a60539316d115"
            echo "SEED=2026100301; generation indices 0..6"
            echo "HYPOTHESIS=bounded object-identity memoization of pure structural expansion"
            echo "CACHE_KEY=(id(expr), active_macro_stack); cached entry retains expr strongly"
            echo "CACHE_CAPACITY=2048 FIFO entries per search call"
            echo "FRONTIER_CACHE=DISABLED; this is a separate optimization"
            echo "WALL_LIMIT_SECONDS=120; RSS_GUARD_MIB=2048"
          } | tee evidence/gen6-expand-cache/provenance.txt

      - name: Checkout exact ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: d83cb60286f195eec02b4d7aa45a60539316d115
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acsie rev-parse HEAD)" = "d83cb60286f195eec02b4d7aa45a60539316d115"
          test "$(git -C acsie rev-parse 'HEAD^{tree}')" = "12d2fa8fc1f1e34d3d7c442eef85aa6a71380420"
          src="$(sha256sum acsie/cognitive_core/behavioral_search.py | awk '{print $1}')"
          test "$src" = "2ff981875397b7d0edb2fef1c33c655b0a15b8c404b13c50d13a804f77535aea"
          echo "ACSIE_BEHAVIORAL_SEARCH_ORIGINAL_SHA256=$src" | tee evidence/gen6-expand-cache/source-identity.txt

      - name: Apply bounded expansion cache in the hosted workspace only
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/acsie/cognitive_core/behavioral_search.py" <<'PY'
          import hashlib, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          base_sha = hashlib.sha256(s.encode()).hexdigest()
          marker = "    def structural_expand(\n"
          end_marker = "    def structural_key("
          if s.count(marker) != 1:
              raise SystemExit(f"structural_expand marker count={s.count(marker)}")
          start = s.index(marker)
          end = s.index(end_marker, start + len(marker))
          block = s[start:end]
          wrapper = (
              "    def structural_expand(\n"
              "        expr: Mapping[str, Any],\n"
              "        active: tuple[str, ...] = (),\n"
              "    ) -> Mapping[str, Any]:\n"
              "        if not _h7_expand_cache_enabled:\n"
              "            return _structural_expand_uncached(expr, active)\n"
              "        cache_key = (id(expr), active)\n"
              "        entry = _h7_expand_cache.get(cache_key)\n"
              "        if entry is not None and entry[0] is expr:\n"
              "            _h7_expand_cache_stats['hits'] += 1\n"
              "            return entry[1]\n"
              "        _h7_expand_cache_stats['misses'] += 1\n"
              "        result = _structural_expand_uncached(expr, active)\n"
              "        if len(_h7_expand_cache) >= 2048:\n"
              "            del _h7_expand_cache[next(iter(_h7_expand_cache))]\n"
              "            _h7_expand_cache_stats['evictions'] += 1\n"
              "        _h7_expand_cache[cache_key] = (expr, result)\n"
              "        return result\n\n"
              "    def _structural_expand_uncached(\n"
          )
          if s.count("_h7_expand_cache") != 0:
              raise SystemExit("unexpected prior expansion cache marker")
          cache_decl = (
              '    _h7_expand_cache_enabled = __import__("os").environ.get("ACSIE_DISABLE_EXPAND_CACHE") != "1"\n'
              '    _h7_expand_cache = {}\n'
              '    _h7_expand_cache_stats = {"hits": 0, "misses": 0, "evictions": 0}\n\n'
          )
          s = s[:start] + cache_decl + s[start:]
          start = s.index(marker)
          end = s.index(end_marker, start + len(marker))
          block = s[start:end]
          block = block.replace(marker, wrapper, 1)
          s = s[:start] + block + s[end:]
          ret = "        return BehavioralSearchResult("
          pos = s.rfind(ret)
          if pos < 0:
              raise SystemExit("search result return marker missing")
          s = s[:pos] + '        find_exact_expression._H7_LAST_EXPAND_CACHE_STATS = dict(_h7_expand_cache_stats)\n' + s[pos:]
          p.write_text(s)
          print("ORIGINAL_SHA256=" + base_sha)
          print("PATCHED_SHA256=" + hashlib.sha256(s.encode()).hexdigest())
          PY
          python -m py_compile acsie/cognitive_core/behavioral_search.py
          sha256sum acsie/cognitive_core/behavioral_search.py | tee evidence/gen6-expand-cache/diagnostic-source-sha256.txt

      - name: Run six-file regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 python -m pytest -q \
            acsie/tests/test_open_ended_growth.py \
            acsie/tests/test_core014_recursive_cognitive_compiler.py \
            acsie/tests/test_core015_semantic_operator_discovery.py \
            acsie/tests/test_core016_open_semantic_substrate.py \
            acsie/tests/test_adaptive_capability_repair.py \
            acsie/tests/test_asi_claim_gate.py 2>&1 | tee evidence/gen6-expand-cache/six-file-regression.txt

      - name: Require exact cached versus uncached signature parity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/acsie" PYTHONHASHSEED=0 python - "$GITHUB_WORKSPACE/evidence/gen6-expand-cache" <<'PY'
          import json, os, pathlib, sys
          from cognitive_core.behavioral_search import find_exact_expression
          from cognitive_core.open_ended_growth import OpenEndedRecursiveCognitiveCompiler
          from cognitive_core.recursive_cognitive_compiler import ArchiveRecord, CognitivePrimitive, Trace
          out = pathlib.Path(sys.argv[1])

          def build(op):
              c = OpenEndedRecursiveCognitiveCompiler(max_depth=4, seed=771221)
              px = CognitivePrimitive("prim:x", {"op":"get","key":"x"}, ("x","y"), "delta", 0, (), ("opaque",), 0.0, 0.0, 0.0, 1, {})
              py = CognitivePrimitive("prim:y", {"op":"get","key":"y"}, ("x","y"), "delta", 0, (), ("opaque",), 0.0, 0.0, 0.0, 1, {})
              c.primitives = {px.primitive_id:px, py.primitive_id:py}
              c.archive = {px.primitive_id:ArchiveRecord(px), py.primitive_id:ArchiveRecord(py)}
              rows=[]
              for i in range(8):
                  x,y=float(i),float(i+1)
                  target=max(x,y) if op=="max" else min(x,y) if op=="min" else x+y
                  rows.append(Trace({"x":x,"y":y},target,"opaque",{},f"{op}-{i}"))
              return c,tuple(rows),2 if op=="sum" else 4,"maximize_direct_vocabulary" if op=="sum" else "minimize_expanded_cost"

          def signature(r):
              return None if r is None else {"expression":r.expression,"used_primitives":r.used_primitives,"alternatives":r.alternatives,"stats":dict(r.stats)}

          results=[]
          total_hits=0
          for op in ("max","min","sum"):
              a,ra,da,oa=build(op)
              os.environ["ACSIE_DISABLE_EXPAND_CACHE"]="1"
              before=find_exact_expression(a,ra,max_depth=da,require_macro=True,selection_objective=oa,max_alternatives=8)
              sig_before=signature(before)
              stats_before=dict(getattr(find_exact_expression,"_H7_LAST_EXPAND_CACHE_STATS",{}))
              b,rb,db,ob=build(op)
              os.environ.pop("ACSIE_DISABLE_EXPAND_CACHE",None)
              after=find_exact_expression(b,rb,max_depth=db,require_macro=True,selection_objective=ob,max_alternatives=8)
              stats_after=dict(getattr(find_exact_expression,"_H7_LAST_EXPAND_CACHE_STATS",{}))
              same=sig_before==signature(after)
              total_hits += int(stats_after.get("hits",0))
              row={"fixture":op,"exact_signature_equal":same,"uncached_stats":stats_before,"cached_stats":stats_after,"result_found":after is not None}
              results.append(row)
              print(json.dumps(row,sort_keys=True))
              if not same:
                  raise SystemExit(f"exact signature mismatch on {op}")
          summary={"schema":"ACSIE.gen6_structural_expand_cache_parity.v1","capacity":2048,"key":"(id(expr), active_macro_stack); strong reference retained",
                   "all_signatures_equal":all(r["exact_signature_equal"] for r in results),"total_cached_expand_hits":total_hits,"fixtures":results,
                   "guard":"Fixture-level parity only; no Gen6 qualification."}
          (out/"cache-parity.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          if total_hits < 1: raise SystemExit("no cache hits in parity fixtures")
          PY

      - name: Prepare external stack and counter sampler
        shell: bash
        run: |
          set -euo pipefail
          cat > diagnostics/sitecustomize.py <<'PY'
          import faulthandler, json, os, signal, sys, time
          faulthandler.enable(file=sys.stderr, all_threads=True)
          t0=time.monotonic()
          log=os.environ.get("ACSIE_EXPAND_CACHE_LOG")
          def snap(signum,frame):
              faulthandler.dump_traceback(file=sys.stderr,all_threads=True)
              f=frame
              while f is not None and f.f_code.co_name!="find_exact_expression": f=f.f_back
              row={"elapsed_s":round(time.monotonic()-t0,3),"signal":int(signum)}
              if f is not None:
                  loc=f.f_locals
                  row["search"]={k:loc.get("stats",{}).get(k) for k in ("rows","max_depth","primitive_count","generated_expressions","unique_states","dominance_pruned_states","dominance_frontier_max","status")}
                  row["cache_stats"]=dict(loc.get("_h7_expand_cache_stats",{}))
                  row["cache_entries"]=len(loc.get("_h7_expand_cache",{}))
              if log:
                  with open(log,"a",buffering=1) as h: h.write(json.dumps(row,sort_keys=True)+"\n")
          signal.signal(signal.SIGUSR1,snap)
          PY
          python -m py_compile diagnostics/sitecustomize.py
          sha256sum diagnostics/sitecustomize.py | tee evidence/gen6-expand-cache/sampler-sha256.txt

      - name: Run one actual self-extending Gen6 seed within fixed bounds
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          root="$GITHUB_WORKSPACE/evidence/gen6-expand-cache"
          seed=2026100301
          ACSIE_EXPAND_CACHE_LOG="$root/gen6-cache-snapshots.jsonl" \
          PYTHONPATH="$GITHUB_WORKSPACE/diagnostics:$GITHUB_WORKSPACE/lab:$GITHUB_WORKSPACE/acsie" \
            python -c 'import json,sys,acsie_open_ended_self_extending_proving as g; print(json.dumps(g.run_seed(int(sys.argv[1]),7),sort_keys=True),flush=True)' \
            "$seed" > "$root/gen6.stdout.jsonl" 2> "$root/gen6.stderr" &
          child=$!
          start=$(date +%s); next=$((start+10)); timeout_hit=0; rss_hit=0; max_rss=0
          while kill -0 "$child" 2>/dev/null; do
            if ps -p "$child" -o stat= 2>/dev/null | grep -q 'Z'; then break; fi
            now=$(date +%s); elapsed=$((now-start))
            rss=$(ps -p "$child" -o rss= 2>/dev/null | tr -d ' ' || echo 0)
            case "$rss" in ''|*[!0-9]*) rss=0;; esac
            if [ "$rss" -gt "$max_rss" ]; then max_rss=$rss; fi
            if [ "$rss" -ge 2097152 ]; then rss_hit=1; kill -TERM "$child" 2>/dev/null || true; sleep 3; kill -KILL "$child" 2>/dev/null || true; break; fi
            if [ "$now" -ge "$next" ]; then kill -USR1 "$child" 2>/dev/null || true; next=$((now+10)); fi
            if [ "$elapsed" -ge 120 ]; then timeout_hit=1; kill -TERM "$child" 2>/dev/null || true; sleep 3; kill -KILL "$child" 2>/dev/null || true; break; fi
            sleep 1
          done
          set +e; wait "$child"; rc=$?; set -e
          if [ "$rss_hit" -eq 1 ]; then status=RESOURCE_GUARD_RSS_LIMIT; elif [ "$timeout_hit" -eq 1 ]; then status=INCONCLUSIVE_CHILD_WALL_TIMEOUT; elif [ "$rc" -eq 0 ] && [ -s "$root/gen6.stdout.jsonl" ]; then status=CHILD_RETURNED_RECORD; else status=CHILD_ERROR_OR_EMPTY_OUTPUT; fi
          printf '{"seed":%s,"child_returncode":%s,"timeout_hit":%s,"rss_guard_hit":%s,"max_rss_kib":%s,"status":"%s"}\n' "$seed" "$rc" "$timeout_hit" "$rss_hit" "$max_rss" "$status" | tee "$root/gen6-child-status.json"
          python - "$root" <<'PY'
          import collections,json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]); stderr=(root/"gen6.stderr").read_text(errors="replace")
          stacks=[]
          for block in re.split(r"(?=Current thread 0x)",stderr):
              frames=re.findall(r'File "([^"]+)", line (\d+), in ([^\n]+)',block)
              if frames: stacks.append([{"file":f,"line":int(n),"function":fn} for f,n,fn in frames])
          samples=[]
          q=root/"gen6-cache-snapshots.jsonl"
          if q.exists():
              for line in q.read_text(errors="replace").splitlines():
                  try:samples.append(json.loads(line))
                  except Exception:pass
          child=json.loads((root/"gen6-child-status.json").read_text())
          summary={"schema":"ACSIE.gen6_structural_expand_cache_diagnostic.v1","source_commit":"d83cb60286f195eec02b4d7aa45a60539316d115",
                   "seed":2026100301,"child_status":child,"stack_snapshot_count":len(stacks),
                   "stack_function_frequency":dict(collections.Counter(fr["function"] for st in stacks for fr in st)),
                   "live_cache_samples":samples,"stdout_bytes":(root/"gen6.stdout.jsonl").stat().st_size,
                   "stderr_bytes":len(stderr.encode()),"stderr_tail":stderr[-10000:],
                   "guard":"Cache must pass exact-signature parity and 61 regression tests before the bounded Gen6 diagnostic is run. Timeout is inconclusive, not science pass/fail."}
          (root/"gen6-summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps({k:v for k,v in summary.items() if k!="stderr_tail"},indent=2,sort_keys=True))
          PY

      - name: Upload all structural-expansion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen6-structural-expand-cache-${{ github.run_id }}
          path: evidence/gen6-expand-cache/
          if-no-files-found: error
