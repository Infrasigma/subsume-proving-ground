name: ACE Runtime

on:
  push:
    branches: ["ace-full-system-20260911"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/ace
