name: ACE Runtime

on:
  push:
    branches: ["ace-full-system-20260911"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Resolve module checksums
        run: go mod download
      - name: Expose generated checksums for repository repair
        run: cat go.sum
      - name: Package generated checksums
        if: always()
        run: tar -czf /tmp/go-sum.tgz go.sum
      - name: Upload generated checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-go-sum
          path: /tmp/go-sum.tgz
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/ace
