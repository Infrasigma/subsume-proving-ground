name: ACE G16 Task Free Continual Learning Gate

on:
  pull_request:

concurrency:
  group: ace-g16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: G16 task-free continual skill learning
        run: go test -mod=mod -run '^TestG16TaskFreeContinualSkillLearning$' ./internal/ace -count=1 -v -timeout 30m
      - name: G16 race
        run: go test -mod=mod -race -run '^TestG16TaskFreeContinualSkillLearning$' ./internal/ace -count=1 -v -timeout 30m
