name: ACSIE H9-C independent proving

on:
  push:
    paths:
      - ".github/workflows/acsie-h9c-independent-proving.yml"
      - "lab/acsie_h9c_independent_proving.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/acsie-h9c-independent-proving.yml"
      - "lab/acsie_h9c_independent_proving.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h9c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact ACSIE research commit
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          ACSIE_REF: "06ff348b7eba9de9192500dbfc00bb9a6d4cec9f"
        run: |
          set -euo pipefail
          test -n "$ACSIE_READ_TOKEN"
          rm -rf /tmp/acsie-h9c
          git clone --no-checkout --depth 1 "https://x-access-token:$ACSIE_READ_TOKEN@github.com/Infrasigma/ACSIE.git" /tmp/acsie-h9c
          git -C /tmp/acsie-h9c fetch --depth 1 origin "$ACSIE_REF"
          git -C /tmp/acsie-h9c checkout --detach "$ACSIE_REF"
          test "$(git -C /tmp/acsie-h9c rev-parse HEAD)" = "$ACSIE_REF"
      - name: Run H9-C unit tests from exact research commit
        run: |
          python3 -m venv /tmp/acsie-h9c-venv
          . /tmp/acsie-h9c-venv/bin/activate
          python -m pip install --upgrade pip pytest
          PYTHONPATH=/tmp/acsie-h9c pytest -q /tmp/acsie-h9c/tests/test_h9_active_compositional_demand.py
      - name: Run independent five-seed evaluator
        env:
          PYTHONPATH: /tmp/acsie-h9c
          ACSIE_REF: "06ff348b7eba9de9192500dbfc00bb9a6d4cec9f"
        run: |
          . /tmp/acsie-h9c-venv/bin/activate
          python3 lab/acsie_h9c_independent_proving.py --strict
